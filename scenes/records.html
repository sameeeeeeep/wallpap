/* =====================================================================
   Record Store After Hours — a small independent record shop at night,
   after closing, seen from inside. Music mode hero: the NOW PLAYING wall
   display (big lit sleeve + letter board), turntable on the counter.

   ART SLOTS (optional; everything is procedural until these exist)
   Put PNGs in scenes/art/records/. Each is tried once at startup with
   new Image(); a 404 is silently ignored and the procedural drawing stays.

     bg-night.png   3200×2000  full painted shop interior at night (16:10).
                               The shop-window GLASS must be fully transparent
                               (alpha 0) so the live street/rain shows through.
     bg-day.png     3200×2000  same framing in daylight. Crossfades with
                               bg-night by time of day; either alone is fine.
       When a bg is present the scene switches to a fixed 1600×1000 reference
       layout (world units), cover-fit to the screen. Paint the room EMPTY at
       these anchors (live layers are drawn on top). Keep the right ~30%
       (x > 1120) calm: no text, no hero objects, nothing bright.
         shop window glass   x 56…424,  y 128…590  (riser top y 584, cat sits ≈ x 328)
         hero sleeve         x 692…992, y 124…424  (square, lit by picture light)
         letter board text   x 662…1022, y 454…546
         cabinet top (cat)   y 560, x 454…1230
         crate record tops   y ≈ 770, crates x 330…720 (front panel top y 800)
         counter top         y 690…712, x ≥ 750 (cat sits at x ≈ 794)
         turntable platter   centre (958, 651), radius 88 (seen at 0.34 tilt)
         dog bed             centre (200, 824); dog lanes on the rug y ≈ 958
     bg-overcast.png  day shop under cloud (blended over bg-day by cloud cover)
     glass-mask.png   alpha = the painted window glass (cut from both paintings)
     street-night.png / street-night-dry.png / street-day.png   1024² views through the window
                      (night sky cut at load → live sky + shared moon.js); car-1..3.png passing cars
     turntable.png    the deck on the counter (record, tonearm, lamp live); dogbed.png, bowls.png
     LAYOUT: LW.layout side 'left' → drawn mirrored (MIR, upright() for text/art/deck/street); pets only
     rest inside LW.layout.clear / outside avoid boxes. PETS on/off (LW.settings.pets): they walk out
     off the left edge along the front of the shop and stay away; back in from there.
     ANIMALS — illustrated sprites come from the shared library
       art/sprites/cats/black/{walk1,walk2,sit,loaf,sleep,stretch}.png  (cat "Licorice")
       art/sprites/dogs/golden/{walk1,walk2,sit,lie,belly-up}.png      (pup "Biscuit")
     (transparent PNG, facing RIGHT, bottom-centre = paw contact; any size —
     scaled so walk1's width = the animal's body length). Per-scene overrides
     win if present: art/records/cat-<pose>.png, art/records/dog-<pose>.png
     with the same pose names. Procedural rigs draw until a full set loads.
   ===================================================================== */
'use strict';
(() => {

const ctx = cv.getContext('2d', { alpha: false });

}

const GLOW_WHITE = sprite(128, [[0, 'rgba(255,255,255,1)'], [0.2, 'rgba(255,255,255,0.45)'], [0.55, 'rgba(255,255,255,0.1)'], [1, 'rgba(255,255,255,0)']]);
const BLOB = sprite(64, [[0, 'rgba(255,255,255,0.9)'], [0.45, 'rgba(255,255,255,0.45)'], [1, 'rgba(255,255,255,0)']]);
const DARK = sprite(64, [[0, 'rgba(8,5,8,0.85)'], [0.5, 'rgba(8,5,8,0.45)'], [1, 'rgba(8,5,8,0)']]);
const GLOW_PINK = sprite(96, [[0, 'rgba(255,120,170,0.9)'], [0.35, 'rgba(255,90,150,0.3)'], [1, 'rgba(255,80,140,0)']]);
const GLOW_NEON = sprite(128, [[0, 'rgba(255,90,120,0.95)'], [0.3, 'rgba(255,70,110,0.32)'], [1, 'rgba(255,60,100,0)']]);
function drawSprite(g, sp, x, y, r, a, op = 'lighter') {

  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
}

  return [f(0) * 255, f(8) * 255, f(4) * 255];
}
function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;

function fitText(g, s, maxW) { s = s || ''; if (g.measureText(s).width <= maxW) return s; while (s.length > 1 && g.measureText(s + '…').width > maxW) s = s.slice(0, -1); return s + '…'; }

// =====================================================================
//  art slots (optional PNGs; procedural fallback is the default)
// =====================================================================
const ART = { dir: 'art/records/', img: {} };
// bg-overcast: the day room under cloud (no sun patches); street-*: the painted view through the
// window (night wet / night dry / day, 1024² plates); car-1..3: passing cars (side view, facing right);
// turntable: the painted deck on the counter (record, tonearm and lamp stay live)
const ART_NAMES = ['bg-night', 'bg-day', 'bg-overcast', 'street-night', 'street-night-dry', 'street-day', 'car-1', 'car-2', 'car-3', 'turntable', 'glass-mask', 'dogbed', 'bowls'];
// dogbed / bowls: the pup's plush bed under the window (its front rim is redrawn over whoever lies in
// it) and a pair of bowls on a little tray beside it
// glass-mask: alpha = the painted window's glass (cut out of both paintings so the street shows
// through, keeping the mullions, the sleeves and the cactus on the sill)
function loadArtSlots() {
  for (const name of ART_NAMES) {
    try {
      const im = new Image();
      im.onload = () => { if (!im.naturalWidth) return; ART.img[name] = im; clearTimeout(ART.rb); ART.rb = setTimeout(rebuild, 60); };
      im.onerror = () => {};
      im.src = ART.dir + name + '.png';
    } catch (e) { /* never let a missing asset matter */ }
  }
}
const artMode = () => !!(ART.img['bg-night'] || ART.img['bg-day']);
const streetArt = () => !!(ART.img['street-night'] || ART.img['street-night-dry'] || ART.img['street-day']);

// =====================================================================
//  environment: time of day + weather (glides; never pops)
// =====================================================================
const KF = [
  { h: 0, top: '#070b1c', bot: '#1a2240', day: 0, lamp: 1, city: 1, warm: 0 },
  { h: 5.0, top: '#070b1c', bot: '#1a2240', day: 0, lamp: 1, city: 1, warm: 0 },
  { h: 6.3, top: '#2b3462', bot: '#dc9c88', day: 0.32, lamp: 0.75, city: 0.55, warm: 0.8 },
  { h: 7.6, top: '#7aa1cf', bot: '#efe0cc', day: 0.8, lamp: 0.2, city: 0.08, warm: 0.3 },
  { h: 9, top: '#6a9bd2', bot: '#dbe8f0', day: 1, lamp: 0.08, city: 0, warm: 0 },
  { h: 16.3, top: '#6696cf', bot: '#efdcc0', day: 0.95, lamp: 0.1, city: 0, warm: 0.2 },
  { h: 18.3, top: '#45507f', bot: '#ef9a62', day: 0.55, lamp: 0.72, city: 0.45, warm: 1 },
  { h: 19.6, top: '#1a2046', bot: '#6c4f72', day: 0.15, lamp: 1, city: 0.9, warm: 0.3 },
  { h: 21, top: '#070b1c', bot: '#1a2240', day: 0, lamp: 1, city: 1, warm: 0 },
  { h: 24, top: '#070b1c', bot: '#1a2240', day: 0, lamp: 1, city: 1, warm: 0 },
];
KF.forEach((k) => { k.topC = hex(k.top); k.botC = hex(k.bot); });
const WX = {
  cloudy: { d: ['#99a2b1', '#c8ccd2'], n: ['#141824', '#262a38'], amt: 0.6, day: 0.85, lamp: 0.3 },
  rain: { d: ['#6c7684', '#959daa'], n: ['#0b0e17', '#1a1f2c'], amt: 0.85, day: 0.6, lamp: 0.6 },
  storm: { d: ['#4b5262', '#6d7483'], n: ['#06080e', '#131723'], amt: 0.95, day: 0.45, lamp: 0.8 },
  snow: { d: ['#b8becb', '#dde1e8'], n: ['#1a1d2b', '#30344a'], amt: 0.75, day: 0.85, lamp: 0.45 },
  fog: { d: ['#b3b6bc', '#d2d4d7'], n: ['#1d2029', '#373a46'], amt: 0.85, day: 0.75, lamp: 0.5 },
};
let E = null, Et = null;
function computeTarget() {
  const env = LW.env || {};
  const hr = (((+env.hour || 0) % 24) + 24) % 24;

  for (let i = 0; i < KF.length - 1; i++) if (hr >= KF[i].h && hr <= KF[i + 1].h) { a = KF[i]; b = KF[i + 1]; break; }
  const t = smooth((hr - a.h) / Math.max(0.001, b.h - a.h));
  const n = (k) => lerp(a[k], b[k], t);

    top = mix3(top, mix3(hex(X.n[0]), hex(X.d[0]), day), f);
    bot = mix3(bot, mix3(hex(X.n[1]), hex(X.d[1]), day), f);

    if (w === 'rain') rain = 0.45 + 0.55 * it;

  moon *= LW.moonVisibility();

const ENV_KEYS = ['day', 'lamp', 'city', 'warm', 'rain', 'storm', 'snow', 'fog', 'cloud', 'moon', 'litFrac', 'it'];
let lastBake = -99, bakedSnap = null, fade = 1;

let L = null;

function computeLayout() {

  if (x > t.px0 - 6 && x < t.px1 + 6 && y > t.cy - t.pv * t.q - 34 && y < t.cy + t.pv * t.q + 24) {
    const playing = music.intent ? music.intent.play : !!(music.np && music.np.playing);
    music.intent = { play: !playing, until: T + 3 };
    sClick(); media('playpause');
    return;
  }
  for (let i = 0; i < L.crates.length; i++) {
    const c = L.crates[i];
    if (x > c.x0 && x < c.x1 && y > c.rec - 30 && y < c.bot) { startFlip(i, c.next); if (c.next) later(0.25, () => media('next')); return; }
  }
  const h = L.hero;
  if (x > h.x && x < h.x + h.s && y > h.y && y < h.y + h.s) { music.swap = Math.min(music.swap, 0.75); return; }
}
LW.on('down', onDown);
LW.on('move', (x, y) => {
  const T = nowS(), [wx, wy] = toWorld(x, y), p = { x: wx, y: wy, t: T };
  if (ptrLast) { const dt = Math.max(1 / 60, T - ptrLast.t), d = Math.hypot(p.x - ptrLast.x, p.y - ptrLast.y); ptrSpeed = Math.max(ptrSpeed * 0.6, d / dt); if (d > 3) ptrStillSince = T; } else ptrStillSince = T;
  ptrLast = p;
});
LW.on('env', () => { computeTarget(); updateBoard(); });
LW.on('nowplaying', onNowPlaying);
LW.on('beat', s=>{music.pulse=Math.max(music.pulse,s);music.lastBeat=nowS();});
LW.on('reminder', (r) => {
  if (!r) return;
  if (r.kind === 'water') startWater(r.text);
  else if (r.kind === 'stretch') startStretch(r.text);
  else if (r.kind === 'breathe') setCalm(true, 60);
});
LW.on('calm', (on) => setCalm(!!on, 0, true));
LW.on('action', (a) => {
  if (a === 'water') startWater();
  else if (a === 'stretch') startStretch();
  else if (a === 'calm' || a === 'breathe') setCalm(!calm.on, a === 'breathe' ? 60 : 0);
  else if (a === 'playpause' || a === 'next' || a === 'previous') media(a);
  else if (a === 'pet' && !cat.away) onDown(devX(cat.x) / dpr, devY(cat.y - 40 * cat.k) / dpr);
});
if (!LW.isHost) addEventListener('keydown', (e) => {
  if (e.key === 's') startStretch('roll your shoulders');
  if (e.key === '.') media('next');
  if (e.key === 'p') media('playpause');
  if (e.key === 'c') { planRoam(nowS()); }
});

// =====================================================================
//  frame
// =====================================================================
let tPrev = nowS(), perfAcc = 0, perfN = 0, perfMs = 0;
function frame() {
  requestAnimationFrame(frame);
  const T = nowS(), dt = Math.min(0.1, Math.max(0, T - tPrev));
  tPrev = T;
  const t0 = LW.virtual ? 0 : performance.now();
  step(dt, T);
  render(T);
  if (!LW.virtual) { perfAcc += performance.now() - t0; if (++perfN >= 60) { perfMs = perfAcc / perfN; perfAcc = 0; perfN = 0; } }
}
function step(dt, T) {
  runTimers();
  ptrSpeed *= Math.exp(-dt * 6);
  if (calm.on) { calm.t += dt; if (calm.auto && calm.t > calm.auto) setCalm(false); }
  calm.lv = approach(calm.lv, calm.on ? 1 : 0, calm.on ? 0.6 : 0.9, dt);
  stepGuide(dt);
  updateEnv(dt);
  updateTurntable(dt);
  updateOutside(dt, T);
  updateParticles(dt * calmPace(), T);
  updateWater(dt);
  petSystem.step(dt,T);
  boardFade = Math.min(1, boardFade + dt / 1.8);
  if (boardOverride && T > boardOverride.until) { boardOverride = null; updateBoard(); }
  if (flip) flip.t += dt;
}
function render(T) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (OX > 0.5 || OY > 0.5) { ctx.fillStyle = '#0d0a0b'; ctx.fillRect(0, 0, cv.width, cv.height); }
  drawOutside(ctx, T);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (fade < 1 && prevRoomCv) ctx.drawImage(prevRoomCv, 0, 0);
  ctx.globalAlpha = fade < 1 && prevRoomCv ? fade : 1; ctx.drawImage(roomCv, 0, 0); ctx.globalAlpha = 1;
  drawNeon(ctx, T);
  setW(ctx);
  const lv = E.lamp * (1 - 0.6 * calm.lv);
  // live glows: banker's lamp, booth porthole (breathes with the bass), track spots
  if (lv > 0.02) {
    drawSprite(ctx, GLOW_WARM, L.lamp.x, L.lamp.y - 50, 70, 0.32 * lv);
    const bw = L.booth.win, p = music.pal || DEFAULT_PAL;
    drawSprite(ctx, GLOW_WARM, bw.x, bw.y, bw.r * 2.2, (0.22 + 0.08 * music.bassEnv * music.lv) * Math.max(lv, 0.5));
    if (tintGlow && music.lv > 0.02) drawSprite(ctx, tintGlow, bw.x, bw.y, bw.r * 2, 0.22 * music.lv * (1 - calm.lv), 'screen');
  }
  if (lv > 0.02 && L.fairy) {
    for (let i = 0; i < L.fairy.length; i++) {
      const [x, y] = L.fairy[i], k = 0.75 + 0.25 * Math.sin(T * (0.5 + (i % 5) * 0.11) + i * 1.7);
      ctx.fillStyle = `rgba(255,${205 + (i % 3) * 14},140,${0.9 * lv})`; ctx.beginPath(); ctx.arc(x, y, 2.2, 0, TAU); ctx.fill();
      drawSprite(ctx, GLOW_WARM, x, y, 16, 0.32 * lv * k);
    }
  }
  // music tint: the shop leans toward the album's colours (subtle)
  const tintLv = music.lv * (1 - calm.lv);
  if (tintLv > 0.01 && tintGlow) {
    drawSprite(ctx, tintGlow, L.hero.cx, L.cab.top + 60, 520, 0.08 * tintLv, 'screen');
    drawSprite(ctx, tintGlow, (L.stand.x0 + L.stand.x1) / 2, 820, 520, 0.06 * tintLv, 'screen');
    drawSprite(ctx, tintGlow, L.tt.cx, L.tt.cy, 300, 0.07 * tintLv, 'screen');
  }
  drawHero(ctx, T);
  drawBoard(ctx);
  drawSpeakers(ctx);
  drawTurntable(ctx);
  petSystem.draw(ctx);
  drawParticles(ctx);
  drawWater(ctx);
  // dimming: paused/stopped → a touch darker; calm → much darker
  const pausedDim = (1 - music.lv) * (music.ever ? 0.08 : 0.04) * (1 - E.day * 0.7);
  const dim = clamp(pausedDim + calm.lv * (0.56 - 0.18 * breath()), 0, 0.8);   // the room itself breathes
  if (dim > 0.002) { ctx.fillStyle = `rgba(8,4,6,${dim})`; ctx.fillRect(-2400, -10, W + 4800, H + 20); }
  if (calm.lv > 0.01) drawBreathLight(ctx, breath(), calm.lv);
  const fa = flashA();
  if (fa > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(120,130,170,${fa * 0.1})`; ctx.fillRect(-2400, -10, W + 4800, H + 20); ctx.globalCompositeOperation = 'source-over'; }
}

// =====================================================================
//  boot
// =====================================================================
function rebuild() {
  const keepCat = L && cat.plat === 'crate' && !cat.act;
  computeLayout();
  if (!E) computeTarget();
  E.amb = envAmb();
  bake(false);
  bakeBeads();
  bakeNeon();
  rebuildArt(false);
  boardKey = ''; prevBoardCv = null; boardFade = 1; updateBoard(true);
  petSystem.reset();
}
LW.on('layout', () => { clearTimeout(rsT); rsT = setTimeout(rebuild, 60); });
let rsT = null;
addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(rebuild, 150); });
computeTarget();
E.amb = envAmb();
rebuild();
loadArtSlots();

if (LW.nowPlaying) onNowPlaying(LW.nowPlaying);
if (LW.calm) setCalm(true);
requestAnimationFrame(frame);

// dev hooks: perf + identity self-test
function benchRaw(n = 120) {
  let T = nowS(); const t0 = performance.now(); let js = 0;
  for (let i = 0; i < n; i++) { T += 1 / 30; const a = performance.now(); step(1 / 30, T); render(T); js += performance.now() - a; }
  ctx.getImageData(0, 0, 1, 1);
  return { perFrameTotal: +((performance.now() - t0) / n).toFixed(2), jsOnly: +(js / n).toFixed(2) };
}
window.__pets=petSystem;
window.__records={pets:petSystem,get L(){return L},get E(){return E},step,render,bake,ART,calm,setCalm,startWater,startStretch};
})();
