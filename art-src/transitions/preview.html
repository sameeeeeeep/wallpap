<!doctype html><meta charset=utf-8><title>Cat transitions</title>
<style>body{margin:0;background:#2b2f36;color:#ddd;font:14px system-ui;display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:16px}
div{background:#3a3f47;border-radius:10px;padding:8px;text-align:center}canvas{width:100%;height:auto}</style>
<body><script>
const T=['stand-sit','sit-sleep','turn','jump'];
for(const t of T){const d=document.createElement('div');d.innerHTML=`<canvas width=520 height=320></canvas><br>${t} (ping-pong, 110ms/frame)`;document.body.append(d);
 const c=d.querySelector('canvas'),x=c.getContext('2d'),f=[1,2,3,4,5].map(i=>{const im=new Image();im.src=`cut/cat-orange-${t}-${i}.png`;return im});
 const lift=t=='jump'?[0,55,75,40,0]:[0,0,0,0,0];let k=0,dir=1,hold=0;
 setInterval(()=>{x.clearRect(0,0,520,320);const im=f[k];if(im.complete){x.drawImage(im,260-im.width/2,290-im.height-lift[k])}
  x.fillStyle='#555';x.fillRect(40,291,440,2);
  if(hold>0){hold--;return} k+=dir;if(k==4||k==0){dir=-dir;hold=8}},110)}
</script>
