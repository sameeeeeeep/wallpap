<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluids</title>
<!--
  wallpap scene: Fluids, a family of music-driven fluid installations.
  Skins (LW.settings.skin):
    'ferro'  Magnet Bloom (default, free): a black mirror pool of ferrofluid in a slate dish that grows
             a crown of spikes only when the music earns it (the Rosensweig normal-field instability).

  Magnet Bloom, physically:
    A magnet sits under the dish. Below a critical field Bc the fluid only gathers into a low dome;
    past Bc a hexagonal lattice of spikes erupts (with hysteresis: it holds until the field falls
    clearly below Bc). At a higher field the lattice switches hexagons → squares (a real second
    threshold). When the field drops the spikes slump back viscously (~1.5 s) into a mirror.
  Music (all via music.js / LW.mx):
    loudness (energy)            → field B (threshold + hysteresis: quiet passages stay a mirror)
    kick                         → field pulse: spikes jolt and a capillary ring runs outward
    chord root (circle of fifths) → where the magnet sits under the dish; chord change → it glides
                                   (motor-limited) and the crown slides across the pool
    key                          → lattice orientation + the tonal palette (rim light colour)
    brightness                   → spike sharpness; very high field → hexagon → square lattice
    build (tension)              → the magnet slowly rises (B baseline creeps up)
    drop                         → full crown (B boost that relaxes over ~8 s)
    silence / paused             → magnet withdraws; mirror pool with a faint meniscus shimmer;
                                   now and then a small resting bloom (the installation's idle)
    calm                         → a soft sub-threshold dome swells on the in-breath, flattens on
                                   the out-breath; never spikes
  Never strobes: beats move the fluid, the light only follows slow arcs.

  Render (WebGL2, no 2D canvas is ever uploaded):
    1. height pass: 512² heightfield (fluid + dish + table) from analytic terms
    2. view pass: perspective heightfield ray-march (22 steps + 5 refinements, ≤1150 px wide), GGX-ish black
       dielectric under an analytic studio (one softbox + an accent rim strip), slate + table
    3. dual-filter bloom (quarter res) → ACES → alpha vignette into the canvas2D backdrop
  Layers: #bg canvas2D backdrop (baked on time-of-day/palette change), #gl the dish, #cap caption.
  Layout: the dish sits inside LW.layout.clear (right ~28% stays backdrop); follows LW.on('layout').
  Dev keys (browser): n fake track (lw.js + music.js synthetic frames), p play/pause demo,
    . next, k kick, s stretch, r water (lw.js), b calm (lw.js), t +3h (lw.js)
  Debug: window.__fx.bench(120) → ms/frame incl. GPU sync.
  Art slots: none (procedural).
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06070a; }
  canvas { position: fixed; display: block; }
  #bg { left: 0; top: 0; width: 100vw; height: 100vh; }
  #gl, #cap { pointer-events: none; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="gl"></canvas>
<canvas id="cap"></canvas>
<script src="lw.js"></script>
<script src="music.js"></script>
<script src="physical-skins.js"></script>
<script>
'use strict';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, tau, dt) => v + (t - v) * (1 - Math.exp(-dt / Math.max(1e-4, tau)));
const smooth01 = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const nowS = () => performance.now() / 1000;
const qs = new URLSearchParams(location.search);
const DEV = !LW.isHost;
const SERIF = 'ui-serif, "New York", "Iowan Old Style", Georgia, serif';
const SANS = '-apple-system, BlinkMacSystemFont, system-ui, sans-serif';
const MONO = 'ui-monospace, "SF Mono", Menlo, monospace';
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const toLin = (c) => c.map((v) => Math.pow(clamp(v / 255, 0, 1), 2.2));
const MX = LW.mx;
const CAP = clamp(+(qs.get('cap') || 1150), 512, 2600);   // max internal render width (px)
const HSIDE = 512;                                       // heightfield resolution
const ASPECT = 1.5;                                      // GL canvas width / height

// =====================================================================
//  WebGL2 helpers
// =====================================================================
const glCv = document.getElementById('gl');
let gl = null;
try {
  gl = glCv.getContext('webgl2', { antialias: false, alpha: true, premultipliedAlpha: true, depth: false, stencil: false, preserveDrawingBuffer: false });
  if (gl && !gl.getExtension('EXT_color_buffer_float')) { console.warn('fluids: EXT_color_buffer_float missing'); gl = null; }
} catch (e) { gl = null; }
if (gl) gl.bindVertexArray(gl.createVertexArray());
const FULLSCREEN_VS = `#version 300 es
out vec2 vUv;
void main() { vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); vUv = p; gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
function makeSetter(info, loc) {
  const arr = info.size > 1;
  switch (info.type) {
    case gl.FLOAT: return arr ? (v) => gl.uniform1fv(loc, v) : (v) => gl.uniform1f(loc, v);
    case gl.FLOAT_VEC2: return (v) => gl.uniform2fv(loc, v);
    case gl.FLOAT_VEC3: return (v) => gl.uniform3fv(loc, v);
    case gl.FLOAT_VEC4: return (v) => gl.uniform4fv(loc, v);
    case gl.INT: case gl.BOOL: case gl.SAMPLER_2D: return arr ? (v) => gl.uniform1iv(loc, v) : (v) => gl.uniform1i(loc, v);
    default: return () => {};
  }
}
function program(vsSrc, fsSrc) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vsSrc], [gl.FRAGMENT_SHADER, fsSrc]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const setters = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); setters[info.name.replace(/\[0\]$/, '')] = makeSetter(info, gl.getUniformLocation(p, info.name)); }
  return { use(u = {}) { gl.useProgram(p); for (const k in u) if (setters[k]) setters[k](u[k]); } };
}
function target(w, h, { internal = gl.RGBA16F, type = gl.HALF_FLOAT, filter = gl.LINEAR } = {}) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, gl.RGBA, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fbo, w, h, dispose() { gl.deleteTexture(tex); gl.deleteFramebuffer(fbo); } };
}
function bindTarget(t) { gl.bindFramebuffer(gl.FRAMEBUFFER, t ? t.fbo : null); gl.viewport(0, 0, t ? t.w : gl.drawingBufferWidth, t ? t.h : gl.drawingBufferHeight); }
function bindTex(unit, tex) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); }

// =====================================================================
//  Shaders
// =====================================================================
// World: z up, dish centred at the origin, radius 1. Camera on −y looking toward +y and down.
const GEOM = `
const float E = 1.3;          // heightfield half-extent
const float RF = 0.82;        // fluid radius (inner wall of the dish)
const float RD = 1.0;         // dish outer radius
const float ZRIM = 0.035;     // dish rim height
const float ZTAB = -0.11;     // table
const float ZMAX = 0.30;      // tallest spike tip`;

const HEIGHT_FS = `#version 300 es
precision highp float;
${GEOM}
uniform vec2 uMag;            // magnet position (dish units)
uniform float uSig, uDome, uSpk, uK, uRot, uSq, uSharp, uTime, uShim;
uniform vec4 uRip[4];         // x, y, age, strength
in vec2 vUv; out vec4 o;
float latticeHex(vec2 q) {
  const vec2 e1 = vec2(1.0, 0.0), e2 = vec2(-0.5, 0.8660254), e3 = vec2(-0.5, -0.8660254);
  return (cos(dot(q, e1)) + cos(dot(q, e2)) + cos(dot(q, e3))) / 3.0;   // -0.5 .. 1 (1 on lattice points)
}
void main() {
  vec2 p = (vUv * 2.0 - 1.0) * E;
  float r = length(p);
  float h;
  if (r < RF) {
    vec2 d = p - uMag;
    float rm = length(d);
    float wall = smoothstep(RF, RF - 0.16, r);
    float env = exp(-rm * rm / (uSig * uSig)) * wall;
    // dome: the fluid heaps over the magnet even below threshold
    h = uDome * env;
    // spikes: lattice anchored on the magnet, conical peaks (pow of the cosine sum)
    float c = cos(uRot), s = sin(uRot);
    vec2 q = mat2(c, -s, s, c) * d * uK;
    float hex = clamp((latticeHex(q) + 0.5) / 1.5, 0.0, 1.0);
    float sq = clamp((cos(q.x) + cos(q.y) + 2.0) / 4.0, 0.0, 1.0);
    float lat = pow(mix(hex, sq, uSq), uSharp);
    h += uSpk * 0.22 * pow(env, 0.5) * lat * smoothstep(0.02, 0.25, env);
    // capillary rings from kicks
    for (int i = 0; i < 4; i++) {
      vec4 R = uRip[i];
      if (R.w <= 0.0) continue;
      float x = length(p - R.xy) - R.z * 0.55;
      h += R.w * 0.0028 * exp(-x * x * 500.0) * sin(x * 95.0) * exp(-R.z * 1.6) * wall;
    }
    // meniscus shimmer + the fluid climbing the wall
    h += uShim * 0.00035 * (sin(p.x * 13.0 + uTime * 0.6) * sin(p.y * 11.0 - uTime * 0.45) + 0.5 * sin((p.x - p.y) * 19.0 + uTime * 0.8)) * wall;
    h += 0.016 * smoothstep(RF - 0.07, RF, r);
    h -= 0.004;
  } else if (r < RD) {
    // rim: flat top with a rounded outer edge and a short inner wall
    float inner = smoothstep(RF, RF + 0.012, r);
    float outer = 1.0 - smoothstep(RD - 0.03, RD, r);
    h = mix(0.012, ZRIM, inner) - (1.0 - outer) * 0.02 * (r - RD + 0.03) / 0.03;
  } else {
    h = mix(ZRIM - 0.02, ZTAB, smoothstep(RD, RD + 0.02, r));
  }
  o = vec4(h, 0.0, 0.0, 1.0);
}`;

const VIEW_FS = `#version 300 es
precision highp float;
${GEOM}
uniform sampler2D uH;
uniform vec3 uCam, uF, uR, uU;
uniform vec2 uTan;
uniform vec3 uKey, uRim, uRim2, uAmb, uTable;
uniform float uTime;
in vec2 vUv; out vec4 o;
float H(vec2 p) {
  vec2 uv = p / (2.0 * E) + 0.5;
  if (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) return ZTAB;
  return texture(uH, uv).r;
}
vec3 normalAt(vec2 p) {
  float e = 2.0 * E / ${HSIDE}.0;
  float hx = H(p + vec2(e, 0)) - H(p - vec2(e, 0));
  float hy = H(p + vec2(0, e)) - H(p - vec2(0, e));
  return normalize(vec3(-hx, -hy, 2.0 * e));
}
// studio: one big softbox behind/above the dish, an accent strip to the right, a dim neutral strip left
vec3 env(vec3 r, float rough) {
  float el = asin(clamp(r.z, -1.0, 1.0));
  float az = atan(r.x, r.y);
  vec3 c = uAmb * (0.25 + 0.75 * smoothstep(-0.2, 0.9, r.z));
  float soft = 0.05 + rough * 0.9;
  vec2 b = vec2(abs(az) / 0.13, abs(el - 0.5) / 0.085);
  float box = pow(pow(b.x, 5.0) + pow(b.y, 5.0), 1.0 / 5.0);
  float edgeLit = 0.7 + 0.3 * (1.0 - b.x * b.x);                  // diffuser: brighter in the middle
  c += uKey * smoothstep(1.0 + soft, 1.0 - soft, box) * edgeLit;
  c += uKey * 0.012 * exp(-box * box * 0.6);                      // the box's spill
  vec2 s1 = vec2(abs(az - 1.5) / 0.22, abs(el - 0.4) / 0.32);
  c += uRim * smoothstep(1.0 + soft * 2.0, 1.0 - soft * 2.0, max(s1.x, s1.y));
  vec2 s2 = vec2(abs(az + 1.95) / 0.07, abs(el - 0.22) / 0.22);
  c += uRim2 * smoothstep(1.0 + soft * 2.0, 1.0 - soft * 2.0, max(s2.x, s2.y));
  return c;
}
float h12(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h12(i), h12(i + vec2(1, 0)), f.x), mix(h12(i + vec2(0, 1)), h12(i + vec2(1, 1)), f.x), f.y);
}
void main() {
  vec2 sc = vUv * 2.0 - 1.0;
  vec3 d = normalize(uF + sc.x * uTan.x * uR + sc.y * uTan.y * uU);
  vec3 ro = uCam;
  float t0 = (ZMAX - ro.z) / d.z, t1 = (ZTAB - ro.z) / d.z;
  vec3 pT = ro + d * t1;
  float t = t1;
  // only march where the ray passes over the dish
  vec2 a0 = (ro + d * t0).xy;
  vec2 ab = pT.xy - a0;
  float tc = clamp(-dot(a0, ab) / max(dot(ab, ab), 1e-6), 0.0, 1.0);
  bool over = length(a0 + ab * tc) < RD + 0.05;
  if (over) {
    const int N = 22;
    float tp = t0;
    bool hit = false;
    for (int i = 1; i <= N; i++) {
      float ti = mix(t0, t1, float(i) / float(N));
      vec3 p = ro + d * ti;
      if (p.z < H(p.xy)) { t = ti; hit = true; break; }
      tp = ti;
    }
    if (hit) {
      float lo = tp, hi = t;
      for (int k = 0; k < 5; k++) { float m = 0.5 * (lo + hi); vec3 p = ro + d * m; if (p.z < H(p.xy)) hi = m; else lo = m; }
      t = hi;
    }
  }
  vec3 p = ro + d * t;
  float r = length(p.xy);
  vec3 col;
  vec3 keyDir = normalize(vec3(0.0, 0.62, 0.78));
  if (r < RF + 0.004) {
    // ferrofluid: black dielectric, very glossy
    vec3 n = normalAt(p.xy);
    vec3 rf = reflect(d, n);
    float cosv = clamp(dot(-d, n), 0.0, 1.0);
    float F = 0.065 + 0.935 * pow(1.0 - cosv, 5.0);
    col = env(rf, 0.04) * F + vec3(0.0025) * max(dot(n, keyDir), 0.0) * uKey;
  } else if (r < RD + 0.012) {
    // slate: honed dark stone, fine mottling
    vec3 n = normalAt(p.xy);
    float m = vnoise(p.xy * 38.0) * 0.6 + vnoise(p.xy * 110.0) * 0.4;
    vec3 alb = vec3(0.045, 0.047, 0.05) * (0.8 + 0.4 * m);
    float dif = max(dot(n, keyDir), 0.0) * 0.55 + 0.25;
    vec3 rf = reflect(d, n);
    float cosv = clamp(dot(-d, n), 0.0, 1.0);
    float F = 0.04 + 0.96 * pow(1.0 - cosv, 5.0);
    col = alb * dif * (uKey * 0.12 + uAmb * 3.0) + env(rf, 0.45) * F * 0.22;
  } else {
    // table: near-black, a soft pool of light and the dish's contact shadow
    float pool = exp(-dot(p.xy - vec2(0.0, 0.25), p.xy - vec2(0.0, 0.25)) * 0.35);
    float sh = mix(0.25, 1.0, smoothstep(RD, RD + 0.35, length(p.xy - vec2(0.0, -0.06))));
    col = uTable * (0.35 + 0.65 * pool) * sh;
  }
  // alpha: fade the table into the backdrop toward the canvas edges
  float vig = smoothstep(1.0, 0.72, length(sc * vec2(0.92, 1.0)));
  float a = r < RD + 0.02 ? 1.0 : vig;
  o = vec4(col * a, a);
}`;

const DOWN_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform vec2 uTexel; uniform float uThreshold, uSpread; uniform int uPrefilter;
in vec2 vUv; out vec4 o;
vec3 pre(vec3 c) {
  if (uPrefilter == 0) return c;
  float b = max(c.r, max(c.g, c.b));
  float soft = clamp(b - uThreshold + 0.5, 0.0, 1.0); soft = soft * soft * 0.5;
  return c * max(soft, b - uThreshold) / max(b, 1e-4);
}
void main() {
  vec2 h = uTexel * uSpread;
  vec3 c = pre(texture(uSrc, vUv).rgb) * (uPrefilter == 0 ? 4.0 : 0.0);
  c += pre(texture(uSrc, vUv - h).rgb) + pre(texture(uSrc, vUv + h).rgb);
  c += pre(texture(uSrc, vUv + vec2(h.x, -h.y)).rgb) + pre(texture(uSrc, vUv - vec2(h.x, -h.y)).rgb);
  o = vec4(c / (uPrefilter == 0 ? 8.0 : 4.0), 1.0);
}`;
const UP_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform vec2 uTexel;
in vec2 vUv; out vec4 o;
vec3 t(vec2 d) { return texture(uSrc, vUv + d * uTexel).rgb; }
void main() {
  vec3 c = t(vec2(-2, 0)) + t(vec2(2, 0)) + t(vec2(0, -2)) + t(vec2(0, 2));
  c += 2.0 * (t(vec2(-1, -1)) + t(vec2(1, -1)) + t(vec2(-1, 1)) + t(vec2(1, 1)));
  o = vec4(c / 12.0, 1.0);
}`;
const COMP_FS = `#version 300 es
precision highp float;
uniform sampler2D uScene, uBloom;
uniform float uBloomAmt, uExposure;
in vec2 vUv; out vec4 o;
vec3 aces(vec3 x) { const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14; return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0); }
float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main() {
  vec4 s = texture(uScene, vUv);
  vec2 q = vUv * 2.0 - 1.0;
  float edge = smoothstep(1.0, 0.75, max(abs(q.x), abs(q.y)));
  vec3 hdr = s.rgb + texture(uBloom, vUv).rgb * uBloomAmt * mix(edge, 1.0, s.a);
  vec3 col = pow(aces(hdr * uExposure), vec3(1.0 / 2.2));
  col += (hash(gl_FragCoord.xy) - 0.5) / 255.0;
  float a = max(s.a, max(col.r, max(col.g, col.b)));
  o = vec4(clamp(col, 0.0, a), a);
}`;

const GPU = { w: 0, h: 0 };
function initGL() {
  GPU.height = program(FULLSCREEN_VS, HEIGHT_FS);
  GPU.view = program(FULLSCREEN_VS, VIEW_FS);
  GPU.down = program(FULLSCREEN_VS, DOWN_FS);
  GPU.up = program(FULLSCREEN_VS, UP_FS);
  GPU.comp = program(FULLSCREEN_VS, COMP_FS);
  GPU.H = target(HSIDE, HSIDE);
  GPU.mips = [];
}
function resizeGL(w, h) {
  if (w === GPU.w && h === GPU.h) return;
  GPU.w = w; GPU.h = h;
  if (GPU.scene) GPU.scene.dispose();
  GPU.mips.forEach((m) => m.dispose()); GPU.mips = [];
  GPU.scene = target(w, h);
  let sw = w >> 2, sh = h >> 2;
  for (let i = 0; i < 4 && sw >= 8 && sh >= 8; i++, sw >>= 1, sh >>= 1) GPU.mips.push(target(sw, sh));
}

// =====================================================================
//  Layout: the dish in the clear band (LW.layout), right side stays backdrop
// =====================================================================
const L = { W: 0, H: 0, dpr: 1, cw: 0, ch: 0, cx: 0, cy: 0, x0: 0, x1: 0, pw: 0, ph: 0 };
function layout() {
  const W = innerWidth, H = innerHeight;
  const cl = (LW.layout && LW.layout.clear) || [0, 0.72];
  L.W = W; L.H = H; L.dpr = Math.min(2, devicePixelRatio || 1);
  L.x0 = cl[0] * W; L.x1 = cl[1] * W;
  const zone = L.x1 - L.x0;
  L.cw = Math.round(Math.min(zone * 0.9, H * 0.86 * ASPECT));
  L.ch = Math.round(L.cw / ASPECT);
  L.cx = Math.round(L.x0 + zone * 0.52);
  L.cy = Math.round(H * 0.45);
  glCv.style.width = L.cw + 'px'; glCv.style.height = L.ch + 'px';
  glCv.style.left = (L.cx - L.cw / 2) + 'px'; glCv.style.top = (L.cy - L.ch / 2) + 'px';
  L.pw = Math.min(CAP, Math.round(L.cw * L.dpr * 0.7)); L.ph = Math.round(L.pw / ASPECT);
  if (gl) { if (glCv.width !== L.pw || glCv.height !== L.ph) { glCv.width = L.pw; glCv.height = L.ph; } resizeGL(L.pw, L.ph); }
  layoutCaption();
  // calm label: in the quiet strip beside the dish if there is room, else above it
  const right = L.cx + L.cw * 0.47, room = L.x1 - right;
  LW.breathLabelAt = room > 170 ? [(right + room / 2) / W, L.cy / H] : [L.cx / W, Math.max(0.05, (L.cy - L.ch * 0.42) / H)];
  bg.dirty = true;
}

// =====================================================================
//  Backdrop: dark studio, faint pool of light, time-of-day tint (baked, half res)
// =====================================================================
const bgCv = document.getElementById('bg'), bgx = bgCv.getContext('2d');
const bg = { dirty: true, at: -1, key: '', noise: null };
// hour → [base, pool, key light] (sRGB)
const TOD = [
  [0, [5, 6, 10], [18, 20, 30], [185, 200, 235]],
  [5.5, [6, 6, 10], [22, 22, 32], [200, 200, 230]],
  [7.2, [10, 8, 10], [36, 28, 30], [255, 220, 205]],
  [10, [9, 9, 10], [32, 32, 34], [245, 242, 236]],
  [16.5, [9, 9, 10], [32, 31, 30], [248, 238, 224]],
  [18.6, [11, 8, 7], [40, 28, 22], [255, 208, 170]],
  [20.6, [6, 7, 10], [20, 21, 30], [205, 210, 235]],
  [24, [5, 6, 10], [18, 20, 30], [185, 200, 235]],
];

  bench(n = 120) {
    const realNow = () => new Event('x').timeStamp, px = new Uint8Array(4);
    let T = nowS(); const t0 = realNow();
    for (let i = 0; i < n; i++) { T += 1 / 30; tick(1 / 30, T); if (gl) gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); }
    return { msPerFrameSynced: +((realNow() - t0) / n).toFixed(2), renderPx: [GPU.w, GPU.h], dpr: L.dpr, view: [L.W, L.H] };
  },
};
