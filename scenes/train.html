<script>
/* =====================================================================
   Night Train — a quiet carriage, window seat. The world slides by in
   parallax (city lights → suburbs → countryside → bridge over water →
   brief tunnels; fields and hills by day). Music hero: the little player
   propped on the table shows the album art + title; headphones, a glass
   of tea in its holder, a face-down book. A calico cat naps on the seat
   (sits up to watch the lights); a corgi wanders the aisle and settles
   at different seats.

   Click the player = play / pause.  Click the window = next track (the
   view skips ahead to a new landscape).  Dev keys: n (fake track),
   p play/pause, . next, s stretch, c/d roam cat/dog, w weather, t time.

   ART SLOTS (optional; everything is procedural until these exist)
   Put PNGs in scenes/art/train/. Tried once with new Image(); 404s ignored.
     bg-night.png  3200×2000  carriage interior at night (16:10), EMPTY of the
                              player/animals/tea steam. The WINDOW GLASS must be
                              fully transparent (alpha 0) — the landscape is live.
     bg-day.png    3200×2000  same framing by day (crossfades with bg-night).
       With a bg the layout locks to a 1600×1000 reference frame (cover-fit).
       Anchors (world units):
         window glass        x 176…1050, y 150…612 (corner radius 46)
         table top           y 640 (back) … 704 (front), x 333…893
         player (hero)       base centre (568, 684), 150×252, leaning on a stand
         left seat cushion   y 744, x 83…339  (cat's home)
         right seat cushion  y 744, x 887…1143
         aisle (dog lane)    y ≈ 950
       Keep x > 1120 calm (macOS widgets live there): no text, nothing bright.
     ANIMALS — illustrated sprites from the shared library:
       art/sprites/cats/calico/{walk1,walk2,sit,sleep}.png         (cat "Patch")
       art/sprites/dogs/corgi/{walk1,walk2,sit,sleep,play-bow}.png (corgi "Toast")
     transparent, facing RIGHT, bottom-centre = paw contact; scaled so walk1's
     width = body length. Per-scene overrides win: art/train/cat-<pose>.png,
     art/train/dog-<pose>.png (same pose names). Procedural fallback until loaded.
   ===================================================================== */
'use strict';
(() => {
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

const rgba = (c, a = 1) => `rgba(${clamp(c[0] | 0, 0, 255)},${clamp(c[1] | 0, 0, 255)},${clamp(c[2] | 0, 0, 255)},${a})`;

const lum = (c) => (c[0] + c[1] + c[2]) / 3;
const approach = (v, t, rate, dt) => v + (t - v) * (1 - Math.exp(-rate * dt));
function mulberry(a) {

    a |= 0; a = (a + 0x6d2b79f5) | 0;

}

const nowS = () => performance.now() / 1000;
const timers = [];
const later = (sec, fn) => timers.push({ at: nowS() + sec, fn });
function runTimers() { const T = nowS(); for (let i = timers.length - 1; i >= 0; i--) if (timers[i].at <= T) { const f = timers[i].fn; timers.splice(i, 1); try { f(); } catch (e) { console.error(e); } } }
const SANS = '-apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif';
const SERIF = '"Hoefler Text", "Baskerville", "Iowan Old Style", Georgia, serif';
const HAND = '"Marker Felt", "Noteworthy", "Chalkboard SE", cursive';
function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
function rr(g, x, y, w, h, r) {

  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
function rrPath(p, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  p.moveTo(x + r, y); p.lineTo(x + w - r, y); p.quadraticCurveTo(x + w, y, x + w, y + r);
  p.lineTo(x + w, y + h - r); p.quadraticCurveTo(x + w, y + h, x + w - r, y + h); p.lineTo(x + r, y + h);
  p.quadraticCurveTo(x, y + h, x, y + h - r); p.lineTo(x, y + r); p.quadraticCurveTo(x, y, x + r, y); p.closePath();

}
const GLOW_WARM = sprite(128, [[0, 'rgba(255,214,150,1)'], [0.18, 'rgba(255,190,110,0.5)'], [0.5, 'rgba(255,160,80,0.12)'], [1, 'rgba(255,140,60,0)']]);
const GLOW_WHITE = sprite(128, [[0, 'rgba(255,255,255,1)'], [0.2, 'rgba(255,255,255,0.45)'], [0.55, 'rgba(255,255,255,0.1)'], [1, 'rgba(255,255,255,0)']]);
const GLOW_COOL = sprite(128, [[0, 'rgba(200,225,255,1)'], [0.2, 'rgba(170,205,255,0.4)'], [0.55, 'rgba(150,190,255,0.08)'], [1, 'rgba(150,190,255,0)']]);
const BLOB = sprite(64, [[0, 'rgba(255,255,255,0.9)'], [0.45, 'rgba(255,255,255,0.45)'], [1, 'rgba(255,255,255,0)']]);
const DARK = sprite(64, [[0, 'rgba(6,5,10,0.85)'], [0.5, 'rgba(6,5,10,0.45)'], [1, 'rgba(6,5,10,0)']]);
function drawSprite(g, sp, x, y, r, a, op = 'lighter') {
  if (a <= 0.003) return;
  g.globalCompositeOperation = op; g.globalAlpha = Math.min(1, a);
  g.drawImage(sp, x - r, y - r, r * 2, r * 2);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
}
function hsl2rgb(h, s, l) {
  const a = s * Math.min(l, 1 - l), f = (n) => { const k = (n + h / 30) % 12; return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [f(0) * 255, f(8) * 255, f(4) * 255];
}
function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  if (mx === mn) return [0, 0, l];
  const d = mx - mn, s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
  const h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h * 60, s, l];
}
function fitText(g, s, maxW) { s = s || ''; if (g.measureText(s).width <= maxW) return s; while (s.length > 1 && g.measureText(s + '…').width > maxW) s = s.slice(0, -1); return s + '…'; }
// smooth value noise (1D) for ridgelines
function vnoise(x, seed) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  const h = (n) => { let v = Math.imul((n + seed * 374761) | 0, 668265263); v = Math.imul(v ^ (v >>> 13), 1274126177); return ((v ^ (v >>> 16)) >>> 0) / 4294967296; };
  return lerp(h(i), h(i + 1), u);
}
const fbm = (x, seed) => vnoise(x, seed) * 0.6 + vnoise(x * 2.3, seed + 7) * 0.28 + vnoise(x * 5.1, seed + 13) * 0.12;

// =====================================================================
//  art slots
// =====================================================================
const ART = { dir: 'art/train/', img: {} };
function loadArtSlots() {
  for (const name of ['bg-night', 'bg-day']) {
    try {
      const im = new Image();
      im.onload = () => { if (!im.naturalWidth) return; ART.img[name] = im; clearTimeout(ART.rb); ART.rb = setTimeout(rebuild, 60); };
      im.onerror = () => {};
      im.src = ART.dir + name + '.png';
    } catch (e) { /* missing art never matters */ }
  }
}
const artMode = () => !!(ART.img['bg-night'] || ART.img['bg-day']);

// =====================================================================
//  environment: time of day + weather (glides; never pops)
// =====================================================================
const KF = [
  { h: 0, top: '#0a1130', bot: '#2e3a66', day: 0, lamp: 1, city: 1, warm: 0 },
  { h: 5.0, top: '#0a1130', bot: '#2e3a66', day: 0, lamp: 1, city: 1, warm: 0 },
  { h: 6.3, top: '#2b3462', bot: '#e09e86', day: 0.32, lamp: 0.75, city: 0.55, warm: 0.9 },
  { h: 7.6, top: '#7aa1cf', bot: '#efe0cc', day: 0.8, lamp: 0.25, city: 0.08, warm: 0.3 },
  { h: 9, top: '#5f95d4', bot: '#d8e6ee', day: 1, lamp: 0.12, city: 0, warm: 0 },
  { h: 16.3, top: '#6696cf', bot: '#efdcc0', day: 0.95, lamp: 0.15, city: 0, warm: 0.2 },
  { h: 18.3, top: '#45507f', bot: '#f09a5e', day: 0.55, lamp: 0.72, city: 0.45, warm: 1 },
  { h: 19.6, top: '#1a2046', bot: '#6c4f72', day: 0.15, lamp: 1, city: 0.9, warm: 0.3 },
  { h: 21, top: '#0a1130', bot: '#2e3a66', day: 0, lamp: 1, city: 1, warm: 0 },
  { h: 24, top: '#0a1130', bot: '#2e3a66', day: 0, lamp: 1, city: 1, warm: 0 },
];
KF.forEach((k) => { k.topC = hex(k.top); k.botC = hex(k.bot); });
const WX = {
  cloudy: { d: ['#99a2b1', '#c8ccd2'], n: ['#141824', '#262a38'], amt: 0.6, day: 0.85, lamp: 0.3 },
  rain: { d: ['#6c7684', '#959daa'], n: ['#0b0e17', '#1a1f2c'], amt: 0.85, day: 0.6, lamp: 0.6 },
  storm: { d: ['#4b5262', '#6d7483'], n: ['#06080e', '#131723'], amt: 0.95, day: 0.45, lamp: 0.8 },
  snow: { d: ['#b8becb', '#dde1e8'], n: ['#1a1d2b', '#30344a'], amt: 0.75, day: 0.85, lamp: 0.45 },
  fog: { d: ['#b3b6bc', '#d2d4d7'], n: ['#1d2029', '#373a46'], amt: 0.85, day: 0.75, lamp: 0.5 },

function computeTarget() {
  const env = LW.env || {};

    { x: tcx, y: 560, rx: Math.max(W * 0.42, 700), ry: 460, k: 0.3, c: [1.0, 0.84, 0.62], kind: 'ceil' },

  L = o;
  elCache.clear();
}

// =====================================================================
