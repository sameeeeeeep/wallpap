<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinetic</title>
<!--
  wallpap scene: Kinetic, music-driven kinetic sculptures. Skins (LW.settings.skin):
    'copper'        Copper Rain (default, free): an homage to ART+COM's Kinetic Rain. 1,024 polished
                    copper drops on hairline wires, seen from below in a dark atrium, morphing into the
                    shape of the harmony. Every drop is driven through a motor model (max velocity and
                    acceleration), which is what keeps it graceful and never twitchy.
    'harmonograph'  Harmonograph: a pendulum pen draws the interval you are hearing in sumi ink on cream
                    paper under a desk lamp. Simple ratios close into rosettes, dissonance weaves.
  Switching skin crossfades (both run for ~1.4 s).

  Copper Rain, music (LW.mx from music.js):
    chord (circle of fifths)  → the sculpture: a sum of low-order standing modes cos(nπu)cos(mπv) from the
                                Cymatics mode table, so related keys give related sculptures
    minor / major             → the mode's ± symmetry partner
    brightness                → mode order (complexity tier)
    loudness                  → amplitude, through the motor model
    kick                      → a soft swell travelling out from a point
    tempo / phrases           → the form changes only on phrase boundaries (bar 1 of 8)
    build (tension)           → the drops gather into a perfect flat plane, lifting slightly
    drop                      → the plane breaks into the new form (+ one big swell from the centre)
    silence / paused          → a slow looping choreography in which the two halves mirror and answer
    calm                      → the whole field rises and falls as one breathing plane
  Harmonograph, music:
    two strongest pitch classes → frequency ratio (unison 1:1, fifth 3:2, fourth 4:3, maj 3rd 5:4,
                                  min 3rd 6:5, tritone 45:32), glided like changing a pendulum length
    loudness wobble             → a small detune: the rosette precesses
    brightness                  → nib width;  loudness at the start of a sheet → figure size
    phrases                     → one sheet per 16 bars (or when the figure has decayed)
    drop                        → a third, rotary pendulum joins, drawing in the accent ink
    new track                   → a fresh sheet slides in; finished sheets stack and fade underneath
    silence                     → the pen spirals in as the damping finishes, then lifts. Long silence →
                                  a slow 1:1 ellipse in graphite
    calm                        → one ellipse per breath, growing on the in-breath
  Never strobes: beats move matter, never light.

  Rendering: Copper Rain is WebGL2 (instanced teardrops 216 tris × 1024, 2× MSAA HDR at ≤1.1 Mpx (?msaa=4 for more), analytic atrium
  environment, dual-filter bloom, ACES); heights are a 32×32 float texture (texSubImage of 4 KB/frame).
  Harmonograph is canvas2D only (the desk, paper and lamp are baked; per frame only new ink segments
  and the pen's CSS transform). No 2D canvas is ever uploaded to WebGL.
  Layout: hero inside LW.layout.clear (right ~28% calm), follows LW.on('layout').
  Dev keys (browser): n fake track (with chords), p play/pause demo, . next, k kick, v next skin,
    s stretch, r water, b calm, t +3h.   Debug: window.__kin.bench(120).
  Art slots: none (procedural).
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07070a; }
  canvas { position: fixed; display: block; }
  .skin { position: fixed; inset: 0; opacity: 0; transition: opacity 1.4s ease; pointer-events: none; }
  .skin.on { opacity: 1; }
  #cu-gl { left: 0; top: 0; width: 100vw; height: 100vh; }
  #hg-desk, #hg-shade { left: 0; top: 0; width: 100vw; height: 100vh; }
  #hg-sheet { position: fixed; transform-origin: 50% 50%; will-change: transform; }
  #hg-sheet canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #hg-stack { position: fixed; }
  #hg-pen { position: fixed; left: 0; top: 0; width: 0; height: 0; will-change: transform; }
  #hg-arm { position: absolute; left: 0; top: -1.5px; height: 3px; transform-origin: 0 50%; border-radius: 2px;
    background: linear-gradient(180deg, #e9cf98 0%, #a8803f 45%, #5d4219 100%); box-shadow: 0 6px 7px rgba(0,0,0,.35); }
  #hg-nib { position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #f3e3bd, #8d6a32 60%, #3a2a12); box-shadow: 0 3px 4px rgba(0,0,0,.45); }
  #cap { pointer-events: none; z-index: 5; }
</style>
</head>
<body>
<div class="skin" id="skin-copper"><canvas id="cu-gl"></canvas></div>
<div class="skin" id="skin-harmonograph">
  <canvas id="hg-desk"></canvas>
  <canvas id="hg-stack"></canvas>
  <div id="hg-sheet"><canvas id="hg-paper"></canvas><canvas id="hg-ink"></canvas></div>
  <canvas id="hg-shade"></canvas>
  <div id="hg-pen"><div id="hg-arm"></div><div id="hg-nib"></div></div>
</div>
<canvas id="cap"></canvas>
<script src="lw.js"></script>
<script src="music.js"></script>
<script>
'use strict';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, tau, dt) => v + (t - v) * (1 - Math.exp(-dt / Math.max(1e-4, tau)));
const smooth01 = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const nowS = () => performance.now() / 1000;
const qs = new URLSearchParams(location.search);
const DEV = !LW.isHost;
const SERIF = 'ui-serif, "New York", "Iowan Old Style", Georgia, serif';
const SANS = '-apple-system, BlinkMacSystemFont, system-ui, sans-serif';
const MONO = 'ui-monospace, "SF Mono", Menlo, monospace';
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const toLin = (c) => c.map((v) => Math.pow(clamp(v / 255, 0, 1), 2.2));
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const MX = LW.mx;
const SKINS = ['copper', 'harmonograph'];
const skinWanted = () => SKINS.includes(LW.settings.skin) ? LW.settings.skin : 'copper';

// hour → [base, key light] (sRGB) shared by both skins
const TOD = [
  [0, [6, 6, 9], [175, 190, 230]], [5.5, [7, 6, 9], [200, 196, 220]], [7.2, [12, 9, 9], [255, 214, 196]],
  [10, [11, 10, 10], [250, 244, 232]], [16.5, [11, 10, 10], [252, 238, 218]], [18.6, [13, 9, 7], [255, 200, 150]],
  [20.6, [7, 7, 10], [205, 205, 230]], [24, [6, 6, 9], [175, 190, 230]],
];
function todAt(h) {
  h = ((h % 24) + 24) % 24;
  for (let i = 0; i < TOD.length - 1; i++) {
    const a = TOD[i], b = TOD[i + 1];
    if (h >= a[0] && h <= b[0]) { const t = (h - a[0]) / (b[0] - a[0]), e = t * t * (3 - 2 * t); return { base: mix3(a[1], b[1], e), light: mix3(a[2], b[2], e), day: smooth01(6, 8.5, h) * (1 - smooth01(17.5, 20, h)) }; }
  }
  return { base: TOD[0][1], light: TOD[0][2], day: 0 };
}

// =====================================================================
//  Layout (shared): hero centre inside LW.layout.clear
// =====================================================================
const L = { W: 0, H: 0, dpr: 1, x0: 0, x1: 0, cx: 0, cy: 0 };
function layout() {
  const W = innerWidth, H = innerHeight, cl = (LW.layout && LW.layout.clear) || [0, 0.72];
  L.W = W; L.H = H; L.dpr = Math.min(2, devicePixelRatio || 1);
  L.x0 = cl[0] * W; L.x1 = cl[1] * W;
  L.cx = Math.round(L.x0 + (L.x1 - L.x0) * 0.52); L.cy = Math.round(H * 0.45);
  CU.layout(); HG.layout();
  layoutCaption();
}

// =====================================================================
//  Calm + reminders (shared)
// =====================================================================
const calm = { on: false, lv: 0, auto: 0, t: 0, br: { level: 0 } };
LW.breathDiegetic = true;   // the sculpture / the pen carries the breath; lw.js keeps a quiet label
const BR = { t0: nowS(), off: -1e9 };
function setCalm(on, auto = 0) {
  if (on && !calm.on && nowS() - BR.off > 3) BR.t0 = nowS();
  if (!on && calm.on) BR.off = nowS();
  calm.on = on; calm.auto = on ? auto : 0; calm.t = 0; cap.dirty = true;
}
let tag = null;
function showTag(kind, text) { tag = { kind, text, t: 0 }; cap.dirty = true; if (kind === 'stretch') CU.swell(0.5, 0.5, 1); }

// =====================================================================
//  COPPER RAIN
// =====================================================================
const N = 32;
const cuCv = document.getElementById('cu-gl');
const CU = (() => {
  let gl = null;
  try {
    gl = cuCv.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, preserveDrawingBuffer: false });
    if (gl && !gl.getExtension('EXT_color_buffer_float')) { console.warn('kinetic: EXT_color_buffer_float missing'); gl = null; }
  } catch (e) { gl = null; }
  const S = {
    gl, w: 0, h: 0, ready: false,
    hh: new Float32Array(N * N), v: new Float32Array(N * N), tgt: new Float32Array(N * N),
    form: { a: [1, 2, -1], b: [1, 2, -1], mix: 1 }, amp: 0.6, plane: 0, lift: 0,
    swells: [], idleT: 0, formT: 0, yaw: 0, expo: 0.95, light: [1, 0.95, 0.88], key: [1, 1, 1], win: [0.5, 0.6, 0.7],
    accent: [0.9, 0.5, 0.3], fog: [0.01, 0.01, 0.012], base: [7, 7, 10], active: false,
  };
  const FS_VS = `#version 300 es
out vec2 vUv;
void main() { vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); vUv = p; gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
  const ENV = `
uniform vec3 uKey, uWin, uAcc, uFloor;
// the atrium the drops reflect: a paned skylight overhead, a long clerestory band, one accent strip,
// a faintly lit floor below
vec3 env(vec3 r, float rough) {
  vec3 c = vec3(0.004, 0.0038, 0.0036);
  float s = 0.02 + rough;
  // skylight: a long soft rooflight overhead
  float up = smoothstep(0.62 - s, 0.8 + s, r.y) * smoothstep(0.55 + s, 0.2 - s, abs(r.x / max(r.y, 0.3)));
  c += uKey * up;
  // clerestory: a horizontal band all round, brighter behind the viewer (−z)
  float band = smoothstep(0.06 - s, 0.1 + s, r.y) * (1.0 - smoothstep(0.17 - s, 0.21 + s, r.y));
  c += uWin * band * (0.35 + 0.65 * smoothstep(0.3, -0.9, r.z));
  // accent strip, to the right
  float az = atan(r.x, -r.z);
  c += uAcc * smoothstep(0.16 + s, 0.1 - s, abs(az - 1.2)) * smoothstep(-0.2 - s, 0.0, r.y) * (1.0 - smoothstep(0.4, 0.6 + s, r.y));
  // floor bounce
  c += uFloor * (smoothstep(-0.6 + s, -0.95, r.y) + 0.015 * smoothstep(0.0, -0.5, r.y));
  return c;
}`;
  const DROP_VS = `#version 300 es
precision highp float;
layout(location = 0) in vec3 aPos;
layout(location = 1) in vec3 aNrm;
uniform mat4 uVP;
uniform sampler2D uH;
uniform float uSp, uScale;
out vec3 vN; out vec3 vW;
void main() {
  int i = gl_InstanceID % ${N}, j = gl_InstanceID / ${N};
  float h = texelFetch(uH, ivec2(i, j), 0).r;
  vec2 g = (vec2(float(i), float(j)) - float(${(N - 1) / 2})) * uSp;
  vec3 w = vec3(g.x, h, g.y) + aPos * uScale;
  vW = w; vN = aNrm;
  gl_Position = uVP * vec4(w, 1.0);
}`;
  const DROP_FS = `#version 300 es
precision highp float;
uniform vec3 uCam, uFog, uTint;
uniform float uFogK;
in vec3 vN; in vec3 vW; out vec4 o;
${ENV}
void main() {
  vec3 n = normalize(vN), v = normalize(uCam - vW), r = reflect(-v, n);
  vec3 F0 = vec3(0.955, 0.6, 0.46) * uTint;
  float cv = clamp(dot(n, v), 0.0, 1.0);
  vec3 F = F0 + (1.0 - F0) * pow(1.0 - cv, 5.0);
  vec3 c = F * env(r, 0.12);
  float d = length(uCam - vW);
  c = mix(c, uFog, 1.0 - exp(-d * uFogK));
  o = vec4(c, 1.0);
}`;
  const WIRE_VS = `#version 300 es
precision highp float;
uniform mat4 uVP; uniform sampler2D uH; uniform float uSp, uScale, uTop;
out float vY;
void main() {
  int i = gl_InstanceID % ${N}, j = gl_InstanceID / ${N};
  float h = texelFetch(uH, ivec2(i, j), 0).r;
  vec2 g = (vec2(float(i), float(j)) - float(${(N - 1) / 2})) * uSp;
  float y = gl_VertexID == 0 ? h + 0.95 * uScale : uTop;
  vY = gl_VertexID == 0 ? 0.0 : 1.0;
  gl_Position = uVP * vec4(g.x, y, g.y, 1.0);
}`;
  const WIRE_FS = `#version 300 es
precision highp float;
uniform vec3 uWire;
in float vY; out vec4 o;
void main() { o = vec4(uWire * (1.0 - vY) * (1.0 - vY), 1.0); }`;
  const DOWN_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform vec2 uTexel; uniform float uThreshold, uSpread; uniform int uPrefilter;
in vec2 vUv; out vec4 o;
vec3 pre(vec3 c) { if (uPrefilter == 0) return c; float b = max(c.r, max(c.g, c.b)); float soft = clamp(b - uThreshold + 0.5, 0.0, 1.0); soft = soft * soft * 0.5; return c * max(soft, b - uThreshold) / max(b, 1e-4); }
void main() {
  vec2 h = uTexel * uSpread;
  vec3 c = pre(texture(uSrc, vUv).rgb) * (uPrefilter == 0 ? 4.0 : 0.0);
  c += pre(texture(uSrc, vUv - h).rgb) + pre(texture(uSrc, vUv + h).rgb) + pre(texture(uSrc, vUv + vec2(h.x, -h.y)).rgb) + pre(texture(uSrc, vUv - vec2(h.x, -h.y)).rgb);
  o = vec4(c / (uPrefilter == 0 ? 8.0 : 4.0), 1.0);
}`;
  const UP_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform vec2 uTexel;
in vec2 vUv; out vec4 o;
vec3 t(vec2 d) { return texture(uSrc, vUv + d * uTexel).rgb; }
void main() { vec3 c = t(vec2(-2, 0)) + t(vec2(2, 0)) + t(vec2(0, -2)) + t(vec2(0, 2)); c += 2.0 * (t(vec2(-1, -1)) + t(vec2(1, -1)) + t(vec2(-1, 1)) + t(vec2(1, 1))); o = vec4(c / 12.0, 1.0); }`;
  const COMP_FS = `#version 300 es
precision highp float;
uniform sampler2D uScene, uBloom;
uniform float uBloomAmt, uExposure;
uniform vec3 uBgTop, uBgBot;
uniform vec2 uGlow;   // screen-space centre of the skylight spill
in vec2 vUv; out vec4 o;
vec3 aces(vec3 x) { const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14; return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0); }
float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main() {
  vec4 s = texture(uScene, vUv);
  vec3 hdr = s.rgb + texture(uBloom, vUv).rgb * uBloomAmt;
  vec3 col = pow(aces(hdr * uExposure), vec3(1.0 / 2.2));
  col += (hash(gl_FragCoord.xy) - 0.5) / 255.0;
  o = vec4(col, 1.0);
}`;
  const BG_FS = `#version 300 es
precision highp float;
uniform vec3 uBgTop, uBgBot, uGlowC; uniform vec2 uGlow; uniform float uAspect;
in vec2 vUv; out vec4 o;
void main() {
  vec3 c = mix(uBgBot, uBgTop, smoothstep(0.0, 1.0, vUv.y));
  vec2 d = (vUv - uGlow) * vec2(uAspect, 1.0);
  c += uGlowC * exp(-dot(d, d) * 2.2);
  o = vec4(c, 1.0);
}`;
  let P = {}, VAO = null, triCount = 0, ms = null, res = null, mips = [], hTex = null, msaa = 4;
  function program(vs, fs) {
    const p = gl.createProgram();
    for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      gl.attachShader(p, s);
    }
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const setters = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const info = gl.getActiveUniform(p, i), loc = gl.getUniformLocation(p, info.name);
      const t = info.type;
      setters[info.name.replace(/\[0\]$/, '')] = t === gl.FLOAT ? (v) => gl.uniform1f(loc, v) : t === gl.FLOAT_VEC2 ? (v) => gl.uniform2fv(loc, v)
        : t === gl.FLOAT_VEC3 ? (v) => gl.uniform3fv(loc, v) : t === gl.FLOAT_MAT4 ? (v) => gl.uniformMatrix4fv(loc, false, v)
        : (v) => gl.uniform1i(loc, v);
    }
    return { use(u = {}) { gl.useProgram(p); for (const k in u) if (setters[k]) setters[k](u[k]); } };
  }
  function tex(w, h, internal = gl.RGBA16F, fmt = gl.RGBA, type = gl.HALF_FLOAT, filter = gl.LINEAR) {
    const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, fmt, type, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }
  function target(w, h) { const t = tex(w, h), f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); gl.bindFramebuffer(gl.FRAMEBUFFER, null); return { tex: t, fbo: f, w, h, dispose() { gl.deleteTexture(t); gl.deleteFramebuffer(f); } }; }
  // a teardrop by lathe: pointed neck on top (wire), full round belly below
  function dropMesh(seg = 12, rings = 9) {
    const prof = [];
    for (let k = 0; k <= rings; k++) {
      const t = k / rings, a = t * Math.PI;                 // 0 top … π bottom
      const y = Math.cos(a) * 0.95 - 0.12 * Math.sin(a);   // shifted belly
      const r = Math.sin(a) * (0.5 + 0.5 * Math.pow(t, 0.9)) * 0.62;
      prof.push([r, y]);
    }
    const pos = [], nrm = [];
    const nAt = (k) => { const a = prof[Math.max(0, k - 1)], b = prof[Math.min(rings, k + 1)]; const dy = b[1] - a[1], dr = b[0] - a[0]; const l = Math.hypot(dy, dr) || 1; return [-dy / l, dr / l]; };   // (radial, y) outward
    for (let k = 0; k < rings; k++) for (let s = 0; s < seg; s++) {
      const q = [[k, s], [k + 1, s], [k + 1, s + 1], [k, s], [k + 1, s + 1], [k, s + 1]];
      for (const [kk, ss] of q) {
        const [r, y] = prof[kk], ang = ss / seg * TAU, [nr, ny] = nAt(kk);
        pos.push(Math.cos(ang) * r, y, Math.sin(ang) * r);
        nrm.push(Math.cos(ang) * nr, ny, Math.sin(ang) * nr);
      }
    }
    return { pos: new Float32Array(pos), nrm: new Float32Array(nrm), count: pos.length / 3 };
  }
  function init() {
    if (!gl) return;
    P.drop = program(DROP_VS, DROP_FS); P.wire = program(WIRE_VS, WIRE_FS);
    P.down = program(FS_VS, DOWN_FS); P.up = program(FS_VS, UP_FS); P.comp = program(FS_VS, COMP_FS); P.bg = program(FS_VS, BG_FS);
    VAO = gl.createVertexArray(); gl.bindVertexArray(VAO);
    const m = dropMesh(); triCount = m.count;
    const b0 = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b0); gl.bufferData(gl.ARRAY_BUFFER, m.pos, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    const b1 = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b1); gl.bufferData(gl.ARRAY_BUFFER, m.nrm, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
    S.emptyVAO = gl.createVertexArray();
    hTex = tex(N, N, gl.R32F, gl.RED, gl.FLOAT, gl.NEAREST);
    const maxS = gl.getParameter(gl.MAX_SAMPLES) || 0;
    msaa = Math.min(+(qs.get('msaa') || 2), maxS);
    S.ready = true;
  }
  function resize(w, h) {
    if (!gl || (w === S.w && h === S.h)) return;
    S.w = w; S.h = h;
    if (ms) { gl.deleteFramebuffer(ms.fbo); gl.deleteRenderbuffer(ms.color); gl.deleteRenderbuffer(ms.depth); }
    if (res) res.dispose();
    mips.forEach((m) => m.dispose()); mips = [];
    ms = { fbo: gl.createFramebuffer(), color: gl.createRenderbuffer(), depth: gl.createRenderbuffer() };
    gl.bindRenderbuffer(gl.RENDERBUFFER, ms.color);
    if (msaa > 1) gl.renderbufferStorageMultisample(gl.RENDERBUFFER, msaa, gl.RGBA16F, w, h); else gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA16F, w, h);
    gl.bindRenderbuffer(gl.RENDERBUFFER, ms.depth);
    if (msaa > 1) gl.renderbufferStorageMultisample(gl.RENDERBUFFER, msaa, gl.DEPTH_COMPONENT24, w, h); else gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
    gl.bindFramebuffer(gl.FRAMEBUFFER, ms.fbo);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, ms.color);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, ms.depth);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    res = target(w, h);
    let sw = w >> 2, sh = h >> 2;
    for (let i = 0; i < 4 && sw >= 8 && sh >= 8; i++, sw >>= 1, sh >>= 1) mips.push(target(sw, sh));
  }
  // ── camera ──
  const mat = {
    persp(fy, asp, n, f, shiftX) {
      const t = 1 / Math.tan(fy / 2), m = new Float32Array(16);
