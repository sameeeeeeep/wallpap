'use strict';
/* =====================================================================
   Snowy Cabin — a warm log-cabin room on a snowy evening, as a music
   wallpaper. Crackling fire (embers pop on beats), the album artwork in a
   frame above the mantel lit by the fire, a record player on a sideboard
   with the sleeve propped behind it (the music hero, all in the left
   ~70%), a big window on the right onto pine forest + mountains (calm
   background: snowfall, aurora on clear winter nights, blizzard, sleet,
   fog — or a summer evening when it's warm out), an armchair with a
   knitted blanket, cocoa steaming, fairy lights, bookshelves.
   A golden puppy roams rug ↔ armchair ↔ door; an orange cat roams
   windowsill (pawing at snowflakes) ↔ bookshelf ↔ armchair.

   Click the record player = play/pause · click the window = next.

   World units: 1000 tall, width follows the aspect; the composition is a
   1600-wide stage centred on screen (wider screens show more log wall).
   The room (walls, furniture, window frame) is painted once per light
   change as albedo × a soft light map, cached and crossfaded; the view
   out of the window is baked separately per weather/time. Per frame we
   draw: outside view → room → fire, turntable, framed art, sleeve, card →
   animals → armchair layer → particles, fairy-light glows, overlays.

   ART SLOTS (optional) — scenes/art/cabin/*.png, procedural if missing:
   ┌──────────────────┬────────────┬─────────────────────────────────────┐
   │ file             │ size (px)  │ notes                               │
   ├──────────────────┼────────────┼─────────────────────────────────────┤
   │ room-night.png   │ 3200×2000  │ the room painted for the 1600×1000  │
   │ room-day.png     │ 3200×2000  │ stage (centred). Window panes must  │
   │                  │            │ be TRANSPARENT (the live outside    │
   │                  │            │ view shows through). Leave OUT: the │
   │                  │            │ fire, the framed art, turntable     │
   │                  │            │ platter/arm, sleeve, card, armchair │
   │                  │            │ (it is its own layer), animals.     │
   │ armchair.png     │ 600×560    │ armchair + blanket + side table,    │
   │                  │            │ drawn at stage x 190..490, bottom   │
   │                  │            │ at y 930 (300×280 units).           │
   │ outside-winter.png│ 1600×1600 │ view through the window (square,    │
   │ outside-summer.png│ 1600×1600 │ cropped to the window, tinted by    │
   │                  │            │ time of day). Weather is live.      │
   └──────────────────┴────────────┴─────────────────────────────────────┘
   ANIMALS use the shared illustrated sprites (scenes/art/sprites/):
     cats/orange/{walk1,walk2,sit,loaf,sleep,stretch}.png   — Ember
     dogs/golden/{walk1,walk2,sit,lie,belly-up}.png         — Maple
   facing RIGHT, feet at the bottom edge; walk = alternate walk1/walk2
   with a small bob. Each animal tints its sprite on its own canvas; the
   procedural side-view rig is drawn until a set has loaded.
   ===================================================================== */
(() => {
const SCENE_ID = 'cabin';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgba = (c, a = 1) => `rgba(${clamp(c[0] | 0, 0, 255)},${clamp(c[1] | 0, 0, 255)},${clamp(c[2] | 0, 0, 255)},${a})`;
const mul = (c, m) => [c[0] * m[0], c[1] * m[1], c[2] * m[2]];
const lum = (c) => (c[0] + c[1] + c[2]) / 3;
const approach = (v, t, rate, dt) => v + (t - v) * (1 - Math.exp(-rate * dt));
function mulberry(a) {

}
const hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const nowS = () => performance.now() / 1000;
const timers = [];
const later = (sec, fn) => timers.push({ at: nowS() + sec, fn });
function runTimers() { const T = nowS(); for (let i = timers.length - 1; i >= 0; i--) if (timers[i].at <= T) { const f = timers[i].fn; timers.splice(i, 1); try { f(); } catch (e) { console.error(e); } } }
const SANS = '-apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif';
const SERIF = '"Hoefler Text", "Baskerville", "Iowan Old Style", Georgia, serif';
const HAND = '"Snell Roundhand", "Bradley Hand", "Segoe Print", "Hoefler Text", Georgia, serif';
function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
function ellGrad(g, x, y, rx, ry, col, a, stops = 6) {

const GLOW_WARM = sprite(128, [[0, 'rgba(255,214,150,1)'], [0.18, 'rgba(255,190,110,0.5)'], [0.5, 'rgba(255,160,80,0.12)'], [1, 'rgba(255,140,60,0)']]);
const GLOW_FIRE = sprite(128, [[0, 'rgba(255,190,110,1)'], [0.25, 'rgba(255,120,50,0.45)'], [0.6, 'rgba(220,70,20,0.1)'], [1, 'rgba(200,50,10,0)']]);
const GLOW_WHITE = sprite(128, [[0, 'rgba(255,255,255,1)'], [0.2, 'rgba(255,255,255,0.45)'], [0.55, 'rgba(255,255,255,0.1)'], [1, 'rgba(255,255,255,0)']]);
const GLOW_COOL = sprite(128, [[0, 'rgba(210,235,255,1)'], [0.25, 'rgba(160,205,255,0.4)'], [0.6, 'rgba(120,170,255,0.08)'], [1, 'rgba(100,150,255,0)']]);
const GLOW_FLY = sprite(64, [[0, 'rgba(240,255,170,1)'], [0.3, 'rgba(200,255,120,0.4)'], [1, 'rgba(160,230,80,0)']]);
const BLOB = sprite(64, [[0, 'rgba(255,255,255,0.9)'], [0.45, 'rgba(255,255,255,0.45)'], [1, 'rgba(255,255,255,0)']]);
const STEAM = sprite(64, [[0, 'rgba(255,244,230,0.8)'], [0.5, 'rgba(255,240,225,0.35)'], [1, 'rgba(255,236,220,0)']]);
const DARK = sprite(64, [[0, 'rgba(10,6,6,0.85)'], [0.5, 'rgba(10,6,6,0.45)'], [1, 'rgba(10,6,6,0)']]);
const VIGNETTE = (() => { const c = newCanvas(320, 200), g = c.getContext('2d'); g.setTransform(1, 0, 0, 200 / 320, 0, 0); const gr = g.createRadialGradient(160, 150, 60, 160, 160, 230); gr.addColorStop(0, 'rgba(8,4,4,0)'); gr.addColorStop(0.6, 'rgba(8,4,4,0.18)'); gr.addColorStop(1, 'rgba(8,4,4,0.62)'); g.fillStyle = gr; g.fillRect(0, 0, 320, 320); return c; })();
function drawSprite(g, sp, x, y, r, a, op = 'lighter') {
  if (a <= 0.003) return;
  g.globalCompositeOperation = op; g.globalAlpha = Math.min(1, a);
  g.drawImage(sp, x - r, y - r, r * 2, r * 2);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
}
function drawSpriteXY(g, sp, x, y, rx, ry, a, op = 'lighter') {
  if (a <= 0.003) return;
  g.globalCompositeOperation = op; g.globalAlpha = Math.min(1, a);
  g.drawImage(sp, x - rx, y - ry, rx * 2, ry * 2);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
}
function fitText(g, s, maxW) { s = s || ''; if (g.measureText(s).width <= maxW) return s; while (s.length > 1 && g.measureText(s + '…').width > maxW) s = s.slice(0, -1); return s + '…'; }
function flameSprite(c0, c1) {
  const c = newCanvas(64, 128), g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 128, 0, 0); gr.addColorStop(0, c0); gr.addColorStop(0.35, c0); gr.addColorStop(1, c1);
  g.fillStyle = gr; g.beginPath(); g.moveTo(2, 128); g.bezierCurveTo(4, 70, 22, 40, 32, 0); g.bezierCurveTo(42, 40, 60, 70, 62, 128); g.closePath(); g.fill();
  return c;
}
const FLAMES = [flameSprite('rgba(255,90,20,0.55)', 'rgba(200,40,10,0)'), flameSprite('rgba(255,150,40,0.7)', 'rgba(255,90,20,0)'), flameSprite('rgba(255,236,170,0.85)', 'rgba(255,190,90,0)')];
const noise1 = (x) => { const i = Math.floor(x), f = x - i, h = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }; return lerp(h(i), h(i + 1), f * f * (3 - 2 * f)); };

// =====================================================================
//  art slots (optional PNGs; procedural fallback)
// =====================================================================
const ART = {};
let artDirty = false;
function loadArtSlots() {
  for (const name of ['room-night', 'room-day', 'armchair', 'outside-winter', 'outside-summer']) {
    const im = new Image();
    im.onload = () => { if (im.naturalWidth > 1) { ART[name] = im; artDirty = true; } };
    im.onerror = () => {};
    im.src = 'art/' + SCENE_ID + '/' + name + '.png';
  }
}

// =====================================================================
//  environment: time of day, weather, season (glides ~30 s; never pops)
// =====================================================================
const KF = [
  { h: 0, top: '#060a1c', bot: '#18223f', day: 0 },
  { h: 5.2, top: '#060a1c', bot: '#18223f', day: 0 },
  { h: 6.6, top: '#2e3868', bot: '#e3a596', day: 0.35 },
  { h: 8.2, top: '#7aa2d2', bot: '#e8e2d6', day: 0.85 },
  { h: 11, top: '#76a6da', bot: '#dce9f3', day: 1 },
  { h: 16.0, top: '#7098cc', bot: '#efdcc0', day: 0.92 },
  { h: 17.8, top: '#4a5590', bot: '#f2a070', day: 0.55 },
  { h: 19.2, top: '#1c2350', bot: '#7a4e7a', day: 0.16 },
  { h: 20.6, top: '#080c22', bot: '#1c2446', day: 0 },
  { h: 24, top: '#060a1c', bot: '#18223f', day: 0 },
];
KF.forEach((k) => { k.topC = hex(k.top); k.botC = hex(k.bot); });
const WX = {
  cloudy: { d: ['#9aa2b0', '#c8ccd2'], n: ['#141725', '#2a2a3c'], amt: 0.6, day: 0.85 },
  rain: { d: ['#6c7584', '#959ca8'], n: ['#0b0d18', '#1d1d2e'], amt: 0.85, day: 0.6 },
  storm: { d: ['#8a92a0', '#b8bec8'], n: ['#10121c', '#262838'], amt: 0.95, day: 0.55 },
  snow: { d: ['#b4bac6', '#dde1e8'], n: ['#161a2a', '#2e3046'], amt: 0.8, day: 0.85 },
  fog: { d: ['#b0b3ba', '#d2d4d8'], n: ['#1a1d28', '#363846'], amt: 0.85, day: 0.78 },

let E = null, Et = null;
function seasonFor(env) {
  const s = (LW.settings && LW.settings.season) || 'auto';
  if (s === 'summer') return 1;
  if (s === 'winter') return 0;
  if (env.weather === 'snow') return 0;
  // a snowy cabin by default; only a properly warm evening turns it to summer
  return (+env.temp || 0) >= 22 ? 1 : 0;
}
function computeTarget() {
  const env = LW.env || {};
  const hr = (((+env.hour || 0) % 24) + 24) % 24;
  let a = KF[0], b = KF[1];
  for (let i = 0; i < KF.length - 1; i++) if (hr >= KF[i].h && hr <= KF[i + 1].h) { a = KF[i]; b = KF[i + 1]; break; }

  let snow = 0, rain = 0, storm = 0, fog = 0, cloud = 0.1, flurry = 0;

    bot = mix3(bot, mix3(hex(X.n[1]), hex(X.d[1]), day), f);

    if (w === 'rain') rain = 0.45 + 0.55 * it;                                             // sleet in winter

const ENV_KEYS = ['day', 'snow', 'rain', 'storm', 'fog', 'cloud', 'moon', 'flurry', 'summer', 'aurora', 'fireflies', 'it'];
