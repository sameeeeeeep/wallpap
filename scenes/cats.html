<script>
'use strict';
(() => {
// =====================================================================
//  Santorini cats — a smooth, illustrated live wallpaper.
//  World units: the scene is always 1000 units tall; width follows the
//  aspect ratio. Everything is drawn with Canvas2D paths at device pixel
//  resolution (DPR ≤ 2). Static scenery is pre-rendered once per light /
//  weather change; cats are drawn every frame from their own data only.
//
//  Pets use the common roster and frame-based runtime in pets.js. There is no
//  procedural animal fallback; each pet owns its own cached lighting tint.
//  The right ~28% of the screen (L.R…W) is kept calm for macOS widgets: no
//  resting cats, bubbles or text there.
// =====================================================================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgba = (c, a = 1) => `rgba(${clamp(c[0] | 0, 0, 255)},${clamp(c[1] | 0, 0, 255)},${clamp(c[2] | 0, 0, 255)},${a})`;
const mul = (c, m) => [c[0] * m[0], c[1] * m[1], c[2] * m[2]];
const lum = (c) => (c[0] + c[1] + c[2]) / 3;
const TAU = Math.PI * 2;
function mulberry(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const nowS = () => performance.now() / 1000;
const timers = [];
const later = (sec, fn) => timers.push({ at: nowS() + sec, fn });
function runTimers() { const T = nowS(); for (let i = timers.length - 1; i >= 0; i--) if (timers[i].at <= T) { const f = timers[i].fn; timers.splice(i, 1); try { f(); } catch (e) { console.error(e); } } }
const FONT = '-apple-system, "SF Pro Rounded", ui-rounded, "Helvetica Neue", system-ui, sans-serif';

// =====================================================================
//  environment: time of day + weather
// =====================================================================
const KF = [
  { h: 0, top: '#0d1430', bot: '#283461', sea: '#0c1a33', amb: [0.38, 0.42, 0.62], lamp: 1, stars: 1, sunA: 0, moon: 1, warm: 0 },
  { h: 5.0, top: '#0d1430', bot: '#283461', sea: '#0c1a33', amb: [0.38, 0.42, 0.62], lamp: 1, stars: 1, sunA: 0, moon: 1, warm: 0 },
  { h: 6.3, top: '#3a4677', bot: '#f0b39c', sea: '#3d5378', amb: [0.72, 0.66, 0.74], lamp: 0.5, stars: 0.15, sunA: 1, moon: 0, warm: 0.6 },
  { h: 7.8, top: '#6c9fd4', bot: '#d8e7f0', sea: '#2f6ea6', amb: [0.94, 0.93, 0.92], lamp: 0, stars: 0, sunA: 1, moon: 0, warm: 0.15 },
  { h: 12, top: '#4b8bd6', bot: '#c2def2', sea: '#1f62a8', amb: [1.0, 1.0, 0.98], lamp: 0, stars: 0, sunA: 1, moon: 0, warm: 0 },
  { h: 16.4, top: '#5b8ccc', bot: '#efd8b6', sea: '#285f9c', amb: [1.0, 0.95, 0.88], lamp: 0, stars: 0, sunA: 1, moon: 0, warm: 0.3 },
  { h: 18.5, top: '#4d5893', bot: '#f6a464', sea: '#3a4f7e', amb: [1.0, 0.9, 0.84], lamp: 0.55, stars: 0, sunA: 1, moon: 0, warm: 1 },
  { h: 19.7, top: '#262a58', bot: '#c47b7c', sea: '#22305a', amb: [0.62, 0.55, 0.70], lamp: 0.9, stars: 0.45, sunA: 0, moon: 0.4, warm: 0.4 },
  { h: 21, top: '#0d1430', bot: '#283461', sea: '#0c1a33', amb: [0.38, 0.42, 0.62], lamp: 1, stars: 1, sunA: 0, moon: 1, warm: 0 },
  { h: 24, top: '#0d1430', bot: '#283461', sea: '#0c1a33', amb: [0.38, 0.42, 0.62], lamp: 1, stars: 1, sunA: 0, moon: 1, warm: 0 },
];
KF.forEach((k) => { k.topC = hex(k.top); k.botC = hex(k.bot); k.seaC = hex(k.sea); });
let E = null;
function computeEnv() {
  const env = LW.env || {};
  const hr = (((+env.hour || 0) % 24) + 24) % 24;
  let a = KF[0], b = KF[1];
  for (let i = 0; i < KF.length - 1; i++) if (hr >= KF[i].h && hr <= KF[i + 1].h) { a = KF[i]; b = KF[i + 1]; break; }
  const t = smooth((hr - a.h) / Math.max(0.001, b.h - a.h));
  const n = (k) => lerp(a[k], b[k], t);
  let top = mix3(a.topC, b.topC, t), bot = mix3(a.botC, b.botC, t), sea = mix3(a.seaC, b.seaC, t);
  let amb = mix3(a.amb, b.amb, t);
  let lamp = n('lamp'), stars = n('stars'), sunA = n('sunA'), moon = n('moon'), warm = n('warm');
  const dl = clamp((lum(amb) - 0.45) / 0.45, 0, 1);
  const w = env.weather || 'clear';
  const it = clamp(env.intensity == null ? 0.7 : +env.intensity, 0, 1);
  const f = 0.55 + 0.45 * it;
  const grey = (c) => { const l = lum(c); return [l, l, l]; };
  const to = (dT, dB, dS, nT, nB, nS, amt) => {
    top = mix3(top, mix3(hex(nT), hex(dT), dl), amt);
    bot = mix3(bot, mix3(hex(nB), hex(dB), dl), amt);
    sea = mix3(sea, mix3(hex(nS), hex(dS), dl), amt);
  };
  let clouds = 0.25, rain = 0, snow = 0, storm = 0, fog = 0, wet = 0;
  if (w === 'cloudy') {
    amb = mix3(amb, grey(amb), 0.3 * f).map((v) => v * (1 - 0.1 * f));
    stars *= 0.3; sunA *= 0.35; warm *= 0.4; clouds = 0.75 + 0.25 * it;
    to('#8d9aae', '#c6ccd4', '#4d6a8a', '#1a1f30', '#2d3246', '#141c2e', 0.45 * f);
  } else if (w === 'rain' || w === 'storm') {
    const st = w === 'storm';
    amb = mix3(amb, grey(amb), 0.35).map((v, i) => v * (1 - (st ? 0.4 : 0.26) * f) * [0.95, 0.98, 1.05][i]);
    stars = 0; sunA = 0; moon = 0; warm = 0; clouds = 1; wet = 1;
    lamp = Math.max(lamp, (st ? 0.75 : 0.55) * f);
    rain = it * (st ? 1 : 0.7) + 0.25; storm = st ? 1 : 0;
    to(st ? '#4a5262' : '#6a7484', st ? '#6c7482' : '#949ca8', st ? '#2e3d50' : '#3e5570', st ? '#0b0d16' : '#121520', st ? '#181c28' : '#1f2433', st ? '#0a1220' : '#0e1726', (st ? 0.9 : 0.75) * f);
  } else if (w === 'snow') {
    amb = mix3(amb, [0.86, 0.9, 1.0].map((v) => v * lum(amb) / 0.92), 0.55 * f);
    stars = 0; moon *= 0.3; sunA *= 0.3; warm *= 0.3; clouds = 0.9; snow = 0.4 + 0.6 * it;
    lamp = Math.max(lamp, 0.35 * f);
    to('#c6ccd6', '#e2e6ec', '#6a7f96', '#262a3a', '#3a3f52', '#1a2232', 0.6 * f);
  } else if (w === 'fog') {
    amb = mix3(amb, grey(amb), 0.45 * f);
    stars *= 0.1; moon *= 0.4; sunA *= 0.35; warm *= 0.5; clouds = 0.35; fog = f;
    lamp = Math.max(lamp, 0.3 * f);
    to('#aeb3ba', '#d0d3d7', '#8e9aa6', '#2e3040', '#46485c', '#2a2f3e', 0.7 * f);
  }
  // sun / moon placement (sun sinks over the caldera; never top-right)
  const dayFrac = clamp((hr - 6.2) / (19.6 - 6.2), 0, 1);
  const sunX = lerp(0.24, 0.52, dayFrac);
  const sunY = 452 - Math.sin(dayFrac * Math.PI) * 360 + 6;
  moon *= LW.moonVisibility();
  Et = {
    hour: hr, weather: w, it, top, bot, sea, amb, lamp, stars, sunA, moon, warm, dl, clouds, rain, snow, storm, fog, wet,
    sunXf: sunX, sunY, night: clamp(1 - dl * 1.5, 0, 1) * (hr > 20 || hr < 6.5 ? 1 : 0.6),
    sunny: sunA > 0.5 && dl > 0.45 && (w === 'clear' || (w === 'cloudy' && it < 0.35)),
  };
  if (!E) { E = JSON.parse(JSON.stringify(Et)); E.wet = 0; }
}
// The live environment glides toward the target (~30 s), never pops; the
// scenery is re-painted every few seconds while it changes and crossfaded.
let farMoon = true, snowAcc = 0;
let Et = null, wetness = 0, lastBake = -99, bakedSnap = null, fade = 1;
const ENV_KEYS = ['lamp', 'stars', 'sunA', 'moon', 'warm', 'dl', 'clouds', 'rain', 'snow', 'storm', 'fog', 'sunXf', 'sunY', 'night', 'it'];
function updateEnv(dt) {
  const k = LW.envBlend(dt, 10);
  for (const key of ENV_KEYS) E[key] += (Et[key] - E[key]) * k;
  for (const key of ['top', 'bot', 'sea', 'amb']) for (let i = 0; i < 3; i++) E[key][i] += (Et[key][i] - E[key][i]) * k;
  E.hour = Et.hour; E.weather = Et.weather;
  E.sunny = E.sunA > 0.5 && E.dl > 0.45 && E.clouds < 0.6 && E.rain < 0.1;
  // the terrace gets wet in the rain and dries slowly afterwards
  wetness = clamp(wetness + (E.rain > 0.15 ? (dt * E.rain) / 45 : -dt / 480), 0, 1);
  E.wet = wetness;
  // snow settles on exposed tops over a few minutes of snowfall, lingers, then melts (faster in sun)
  snowAcc = clamp(snowAcc + (E.snow > 0.15 ? (dt * E.snow) / 150 : -dt * (E.sunny ? 1 / 240 : 1 / 600)), 0, 1);
  E.snowAcc = snowAcc;
  fade = Math.min(1, fade + dt / 1.6);
  if (!farMoon && E.moon > 0.05 && LW.moonCanvas && LW.moonCanvas(32) && nowS() - lastBake > 0.5) bake(true);
  const snap = [...ENV_KEYS.slice(0, 11).map((q) => E[q]), E.wet * 0.3, snowAcc * 0.5, ...E.top.map((v) => v / 255), ...E.amb];
  const diff = bakedSnap ? Math.max(...snap.map((v, i) => Math.abs(v - bakedSnap[i]))) : 1;
  if (diff > 0.025 && nowS() - lastBake > 2.5 && fade >= 1) bake(true);

// =====================================================================
//  layout
// =====================================================================
let dpr = 1, cssW = 1, cssH = 1, U = 1, W = 1600, H = 1000;
let L = null, L0 = null;
let farCv = document.createElement('canvas'), fax = farCv.getContext('2d');
let fgCv = document.createElement('canvas'), fgx = fgCv.getContext('2d');
let spareFar = document.createElement('canvas'), spareFg = document.createElement('canvas');
let prevFar = null, prevFg = null, prevSprites = null;
let sprites = {}; // static props drawn in depth order with the cats

function computeLayout() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cssW = Math.max(1, innerWidth); cssH = Math.max(1, innerHeight);
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
  H = 1000; W = (cssW / cssH) * 1000; U = cv.height / 1000;
  MIR = (LW.layout && LW.layout.side) === 'left';
  L = layoutFor(W, clearFrac());
  L0 = layoutFor(PLATE_W, 0.72);   // where things sit in the painted plates (art/cats/, painted at 1500×1000)
}
// Desktop layout (LW.layout): the widget side stays calm. side:'left' mirrors the whole terrace (house
// on the right, the calm open end on the left) — the world is laid out as for 'right' and drawn
// mirrored; input is mirrored back. clearFrac = how far from the house the calm zone begins.
let MIR = false;
function clearFrac() {
  const l = LW.layout || {}, c = Array.isArray(l.clear) ? l.clear : [0, 0.72];
  return clamp(MIR ? 1 - c[0] : c[1], 0.55, 1);
}
// is a world point inside one of the host's avoid boxes (fractions of the display)?
function avoidHit(x, y) {
  const av = (LW.layout && LW.layout.avoid) || [];
  const fx = (MIR ? W - x : x) / W, fy = y / H;
  return av.some((b) => b && fx > b[0] && fx < b[0] + b[2] && fy > b[1] && fy < b[1] + b[3]);
}
const toWX = (x) => { const w = (x / cssH) * 1000; return MIR ? W - w : w; };
function layoutFor(W, rFrac) {
  const Lr = {};
  Lr.horizon = 452;
  Lr.parTop = 584; Lr.parCap = 600; Lr.floorBack = 664;
  Lr.floorTop = 712; Lr.floorBot = 972;
  const bx1 = 300;   // fixed: the painted house (art/cats/terrace.png) has one width
  Lr.bld = { x1: bx1, top: 300, front: 905 };
  Lr.dome = { x: bx1 * 0.5, y: 300, r: bx1 * 0.3 };
  Lr.win = { x0: bx1 * 0.22, x1: bx1 * 0.6, y0: 418, y1: 520 };
  // stairs rising to the left toward a blue door
  const sn = 4, sw = Math.min(54, bx1 * 0.17), sh = 34;
  Lr.stairs = { x1: bx1 + 26, n: sn, w: sw, h: sh, base: 912 };
  Lr.door = { x0: bx1 + 26 - sw * sn - 92, w: 78, base: 912 - sh * sn };
  // the right ~28% is reserved for macOS widgets: the bench (a favourite resting
  // spot) ends where that zone begins
  Lr.R = W * rFrac;
  const benchX1 = Math.min(W - 30, Math.max(Lr.R - 10, bx1 + 640));
  Lr.bench = { x0: benchX1 - clamp(W * 0.18, 220, 300), x1: benchX1, seat: 668, base: 792 };
  Lr.hasBench = Lr.bench.x1 - Lr.bench.x0 > 180 && Lr.bench.x0 > bx1 + 120;
  Lr.mat = { cx: lerp(bx1 + 60, Lr.hasBench ? Lr.bench.x0 : Lr.R, 0.5), cy: 858, rx: clamp(W * 0.1, 120, 190), ry: 44 };
  Lr.water = { x: Lr.hasBench ? Lr.bench.x0 - 64 : Lr.R - 80, y: 812, kind: 'water' };
  Lr.food = { x: Math.min(Lr.water.x - 170, Math.max(Lr.stairs.x1 + 120, Lr.mat.cx - Lr.mat.rx - 10)), y: 826, kind: 'food' };
  Lr.bowl = Lr.water;
  Lr.lanterns = [];
  // one lantern over the open terrace, one past the bench canopy (clear of its posts)
  for (const x of [lerp(bx1, Lr.hasBench ? Lr.bench.x0 : Lr.R, 0.55), (Lr.hasBench ? Lr.bench.x1 : Lr.R) + 110]) if (x > bx1 + 120 && x < W - 60) Lr.lanterns.push({ x, y: Lr.parTop });
  Lr.pots = [{ x: W - 52, y: 930, big: 1 }];
  if (!Lr.hasBench) Lr.pots = [];
  // jumpable surfaces. base = the floor depth they stand over (for draw order / scale)
  const ledges = [];
  const pt = { y: Lr.parTop + 2, base: Lr.floorBack, depth: 1.02, cap: 2 };
  const cuts = [bx1 + 40, ...Lr.lanterns.flatMap((l) => [l.x - 50, l.x + 50]), W - 40];
  for (let i = 0; i < cuts.length; i += 2) if (cuts[i + 1] - cuts[i] > 140) ledges.push({ name: 'parapet', x0: cuts[i], x1: cuts[i + 1], ...pt });
  if (Lr.hasBench) ledges.push({ name: 'bench', x0: Lr.bench.x0 + 40, x1: Lr.bench.x1 - 40, y: Lr.bench.seat - 8, base: Lr.bench.base, depth: 1.16, cap: 2 });
  const st = Lr.stairs;
  for (let i = 1; i < sn; i++) {
    const xa = st.x1 - st.w * (i + 1), xb = st.x1 - st.w * i;
    ledges.push({ name: 'step', x0: xa + 22, x1: xb - 8, y: st.base - st.h * (i + 1), base: st.base + i * 0.01, depth: 1.26, cap: 1, step: i });
  }
  ledges.push({ name: 'sill', x0: Lr.win.x0 + 40, x1: Lr.win.x1 - 22, y: Lr.win.y1 + 10, base: Lr.bld.front, depth: 1.08, cap: 1, hi: 1 });
  ledges.push({ name: 'roof', x0: bx1 * 0.82, x1: bx1 - 26, y: Lr.bld.top + 2, base: Lr.bld.front, depth: 1.02, cap: 1, hi: 2 });
  ledges.forEach((l) => { l.x0 = clamp(l.x0, 40, W - 40); l.x1 = clamp(l.x1, 40, W - 40); });
  Lr.ledges = ledges.filter((l) => l.x1 - l.x0 > 30);
  Lr.spots = {
    hide: Lr.hasBench ? { x: (Lr.bench.x0 + Lr.bench.x1) / 2, y: Lr.bench.base - 8, cap: 2, kind: 'hide' } : null,
  };
  // rain shelters: under the bench, on its canopied cushion, the top step under the
  // door awning, the window sill under its awning; in snow also beside the lanterns
  const li = (name, pred) => Lr.ledges.findIndex((l) => l.name === name && (!pred || pred(l)));
  Lr.shelters = [];

    const bi = li('bench'); if (bi >= 0) { const lg = Lr.ledges[bi]; Lr.shelters.push({ x: lg.x0 + 40, ledge: bi }, { x: lg.x1 - 40, ledge: bi }); }
  }
  const ts = li('step', (l) => l.step === sn - 1); if (ts >= 0) { const lg = Lr.ledges[ts]; Lr.shelters.push({ x: (lg.x0 + lg.x1) / 2, ledge: ts }); }
  const si = li('sill'); if (si >= 0) { const lg = Lr.ledges[si]; Lr.shelters.push({ x: (lg.x0 + lg.x1) / 2, ledge: si, hi: 1 }); }

    for (const s2 of [-1, 1]) { const x = ln.x + s2 * 72; const pi = li('parapet', (l) => x > l.x0 + 20 && x < l.x1 - 20); if (pi >= 0) Lr.shelters.push({ x, ledge: pi, warm: 1 }); }
  });

    [Lr.door.x0 - 30, Lr.door.x0 + Lr.door.w + 30, dTop0 - 8, Lr.stairs.base],
    [Lr.win.x0 - 40, Lr.win.x1 + 40, Lr.win.y0 - 8, Lr.win.y1 + 22],
  ];
  Lr.canopyY = 474;
  if (Lr.hasBench) Lr.dry.push([Lr.bench.x0 - 26, Lr.bench.x1 + 26, Lr.canopyY + 16, Lr.bench.base]);
  const rr = mulberry(99);
  Lr.stars = [];
  for (let i = 0; i < Math.round(W / 9); i++) Lr.stars.push({ x: rr() * W, y: rr() * 360, p: rr() * 6.28, s: 0.5 + rr() * 1.5, r: 0.8 + rr() * 1.3 });
  return Lr;
}
// walkable terrace floor (not inside the house/stairs or behind the bench)
function floorClamp(x, y) {
  x = clamp(x, 50, W - 50);
  y = clamp(y, L.floorTop, L.floorBot);
  if (x < L.stairs.x1 + 40) y = Math.max(y, L.stairs.base + 18);
  if (L.hasBench && x > L.bench.x0 - 50 && x < L.bench.x1 + 50) y = Math.max(y, L.bench.base + 20);
  if (L.pots.length && x > W - 130) y = Math.min(y, 880);
  return [x, y];
}
// x for anywhere a cat will settle (keeps the widget zone on the right calm)
const restX = (x) => Math.min(x, L.R - 60);
const underBench = (c) => c.surf === -1 && L.hasBench && c.x > L.bench.x0 - 30 && c.x < L.bench.x1 + 30 && c.y < L.bench.base + 6;
const depthK = (y) => lerp(1.1, 1.38, clamp((y - L.floorTop) / (L.floorBot - L.floorTop), 0, 1));

// =====================================================================
//  painting helpers (world units; callers set the transform)
// =====================================================================
function lit(h, k = 1) { const c = typeof h === 'string' ? hex(h) : h; return mul(c, [E.amb[0] * k, E.amb[1] * k, E.amb[2] * k]); }
function litS(h, k = 1, a = 1) { return rgba(lit(h, k), a); }
function rrect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();

function glow(g, x, y, r, col, a) {

// ----- far layer: sky, sun/moon, islands, sea ------------------------------
function paintFar() {
  const sc = 0.5;
  farCv.width = Math.round(cv.width * sc); farCv.height = Math.round(cv.height * sc);
  const g = fax; g.setTransform(U * sc, 0, 0, U * sc, 0, 0);
  const hz = L.horizon;
  let gr = g.createLinearGradient(0, 0, 0, hz);
  gr.addColorStop(0, rgba(E.top)); gr.addColorStop(0.62, rgba(mix3(E.top, E.bot, 0.55))); gr.addColorStop(1, rgba(E.bot));
  g.fillStyle = gr; g.fillRect(0, 0, W, hz + 2);
  const sunX = W * E.sunXf;
  // sun glow + disc
  if (E.sunA > 0.05) {
    const sc2 = mix3([255, 236, 190], [255, 170, 100], E.warm);
    glow(g, sunX, E.sunY, 360, sc2, 0.32 * E.sunA * (E.clouds > 0.9 ? 0.4 : 1));
    glow(g, sunX, E.sunY, 120, sc2, 0.5 * E.sunA * (E.clouds > 0.9 ? 0.3 : 1));
    if (E.clouds < 0.95) { g.fillStyle = rgba(mix3([255, 248, 225], [255, 205, 140], E.warm), E.sunA * (1 - E.fog * 0.5)); g.beginPath(); g.arc(sunX, E.sunY, 30, 0, TAU); g.fill(); }
  }
  // the shared photoreal moon (moon.js: real phase, earthshine, halo, warmer near the horizon)
  farMoon = E.moon <= 0.05 || !LW.drawMoon;
  if (E.moon > 0.05 && LW.drawMoon) {
    const mx = W * 0.27, my = 150, ast = LW.env.astronomy && LW.env.astronomy.moon;
    farMoon = !!LW.moonCanvas(32);
    LW.drawMoon(g, mx, my, 22, { alt: ast ? ast.altitude : undefined, glow: 0.45 + 0.3 * E.fog, haze: clamp((E.clouds - 0.3) * 0.6 + E.fog * 0.7, 0, 1), alpha: clamp(E.moon * 1.1, 0, 1) });
  }
  // sea
  const seaTop = mix3(E.bot, E.sea, 0.45), seaBot = E.sea;
  gr = g.createLinearGradient(0, hz, 0, L.parCap + 20);
  gr.addColorStop(0, rgba(seaTop)); gr.addColorStop(0.35, rgba(mix3(seaTop, seaBot, 0.6))); gr.addColorStop(1, rgba(mix3(seaBot, [8, 14, 30], 0.15)));
  g.fillStyle = gr; g.fillRect(0, hz, W, L.parCap + 30 - hz);
  // sun reflection haze on the water
  if (E.sunA > 0.05 && E.clouds < 0.95) {
    const rg = g.createRadialGradient(sunX, hz + 10, 0, sunX, hz + 10, 300);
    rg.addColorStop(0, rgba(mix3([255, 236, 190], [255, 170, 100], E.warm), 0.32 * E.sunA)); rg.addColorStop(1, rgba([255, 200, 140], 0));
    g.fillStyle = rg; g.fillRect(sunX - 300, hz, 600, 160);
  }
  // islands & caldera cliffs, softened by distance
  const isl = mix3(mix3(seaTop, E.top, 0.35), [40, 40, 60], 0.35 * (1 - E.fog));
  const isl2 = mix3(isl, E.bot, 0.35 + E.fog * 0.4);
  const hill = (x0, x1, h, col, bumps, seed) => {
    const r2 = mulberry(seed);
    g.fillStyle = rgba(col); g.beginPath(); g.moveTo(x0, hz + 1);
    const n = 24;
    for (let i = 0; i <= n; i++) {
      const t = i / n, x = lerp(x0, x1, t);
      const env = Math.pow(Math.sin(t * Math.PI), 0.6);
      const y = hz - h * env * (0.75 + 0.25 * Math.sin(t * bumps + r2() * 0.4));
      g.lineTo(x, y);
    }
    g.lineTo(x1, hz + 1); g.closePath(); g.fill();
  };
  hill(W * 0.02, W * 0.36, 30, isl2, 9, 3);       // Thirasia
  hill(W * 0.39, W * 0.42, 10, mix3(isl2, [240, 236, 228], 0.25), 3, 5); // Aspronisi
  hill(W * 0.5, W * 0.66, 18, mix3(isl, [30, 26, 34], 0.25), 6, 8);  // Nea Kameni
  // the far caldera rim with a sprinkle of white houses (right)
  g.fillStyle = rgba(isl);
  g.beginPath(); g.moveTo(W * 0.74, hz + 1);
  for (let i = 0; i <= 30; i++) { const t = i / 30; g.lineTo(lerp(W * 0.74, W + 10, t), hz - Math.pow(t, 0.7) * 78 - Math.sin(t * 17) * 3); }
  g.lineTo(W + 10, hz + 1); g.closePath(); g.fill();
  const r3 = mulberry(21);
  for (let i = 0; i < 46; i++) {
    const t = 0.15 + r3() * 0.85, x = lerp(W * 0.74, W + 10, t), y = hz - Math.pow(t, 0.7) * 78 + 2 + r3() * 10;
    g.fillStyle = rgba(mix3([236, 232, 226], isl, 0.45 + E.fog * 0.3).map((v) => v * (0.6 + 0.4 * E.dl)));
    g.fillRect(x, y, 3 + r3() * 3, 2 + r3() * 2);
    if (E.lamp > 0.4 && r3() < 0.5) { g.fillStyle = rgba([255, 200, 120], 0.8 * E.lamp); g.fillRect(x + 1, y + 1, 1.6, 1.6); }
  }
  // haze line at the horizon
  gr = g.createLinearGradient(0, hz - 26, 0, hz + 18);
  gr.addColorStop(0, rgba(E.bot, 0)); gr.addColorStop(0.6, rgba(E.bot, 0.35 + E.fog * 0.5)); gr.addColorStop(1, rgba(E.bot, 0));
  g.fillStyle = gr; g.fillRect(0, hz - 26, W, 44);
}

// ----- foreground: house, dome, bougainvillea, parapet, terrace -----------
function paintFG() {
  fgCv.width = cv.width; fgCv.height = cv.height;
  let g = fgx; g.setTransform(U, 0, 0, U, 0, 0);
  g.clearRect(0, 0, W, H);
  const b = L.bld, x1 = b.x1;
  const WHITE = '#f4f0ea', WSHADE = '#ddd6cf', BLUE = '#2f5f9c', DOOR = '#86abc9';
  // terrace floor
  let gr = g.createLinearGradient(0, L.floorBack, 0, H);
  gr.addColorStop(0, litS('#d9cfc2')); gr.addColorStop(0.25, litS('#e9e0d3')); gr.addColorStop(1, litS('#efe7dc'));
  g.fillStyle = gr; g.fillRect(0, L.floorBack - 2, W, H - L.floorBack + 2);
  // stone tiles in gentle perspective
  g.strokeStyle = litS('#c9bdae', 1, 0.45); g.lineWidth = 1.4;
  const vx = W * 0.5, vy = L.horizon - 200;
  for (let i = -14; i <= 14; i++) {
    const xb = vx + i * 150;
    g.beginPath(); g.moveTo(lerp(vx, xb, (L.floorBack - vy) / (H - vy)), L.floorBack); g.lineTo(xb, H); g.stroke();
  }
  for (let y = L.floorBack + 18, k = 0; y < H; k++) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); y += 22 + k * 9; }
  // soft occlusion along the parapet base
  gr = g.createLinearGradient(0, L.floorBack, 0, L.floorBack + 40);
  gr.addColorStop(0, litS('#8a7a70', 1, 0.35)); gr.addColorStop(1, litS('#8a7a70', 1, 0));
  g.fillStyle = gr; g.fillRect(0, L.floorBack, W, 40);

  // parapet
  g.fillStyle = litS(WSHADE); g.fillRect(x1 - 10, L.parCap, W - x1 + 20, L.floorBack - L.parCap);
  gr = g.createLinearGradient(0, L.parCap, 0, L.floorBack);
  gr.addColorStop(0, litS('#e7e1da')); gr.addColorStop(1, litS('#d3cbc3'));
  g.fillStyle = gr; g.fillRect(x1 - 10, L.parCap + 4, W - x1 + 20, L.floorBack - L.parCap - 4);
  rrect(g, x1 - 14, L.parTop, W - x1 + 28, L.parCap - L.parTop + 6, 7);
  g.fillStyle = litS(WHITE); g.fill();
  g.fillStyle = litS('#ffffff', 1, 0.55); g.fillRect(x1, L.parTop + 2, W - x1, 3);
  g.fillStyle = litS('#9a8f86', 1, 0.25); g.fillRect(x1 - 10, L.parCap + 6, W - x1 + 20, 4);

  // house
  gr = g.createLinearGradient(0, b.top, 0, b.front);
  gr.addColorStop(0, litS('#f6f2ec')); gr.addColorStop(1, litS('#e9e3db'));
  g.fillStyle = gr; rrect(g, -20, b.top, x1 + 20, b.front - b.top, 10); g.fill();
  g.fillStyle = litS(WSHADE); g.fillRect(x1 - 16, b.top + 8, 16, b.front - b.top - 8);
  // rounded parapet on the roof
  rrect(g, -20, b.top - 16, x1 + 18, 22, 9); g.fillStyle = litS(WHITE); g.fill();
  // dome on a short drum
  const d = L.dome;
  g.fillStyle = litS('#efe9e2'); rrect(g, d.x - d.r * 0.92, d.y - 40, d.r * 1.84, 44, 6); g.fill();
  g.fillStyle = litS('#d8d1c9'); g.fillRect(d.x - d.r * 0.92, d.y - 4, d.r * 1.84, 6);
  gr = g.createRadialGradient(d.x - d.r * 0.35, d.y - 40 - d.r * 0.55, d.r * 0.1, d.x, d.y - 40, d.r * 1.05);
  gr.addColorStop(0, litS('#5d8fd0')); gr.addColorStop(0.55, litS(BLUE)); gr.addColorStop(1, litS('#1d3d6e'));
  g.fillStyle = gr; g.beginPath(); g.ellipse(d.x, d.y - 40, d.r, d.r * 0.92, 0, Math.PI, TAU); g.closePath(); g.fill();
  g.strokeStyle = litS('#c9b98e'); g.lineWidth = 3; g.beginPath(); g.moveTo(d.x, d.y - 40 - d.r * 0.92); g.lineTo(d.x, d.y - 40 - d.r * 0.92 - 26); g.moveTo(d.x - 9, d.y - 40 - d.r * 0.92 - 17); g.lineTo(d.x + 9, d.y - 40 - d.r * 0.92 - 17); g.stroke();
  // window with blue shutters + stone sill
  const wn = L.win;
  g.fillStyle = litS('#2b3f5a'); rrect(g, wn.x0, wn.y0, wn.x1 - wn.x0, wn.y1 - wn.y0, 8); g.fill();
  g.fillStyle = litS('#9fbad2', 1, 0.5); g.fillRect(wn.x0 + 8, wn.y0 + 8, (wn.x1 - wn.x0) / 2 - 10, (wn.y1 - wn.y0) - 16);
  for (const s of [-1, 1]) {
    const sx = s < 0 ? wn.x0 - 30 : wn.x1 + 2;
    rrect(g, sx, wn.y0 - 2, 28, wn.y1 - wn.y0 + 4, 4); g.fillStyle = litS(BLUE); g.fill();
    g.strokeStyle = litS('#234a7a'); g.lineWidth = 1.5;
    for (let yy = wn.y0 + 8; yy < wn.y1 - 4; yy += 9) { g.beginPath(); g.moveTo(sx + 4, yy); g.lineTo(sx + 24, yy); g.stroke(); }
  }
  rrect(g, wn.x0 - 12, wn.y1 + 4, wn.x1 - wn.x0 + 24, 12, 4); g.fillStyle = litS(WHITE); g.fill();
  g.fillStyle = litS('#b8ada3', 1, 0.6); g.fillRect(wn.x0 - 8, wn.y1 + 16, wn.x1 - wn.x0 + 16, 3);
  // pastel door at the top of the stairs
  const dr = L.door, dTop = dr.base - 150;
  g.fillStyle = litS('#e6ded4'); rrect(g, dr.x0 - 10, dTop - 10, dr.w + 20, dr.base - dTop + 10, 30); g.fill();
  g.fillStyle = litS(DOOR); rrect(g, dr.x0, dTop, dr.w, dr.base - dTop, 32); g.fill();
  g.strokeStyle = litS('#6f93b2'); g.lineWidth = 2;
  g.beginPath(); g.moveTo(dr.x0 + dr.w / 2, dTop + 20); g.lineTo(dr.x0 + dr.w / 2, dr.base); g.stroke();
  for (const yy of [dTop + 60, dTop + 105]) { g.beginPath(); g.moveTo(dr.x0 + 8, yy); g.lineTo(dr.x0 + dr.w - 8, yy); g.stroke(); }
  g.fillStyle = litS('#d9b46a'); g.beginPath(); g.arc(dr.x0 + dr.w / 2 + 9, dTop + 82, 3, 0, TAU); g.fill();

  // bougainvillea spilling over the roof corner and down the wall
  paintBougainvillea(g, x1 - 12, b.top - 12);

  // string light anchor points (the lights themselves sway live in the wind)
  L.str = { s0: [x1 - 6, b.top + 34], s1: [W + 30, 404], sag: 74 };
  L.bulbs = [];
  for (let i = 1; i < 16; i++) { const t = i / 16; L.bulbs.push([lerp(L.str.s0[0], L.str.s1[0], t), lerp(L.str.s0[1], L.str.s1[1], t) + Math.sin(t * Math.PI) * L.str.sag]); }
  // striped awnings over the door and the window
  const awning = (xa, xb, yTop, depth) => {
    const w = xb - xa, n = Math.max(5, Math.round(w / 22));
    g.fillStyle = 'rgba(40,30,40,0.16)'; g.fillRect(xa + 6, yTop + depth, w - 12, 10);
    g.save();
    g.beginPath(); g.moveTo(xa + 8, yTop); g.lineTo(xb - 8, yTop); g.lineTo(xb, yTop + depth);
    for (let i = n; i > 0; i--) { const x0 = xa + (w * (i - 1)) / n, x1s = xa + (w * i) / n; g.quadraticCurveTo((x0 + x1s) / 2, yTop + depth + 9, x0, yTop + depth); }
    g.closePath(); g.clip();
    for (let i = 0; i < n * 2; i++) { g.fillStyle = litS(i % 2 ? '#f4f0ea' : '#3d6a9c'); g.fillRect(xa + (w * i) / (n * 2), yTop - 2, w / (n * 2) + 0.5, depth + 14); }
    const sh = g.createLinearGradient(0, yTop, 0, yTop + depth + 9); sh.addColorStop(0, 'rgba(255,255,255,0.18)'); sh.addColorStop(1, 'rgba(0,0,30,0.12)');
    g.fillStyle = sh; g.fillRect(xa, yTop - 2, w, depth + 14);
    g.restore();
    g.fillStyle = litS('#3a3534'); g.fillRect(xa + 6, yTop - 3, w - 12, 3);
  };
  awning(L.door.x0 - 28, L.door.x0 + L.door.w + 28, L.door.base - 186, 30);
  awning(L.win.x0 - 38, L.win.x1 + 38, L.win.y0 - 34, 24);
  // the painted terrace replaces the vector colours: the house block as painted, the parapet and
  // floor stretched from the plate's 1500 units to this width
  if (PLATES.terrace) {
    const hx = x1 + 150, sx0 = x1 - 14;
    g.save(); g.setTransform(U, 0, 0, U, 0, 0);
    platePaint(g, fgCv, 'terrace', [
      // the roofline, dome and bougainvillea: the painted cut-outs themselves (they replace the vector shapes)
      { src: [-20, 0, hx + 20, H], dst: [-20, 0, hx + 20, H], clip: [-20, 0, hx + 20, L.parTop - 4], mode: 'replace' },
      // parapet and floor (opaque in the plate: drawn straight over, no seams), stretched to this width
      { src: [sx0, L.parTop - 8, PLATE_W - sx0, H - L.parTop + 8], dst: [sx0, L.parTop - 8, W - sx0, H - L.parTop + 8], clip: [x1 - 1, L.parTop - 8, W, H], mode: 'over' },
      // the house wall below the parapet line, unstretched, overlapping the seam
      { src: [-20, 0, hx + 20, H], dst: [-20, 0, hx + 20, H], clip: [-20, L.parTop - 12, x1 + 22, H], mode: 'over' },
    ]);
    g.restore();
  }
  // weather on the stone floor: only where the sky reaches it — not inside the house, not under the
  // bench canopy (a dry patch stays there), with lamp reflections in the wet and gradual snow cover
  const cz = L.hasBench ? [L.bench.x0 - 30, L.floorBack, L.bench.x1 - L.bench.x0 + 60, L.bench.base + 26 - L.floorBack] : null;
  const fgMain = g;
  if (E.wet > 0.03 || E.snowAcc > 0.02) {   // drawn on a scratch layer, then the sheltered patch is softly erased
    const wc = paintFG.wc || (paintFG.wc = document.createElement('canvas'));
    wc.width = fgCv.width; wc.height = fgCv.height;
    g = wc.getContext('2d'); g.setTransform(U, 0, 0, U, 0, 0);
  }
  g.save(); g.beginPath(); g.rect(x1 - 2, L.floorBack, W, H); g.clip();
  if (E.wet > 0.03) {
    g.globalAlpha = clamp(E.wet, 0, 1);
    gr = g.createLinearGradient(0, L.floorBack, 0, H);
    gr.addColorStop(0, rgba([30, 40, 60], 0.3)); gr.addColorStop(1, rgba([30, 40, 60], 0.12));
    g.fillStyle = gr; g.fillRect(0, L.floorBack, W, H);
    // wet stone mirrors the lanterns and the lit doorway
    const refl = (x, y0, rw, a) => {
      g.save(); g.translate(x, y0); g.scale(0.32, 1);
      const rg = g.createRadialGradient(0, 0, 4, 0, 0, rw);
      rg.addColorStop(0, rgba([255, 200, 140], a)); rg.addColorStop(1, rgba([255, 200, 140], 0));
      g.fillStyle = rg; g.beginPath(); g.arc(0, 0, rw, 0, TAU); g.fill(); g.restore();
    };
    L.lanterns.forEach((ln) => refl(ln.x, L.floorBack + 70, 90, 0.22 * (0.4 + E.lamp)));
    g.strokeStyle = 'rgba(255,255,255,0.08)'; g.lineWidth = 2;
    const r5 = mulberry(4);
    for (let i = 0; i < 40; i++) { const x = r5() * W, y = L.floorBack + 30 + r5() * (H - L.floorBack); g.beginPath(); g.ellipse(x, y, 20 + r5() * 40, 2 + r5() * 3, 0, 0, TAU); g.stroke(); }
    // puddles once it has been raining a while (they reflect the sky)
    if (E.wet > 0.45) {
      const r6 = mulberry(12); g.globalAlpha = clamp((E.wet - 0.45) * 2, 0, 1);
      L.puddles = [];
      for (let i = 0; i < 9; i++) {
        const x = x1 + 60 + r6() * (W - x1 - 160), y = L.floorBack + 60 + r6() * (H - L.floorBack - 90), rx = 40 + r6() * 50, ry = 6 + r6() * 5;
        if (cz && x > cz[0] - rx && x < cz[0] + cz[2] + rx && y < cz[1] + cz[3] + ry) continue;
        L.puddles.push([x, y, rx, ry]);
        const pg = g.createLinearGradient(0, y - 8, 0, y + 8);
        pg.addColorStop(0, rgba(mix3(E.top, [180, 190, 210], 0.4), 0.5)); pg.addColorStop(1, rgba(mix3(E.bot, [120, 130, 160], 0.4), 0.35));
        g.fillStyle = pg; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); g.fill();
      }
    }
    g.globalAlpha = 1;
  }
  if (E.snowAcc > 0.02) {
    const sa = E.snowAcc;
    g.fillStyle = rgba(lit([246, 248, 252]), 0.55 * smooth(sa / 0.8)); g.fillRect(0, L.floorBack, W, H);
    const r4 = mulberry(77);
    g.fillStyle = 'rgba(250,252,255,0.85)';
    for (let i = 0; i < 300 * Math.min(1, sa * 2); i++) { g.globalAlpha = 0.25 + r4() * 0.4; g.beginPath(); g.ellipse(r4() * W, L.floorBack + r4() * (H - L.floorBack), 3 + r4() * 9, 1 + r4() * 2, 0, 0, TAU); g.fill(); }
    g.globalAlpha = 1;
  }
  g.restore();
  if (g !== fgMain) {
    if (cz) {   // under the canopy the stone stays dry: a soft-edged patch, wider at the back
      g.save(); g.globalCompositeOperation = 'destination-out';
      g.translate(cz[0] + cz[2] / 2, cz[1] + cz[3] * 0.55); g.scale(1, (cz[3] * 0.62) / (cz[2] * 0.5));
      const dg = g.createRadialGradient(0, 0, cz[2] * 0.22, 0, 0, cz[2] * 0.56);
      dg.addColorStop(0, 'rgba(0,0,0,0.92)'); dg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = dg; g.beginPath(); g.arc(0, 0, cz[2] * 0.56, 0, TAU); g.fill(); g.restore();
    }
    const wc = g.canvas; g = fgMain;
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(wc, 0, 0); g.restore();
  }
  // the bench canopy's soft shade on the wall behind the seat (the canopy itself is a depth-sorted prop)
  if (L.hasBench && !ARTREF) { const bn = L.bench; g.fillStyle = 'rgba(40,30,40,0.12)'; g.fillRect(bn.x0 - 10, bn.seat - 30, bn.x1 - bn.x0 + 20, 26); }
  // lighting overlays (only where something is painted)
  g.globalCompositeOperation = 'source-atop';
  if (E.warm > 0.05) {
    gr = g.createLinearGradient(W * E.sunXf, L.horizon, W * E.sunXf, H);
    gr.addColorStop(0, rgba([255, 176, 120], 0.13 * E.warm)); gr.addColorStop(1, rgba([255, 160, 110], 0.02 * E.warm));
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }
  if (E.lamp > 0.1) {
    L.lanterns.forEach((ln) => glow(g, ln.x, ln.y - 22, 260, [255, 178, 96], 0.42 * E.lamp));
    L.bulbs.forEach((p, i) => { if (i % 2 === 0) glow(g, p[0], p[1] + 30, 150, [255, 190, 120], 0.14 * E.lamp); });
    glow(g, L.door.x0 + L.door.w / 2, L.door.base - 120, 160, [255, 190, 120], 0.2 * E.lamp);
  }
  g.globalCompositeOperation = 'source-over';
  // someone is home: the window glows warm after dark
  if (E.lamp > 0.25 && !ARTREF) {
    const wn = L.win, a = clamp((E.lamp - 0.25) / 0.6, 0, 1);
    g.save(); rrect(g, wn.x0 + 4, wn.y0 + 4, wn.x1 - wn.x0 - 8, wn.y1 - wn.y0 - 8, 6); g.clip();
    const wg = g.createLinearGradient(0, wn.y0, 0, wn.y1);
    wg.addColorStop(0, rgba([255, 196, 120], 0.55 * a)); wg.addColorStop(1, rgba([240, 150, 80], 0.75 * a));
    g.fillStyle = wg; g.fillRect(wn.x0, wn.y0, wn.x1 - wn.x0, wn.y1 - wn.y0);
    g.fillStyle = rgba([60, 40, 40], 0.35 * a); g.fillRect((wn.x0 + wn.x1) / 2 - 2, wn.y0, 4, wn.y1 - wn.y0);   // the mullion against the light
    g.restore();
    g.globalCompositeOperation = 'lighter'; glow(g, (wn.x0 + wn.x1) / 2, (wn.y0 + wn.y1) / 2, 120, [255, 170, 90], 0.12 * a); g.globalCompositeOperation = 'source-over';
  }
  // snow builds up on what faces the sky: parapet coping, roof, dome, window sill, awnings
  if (E.snowAcc > 0.02) {
    const sa = smooth(E.snowAcc), th = 2 + 7 * sa;
    g.fillStyle = rgba(lit([250, 251, 255]), 0.95 * Math.min(1, E.snowAcc * 3));

// The terrace is painted (Codex, from this file's own geometry — docs/scene-polish.md):
//   terrace.png  1536×1024 — house, dome, window, door, awnings, stairs, parapet, floor (no props)
//   props.png    1536×1024 — bench, canopy, bowls, pot, mat, lanterns where they stand at 1500 wide
// both painted in flat neutral daylight over the world 1500×1000 units (PLATE_W). The vector shapes
// below still define every silhouette (so ledges and depth sorting stay exact); the plates replace
// their colours (source-atop), then the scene light multiplies them — night, dusk, rain and lamp
// pools are laid on top exactly as before. ?procedural=1 or a missing plate keeps the vector look.
const PLATE_W = 1500;
const ARTREF = new URLSearchParams(location.search).get('artref');   // dev: render the reference for a repaint
const PLATES = {};
for (const n of ['terrace', 'props', 'clouds']) {
  if (ARTREF || new URLSearchParams(location.search).get('procedural') === '1') break;
  const im = new Image();
  im.onload = () => { if (im.naturalWidth > 0) { PLATES[n] = im; if (L) bake(true); } };
  im.src = 'art/cats/' + n + '.png';
}
// paint a plate over what is already drawn on g (world transform set), only inside the drawn alpha,
// then light it: pieces = [{src:[x,y,w,h] in plate units, dst:[x,y,w,h] in world, clip?:[x,y,w,h]}]
function platePaint(g, cvs, plate, pieces, k = 1) {
  const im = PLATES[plate]; if (!im) return false;
  const ps = im.naturalWidth / PLATE_W;
  g.save();
  for (const pc of pieces) {
    g.save();
    const [sx, sy, sw, sh] = pc.src, [dx, dy, dw, dh] = pc.dst, cl = pc.clip || pc.dst;
    g.beginPath(); g.rect(...cl); g.clip();
    // 'replace': the painted cut-out itself (organic edges: bougainvillea, the house, the pot);
    // otherwise only inside the vector silhouette, which keeps ledges and depth sorting exact
    if (pc.mode === 'replace') g.clearRect(...cl); else if (pc.mode !== 'over') g.globalCompositeOperation = 'source-atop';
    g.drawImage(im, sx * ps, sy * ps, sw * ps, sh * ps, dx, dy, dw, dh);
    g.restore();
  }
  // the scene light (as litS does for the vector colours)
  const mask = platePaint.m || (platePaint.m = document.createElement('canvas'));
  if (mask.width !== cvs.width || mask.height !== cvs.height) { mask.width = cvs.width; mask.height = cvs.height; }
  const mg = mask.getContext('2d'); mg.setTransform(1, 0, 0, 1, 0, 0); mg.clearRect(0, 0, mask.width, mask.height); mg.drawImage(cvs, 0, 0);
  const m = E.amb.map((v) => clamp(v * k, 0, 1) * 255);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'multiply'; g.fillStyle = rgba(m); g.fillRect(0, 0, cvs.width, cvs.height);
  g.globalCompositeOperation = 'destination-in'; g.drawImage(mask, 0, 0);
  g.restore();

}

      m[0] += I * 1.0; m[1] += I * 0.68; m[2] += I * 0.38;
    });
  }
  if (E.warm > 0) { m[0] += 0.08 * E.warm; m[1] += 0.02 * E.warm; }
  if (noFlash) return m;
  const fl = flashA() * 0.45; m[0] += fl; m[1] += fl; m[2] += fl * 1.1;
  return m;
}

// =====================================================================
//  main loop
// =====================================================================
let lastFrame = 0, tPrev = nowS(), audioTick = 0;
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now();
  if (now - lastFrame < 30) return;
  lastFrame = now;
  const T = now / 1000;
  const dt = Math.min(0.1, T - tPrev); tPrev = T;
  if (!LW.virtual) { step(dt, T); render(T); return; }
  // dev (?virtual=1): real-clock JS cost per frame → __cats.prof
  const r0 = realNow();
  step(dt, T);
  const r1 = realNow();
  render(T);
  const r2 = realNow();
  prof.step += r1 - r0; prof.render += r2 - r1; prof.n++; prof.max = Math.max(prof.max, r2 - r0);
  if (prof.times.length < 3000) prof.times.push(r2 - r0);
}
const realNow = Performance.prototype.now.bind(performance);   // real clock even under ?virtual=1
const prof = { step: 0, render: 0, n: 0, max: 0, times: [] };
function step(dt,T){
 runTimers();if(calm.on){calm.t+=dt;calm.fade=Math.min(1,calm.fade+dt/2);if(calm.auto&&calm.t>calm.auto)setCalm(false);}else calm.fade=Math.max(0,calm.fade-dt/2.5);
 calm.br=breathNow();updateEnv(dt);updateSky(dt,T);updatePetals(dt,T);petSystem.step(dt,T);
 audioTick-=dt;if(audioTick<=0){audioTick=.25;updatePurrLoop();updateRainAudio();}
}

const drawn = [];
// every render transform goes through ST: the mirrored layout flips the world about the centre
function ST(a, b, c, d, e, f) { if (MIR) ctx.setTransform(-a, b, -c, d, cv.width - e, f); else ctx.setTransform(a, b, c, d, e, f); }
function render(T) {
  ST(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = true;
  if (ARTREF) {   // dev: the geometry a plate is painted from, on flat green (art-src/cats/)
    ctx.fillStyle = '#00ff00'; ctx.fillRect(0, 0, cv.width, cv.height);
    if (ARTREF === 'surfaces') ctx.drawImage(fgCv, 0, 0);
    for (const k in sprites) if ((k === 'stairs') === (ARTREF === 'surfaces')) ctx.drawImage(sprites[k].cv, Math.round(sprites[k].x0 * U), Math.round(sprites[k].y0 * U));
    return;
  }
  if (fade < 1 && prevFar) ctx.drawImage(prevFar, 0, 0, cv.width, cv.height);
  ctx.globalAlpha = fade < 1 && prevFar ? fade : 1; ctx.drawImage(farCv, 0, 0, cv.width, cv.height); ctx.globalAlpha = 1;
  ST(U, 0, 0, U, 0, 0);
  drawSkyAndSea(ctx, T);
  ST(1, 0, 0, 1, 0, 0);
  if (fade < 1 && prevFg) ctx.drawImage(prevFg, 0, 0);
  ctx.globalAlpha = fade < 1 && prevFg ? fade : 1; ctx.drawImage(fgCv, 0, 0); ctx.globalAlpha = 1;
  ST(U, 0, 0, U, 0, 0);
  drawLights(ctx, T);
  drawPetals(ctx);
  petSystem.draw(ctx);
  // drinking ripples
  const drinker = cats.find((c) => c.state === 'drink');
  if (drinker && bowls.water > 0.04) { const r = (T * 1.6) % 1; ctx.strokeStyle = `rgba(255,255,255,${0.6 * (1 - r)})`; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.ellipse(L.water.x, L.water.y - 13 + (1 - bowls.water) * 4, 4 + r * 14, 1 + r * 3, 0, 0, TAU); ctx.stroke(); }
  drawPours(ctx, T);
  // particles
  parts.forEach((p) => {
    if (p.type === 'sound') return;
    const a = clamp(Math.min(p.t / 0.25, (p.life - p.t) / (p.life * 0.5)), 0, 1);
    if (p.type === 'heart') { ctx.fillStyle = `rgba(232,128,152,${a})`; heartPath(ctx, p.x, p.y, p.s); ctx.fill(); ctx.fillStyle = `rgba(255,220,228,${a * 0.8})`; ctx.beginPath(); ctx.arc(p.x - 4 * p.s, p.y - 4 * p.s, 1.8 * p.s, 0, TAU); ctx.fill(); }
    else if (p.type === 'z') { ctx.save(); ctx.translate(p.x, p.y); if (MIR) ctx.scale(-1, 1); ctx.font = `italic 600 ${Math.round(20 * p.s)}px ${FONT}`; ctx.fillStyle = `rgba(215,208,240,${a * 0.6})`; ctx.fillText('z', 0, 0); ctx.restore(); }
  });
  parts.forEach((p) => { if (p.type === 'sound') drawSound(ctx, p); });
  // weather in front
  if (drops.length) {
    ctx.strokeStyle = E.dl > 0.3 ? 'rgba(225,232,245,0.28)' : 'rgba(180,190,220,0.22)'; ctx.lineWidth = 1.3; ctx.beginPath();
    drops.forEach((d) => { if (L.dry.some((z) => d.x > z[0] && d.x < z[1] && d.y > z[2] && d.y < z[3])) return; ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + d.l * 0.12, d.y + d.l); });
    ctx.stroke();
    ctx.strokeStyle = 'rgba(230,236,248,0.35)'; ctx.lineWidth = 1;
    splashes.forEach((s) => { const r = s.t / 0.45, k = s.s || 1; ctx.globalAlpha = 1 - r; ctx.beginPath(); ctx.ellipse(s.x, s.y, (3 + r * 12) * k, (1 + r * 3) * k, 0, 0, TAU); ctx.stroke(); });
    ctx.globalAlpha = 1;
  }
  if (drips.length) {
    ctx.strokeStyle = E.dl > 0.3 ? 'rgba(225,232,245,0.5)' : 'rgba(200,210,235,0.4)'; ctx.lineWidth = 1.2; ctx.beginPath();
    drips.forEach((d) => { ctx.moveTo(d.x, d.y - 5); ctx.lineTo(d.x, d.y + 2); }); ctx.stroke();
  }
  if (flakes.length) {
    ctx.fillStyle = E.dl > 0.3 ? 'rgba(255,255,255,0.85)' : 'rgba(210,218,240,0.75)';
    flakes.forEach((f) => { if (sheltered(f.x, f.y)) return; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.fill(); });
  }
  // calm: a warm pool of lamplight on the mat where the cats pile up, filling with the breath
  if (calm.fade > 0) {
    const b = breath(), cx = L.mat.cx, cy = L.mat.cy, R = 230 + 70 * b;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
    g.addColorStop(0, `rgba(255,214,160,${(0.035 + 0.14 * b) * calm.fade})`); g.addColorStop(1, 'rgba(255,214,160,0)');
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(cx, cy, R, R * 0.55, 0, 0, TAU); ctx.fill(); ctx.restore();
  }
  const fa = flashA();
  if (fa > 0) { ctx.fillStyle = `rgba(220,228,255,${fa * 0.25})`; ctx.fillRect(0, 0, W, H); }
}

// =====================================================================
//  hud (browser only), boot, self-test
// =====================================================================
const hud = document.getElementById('hud');
function updateHud() {
  if (LW.isHost || !E) return;
  hud.textContent = `${E.weather} · ${(LW.env.clockHour??E.hour).toFixed(1)}h${LW.calm || calm.on ? ' · calm' : ''}${LW.muted ? ' · muted' : ''}   [w t r b m · s stretch]`;
  hud.style.opacity = 0.85; clearTimeout(updateHud.t); updateHud.t = setTimeout(() => (hud.style.opacity = 0), 2600);
}
if (!LW.isHost) addEventListener('keydown', (e) => { if (e.key === 's') startStretch('roll your shoulders, unclench your jaw'); });

function rebuild(first){computeLayout();if(!E)computeEnv();bake();petSystem.reset();}
let rsT = null;
addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => rebuild(false), 120); });
computeEnv();
initBowls();
rebuild(true);

if (LW.calm) setCalm(true);
LW.on('layout', () => rebuild(false));
updateHud();
requestAnimationFrame(frame);

window.__pets=petSystem;
window.__cats={pets:petSystem,cats,forceWalk:petSystem.forceWalk,forceJump:petSystem.forceJump,prof,get E(){return E},get L(){return L},calm,setCalm,startWater,startStretch,stormStartle,spawnToy,pet,bowls,fillBowl,bake};
})();
</script>
