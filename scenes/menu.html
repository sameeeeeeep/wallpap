<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>wallpap</title>
<!-- Menu-bar panel (host/Panel.swift; the website embeds it too) — the scene on top, then cards. A collapsed card shows its quick options;
     tap its header (or ⌄) to expand the full options in place. Same host contract as menu.html:
     Host → page: render(state). Page → host: webkit.messageHandlers.panel.postMessage({a, v, tag}). -->
<style>
:root{--ink:#1d2a23;--ink-2:#55615a;--ink-3:#89928b;--bg:rgba(244,243,236,.94);--card:rgba(29,42,35,.055);--tile:rgba(29,42,35,.07);--tile-2:rgba(29,42,35,.12);--well:rgba(255,255,255,.75);
  --on:#2f5a40;--on-ink:#fff;--ring:#2f5a40;--line:rgba(29,42,35,.09);--ease:cubic-bezier(.22,.8,.24,1)}
@media (prefers-color-scheme: dark){
  :root{--ink:#edf2ec;--ink-2:#b9c4ba;--ink-3:#808b82;--bg:rgba(22,28,24,.9);--card:rgba(255,255,255,.055);--tile:rgba(255,255,255,.08);--tile-2:rgba(255,255,255,.14);--well:rgba(0,0,0,.22);
    --on:#e9f1e8;--on-ink:#16201a;--ring:#9fd0ad;--line:rgba(255,255,255,.08)}
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;color:var(--ink);font:12px/1.35 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none;cursor:default}
body{width:100%;min-width:300px;background:var(--bg)}
#root{padding:10px 10px 0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ── the scene ── */
.now{position:relative;height:128px;border-radius:14px;overflow:hidden;background:#2b3a31 center/cover no-repeat}
.now::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),transparent 34%,transparent 50%,rgba(0,0,0,.62));pointer-events:none}
.now>*{position:absolute;z-index:1}
.brand{top:9px;left:11px;display:flex;align-items:center;gap:6px;color:#fff;font-weight:600;font-size:12.5px}
.brand svg{width:20px;height:9px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round}
.tr{top:7px;right:7px;display:flex;gap:4px}
.glass{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:28px;min-width:28px;padding:0 9px;border-radius:99px;color:#fff;background:rgba(0,0,0,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:11px;transition:background .15s}
.glass:hover{background:rgba(0,0,0,.48)}
.glass svg.i{width:15px;height:15px}
.glass.pro{font-size:10px;font-weight:700;letter-spacing:.06em}
.nm{left:12px;bottom:11px;color:#fff;max-width:52%}
.nm b{display:block;font-size:16px;font-weight:650;letter-spacing:-.015em;line-height:1.1}
.nm span{font-size:10.5px;opacity:.8}
.acts{right:8px;bottom:9px;display:flex;gap:4px}
.acts .glass{flex-direction:column;height:auto;padding:6px 8px 5px;border-radius:11px;gap:2px;font-size:10px;min-width:44px}

/* ── cards ── */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.c{grid-column:1/-1;border-radius:14px;background:var(--card);padding:9px 10px 10px;min-width:0}
.c.half{grid-column:auto}
.ch{display:flex;align-items:center;gap:8px;width:100%;text-align:left;min-height:26px}
.ch .ib{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);background:var(--tile);flex:none}
.ch .ib svg.i{width:16px;height:16px}
.ch .tt{display:flex;flex-direction:column;min-width:0;flex:1}
.ch .tt b{font-size:12.5px;font-weight:650;letter-spacing:-.005em}
.ch .tt small{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .cv{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:var(--ink-3);flex:none;transition:background .15s}
.ch:hover .cv{background:var(--tile)}
.ch .cv svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .22s var(--ease)}
.c.open .ch .cv svg{transform:rotate(180deg)}
.q{margin-top:9px}
.det{margin-top:6px;animation:dr .22s var(--ease)}
@keyframes dr{from{opacity:0;transform:translateY(-3px)}}

/* building blocks */
.cap{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:12px 0 6px}
.cap:first-child{margin-top:4px}
.cap small{font-size:10.5px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink-2)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:30px;font-size:12px}
.row .lab{display:flex;flex-direction:column;min-width:0}
.row .lab small{font-size:10.5px;color:var(--ink-3)}
.note{font-size:10.5px;color:var(--ink-3);line-height:1.4;margin-top:4px}
.link{font-size:11px;color:var(--ink-2);text-decoration:underline}
.sw{width:30px;height:17px;border-radius:99px;background:var(--tile-2);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.sw[aria-checked=true]{background:var(--ring)}
.sw[aria-checked=true]::after{transform:translateX(13px)}
.seg{display:flex;gap:2px;padding:2px;border-radius:9px;background:var(--tile)}
.seg button{flex:1;padding:5px 2px;border-radius:7px;font-size:11px;color:var(--ink-2);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--well);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.14)}
/* icon buttons: icon only (quick rows) or icon over a word (detail) */
.ico{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.ico button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:30px;padding:5px 1px;border-radius:9px;background:var(--tile);color:var(--ink-2);font-size:10px;position:relative}
.ico button:hover{background:var(--tile-2);color:var(--ink)}
.ico button[aria-pressed=true]{background:var(--on);color:var(--on-ink)}
.ico.lg button{padding:8px 1px 6px}
.ico svg.i{width:17px;height:17px}
.ico.lg svg.i{width:19px;height:19px}
.ico em{font-style:normal;font-size:7.5px;font-weight:700;letter-spacing:.05em;position:absolute;bottom:1px}
.ico.tiny button{padding:5px 1px 4px;gap:2px;font-size:9px}
.ico.tiny svg.i{width:16px;height:16px}
.grid4{grid-auto-flow:row;grid-template-columns:repeat(4,1fr)}
/* pills: a quick toggle with a word */
.pills{display:flex;gap:5px}
.pill{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:5px;height:32px;padding:0 7px;border-radius:10px;background:var(--tile);color:var(--ink);font-size:11.5px;white-space:nowrap;min-width:0}
.pill span{white-space:nowrap}
.pill:hover{background:var(--tile-2)}
.pill[aria-pressed=true]{background:var(--on);color:var(--on-ink)}
.pill svg.i{width:16px;height:16px}
.pill.ghost{background:none;box-shadow:inset 0 0 0 1px var(--line)}
/* labelled quick rows */
.lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:2px 0 5px}
.lbl~.lbl{margin-top:9px}
.lbl small{font-size:10.5px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:65%;text-align:right}
.timerow{display:flex;gap:5px}
.nowb{flex:none;width:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:10px;background:var(--tile);color:var(--ink-2);font-size:9.5px;font-weight:600}
.nowb:hover{background:var(--tile-2)}
.nowb[aria-pressed=true]{background:var(--on);color:var(--on-ink)}
.nowb svg.i{width:17px;height:17px}
.timerow .day{flex:1;height:44px}
/* Control-Centre toggles: icon, name, state */
.tgs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.tg{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px 8px;border-radius:12px;background:var(--tile);text-align:center;min-width:0}
.tg:hover{background:var(--tile-2)}
.tg span{display:flex;flex-direction:column;align-items:center;min-width:0;max-width:100%}
.tg b{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg small{font-size:10px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg[aria-pressed=true]{background:var(--on);color:var(--on-ink)}
.tg[aria-pressed=true] small{color:var(--on-ink);opacity:.72}
.tg svg.i{width:20px;height:20px}
.swrow{display:flex;align-items:center;justify-content:space-between;width:100%;height:34px;padding:0 10px;border-radius:10px;background:var(--tile);font-size:12px;font-weight:500}
.swrow:hover{background:var(--tile-2)}
/* the scene's own sounds: three tiles, level right under each one that's on */
.ch .sw{margin-left:auto}
.lvs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.lvs.muted{opacity:.45}
.lv{display:flex;flex-direction:column;border-radius:12px;background:var(--tile);overflow:hidden}
.lv[aria-pressed=true]{background:var(--on);color:var(--on-ink)}
.lv-m{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 6px;color:inherit}
.lv-m svg.i{width:20px;height:20px;margin-bottom:2px}
.lv-m b{font-size:11.5px;font-weight:600}
.lv-m small{font-size:9.5px;opacity:.65;white-space:nowrap}
.lv:hover{filter:brightness(1.04)}
.lvl{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:24px;padding:0 0 8px}
.lvl button{width:12px;height:var(--h);border-radius:2px;background:currentColor;opacity:.28;padding:0}
.lvl button[aria-pressed=true]{opacity:1}
.lvl button:hover{opacity:.7}
.lv-off{display:block;text-align:center;font-size:10px;color:var(--ink-3);height:24px;line-height:16px}
.look{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;color:var(--ink-2)}
.look>span{width:72px;flex:none}
.look .seg{flex:1}
/* the day: a sky gradient with five moments */
.day{display:grid;grid-template-columns:repeat(5,1fr);height:50px;border-radius:11px;overflow:hidden;background:linear-gradient(90deg,#f6c7b2 0%,#c4e0f3 28%,#b9d9f2 46%,#f7c58e 64%,#c3b6e2 81%,#9eabd6 100%)}
.day button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#1d2a23;font-size:9.5px;font-weight:600}
.day button svg.i{width:17px;height:17px}
.day button:hover{background:rgba(255,255,255,.3)}
.day button[aria-pressed=true]{background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 2px #1d2a23;color:#1d2a23}
/* worlds */
.w2{flex:none;width:68px;text-align:left;font-size:9.5px;color:var(--ink-2)}
.w2 i{display:block;width:68px;height:42px;border-radius:8px;background:var(--tile) center/cover no-repeat;margin-bottom:3px}
.w2 span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.2}
.w2[aria-current=true] i{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ring)}
.w2[aria-current=true]{color:var(--ink);font-weight:600}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:3px 2px;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.strip::-webkit-scrollbar{display:none}
.w{flex:none;width:50px;height:34px;border-radius:8px;background:var(--tile) center/cover no-repeat;position:relative}
.w[aria-current=true]{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ring)}
.cats{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:2px 0 8px}
.cats button{flex:none;padding:4px 10px;border-radius:99px;font-size:11px;color:var(--ink-2);background:var(--tile)}
.cats button[aria-pressed=true]{background:var(--on);color:var(--on-ink)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 6px}
.th{text-align:left;font-size:10.5px;color:var(--ink-2);min-width:0}
.th i{display:block;aspect-ratio:16/10;border-radius:9px;background:var(--tile) center/cover no-repeat;margin-bottom:4px;position:relative}
.th span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th[aria-current=true] i{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ring)}
.th[aria-current=true]{color:var(--ink);font-weight:600}
.th.add i{display:grid;place-items:center;color:var(--ink-3)}
.th b{position:absolute;right:4px;bottom:4px;font-size:8.5px;font-weight:700;color:var(--on-ink);background:var(--on);border-radius:5px;padding:1px 5px}
/* sound rows */
.srow{display:flex;align-items:center;gap:9px;min-height:40px}
.srow+.srow{border-top:1px solid var(--line)}
.srow svg.i{color:var(--ink-2)}
.srow .lab{flex:1;display:flex;flex-direction:column;min-width:0}
.srow .lab small{font-size:10.5px;color:var(--ink-3)}
.vb{display:inline-flex;align-items:flex-end;gap:3px;height:14px;padding:4px 6px;margin-right:2px;border-radius:7px}
.vb:hover{background:var(--tile)}
.vb i{width:5px;border-radius:1.5px;background:var(--ink-2);opacity:.25;cursor:pointer}
.vb i:nth-child(1){height:5px}.vb i:nth-child(2){height:9px}.vb i:nth-child(3){height:14px}
.vb i.on{opacity:1}
.place{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.place button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 4px 4px;border-radius:9px;font-size:10.5px;color:var(--ink-2)}
.place button[aria-pressed=true]{box-shadow:0 0 0 1.5px var(--ring);color:var(--ink);font-weight:600}
.place svg{width:100%;display:block}
.place .scr{fill:var(--well);stroke:var(--ink-3)}
.place .wg{fill:var(--ink-3);opacity:.5}
.place .wg.ghost{fill:none;stroke:var(--ink-3);stroke-dasharray:2 1.5;opacity:.8}
.place .act{fill:var(--ring)}
.place .zone{fill:var(--ring);opacity:.15}
.big{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:34px;border-radius:10px;background:var(--on);color:var(--on-ink);font-size:12px;font-weight:600}
.big.off{background:var(--tile);color:var(--ink)}
.big svg.i{width:16px;height:16px}
.tip{display:flex;gap:8px;margin-top:8px;padding:9px 10px;border-radius:12px;background:var(--card);color:var(--ink-2);font-size:11px;line-height:1.4}
.tip b{color:var(--ink)}
.tip span{display:flex;gap:6px;margin-top:6px}
.tip span button{padding:3px 9px;border-radius:99px;background:var(--tile-2);color:var(--ink);font-size:10.5px}
.tip span button:first-child{background:var(--on);color:var(--on-ink)}
.foot{display:flex;align-items:center;gap:2px;margin:9px -10px 0;padding:5px 8px 7px;border-top:1px solid var(--line)}
.foot button{height:30px;min-width:30px;padding:0 8px;border-radius:9px;display:flex;align-items:center;gap:5px;color:var(--ink-2);font-size:11px}
.foot button:hover{background:var(--tile);color:var(--ink)}
.foot svg.i{width:17px;height:17px}
.foot .sp{flex:1}
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const host = window.webkit && webkit.messageHandlers && webkit.messageHandlers.panel;
const send = (a, v, tag) => host ? host.postMessage({ a, v: v === undefined ? null : v, tag: tag == null ? null : tag }) : (window.__mock && window.__mock(a, v, tag));
const key = (x) => (x !== null && typeof x === 'object' ? JSON.stringify(x) : String(x));
const J = (v) => esc(JSON.stringify(v));
let S = null, cat = 'All';
const OPEN_KEY = 'panel3.open';
const open = (() => { try { return JSON.parse(localStorage.getItem(OPEN_KEY) || '{}'); } catch (e) { return {}; } })();
const saveOpen = () => { try { localStorage.setItem(OPEN_KEY, JSON.stringify(open)); } catch (e) {} };

const SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 3v1.5M12 19.5V21M3 12h1.5M19.5 12H21M5.6 5.6l1 1M17.4 17.4l1 1M5.6 18.4l1-1M17.4 6.6l1-1"/>';
const CLOUD = (y = 0) => `<path d="M7 ${18 - y}h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.3 1.5A3.3 3.3 0 0 0 7 ${18 - y}z"/>`;
const RAIN = CLOUD(4) + '<path d="M9 17l-1 3M13 17l-1 3M17 17l-1 3"/>';
const I = {
  live: '<circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/>',
  cycle: '<path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4v4h-4"/>',
  sunrise: '<path d="M3 18h18M7 18a5 5 0 0 1 10 0"/><path d="M12 4v6M9.5 6.5L12 4l2.5 2.5"/>',
  day: SUN,
  sunset: '<path d="M3 18h18M7 18a5 5 0 0 1 10 0"/><path d="M12 4v6M9.5 7.5L12 10l2.5-2.5"/>',
  evening: '<path d="M3 18h18"/><path d="M16 14.5a5 5 0 0 1-6.5-6.5 5.5 5.5 0 1 0 6.5 6.5z"/><path d="M18 5v2M17 6h2"/>',
  night: '<path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/><path d="M17 3.5v2M16 4.5h2"/>',
  pin: '<circle cx="12" cy="10" r="2.2"/><path d="M12 21s6.5-5.6 6.5-11a6.5 6.5 0 0 0-13 0c0 5.4 6.5 11 6.5 11z"/>',
  clear: SUN, cloudy: CLOUD(), rain: RAIN, storm: CLOUD(4) + '<path d="M12.5 15l-2 3.5h3l-2 3.5"/>',
  snow: '<path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/>', fog: '<path d="M4 9h16M3 13h18M5 17h14"/>',
  sound: '<path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>',
  mute: '<path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>',
  scape: '<path d="M3 10c2.5-2 4-2 6 0s4 2 6 0 3.5-2 6 0M3 15c2.5-2 4-2 6 0s4 2 6 0 3.5-2 6 0"/>',
  music: '<path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
  beat: '<path d="M3 12h4l2-5 3 10 2-7 1.5 2H21"/>',
  breathe: '<circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="8" opacity=".55"/>',
  water: '<path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z"/>',
  pause: '<path d="M8.5 5v14M15.5 5v14"/>', play: '<path d="M8 5l11 7-11 7z"/>',
  bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  away: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/><path d="M17.5 3.5l3 3M20.5 3.5l-3 3"/>',
  battery: '<rect x="3" y="7.5" width="16" height="9" rx="2"/><path d="M21.5 11v2M6 10.5v3"/>',
  layout: '<rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M15 8.5h3M15 12h3M15 15.5h3"/><circle cx="8" cy="13.5" r="1.6"/>',
  next: '<path d="M6 5l9 7-9 7zM18 5v14"/>', reload: '<path d="M19 9A7.5 7.5 0 1 0 19.5 14"/><path d="M19.5 4.5V9H15"/>',

      <div class="row"><span class="lab">Share anonymous counts<small>Daily totals only</small></span>${sw(S.sharePlayCounts !== false, 'togglePlayCounts')}</div>
      <div class="row">${S.pro ? `<span class="note" style="margin:0">Pro is active${S.licensed ? ' · <button class="link" data-a="deactivateLicense">move to another Mac</button>' : ''}</span>` : '<button class="link" data-a="enterLicense">Have a key?</button>'}<button class="link" data-a="shareApp">Share wallpap</button></div>`);

  $('#root').innerHTML = `
  <div class="now" style="background-image:${thumb(cur.id, cur.thumb)}">
    <div class="brand"><svg viewBox="0 0 22 10"><path d="M1 4c2.5-3 5-3 7.5 0s5 3 7.5 0 3.5-2 5-1"/><path d="M1 8.5c2.5-3 5-3 7.5 0s5 3 7.5 0 3.5-2 5-1" opacity=".45"/></svg>wallpap</div>
    <div class="tr">${S.web ? '<button class="glass" data-a="addToDesktop" title="Open this world in the wallpap app">Add to desktop</button>' : ''}${S.pro ? '' : '<button class="glass pro" data-a="openPro">PRO</button>'}<button class="glass" data-a="togglePause" title="${S.paused ? 'Resume' : 'Pause'} the scene">${ic(S.paused ? 'play' : 'pause')}</button><button class="glass" data-a="nextSceneNow" title="Next world">${ic('next')}</button></div>
    <div class="nm"><b>${esc(cur.title)}</b>${S.paused ? '<span>Paused · click the scene to resume</span>' : ''}</div>
    ${acts.length ? `<div class="acts">${acts.map((c) => { const k = actIcon(String(c.v), c.title); return `<button class="glass" data-a="runAction" data-v='${J(c.v)}' title="${esc(c.title)}">${ic(k)}<span>${esc(ACT_WORD[k] || c.title.split(' ')[0])}</span></button>`; }).join('')}</div>` : ''}
  </div>
  ${S.clickTip ? `<div class="tip"><p>Clicking a scene also slides your windows away (macOS <b>Click wallpaper to reveal desktop</b>). Set it to <b>Only in Stage Manager</b>.<span><button data-a="openDesktopSettings">Open setting</button><button data-a="dismissClickTip">Keep</button></span></p></div>` : ''}
  <div class="cards">${world}${worlds}${mood}${sound}${background}${music}${breathe}${water}${settings}</div>
  <nav class="foot">
    <button data-a="togglePlay" ${S.playAvailable === false ? 'disabled' : ''} title="${esc(S.playReason || 'Daily puzzles')}">${ic('puzzle')}<span>${S.playOpen ? 'Close puzzles' : 'Puzzles'}</span></button>
    <span class="sp"></span>
    <button data-a="reloadScene" title="Reload the scene">${ic('reload')}</button>
    <button data-a="showNativeMenu" title="More · Quit">${ic('dots')}</button>
  </nav>`;
  reportHeight();
}

document.addEventListener('click', (e) => {
  const co = e.target.closest('[data-card-open]');
  if (co) { open[co.dataset.cardOpen] = true; saveOpen(); render(S); return; }
  const cd = e.target.closest('[data-card]');
  if (cd) { const k = cd.dataset.card; open[k] = !open[k]; saveOpen(); render(S); return; }
  const ct = e.target.closest('[data-cat]');
  if (ct) { cat = ct.dataset.cat; render(S); return; }
  const t = e.target.closest('[data-a]');
  if (!t) return;
  const a = t.dataset.a; if (!a) return;
  let v = t.dataset.v !== undefined ? JSON.parse(t.dataset.v) : null;
  if (a === 'pickAudioVol' && typeof v === 'string') v = JSON.parse(v);
  if (a === 'pickSoundscape' && v !== 'off') S.lastScape = v;
  send(a, v, t.hasAttribute('data-tag') ? Number(v) : null);
});

let lastH = 0;
function reportHeight() {
  requestAnimationFrame(() => {
    const h = Math.ceil(document.getElementById('root').getBoundingClientRect().height);
    if (h !== lastH) { lastH = h; send('height', h); }
  });
}

if (host) send('ready');
else { // standalone design preview: clicks change this mock state
  const M = {
    pro: true, scene: 'cats', categories: ['Nature', 'Cozy Rooms', 'City Nights', 'Journeys', 'Mindful', 'Music'],
    scenes: [['koi', 'Koi Pond', 'Nature'], ['grass', 'Touch Grass', 'Nature'], ['cats', 'Santorini Cats', 'Nature'], ['cafe', 'Corner Café', 'Cozy Rooms', 1], ['cabin', 'Snowy Cabin', 'Cozy Rooms', 1], ['records', 'Record Store', 'Cozy Rooms', 1], ['speakeasy', 'Speakeasy', 'City Nights', 1], ['rooftop', 'Rooftop', 'City Nights', 1], ['ramen', 'Ramen Alley', 'City Nights', 1], ['train', 'Train Journey', 'Journeys', 1], ['bowls', 'Singing Bowls', 'Mindful'], ['cymatics', 'Cymatics', 'Music', 1]].map(([id, title, cat, m]) => ({ id, title, cat, pro: false, music: !!m })),
    sceneCtl: [{ type: 'action', title: 'Feed the Cats', v: 'feed' }, { type: 'action', title: 'Fill the Water Bowl', v: 'water' }, { type: 'action', title: 'Toss a Toy', v: 'toy' }],
    timeView: 'auto', weather: '', liveWeather: 'Live — rain · 24°', precise: false, muted: false,
    audio: [{ c: 'fx', on: true, vol: 1 }, { c: 'ambience', on: true, vol: 0.7 }, { c: 'weather', on: false, vol: 1 }],
    soundscape: 'off', ssVol: 0.35, music: false, musicDenied: false, beat: true, companions: 'native',
    calm: false, breath: 'box', water: 45, paused: false, fps: 30, breathEvery: 60, overApps: true, cycle: 0, cycleScope: 'all', cycleShuffle: true, licensed: false,
    offers: [{ id: 'butterfly-garden', title: 'Butterfly Garden', thumb: 'art/thumbs/grass.jpg' }, { id: 'beach', title: 'Beach', thumb: 'art/thumbs/koi.jpg' }],
    layoutMode: 'auto', layoutSummary: '4 widgets on the right', avoidIcons: false, login: true, energy: 'away', away: 120, awayRec: 120,
    awayChoices: [[30, '30 sec'], [60, '1 min'], [120, '2 min'], [300, '5 min'], [600, '10 min']],
  };
  const tog = { toggleMute: 'muted', toggleMusicMode: 'music', toggleCalm: 'calm', togglePause: 'paused', toggleBeatSync: 'beat', toggleLogin: 'login', togglePreciseLocation: 'precise', toggleAvoidIcons: 'avoidIcons', toggleRemindersOverApps: 'overApps', toggleSceneCycleShuffle: 'cycleShuffle' };
  const pick = { pickScene: 'scene', pickTimeView: 'timeView', pickWeather: 'weather', pickSoundscape: 'soundscape', pickSoundscapeVolume: 'ssVol', pickBreath: 'breath', pickEnergy: 'energy', pickLayoutMode: 'layoutMode', pickAway: 'away', pickFps: 'fps', pickSceneCycle: 'cycle', pickSceneCycleScope: 'cycleScope', pickBreathReminder: 'breathEvery', pickReminder: 'water', pickCompanions: 'companions' };
  window.__mock = (a, v, tag) => {
    if (a === 'height') return;
    if (tog[a]) M[tog[a]] = !M[tog[a]];
    else if (pick[a]) M[pick[a]] = tag != null ? tag : v;
    else if (a === 'toggleAudioCat') { const p = M.audio.find((x) => x.c === v); p.on = !p.on; }
    else if (a === 'pickAudioVol') { const p = M.audio.find((x) => x.c === v[0]); p.vol = v[1]; }
    else if (a === 'nextSceneNow') { const i = M.scenes.findIndex((s) => s.id === M.scene); M.scene = M.scenes[(i + 1) % M.scenes.length].id; }
    M.lastScape = S && S.lastScape;
    render(M);
  };
  render(M);
}
</script>
