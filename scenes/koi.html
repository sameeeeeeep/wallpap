<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Koi Pond</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050d0d; cursor: default; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #hud { position: fixed; left: 14px; bottom: 12px; font: 12px ui-monospace, Menlo, monospace; color: #9fb; opacity: 0; transition: opacity .6s; pointer-events: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="over"></canvas>
<div id="hud"></div>
<script src="lw.js"></script>
<script>
'use strict';
// ─────────────────────────────────────────────────────────────────────────────
// Koi pond. Layers:
//   fish canvas (2D, underwater)  ─┐
//   surface canvas (2D, pads…)    ─┼─► WebGL composite: ripple sim → refraction,
//   ripple sim (GPU wave eq.)     ─┘   caustics, shadows, sky reflection, glints
//   overlay canvas (2D, emissive: text, fireflies, breath ring, snow)
// ─────────────────────────────────────────────────────────────────────────────

const TAU = Math.PI * 2;
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

// 1D value noise for wandering.
const NP = new Float32Array(512).map(() => Math.random() * 2 - 1);
function noise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(NP[i & 511], NP[(i + 1) & 511], u); }

const glc = document.getElementById('gl');
const over = document.getElementById('over');
const octx = over.getContext('2d');

let W = 0, H = 0, DPR = 1, GLS = 1;
// Sprite resolution for pre-rendered pads/flowers (uploaded once, never per frame —
// canvas→texture uploads stall WebKit, so everything per-frame is drawn in WebGL).
const SURF_SCALE = Math.min(2, devicePixelRatio || 1);
const SIM_DIV = 3;         // ripple sim at 1/3 CSS res

// ─── WebGL ──────────────────────────────────────────────────────────────────
const gl = glc.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: 'default' });
const floatOK = !!(gl && gl.getExtension('EXT_color_buffer_float'));

const VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(p*2.0-1.0,0.0,1.0); }`;

const SIM_FS = `#version 300 es
precision highp float;
uniform sampler2D uPrev; uniform vec2 uSize; uniform vec4 uDrops[16]; uniform int uN; uniform float uDamp;
out vec4 o;
void main(){
  vec2 uv = gl_FragCoord.xy / uSize; vec2 tx = 1.0/uSize;
  vec4 c = texture(uPrev, uv);
  float n = texture(uPrev, uv+vec2(tx.x,0)).r + texture(uPrev, uv-vec2(tx.x,0)).r
          + texture(uPrev, uv+vec2(0,tx.y)).r + texture(uPrev, uv-vec2(0,tx.y)).r;
  float h = (n*0.5 - c.g) * uDamp;
  for (int i=0;i<16;i++){
    if (i>=uN) break;
    vec4 d = uDrops[i];
    float dist = length((uv - d.xy) * uSize);
    if (dist < d.z) h += d.w * (0.5 + 0.5*cos(3.14159*dist/d.z));
  }
  // keep the edges calm
  vec2 e = min(uv, 1.0-uv) * uSize;
  h *= smoothstep(0.0, 4.0, min(e.x, e.y));
  o = vec4(h, c.r, 0.0, 1.0);
}`;

const COMP_FS = `#version 300 es
precision highp float;
uniform sampler2D uSim, uFish, uSurf, uFloor;
uniform vec2 uRes, uSimTx, uSunDir, uLantern;
uniform float uTime, uAspect, uHasSim;
uniform vec3 uLight, uSky, uDeep, uShallow, uFogCol;
uniform float uAmb, uCaust, uSpec, uFlash, uFog, uDapple, uWind, uLanternOn, uSat;
out vec4 o;

float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash2(vec2 p){ return vec2(hash(p), hash(p+19.19)); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<4;i++){ s+=a*noise(p); p=p*2.03+17.1; a*=.5; } return s; }

// Tileable water caustic (after joltz0r / Dave Hoskins).
float caustic(vec2 p, float t){
  p = mod(p, 6.28318) - 250.0;
  vec2 i = p; float c = 1.0; float inten = .005;
  for (int n = 0; n < 4; n++) {
    float tt = t * (1.0 - (3.5 / float(n+1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0/length(vec2(p.x / (sin(i.x+tt)/inten), p.y / (cos(i.y+tt)/inten)));
  }
  c /= 4.0; c = 1.17 - pow(c, 1.4);
  return pow(abs(c), 8.0);
}

// Pond bed: silt + moss, with patches of small river pebbles.
float pebbles(vec2 p, out float tone){
  // Separate rounded stones with silt between (not a tiled pavement).
  vec2 i = floor(p), f = fract(p);
  float best = 0.0; tone = 0.0;
  for (int y=-1;y<=1;y++) for (int x=-1;x<=1;x++){
    vec2 g = vec2(x,y); vec2 h = hash2(i+g);
    if (h.x > 0.6) continue;                         // some cells are empty
    vec2 c = g + 0.2 + h*0.6 - f;
    float ang = h.y*6.28; vec2 q = mat2(cos(ang),-sin(ang),sin(ang),cos(ang))*c;
    q.x *= 0.75 + h.x*0.5;                           // oval
    float hr = hash(i+g+3.7); float r = 0.12 + 0.36*hr*hr;
    float d = length(q)/r;
    float v = smoothstep(1.0, 0.6, d) * (1.0 - 0.4*d*d);   // domed
    float ao = smoothstep(1.45, 1.0, d);                     // contact shadow
    v = v > 0.0 ? v : -ao*0.5;
    if (abs(v) > abs(best)){ best = v; tone = hash(i+g+9.1); }
  }
  return best;
}
vec3 pondFloor(vec2 p, out float stoneMask){
  float m1 = fbm(p*0.35), m2 = fbm(p*1.1 + 7.0);
  vec3 silt = mix(uDeep*1.1, uShallow*0.55, m1);
  silt = mix(silt, silt*vec3(0.85,1.08,0.8), smoothstep(0.4,0.7,m2));     // moss
  float tone;
  float st = pebbles(p*0.75, tone);
  float patchMask = smoothstep(0.42, 0.6, fbm(p*0.3 + 3.1));
  float tone2;
  float small = max(pebbles(p*2.2 + 11.0, tone2), 0.0) * 0.6;
  float grain = noise(p*14.0)*0.5 + noise(p*31.0)*0.5;
  vec3 stone = uShallow * mix(0.6, 1.15, tone);
  stone = mix(stone, stone*vec3(1.12,0.96,0.82), step(0.85, tone)*0.5);
  silt *= 0.88 + 0.24*grain;
  float stv = max(st, 0.0), ao = max(-st, 0.0);
  stoneMask = max(stv*patchMask, small*patchMask*0.5);
  vec3 col = silt * (1.0 - ao*patchMask);
  col = mix(col, stone*(0.9+0.2*grain), stv*patchMask*0.85);
  col = mix(col, uShallow*mix(0.45,0.8,tone2), small*patchMask*0.35);
  return col;
}

float blurA(sampler2D t, vec2 uv, float r){
  float a = texture(t, uv).a*0.28;
  a += texture(t, uv+vec2(r,0)).a*0.18 + texture(t, uv-vec2(r,0)).a*0.18;
  a += texture(t, uv+vec2(0,r*uAspect)).a*0.18 + texture(t, uv-vec2(0,r*uAspect)).a*0.18;
  return a;
}

vec3 sat(vec3 c, float s){ float l = dot(c, vec3(0.299,0.587,0.114)); return mix(vec3(l), c, s); }

void main(){
  vec2 uv = vec2(gl_FragCoord.x/uRes.x, 1.0 - gl_FragCoord.y/uRes.y);
  vec2 asp = vec2(uAspect, 1.0);
  vec2 fp = uv*asp;

  // Surface normal from the ripple heightfield + wind micro-ripples.
  vec2 grad = vec2(
    texture(uSim, uv+vec2(uSimTx.x,0)).r - texture(uSim, uv-vec2(uSimTx.x,0)).r,
    texture(uSim, uv+vec2(0,uSimTx.y)).r - texture(uSim, uv-vec2(0,uSimTx.y)).r) * uHasSim;
  vec2 wp = fp*34.0;
  vec2 micro = vec2(noise(wp + uTime*vec2(1.1,0.6)) - 0.5, noise(wp.yx*1.13 - uTime*vec2(0.8,1.2)) - 0.5);
  micro += 0.5*vec2(noise(fp*9.0 + uTime*0.25) - 0.5, noise(fp.yx*9.0 - uTime*0.21) - 0.5);
  vec3 N = normalize(vec3(-(grad*4.0 + micro*uWind*0.22), 1.0));
  vec2 refr = N.xy * 0.014;

  // Overhead foliage shade drifting slowly (day only).
  float dap = 0.0;
  if (uDapple > 0.01) {
    dap = smoothstep(0.52, 0.72, fbm(fp*2.2 + vec2(uTime*0.012, uTime*0.004)));
    dap *= smoothstep(1.25, 0.2, length((uv - vec2(-0.05, -0.05))*asp)) * uDapple;
  }

  // Floor + caustics.
  float stoneMask;
  vec4 flr = texture(uFloor, uv + refr*1.8/asp);   // pre-baked pond bed
  vec3 fl = flr.rgb; stoneMask = flr.a;
  float ca = caustic((fp + refr*2.5)*4.2, uTime*0.32);
  if (uCaust > 0.2) ca = ca*0.8 + 0.35*caustic((fp*1.7 - refr*1.5)*4.2 + 1.7, uTime*0.27);

  vec2 so = uSunDir * vec2(0.03/uAspect, 0.03);
  float fsh = blurA(uFish, uv + refr*0.5 + so, 0.006);
  float psh = blurA(uSurf, uv + so*0.9, 0.008);
  float lit = (1.0 - dap*0.6) * (1.0 - fsh*0.75) * (1.0 - psh*0.72);

  vec3 col = fl * (uLight*uAmb*(0.5 + 0.5*lit) + vec3(0.02,0.03,0.035));
  col += uLight * ca * uCaust * lit * (0.5 + 0.5*stoneMask) * 0.55;

  // Lantern pool (night).
  float ld = length((uv - uLantern)*asp);
  vec3 lantern = vec3(1.0,0.62,0.3) * uLanternOn * 0.55 / (1.0 + ld*ld*28.0);
  col += fl * lantern * (1.0 - fsh*0.5) * 2.0;

  // Water column.
  float depth = 0.55 + 0.25*smoothstep(0.1, 0.9, length((uv-0.5)*asp*0.9));
  col = mix(col, uDeep*(uAmb*0.8+0.08) + lantern*0.15, 0.42*depth);

  // Fish, refracted.
  vec4 f = texture(uFish, uv + refr*0.7);
  vec3 fishLit = f.rgb * (uLight*uAmb*(0.92 - dap*0.35) + uLight*ca*uCaust*0.22*(1.0-dap) + lantern*1.4 + vec3(0.03));
  col = col*(1.0 - f.a) + fishLit;
  col = mix(col, uDeep*(uAmb*0.7+0.06), 0.1);

  // Sky reflection + specular glints.
  vec4 pad = texture(uSurf, uv + grad*0.012);
  float slope = 1.0 - N.z;
  vec3 sky = uSky * (0.75 + 0.5*noise(fp*2.5 + vec2(uTime*0.006, 0.0) + N.xy*3.0));
  col += sky * (0.06 + min(slope, 0.04)*3.0) * (1.0 - pad.a) * (1.0 - dap*0.5);
  vec3 L = normalize(vec3(uSunDir*vec2(-1.0,1.0)*0.9, 1.0));
  L = normalize(vec3(-uSunDir.x, uSunDir.y, 1.1));
  vec3 Hh = normalize(L + vec3(0,0,1));
  float sp = pow(max(dot(N,Hh), 0.0), 220.0) * uSpec * (1.0 - dap*0.8);
  col += uLight * sp * 0.9 * (1.0 - pad.a);

  // Floating layer (pads, flowers, pellets, leaves) lit by the scene.
  vec3 padLit = pad.rgb * (uLight*uAmb*(0.95 - dap*0.4) + lantern*1.6 + vec3(0.025));
  col = col*(1.0 - pad.a) + padLit;

  // Mist.
  if (uFog > 0.005) {
    float mist = fbm(fp*1.3 + vec2(uTime*0.02, -uTime*0.008));
    col = mix(col, uFogCol*(uAmb*0.9+0.1), uFog * (0.35 + 0.55*mist));
  }

  col += uSky * uFlash * 0.6;
  col = sat(col, uSat);

  // Vignette, gentle filmic shoulder, grain.
  float vig = smoothstep(1.25, 0.35, length((uv-0.5)*vec2(uAspect*0.8, 1.0)));
  col *= 0.62 + 0.38*vig;
  col = col / (1.0 + max(col - 0.7, 0.0)*0.9);
  col += (fract(sin(dot(gl_FragCoord.xy + fract(uTime*7.0)*97.0, vec2(12.9898,78.233)))*43758.5453) - 0.5) * 0.02;
  o = vec4(pow(max(col, 0.0), vec3(0.97)), 1.0);
}`;

// Pond bed is static: bake it once (and again only when the light's palette shifts).
const FLOOR_FS = COMP_FS.slice(0, COMP_FS.indexOf('float blurA(')) + `
void main(){
  vec2 uv = vec2(gl_FragCoord.x/uRes.x, 1.0 - gl_FragCoord.y/uRes.y);
  float m; vec3 c = pondFloor(uv*vec2(uAspect,1.0)*8.0, m);
  o = vec4(c, m);
}`;

function compile(src, type) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(VS, gl.VERTEX_SHADER)); gl.attachShader(p, compile(fs, gl.FRAGMENT_SHADER));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name.replace('[0]', '')] = gl.getUniformLocation(p, info.name); }
  return { p, u };
}
const simP = program(SIM_FS);
const compP = program(COMP_FS);
const floorP = program(FLOOR_FS);
const vao = gl.createVertexArray();

function tex(w, h, float) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  if (float) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
let sim = null; // {w,h,tex:[a,b],fbo:[a,b],i}
// Offscreen layers the composite samples: koi (underwater) and surface (pads…).
function target(w, h) {
  const t = tex(w, h);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex: t, fbo: fb };
}
let fishRT = null, surfRT = null;
let floorTex = null, floorFbo = null, floorKey = null;
function bakeFloor(force) {
  const key = [...L.deep, ...L.shallow];
  if (!force && floorKey && key.every((v, i) => Math.abs(v - floorKey[i]) < 0.004)) return;
  floorKey = key;
  if (!floorTex) {
    floorTex = tex(glc.width, glc.height, floatOK);
    if (!floatOK) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, glc.width, glc.height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    floorFbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, floorFbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, floorTex, 0);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, floorFbo);
  gl.viewport(0, 0, glc.width, glc.height);
  gl.useProgram(floorP.p); gl.bindVertexArray(vao);
  gl.uniform2f(floorP.u.uRes, glc.width, glc.height);
  gl.uniform1f(floorP.u.uAspect, W / H);
  gl.uniform3fv(floorP.u.uDeep, L.deep); gl.uniform3fv(floorP.u.uShallow, L.shallow);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
let dummySim = null;

function buildSim() {
  if (sim) { sim.tex.forEach((t) => gl.deleteTexture(t)); sim.fbo.forEach((f) => gl.deleteFramebuffer(f)); sim = null; }
  if (!floatOK) {
    dummySim = tex(1, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 255]));
    return;
  }
  const w = Math.max(64, Math.round(W / SIM_DIV)), h = Math.max(64, Math.round(H / SIM_DIV));
  const t = [tex(w, h, true), tex(w, h, true)];
  const f = t.map((tt) => { const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tt, 0); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); return fb; });
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  sim = { w, h, tex: t, fbo: f, i: 0 };
}

const drops = [];
function addDrop(x, y, r, s) { if (drops.length < 64) drops.push([x / W, y / H, Math.max(2.6, r / SIM_DIV), s]); }

const dropBuf = new Float32Array(64);
function stepSim() {
  if (!sim) return;
  gl.useProgram(simP.p);
  gl.bindVertexArray(vao);
  gl.viewport(0, 0, sim.w, sim.h);
  gl.uniform2f(simP.u.uSize, sim.w, sim.h);
  gl.uniform1f(simP.u.uDamp, ['rain', 'storm'].includes(LW.env.weather) ? 0.978 : 0.988);
  for (let step = 0; step < 2; step++) {
    const batch = drops.splice(0, 16);
    dropBuf.fill(0);
    batch.forEach((d, i) => dropBuf.set(d, i * 4));
    gl.uniform4fv(simP.u.uDrops, dropBuf);
    gl.uniform1i(simP.u.uN, batch.length);
    const src = sim.i, dst = 1 - sim.i;
    gl.bindFramebuffer(gl.FRAMEBUFFER, sim.fbo[dst]);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sim.tex[src]);
    gl.uniform1i(simP.u.uPrev, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    sim.i = dst;
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}


// ─── 2D batch renderer (koi meshes + surface sprites) ───────────────────────
const BATCH_VS = `#version 300 es
in vec2 aPos; in vec2 aUV; in vec4 aCol; in vec4 aP;
uniform vec2 uView;
out vec2 vUV; out vec4 vCol; out vec4 vP;
void main(){
  vUV = aUV; vCol = aCol; vP = aP;
  // y-down CSS px → clip, stored so texel row 0 = top of screen (matches composite uv)
  gl_Position = vec4(aPos / uView * 2.0 - 1.0, 0.0, 1.0);
}`;
const BATCH_FS = `#version 300 es
precision highp float;
uniform sampler2D uAtlas, uPat; uniform float uRows;
in vec2 vUV; in vec4 vCol; in vec4 vP; out vec4 o;
void main(){
  int mode = int(vP.x + 0.5);
  if (mode == 0) { o = texture(uAtlas, vUV) * vCol; return; }
  if (mode == 1) { o = vCol; return; }
  // Koi body: vUV = (u along spine 0..1, v across -1..1).
  float u = clamp(vUV.x, 0.0, 1.0), v = vUV.y, av = abs(v);
  vec3 c = texture(uPat, vec2(u, (vP.y + clamp(v*0.5 + 0.5, 0.03, 0.97)) / uRows)).rgb;
  bool metal = mod(vP.w, 2.0) > 0.5, rim = vP.w > 1.5;
  if (metal) c = mix(c, min(c*1.3 + 0.06, vec3(1.0)), (1.0 - av)*0.6);
  c *= mix(1.0, 0.6, smoothstep(0.4, 1.0, av));                      // roundness
  float spine = (1.0 - smoothstep(0.0, 0.4, av)) * smoothstep(0.02, 0.12, u) * smoothstep(0.92, 0.7, u);
  c += spine * (metal ? 0.2 : 0.08);                                  // dorsal sheen
  if (rim) c += 0.14 * smoothstep(0.75, 0.97, av);
  c = mix(c, vec3(0.031, 0.133, 0.141), vP.z);                       // depth
  float fw = fwidth(v) * 1.3 + 1e-4;
  float a = (1.0 - smoothstep(1.0 - fw, 1.0, av)) * smoothstep(-0.02, 0.01, vUV.x) * vCol.a;
  o = vec4(c * a, a);
}`;
const batchP = (() => {
  const p = gl.createProgram();
  gl.attachShader(p, compile(BATCH_VS, gl.VERTEX_SHADER)); gl.attachShader(p, compile(BATCH_FS, gl.FRAGMENT_SHADER));
  ['aPos', 'aUV', 'aCol', 'aP'].forEach((n, i) => gl.bindAttribLocation(p, i, n));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; ['uView', 'uAtlas', 'uPat', 'uRows'].forEach((n) => (u[n] = gl.getUniformLocation(p, n)));
  return { p, u };
})();
const STRIDE = 12;
let vbuf = new Float32Array(STRIDE * 60000), vn = 0;
const bvao = gl.createVertexArray(), bbuf = gl.createBuffer();
gl.bindVertexArray(bvao);

let master = null, rain = null;
function audioOut() {

const SEG = 14;
class Koi {
  constructor(i) {
    const md = Math.min(W, H);
    this.L = clamp(md * 0.19, 110, 300) * rand(0.7, 1.12);
    this.z = rand(0, 1);          // depth: 0 = just under surface
    this.variety = pickVariety();
    this.pat = makePattern(this.variety);
    this.butterfly = Math.random() < 0.3;
    this.seed = rand(1000);
    this.curious = rand(0.2, 1);
    this.cruise = this.L * rand(0.22, 0.34);
    this.speed = this.cruise;
    this.ang = rand(TAU);
    this.phase = rand(TAU);
    this.flee = 0;
    this.lastWake = 0;
    const x = rand(W * 0.1, W * 0.9), y = rand(H * 0.1, H * 0.9);
    this.p = [];
    for (let k = 0; k < SEG; k++) this.p.push([x - Math.cos(this.ang) * k * this.L / (SEG - 1), y - Math.sin(this.ang) * k * this.L / (SEG - 1)]);

  get y() { return this.p[0][1]; }
}

    if (d < 4) {
      if (fly.state === 'leave') { fly.state = 'gone'; return; }
      if (fly.goal === 'perch') { fly.state = 'perch'; fly.t = rand(5, 14); }
      else if (fly.goal === 'dip') { addDrop(fly.x, fly.y, 4, -0.6); fly.state = 'hover'; fly.t = rand(0.3, 0.8); }
      else { fly.state = 'hover'; fly.t = rand(0.4, 2.0); }
    }
  } else {
    fly.vx *= Math.exp(-dt * 8); fly.vy *= Math.exp(-dt * 8);
    fly.t -= dt;
    if (fly.state === 'perch' && fly.pad) { fly.x += fly.pad.vx * dt; fly.y += fly.pad.vy * dt; }
    if (fly.t <= 0) flyPick();
  }
  fly.x += fly.vx * dt; fly.y += fly.vy * dt;
  if (fly.state === 'hover') { fly.x += Math.sin(t * 13) * 0.25; fly.y += Math.cos(t * 11) * 0.25; }
}
function emitLife(t) {
  if (frog.state !== 'gone') {
    const s = 1.25 * (1 + (frog.h || 0) * 0.4), a = frog.fade;
    quad(frog.x, frog.y, SPR.frog.s * s, SPR.frog.s * s, frog.ang + Math.PI / 2, SPR.frog.uv, a);
    if (frog.croak > 0.02) {
      const hx = frog.x + Math.cos(frog.ang) * 13 * s, hy = frog.y + Math.sin(frog.ang) * 13 * s, cs = (0.5 + 0.7 * frog.croak) * SPR.frogThroat.s;
      quad(hx, hy, cs, cs, frog.ang, SPR.frogThroat.uv, a * 0.9);
    }
  }
  if (fly.state !== 'gone') {
    const air = fly.state === 'perch' ? 1 : 1.12, rotA = fly.head + Math.PI / 2;
    const flutter = fly.state === 'perch' ? 0.75 : 0.35 + 0.25 * Math.random();
    quad(fly.x, fly.y, SPR.dfWings.s * air, SPR.dfWings.s * air * (fly.state === 'perch' ? 1 : 0.9 + 0.1 * Math.random()), rotA, SPR.dfWings.uv, flutter);
    quad(fly.x, fly.y, SPR.dfBody.s * air, SPR.dfBody.s * air, rotA, SPR.dfBody.uv, 1);
  }
}

// ─── Overlay: emissive things ───────────────────────────────────────────────
const flies = [];
const flakes = [];
function drawOverlay(dt, t) {
  const c = octx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, W, H);
  // Fireflies on warm, dry nights.
  const m = month();
  const wantFlies = L.night > 0.6 && m >= 3 && m <= 9 && !['rain', 'storm', 'snow'].includes(LW.env.weather) ? 14 : 0;
  while (flies.length < wantFlies) flies.push({ x: rand(W), y: rand(H), ph: rand(TAU), s: rand(0.6, 1.2), a: 0 });
  flies.forEach((f, i) => {
    f.x += noise1(f.ph + t * 0.2) * 12 * dt; f.y += noise1(f.ph * 3 + t * 0.2) * 12 * dt;
    f.a = lerp(f.a, i < wantFlies ? 1 : 0, dt * 0.5);
    const glow = f.a * Math.pow(0.5 + 0.5 * Math.sin(t * 1.3 * f.s + f.ph), 3);
    if (glow < 0.02) return;
    const g = c.createRadialGradient(f.x, f.y, 0, f.x, f.y, 14 * f.s);
    g.addColorStop(0, `rgba(230,240,150,${glow * 0.9})`); g.addColorStop(0.2, `rgba(200,220,110,${glow * 0.35})`); g.addColorStop(1, 'rgba(200,220,110,0)');
    c.fillStyle = g; c.beginPath(); c.arc(f.x, f.y, 14 * f.s, 0, TAU); c.fill();
  });
  for (let i = flies.length - 1; i >= 0; i--) if (i >= wantFlies && flies[i].a < 0.02) flies.splice(i, 1);

  // Snow.
  const snowing = LW.env.weather === 'snow';
  if (snowing && flakes.length < 160 * LW.env.intensity + 40) flakes.push({ x: rand(-50, W), y: rand(-50, H), z: rand(0.3, 1), life: rand(3, 9), age: 0 });
  c.fillStyle = 'rgba(240,244,250,0.85)';
  for (let i = flakes.length - 1; i >= 0; i--) {
    const f = flakes[i]; f.age += dt;
    f.x += (8 + noise1(i + t * 0.3) * 14) * dt * f.z; f.y += 16 * dt * f.z;
    // Flakes shrink as they fall toward the water, then melt with a tiny ripple.
    const k = 1 - f.age / f.life;
    if (k <= 0) { addDrop(f.x, f.y, 3, -0.25); flakes.splice(i, 1); continue; }
    c.globalAlpha = Math.min(1, f.age * 2) * (0.35 + 0.6 * k);
    c.beginPath(); c.arc(f.x, f.y, (0.8 + 2.2 * f.z) * (0.4 + 0.6 * k), 0, TAU); c.fill();
  }
  c.globalAlpha = 1;

  // Calm: breathing ring on the water.
  if (calmFade > 0.01) {
    const [cx, cy] = calmCenter(), b = breath(calmT);
    const R = Math.min(W, H) * (0.1 + 0.08 * b);
    const a = calmFade;
    const g = c.createRadialGradient(cx, cy, R * 0.6, cx, cy, R * 1.25);
    g.addColorStop(0, 'rgba(230,240,235,0)'); g.addColorStop(0.55, `rgba(230,240,235,${0.07 * a})`); g.addColorStop(1, 'rgba(230,240,235,0)');
    c.fillStyle = g; c.beginPath(); c.arc(cx, cy, R * 1.3, 0, TAU); c.fill();
    c.strokeStyle = `rgba(235,242,238,${0.22 * a})`; c.lineWidth = 1.2;
    c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.stroke();
    const phase = calmT % 10 < 4 ? 'breathe in' : 'breathe out';
    const within = calmT % 10 < 4 ? (calmT % 10) / 4 : ((calmT % 10) - 4) / 6;
    c.globalAlpha = a * Math.sin(Math.PI * within) * 0.75;
    c.fillStyle = '#e8eee9';
    c.font = `300 ${Math.round(Math.min(W, H) * 0.02)}px ui-serif, "New York", Georgia, serif`;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(phase, cx, cy);
    c.globalAlpha = 1;
  }

  // Reminder text floating on the water.
  if (reminder) {
    const k = smooth(0.5, 2.5, reminder.t) * smooth(16, 12.5, reminder.t);
    if (k > 0.005) {
      const fs = Math.round(clamp(Math.min(W, H) * 0.028, 18, 40));
      c.font = `italic 300 ${fs}px ui-serif, "New York", Georgia, serif`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      const wob = Math.sin(t * 1.3) * 1.5;
      c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 12;
      c.fillStyle = `rgba(242,236,222,${0.9 * k})`;
      c.fillText(reminder.text, reminder.x + wob, reminder.y + 4);
      c.shadowBlur = 0;
    }
  }
}

// ─── Main loop ──────────────────────────────────────────────────────────────
let lastInput = 0;
function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  GLS = Math.min(DPR, Math.sqrt(1.7e6 / (W * H)));   // water is soft: ~1x is plenty, and M1 + Low Power Mode needs the headroom
  glc.width = Math.round(W * GLS); glc.height = Math.round(H * GLS);
  over.width = Math.round(W * DPR); over.height = Math.round(H * DPR);
  [fishRT, surfRT].forEach((rt) => { if (rt) { gl.deleteTexture(rt.tex); gl.deleteFramebuffer(rt.fbo); } });
  fishRT = target(glc.width, glc.height); surfRT = target(glc.width, glc.height);
  buildSim();
  if (floorTex) { gl.deleteTexture(floorTex); gl.deleteFramebuffer(floorFbo); floorTex = null; }
  floorKey = null;
  if (!fish.length || Math.abs(fish.length - clamp(Math.round((W * H) / 160000), 6, 13)) > 2) { spawnFish(); buildPatterns(); }
  spawnPads();
  makeMiscSprites();
  buildAtlas([...pads.map((p) => p.sp), ...pads.filter((p) => p.flower).map((p) => p.flower), ...SPR.maple, ...SPR.petal, SPR.pellet, SPR.bloomPad, ...SPR.bloom, SPR.frog, SPR.frogThroat, SPR.dfBody, SPR.dfWings]);
  frog.state = 'gone'; frog.back = 2;
}
addEventListener('resize', () => { clearTimeout(resize.t); resize.t = setTimeout(resize, 150); });
resize();
for (const k in L) { const tl = targetLight(); if (k in tl) L[k] = tl[k]; }

let prev = performance.now() / 1000, frame = 0, nextFlash = 10, rafDt = 1 / 60;
function tick() {
  requestAnimationFrame(tick);
  const now = performance.now() / 1000;
  const idle = now - lastInput > 20 && !reminder && calmFade < 0.01;
  frame++;
  rafDt = lerp(rafDt, Math.min(0.1, now - (tick.last || now)), 0.1); tick.last = now;
  if (idle && rafDt < 0.012 && frame % 2) return;  // halve 120 Hz when nobody's looking (never below ~60)
  const dt = Math.min(0.05, now - prev); prev = now;
  const t = now;

  stepLight(dt);
  calmFade = lerp(calmFade, calm ? 1 : 0, 1 - Math.exp(-dt * 0.8));
  if (calm || calmFade > 0.01) {
    const before = calmT % 10; calmT += dt;
    if (calmFade > 0.3 && calmT % 10 < before) { const [cx, cy] = calmCenter(); addDrop(cx, cy, 30, -1.4); }
  }
  if (reminder) { reminder.t += dt; if (reminder.t > 17) reminder = null; else if (reminder.t < 12 && Math.random() < dt / 2.5) addDrop(reminder.x + rand(-60, 60), reminder.y - 64 + rand(-20, 20), 5, -0.5); }
  if (bloom) { bloom.t += dt; if (bloom.t > 17) bloom = null; }

  // Weather drops.
  const w = LW.env.weather, it = LW.env.intensity;
  const rate = w === 'rain' ? 30 + it * 70 : w === 'storm' ? 90 + it * 90 : 0;
  let n = rate * dt; while (n > 0) { if (Math.random() < n) addDrop(rand(W), rand(H), rand(4, 7), -rand(0.15, 0.4)); n -= 1; }
  if (w === 'storm') { nextFlash -= dt; if (nextFlash <= 0) { L.flash = rand(0.6, 1.2); nextFlash = rand(7, 22); thunder(); } }

  if (hand.pending && !hand.on && now - hand.downT > 0.45) hand.on = true;
  if (hand.on) { lastInput = now; if (Math.random() < dt * 2.5) addDrop(hand.x + rand(-3, 3), hand.y + rand(-3, 3), 5, -0.3); if (now - hand.downT > 45) hand.on = false; }
  updateFish(dt * (1 - 0.35 * calmFade), t);
  updateSurface(dt, t);
  updateFrog(dt, t);
  updateFly(dt, t);

  drawOverlay(dt, t);
  stepSim();
  for (const f of fish) emitKoi(f, t);
  flush(fishRT, true);
  emitSurface(t);
  flush(surfRT, true);
  bakeFloor();

  gl.viewport(0, 0, glc.width, glc.height);
  gl.useProgram(compP.p);
  gl.bindVertexArray(vao);
  const u = compP.u;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sim ? sim.tex[sim.i] : dummySim); gl.uniform1i(u.uSim, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, fishRT.tex); gl.uniform1i(u.uFish, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, surfRT.tex); gl.uniform1i(u.uSurf, 2);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, floorTex); gl.uniform1i(u.uFloor, 3);
  gl.uniform2f(u.uRes, glc.width, glc.height);
  gl.uniform2f(u.uSimTx, sim ? 1 / sim.w : 0, sim ? 1 / sim.h : 0);
  gl.uniform1f(u.uHasSim, sim ? 1 : 0);
  gl.uniform1f(u.uTime, t % 3600);
  gl.uniform1f(u.uAspect, W / H);
  gl.uniform3fv(u.uLight, L.light);
  gl.uniform3fv(u.uSky, L.sky);
  gl.uniform3fv(u.uDeep, L.deep);
  gl.uniform3fv(u.uShallow, L.shallow);
  gl.uniform3fv(u.uFogCol, [lerp(0.55, 0.2, L.night), lerp(0.6, 0.24, L.night), lerp(0.62, 0.32, L.night)]);
  gl.uniform1f(u.uAmb, L.amb);
  gl.uniform1f(u.uCaust, L.caust);
  gl.uniform1f(u.uSpec, L.spec);
  gl.uniform1f(u.uWind, L.wind);
  gl.uniform1f(u.uFog, L.fog);
  gl.uniform1f(u.uSat, L.sat);
  gl.uniform1f(u.uDapple, L.dapple);
  gl.uniform1f(u.uFlash, L.flash);
  gl.uniform1f(u.uLanternOn, L.lantern);
  gl.uniform2f(u.uLantern, 0.04, 0.96);
  gl.uniform2fv(u.uSunDir, L.sunDir);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
requestAnimationFrame(tick);

// Dev HUD (browser only).
if (!LW.isHost) {
  const hud = document.getElementById('hud');
  const show = () => { hud.textContent = `${LW.env.weather} · ${LW.env.hour.toFixed(1)}h${LW.calm ? ' · calm' : ''}${LW.muted ? ' · muted' : ''}   [w t r b m]`; hud.style.opacity = 0.8; clearTimeout(show.t); show.t = setTimeout(() => (hud.style.opacity = 0), 2500); };
  LW.on('env', show); LW.on('calm', show); LW.on('mute', show);
}
</script>
</body>
</html>
