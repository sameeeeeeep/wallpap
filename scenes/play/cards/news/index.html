<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Headlines</title><!--CARD_STYLE--><style>
#tabs{margin-bottom:12px}#tabs button{font-size:12px;padding:6px 10px}.headline{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:13px 2px;line-height:1.4}.headline small{display:block;margin-top:5px;font-size:10px}.headline[data-seen=true]{opacity:.65}.headline .dot{font-size:11px;margin-right:5px}#notice{font-size:11px}#ad{margin-bottom:2px}
</style></head><body><h1>Headlines</h1><p class="muted">From the source. In the order they were published.</p><div id="tabs" class="row" role="group" aria-label="News outlets"></div><p id="notice" role="status">Loading headlines…</p><div id="list"></div><button id="retry">Refresh</button><div id="ad"></div><!--CARD_SDK--><script>
(async()=>{await card.ready();const $=s=>document.querySelector(s),feeds=CARD_DATA.feeds;let results=[],seen=[],tab='Top',busy=false;
try{seen=await card.load('seen')||[];if(!Array.isArray(seen))seen=[];}catch{}
const tabs=['Top',...new Set(feeds.map(f=>f.outlet))];for(const name of tabs){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{tab=name;render();};$('#tabs').append(b);}
function relative(s){const mins=Math.max(0,Math.floor((Date.now()-Date.parse(s))/60000));return mins<1?'Just now':mins<60?mins+'m ago':mins<1440?Math.floor(mins/60)+'h ago':Math.floor(mins/1440)+'d ago';}
function render(){$('#tabs').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===tab)));const items=PlayCore.dedupe(results.flatMap(r=>r.items)).filter(x=>tab==='Top'||x.source===tab),offline=results.some(r=>r.offline),updated=results.map(r=>r.updated).filter(Boolean).sort()[0];$('#notice').textContent=!feeds.length?'Sources are awaiting syndication permission. Please check back after a future update.':offline?'Offline · '+(updated?'updated '+new Date(updated).toLocaleString():'no saved headlines yet'):'Updated '+(updated?new Date(updated).toLocaleTimeString():'just now');$('#list').replaceChildren();for(const item of items){const b=document.createElement('button');b.className='headline';b.dataset.seen=String(seen.includes(item.link));b.setAttribute('aria-label',item.title+', '+item.source+', opens in your browser');b.textContent=item.title;const small=document.createElement('small');small.textContent=(seen.includes(item.link)?'Seen · ':'New · ')+item.source+' · '+relative(item.published);b.append(small);b.onclick=async()=>{try{await card.open(item.link);seen=[item.link,...seen.filter(x=>x!==item.link)].slice(0,100);await card.save('seen',seen);render();}catch{$('#notice').textContent='This link could not open. Refresh and try again.';}};$('#list').append(b);}if(!items.length&&feeds.length){const p=document.createElement('p');p.className='muted';p.textContent=offline?'Connect to the internet, then refresh.':'No headlines from this outlet yet.';$('#list').append(p);}card.adSlot($('#ad')).catch(()=>{});}
async function refresh(){if(busy)return;busy=true;$('#retry').disabled=true;$('#notice').textContent='Loading headlines…';results=await Promise.all(feeds.map(f=>card.feed(f.id).catch(()=>({items:[],offline:true,updated:null}))));render();$('#retry').disabled=false;busy=false;}
$('#retry').onclick=refresh;refresh();
})();
</script></body></html>
