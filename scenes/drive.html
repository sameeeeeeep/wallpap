<script>
'use strict';
(() => {
// =====================================================================
//  Night Drive — an endless road at night, seen from a chase cam behind
//  an unoccupied grand tourer on autopilot. Classic pseudo-3D segment
//  projection (curve + hill per 4 m segment, drawn as batched trapezoids
//  with hill clipping), painted with baked skies, soft glows and fog.
//
//  ENDLESS + REPRODUCIBLE: every segment (curve, height, verge, roadside
//  props) is a pure function of (LW.settings.seed, segment index); the
//  odometer (LW.settings.odo, metres) persists, so a drive resumes where
//  it left off. 'New Road' picks a new seed (→ new start biome).
//
//  BIOMES (table: BIO / PAL / decorate* / bakeFar*): the route is a chain
//  of legs (4.4–8 km each, ≈3–5 min at cruise) chosen from the seed; the
//  last 200 segments (~800 m, ≈30 s) of a leg blend geometry, palettes,
//  props and baked far layers into the next. Implemented:
//    coast  — night coastal highway: sea + moon glitter, headlands with a
//             lighthouse, guardrail, streetlight runs, towns (diner, fuel).
//    forest — winding road between walls of firs and tall pines, mist in
//             hollows, lake clearings with moonlight, fences, deer signs,
//             fireflies on summer nights.
//    desert — long straights over big dunes, mesas, dense stars + Milky
//             Way, saguaro / joshua trees, telephone poles and wires, a
//             lone motel and diner, heat shimmer by day.
//  To add a biome: add params to BIO, a palette to PAL, a decorate fn to
//  DECOR, a far-layer painter to FAR, (optional) names to NAMES, and its
//  id to BIOME_IDS. Everything else (blending, baking, LOD) is generic.
//
//  Layout: the vanishing point sits left of centre and the car at ~44%
//  of the width, so the right ~28% stays calm (dark verge, hills, sky).
//  Billboards (now playing) stand on the LEFT verge.
//
//  Interaction (gentle; autopilot by default): hold the mouse = speed up,
//  release = ease back to cruise; cursor left/right of the car = nudge to
//  the inner/outer lane; click = flash high beams; click a billboard or
//  gantry sign = next track. Menu actions: beams, horn, faster, slower,
//  newroad (+ playpause / next in Music Mode).
//  Calm: slows to a gentle cruise; headlights + streetlight pools breathe
//  with LW.breathState (holds hold). Sound: engine/road/tyre/wind beds on
//  the ambience bus, wet-tyre hiss + rain on the weather bus, horn on fx.
//
//  ART SLOTS (optional; procedural fallback): scenes/art/drive/
//    car.png  rear view of the player car, transparent PNG, ~1200 px
//             wide, wheels touching the bottom edge, car centred. Drawn
//             at the procedural car's width (1.92 m); tail-light glows
//             are added at 30–60% height, ±40% width.
//  Dev: __drive.goto('forest'|'desert'|'coast'), __drive.bench(), keys:
//  h = horn, g = high beams, ] / [ = faster / slower.
// =====================================================================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgba = (c, a = 1) => `rgba(${clamp(c[0] | 0, 0, 255)},${clamp(c[1] | 0, 0, 255)},${clamp(c[2] | 0, 0, 255)},${a})`;
const mul = (c, m) => [c[0] * m[0], c[1] * m[1], c[2] * m[2]];
const scl = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
const approach = (v, t, rate, dt) => v + (t - v) * (1 - Math.exp(-rate * dt));
function mulberry(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const h32 = (a, b) => {
  let h = Math.imul((a | 0) ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul((b | 0) + 0x632be5ab, 0xc2b2ae35);
  h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12; h = Math.imul(h, 0x297a2d39);
  return (h ^ (h >>> 15)) >>> 0;
};
const hu = (a, b) => h32(a, b) / 4294967296;
const strHash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
function vnoise(x, sd) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  const h = (n) => { let v = Math.imul((n + sd * 374761) | 0, 668265263); v = Math.imul(v ^ (v >>> 13), 1274126177); return ((v ^ (v >>> 16)) >>> 0) / 4294967296; };
  return lerp(h(i), h(i + 1), u);
}
const fbm = (x, sd) => vnoise(x, sd) * 0.6 + vnoise(x * 2.3, sd + 7) * 0.28 + vnoise(x * 5.1, sd + 13) * 0.12;
const nowS = () => performance.now() / 1000;
const SANS = '-apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif';
const SERIF = '"Hoefler Text", "Baskerville", "Iowan Old Style", Georgia, serif';
const COND = '"Avenir Next Condensed", "Helvetica Neue", "Arial Narrow", sans-serif';
function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
function freeCanvas(c) { if (c) { c.width = 1; c.height = 1; } }
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
function ellGrad(g, x, y, rx, ry, col, a, stops = 6) {
  if (a <= 0.002) return;
  g.save(); g.translate(x, y); g.scale(rx, ry);
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, 1);
  for (let i = 0; i <= stops; i++) { const t = i / stops; gr.addColorStop(t, rgba(col, a * Math.exp(-2.6 * t * t) * (1 - t * t * t))); }
  g.fillStyle = gr; g.fillRect(-1, -1, 2, 2); g.restore();
}
function sprite(size, stops) {
  const c = newCanvas(size, size), g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
}
function fitText(g, s, maxW) { s = s || ''; if (g.measureText(s).width <= maxW) return s; while (s.length > 1 && g.measureText(s + '…').width > maxW) s = s.slice(0, -1); return s + '…'; }
function hsl2rgb(h, s, l) {
  const a = s * Math.min(l, 1 - l), f = (n) => { const k = (n + h / 30) % 12; return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [f(0) * 255, f(8) * 255, f(4) * 255];
}
function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  if (mx === mn) return [0, 0, l];
  const d = mx - mn, s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
  const h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h * 60, s, l];
}

// ---- light sprites (additive) -------------------------------------------------
const GL_SODIUM = sprite(128, [[0, 'rgba(255,232,186,1)'], [0.1, 'rgba(255,200,130,0.6)'], [0.4, 'rgba(255,160,84,0.14)'], [1, 'rgba(255,140,60,0)']]);
const GL_WHITE = sprite(128, [[0, 'rgba(255,255,255,1)'], [0.16, 'rgba(240,244,255,0.5)'], [0.5, 'rgba(220,230,255,0.1)'], [1, 'rgba(220,230,255,0)']]);
const GL_COOL = sprite(128, [[0, 'rgba(210,228,255,1)'], [0.2, 'rgba(170,200,255,0.4)'], [0.55, 'rgba(150,185,255,0.08)'], [1, 'rgba(150,185,255,0)']]);
const GL_RED = sprite(128, [[0, 'rgba(255,120,110,1)'], [0.15, 'rgba(255,40,40,0.6)'], [0.5, 'rgba(200,10,20,0.13)'], [1, 'rgba(160,0,10,0)']]);
const GL_AMBER = sprite(64, [[0, 'rgba(255,220,150,1)'], [0.3, 'rgba(255,170,60,0.45)'], [1, 'rgba(255,140,40,0)']]);
const GL_FLY = sprite(32, [[0, 'rgba(240,255,170,1)'], [0.3, 'rgba(200,255,110,0.4)'], [1, 'rgba(160,240,80,0)']]);
const POOL_S = sprite(128, [[0, 'rgba(255,196,128,0.85)'], [0.45, 'rgba(255,170,100,0.3)'], [1, 'rgba(255,150,80,0)']]);
const POOL_W = sprite(128, [[0, 'rgba(235,240,255,0.8)'], [0.45, 'rgba(220,230,255,0.25)'], [1, 'rgba(220,230,255,0)']]);
const POOL_R = sprite(128, [[0, 'rgba(255,40,40,0.7)'], [0.5, 'rgba(220,20,30,0.2)'], [1, 'rgba(200,0,20,0)']]);
const BLOB = sprite(64, [[0, 'rgba(255,255,255,0.9)'], [0.45, 'rgba(255,255,255,0.45)'], [1, 'rgba(255,255,255,0)']]);
function streakSprite(r, g, b) {   // a wet-road reflection: soft column fading downward
  const c = newCanvas(32, 256), x = c.getContext('2d');
  for (let y = 0; y < 256; y++) {
    const k = y / 255, a = Math.pow(1 - k, 1.6) * (0.4 + 0.6 * Math.exp(-k * 3));
    const gr = x.createLinearGradient(0, 0, 32, 0);
    gr.addColorStop(0, `rgba(${r},${g},${b},0)`); gr.addColorStop(0.5, `rgba(${r},${g},${b},${a})`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
    x.fillStyle = gr; x.fillRect(0, y, 32, 1);
  }
  return c;
}
const STREAK_S = streakSprite(255, 190, 120), STREAK_W = streakSprite(230, 236, 255), STREAK_R = streakSprite(255, 50, 50);
const FLARE = (() => {   // anamorphic horizontal streak for close headlights
  const c = newCanvas(256, 16), x = c.getContext('2d');
  const gr = x.createLinearGradient(0, 0, 256, 0);
  gr.addColorStop(0, 'rgba(150,180,255,0)'); gr.addColorStop(0.5, 'rgba(200,220,255,0.9)'); gr.addColorStop(1, 'rgba(150,180,255,0)');
  x.fillStyle = gr; x.fillRect(0, 6, 256, 4);
  const g2 = x.createLinearGradient(0, 0, 0, 16); g2.addColorStop(0, 'rgba(0,0,0,1)'); g2.addColorStop(0.5, 'rgba(0,0,0,0)'); g2.addColorStop(1, 'rgba(0,0,0,1)');
  x.globalCompositeOperation = 'destination-out'; x.fillStyle = g2; x.fillRect(0, 0, 256, 16);
  return c;
})();
const CONE = (() => {      // volumetric streetlight cone (head at top centre)
  const c = newCanvas(128, 256), x = c.getContext('2d');
  for (let y = 0; y < 256; y++) {
    const k = y / 255, hw = 4 + 60 * k, a = 0.9 * Math.pow(1 - k, 0.7) * (0.3 + 0.7 * Math.exp(-k * 2));
    const gr = x.createLinearGradient(64 - hw, 0, 64 + hw, 0);
    gr.addColorStop(0, 'rgba(255,200,140,0)'); gr.addColorStop(0.5, `rgba(255,200,140,${a})`); gr.addColorStop(1, 'rgba(255,200,140,0)');
    x.fillStyle = gr; x.fillRect(64 - hw, y, hw * 2, 1);
  }
  return c;
})();

// =====================================================================
//  art slot
// =====================================================================
const ART = { car: null, plates: {}, trees: {} };
// Generated transparent landscapes and existing painted tree cutouts; all lighting is baked offscreen.
for(const id of ['coast','forest','desert']){
  const im=new Image();im.onload=()=>{ART.plates[id]=im;if(E&&W>1)requestBake(false);};im.src='art/drive/'+id+'-painted.png';
}
for(const [id,path] of Object.entries({fir:'swiss/tree1',tpine:'swiss/tree2',pine:'shinkansen/tree1',cypressW:'orient/tree2',bush:'scrub',rock:'swiss/scrub'})){
  const im=new Image();im.onload=()=>{ART.trees[id]=im;if(E&&W>1)bakeSprites();};im.src='art/train/'+path+'.png';
}
(()=>{const im=new Image();im.onload=()=>{
  const full=newCanvas(im.width,im.height),g=full.getContext('2d');g.drawImage(im,0,0);
  const p=g.getImageData(0,0,im.width,im.height).data;
  ['house','diner','fuel','saguaro','joshua','sage'].forEach((name,i)=>{
    const cx=(i%3)*512,cy=i<3?0:420,cw=512,ch=i<3?420:604;
    let x0=cx+cw,y0=cy+ch,x1=cx,y1=cy;
    for(let y=cy;y<cy+ch;y++)for(let x=cx;x<cx+cw;x++)if(p[(y*im.width+x)*4+3]>32){x0=Math.min(x0,x);x1=Math.max(x1,x+1);y0=Math.min(y0,y);y1=Math.max(y1,y+1);}
    const c=newCanvas(x1-x0,y1-y0);c.getContext('2d').drawImage(im,x0,y0,c.width,c.height,0,0,c.width,c.height);
    c.naturalWidth=c.width;c.naturalHeight=c.height;ART.trees[name]=c;
  });if(E&&W>1)bakeSprites();
};im.src='art/drive/roadside-painted.png';})();
(() => { try { const im = new Image(); im.onload = () => { if (im.naturalWidth) { ART.car = im; if (E && W > 1) bakeCar(); } }; im.onerror = () => {}; if (!/[?&]noart=1/.test(location.search)) im.src = 'art/drive/car.png'; } catch (e) {} })();

// =====================================================================
//  environment: time of day + weather (glides 20–40 s, never pops)
// =====================================================================
const KF = [
  { h: 0, top: '#060a1a', bot: '#1a2a48', day: 0, lamp: 1, warm: 0 },
  { h: 4.8, top: '#060a1a', bot: '#1a2a48', day: 0, lamp: 1, warm: 0 },
  { h: 6.2, top: '#28315c', bot: '#d9977f', day: 0.3, lamp: 0.8, warm: 0.8 },
  { h: 7.6, top: '#6f98c8', bot: '#e8dccb', day: 0.8, lamp: 0.15, warm: 0.25 },
  { h: 9, top: '#4d86c6', bot: '#cddfea', day: 1, lamp: 0, warm: 0 },
  { h: 16.4, top: '#5a8bc4', bot: '#e3d6bd', day: 0.95, lamp: 0, warm: 0.2 },
  { h: 18.3, top: '#39457a', bot: '#ee8f58', day: 0.52, lamp: 0.65, warm: 1 },
  { h: 19.5, top: '#131a3e', bot: '#6c4868', day: 0.14, lamp: 1, warm: 0.4 },
  { h: 20.8, top: '#060a1a', bot: '#1a2a48', day: 0, lamp: 1, warm: 0 },
  { h: 24, top: '#060a1a', bot: '#1a2a48', day: 0, lamp: 1, warm: 0 },
];
KF.forEach((k) => { k.topC = hex(k.top); k.botC = hex(k.bot); });
const WX = {
  cloudy: { d: ['#99a2b1', '#c8ccd2'], n: ['#11151f', '#242a38'], amt: 0.6, day: 0.85 },
  rain: { d: ['#68727f', '#929aa6'], n: ['#090c14', '#171c28'], amt: 0.85, day: 0.6 },
  storm: { d: ['#4a5161', '#6c7382'], n: ['#05070c', '#11151f'], amt: 0.95, day: 0.45 },
  snow: { d: ['#b8becb', '#dde1e8'], n: ['#161a28', '#2c3146'], amt: 0.75, day: 0.85 },
  fog: { d: ['#b2b5bb', '#d1d3d6'], n: ['#191c25', '#31343f'], amt: 0.85, day: 0.75 },
};
let E = null, Et = null;
function computeTarget() {
  const env = LW.env || {};
  const hr = (((+env.hour || 0) % 24) + 24) % 24;
  let a = KF[0], b = KF[1];
  for (let i = 0; i < KF.length - 1; i++) if (hr >= KF[i].h && hr <= KF[i + 1].h) { a = KF[i]; b = KF[i + 1]; break; }
  const t = smooth((hr - a.h) / Math.max(0.001, b.h - a.h));
  const n = (k) => lerp(a[k], b[k], t);
  let top = mix3(a.topC, b.topC, t), bot = mix3(a.botC, b.botC, t);
  let day = n('day'), lamp = n('lamp'), warm = n('warm');
  const w = env.weather || 'clear', it = clamp(env.intensity == null ? 0.7 : +env.intensity, 0, 1);
  let rain = 0, storm = 0, snow = 0, fog = 0, cloud = 0.12;
  let moon = (1 - day) * (hr > 18.5 || hr < 6.6 ? 1 : 0);
  let dusk = warm * (hr > 12 ? 1 : 0.35);
  const X = WX[w];
  if (X) {
    const f = X.amt * (0.6 + 0.4 * it);
    top = mix3(top, mix3(hex(X.n[0]), hex(X.d[0]), day), f);
    bot = mix3(bot, mix3(hex(X.n[1]), hex(X.d[1]), day), f);
    day *= lerp(1, X.day, 0.6 + 0.4 * it);
    warm *= 0.3; dusk *= w === 'cloudy' ? 0.4 : 0.1; moon *= w === 'cloudy' ? 0.3 : 0; cloud = w === 'cloudy' ? 0.8 : 1;
    if (w === 'rain') rain = 0.45 + 0.55 * it;
    if (w === 'storm') { rain = 0.75 + 0.25 * it; storm = 1; }
    if (w === 'snow') snow = 0.4 + 0.6 * it;
    if (w === 'fog') fog = 0.55 + 0.45 * it;
  }
  moon *= LW.moonVisibility();
  const mo = new Date().getMonth(), summer = (mo >= 4 && mo <= 8) || (+env.temp || 0) > 18 ? 1 : 0;
  Et = { hour: hr, weather: w, it, top, bot, day, lamp, warm, dusk, rain, storm, snow, fog, cloud, moon, summer };
  if (!E) { E = JSON.parse(JSON.stringify(Et)); E.wet = rain > 0.1 ? 1 : 0; E.cover = snow > 0.1 ? 1 : 0; }
}
const ENV_KEYS = ['day', 'lamp', 'warm', 'dusk', 'rain', 'storm', 'snow', 'fog', 'cloud', 'moon', 'it', 'summer'];
function envAmb() {
  const night = [0.2, 0.23, 0.32], dayA = mix3([1, 1, 1], [0.8, 0.84, 0.9], E.cloud * 0.6);
  const a = mix3(night, dayA, Math.pow(E.day, 0.85));
  return mix3(a, mul(a, [1.12, 0.9, 0.78]), E.warm * 0.7);
}
const envSnap = () => [...ENV_KEYS.map((q) => E[q]), E.cover * 0.6, E.wet * 0.3, ...E.top.map((v) => v / 255), ...E.bot.map((v) => v / 255)];
let lastBake = -99, bakedSnap = null, fade = 1, sprAmb = null;
function updateEnv(dt) {
  const k = LW.envBlend(dt, 9);
  for (const key of ENV_KEYS) E[key] += (Et[key] - E[key]) * k;
  for (const key of ['top', 'bot']) for (let i = 0; i < 3; i++) E[key][i] += (Et[key][i] - E[key][i]) * k;
  E.hour = Et.hour; E.weather = Et.weather;
  E.wet = clamp(E.wet + (E.rain > 0.15 ? dt * E.rain / 14 : -dt / 220), 0, 1);
  E.cover = clamp(E.cover + (E.snow > 0.15 ? dt * E.snow / 240 : -dt * (1 + 3 * E.day) / 900), 0, 1);   // builds over minutes, melts faster in sun
  E.amb = envAmb();
  fade = Math.min(1, fade + dt / 1.6);
  const snap = envSnap();
  const diff = bakedSnap ? Math.max(...snap.map((v, i) => Math.abs(v - bakedSnap[i]))) : 1;
  if (diff > 0.03 && nowS() - lastBake > 2.5 && fade >= 1 && !bakeQ.length) requestBake(true);
}
const night = () => 1 - E.day;

// =====================================================================
//  world constants (1 m = 250 units; a segment is 4 m)
// =====================================================================
const UPM = 250, SEG = 1000, LANE = 900, ROADW = 1350, SHOULDER = 380, EDGE = ROADW + SHOULDER;
const CENTER_X = -450, LANES = [0, 900], ONCOMING_X = -900;
const CAMH = 620, CAR_DZ = 1450, NEAR = 140, DRAW = 420, RING = 1024, TRANS = 200;
const CAM_FOLLOW = 0.88, CAR_W = 480;
const KMH = (k) => k * UPM / 3.6;
const CRUISE = [60, 75, 90, 105, 120];
const NB = 10, NQ = 8;

// =====================================================================
//  BIOME TABLE — geometry params, palettes, decor, far layers, names
// =====================================================================
const BIOME_IDS = ['coast', 'forest', 'desert'];
const BIO = {
  //          curve scale, dead zone, straight gate, hill amps (broad, swell, dips), fog, streetlights, towns, cliff/sea, forest walls
  coast: { curve: 1.0, dead: 0.12, open: 0.22, hA: 6500, hB: 1600, hC: 350, fogK: 1.0, lightsK: 1, townK: 1, sea: 1, walls: 0, bank: 0 },
