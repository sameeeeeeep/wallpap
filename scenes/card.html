<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>wallpap reminder</title>
<!-- Reminder card shown under the menu bar when the wallpaper is covered (host/Reminders.swift).
     ?kind=water|stretch|breathe&text=…&pattern=box|calm|478. Page → host: webkit.messageHandlers.card. -->
<style>
:root{--ink:#20382d;--ink-3:#6c746b;--card:#e9ede3;--bg:rgba(246,244,236,.94);--solid:#20382d;--solid-ink:#fff;--glow:rgba(51,92,65,.18);--ring:#335c41}
@media (prefers-color-scheme: dark){:root{--ink:#e7ede4;--ink-3:#9aa59b;--card:rgba(255,255,255,.08);--bg:rgba(24,30,26,.92);--solid:#e7ede4;--solid-ink:#18201b;--glow:rgba(134,184,150,.18);--ring:#86b896}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;font:12.5px/1.35 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;cursor:default;overflow:hidden}
.card{margin:4px;border-radius:14px;background:var(--bg);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 0 0 .5px rgba(0,0,0,.12);padding:12px 12px 11px;animation:in .35s cubic-bezier(.22,.8,.24,1)}
@keyframes in{from{transform:translateY(-8px);opacity:0}}
.top{display:flex;gap:10px;align-items:center}
.ic{width:34px;height:34px;border-radius:10px;background:var(--card);display:grid;place-items:center;flex:none}
.ic svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.t b{display:block;font-size:13px;font-weight:600}
.t span{color:var(--ink-3);font-size:11px}
.x{margin-left:auto;align-self:flex-start;color:var(--ink-3);background:none;border:0;font-size:15px;cursor:pointer;padding:0 2px}
.acts{display:flex;gap:6px;margin-top:9px}
.acts button{flex:1;border:0;border-radius:8px;padding:6px 8px;font:inherit;font-size:12px;cursor:pointer;background:var(--card);color:var(--ink)}
.acts button.main{background:var(--solid);color:var(--solid-ink);font-weight:600}
.guide{display:none;flex-direction:column;align-items:center;margin-top:10px}
.guide.on{display:flex}
.orb{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle,var(--glow) 0,transparent 70%);display:grid;place-items:center;position:relative}
.orb i{position:absolute;inset:16px;border-radius:50%;border:1.5px solid var(--ring);transform:scale(.55);opacity:.8}
.phase{margin-top:6px;font-size:13px;font-weight:500;letter-spacing:.01em}
.left{color:var(--ink-3);font-size:10.5px;margin-top:1px}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="top">
    <div class="ic" id="ic"></div>
    <div class="t"><b id="title"></b><span id="sub"></span></div>
    <button class="x" data-a="close" aria-label="Dismiss">×</button>
  </div>
  <div class="acts" id="acts"></div>
  <div class="guide" id="guide"><div class="orb"><i id="ring"></i></div><div class="phase" id="phase">breathe in</div><div class="left" id="left"></div></div>
</div>
<script>
'use strict';
const q = new URLSearchParams(location.search), kind = q.get('kind') || 'water';
const host = window.webkit && webkit.messageHandlers && webkit.messageHandlers.card;
const send = (a, extra) => host ? host.postMessage(Object.assign({ a, kind }, extra || {})) : console.log('[card]', a, extra);
const ICONS = {
  water: '<svg viewBox="0 0 24 24"><path d="M7 4h10l-1.3 15.2a2 2 0 0 1-2 1.8h-3.4a2 2 0 0 1-2-1.8z"/><path d="M7.6 10h8.8"/></svg>',
  stretch: '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M5 9l7 2 7-2M12 11v5l-3 5M12 16l3 5"/></svg>',
  breathe: '<svg viewBox="0 0 24 24"><path d="M3 9h11a3 3 0 1 0-3-3M3 13h15a3 3 0 1 1-3 3M3 17h7"/></svg>',
};
const SUB = { water: 'Small sips, all day.', stretch: 'Ten seconds is enough.', breathe: 'One quiet minute.' };
document.getElementById('ic').innerHTML = ICONS[kind] || ICONS.water;
document.getElementById('title').textContent = q.get('text') || 'A small pause?';
document.getElementById('sub').textContent = SUB[kind] || '';
document.getElementById('acts').innerHTML = kind === 'breathe'
  ? '<button class="main" data-a="breathe">Breathe now</button><button data-a="snooze">Later</button>'
  : '<button class="main" data-a="done">Done</button><button data-a="snooze">Snooze 10 min</button>';

// Same patterns as lw.js: [phase, seconds, label]
const PATTERNS = {
  box: [['in', 4, 'breathe in'], ['hold', 4, 'hold'], ['out', 4, 'breathe out'], ['rest', 4, 'hold']],
  calm: [['in', 4, 'breathe in'], ['out', 6, 'breathe out']],
  478: [['in', 4, 'breathe in'], ['hold', 7, 'hold'], ['out', 8, 'breathe out']],
};
function guide() {
  const P = PATTERNS[q.get('pattern')] || PATTERNS.box, total = P.reduce((a, p) => a + p[1], 0);
  const t0 = performance.now(), dur = 60;
  document.getElementById('acts').style.display = 'none';
  document.getElementById('guide').classList.add('on');
  const ring = document.getElementById('ring'), ph = document.getElementById('phase'), left = document.getElementById('left');
  let level = 0;
  (function tick() {
    const t = (performance.now() - t0) / 1000;
    if (t > dur) { ph.textContent = 'nicely done'; left.textContent = ''; send('breathDone'); return; }
    let c = t % total, i = 0;
    while (c > P[i][1]) { c -= P[i][1]; i++; }
    const [p, d, label] = P[i], k = c / d, e = k * k * (3 - 2 * k);
    level = p === 'in' ? e : p === 'out' ? 1 - e : p === 'hold' ? 1 : 0;
    ring.style.transform = `scale(${0.55 + 0.45 * level})`;
    ph.textContent = label;
    left.textContent = `${Math.ceil(dur - t)}s`;
    requestAnimationFrame(tick);
  })();
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'breathe') { send('breathe'); guide(); return; }
  send(a);
});
const card = document.getElementById('card');
card.addEventListener('mouseenter', () => send('hover', { v: true }));
card.addEventListener('mouseleave', () => send('hover', { v: false }));
</script>
</body>
</html>
