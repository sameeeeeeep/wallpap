/* =====================================================================
   Train Journey — a quiet carriage, window seat. The world slides by in parallax (fields, hills,
   towns, bridges over water, brief tunnels). A drink rests on the table beside a walkman.
   Small flocks pass outside the window.

   SKINS (LW.settings.skin, default 'indian'): a skin is one entry in the SKINS table below — its
   plates, window/table geometry, panoramas + parallax bands, trackside sprites, bridge, tunnel
   palette, route segments (jointed or welded rail) and the drink on the table.
   Adding a skin = art in art/train/<skin>/ + one table entry. Switching skins crossfades live.

   Click the window: the train surges ahead (motion blur, poles whipping past, a whoosh) and eases back
   to cruise further down the line. Music Mode plays on a walkman on the table: reels turn, a tiny LED,
   the cassette's J-card carries the track in biro; click the walkman = play/pause, its fast-forward key
   (top right) or right flank = next. Headphone foam breathes faintly with the beat.
   Dev keys: s stretch, k next skin. Browser (no host): clicking the walkman plays demo tracks.

   Stage: 1600×1000; plates are drawn to it. Shared table props (transparent, painted, neutral light;
   re-lit by the carriage light at bake): walkman.png 396×344 (hubs at 176,197 / 289.5,197 r21.5;
   LED 353,60; FF key 268–318 × 6–40), headphones.png 263×213, cassette-case.png 400×259 (blank J-card
   17–388 × 39–248). art/birds/sparrow.png is a shared four-frame flight atlas.
   ===================================================================== */

// the sleeper at night: wheel rumble, da-dum … da-dum over the rail joints (rate follows train.v),

function ambBuild(a, B, X) {

  ambLoop('rail', 'pink', 'bandpass', 820, 0.7, B);       // steel-on-steel hiss
  ambLoop('air', 'pink', 'bandpass', 1500, 0.5, B);       // night air past the window bars
  ambLoop('fan', 'pink', 'bandpass', 240, 1.6, B, 4.4);   // the ceiling fan: soft whirr, blade flutter
  ambOsc('fanHum', 96, B);                                // … and its motor
  ambLoop('rain', 'pink', 'highpass', 1300, 0.5, X);      // rain streaking the glass

  noiseHit(a, t, 0.08, 'lowpass', 520 * (1 - 0.4 * tun), 0.8, amp * 0.8, o);

// =====================================================================
//  interaction

// =====================================================================
//  frame

// =====================================================================

let rsT = null;
addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(rebuild, 150); });
LW.on('layout', () => { clearTimeout(rsT); rsT = setTimeout(rebuild, 60); });
applySkin(SKINS[LW.settings.skin] ? LW.settings.skin : 'indian'); xf.want = skinId;
computeTarget();
E.amb = envAmb();
rebuild();
loadArtSlots();
if (LW.calm) setCalm(true);
requestAnimationFrame(frame);
