<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cymatics</title>
<!--
  wallpap scene: Cymatics, a Chladni sand plate driven by whatever is playing.

  Port of instrument 1 from cymatica/ (src/sand.js + gl.js + post.js), trimmed for a wallpaper:
  ~83k GPU sand grains (288², vs 262k in cymatica). Each grain hops in proportion to the
  plate's local displacement |u| and drifts down the gradient of u², so sand piles onto the
  nodal lines (the real mechanism behind Chladni figures). Modes crossfade, so sand flows
  from one figure into the next.

  Skins (LW.settings.skin), switching crossfades (both render for ~1.6 s):
    'sand'     Chladni sand (default, free) — as above.
    'faraday'  Faraday water: a round dish of water under a ring light (port of cymatica's water
               instrument). N standing plane waves at even angles → 2N-fold (quasi)crystal patterns; what
               you see is the ring light reflected wherever the surface slope matches it. Below the
               Faraday threshold (quiet passages, idle, calm) the dish falls back to concentric rings.
    'filings'  Iron filings on frosted paper under raking light (a fork of the grain engine: 36,864
               filings with an angle channel). Hidden magnets under the sheet; each kick is a TAP that
               frees the filings to turn into the field and chain along its lines (they drift toward the
               contours of the 2D stream function, i.e. onto discrete field lines).

  Music (LW.mx from music.js — real chroma/chord/key/tempo from the host when Beat Sync is on, a
  synthesised progression otherwise; never a hash of the track title):
    chord root (circle of fifths) → the figure: Chladni mode / water symmetry / magnet ring layout;
                                    minor chords take the mode's ± partner. A new chord is applied once
                                    the current figure has had ~3.5 s to form.
    key (mode)                    → plate shape in 'auto' (minor keys round, major square; ≤ 1 change / 30 s)
    brightness                    → complexity tier (higher-order modes / more poles / finer waves)
    LW.music.level + kick         → sand agitation + jumps / water steepness + ripples / filing taps
    artwork                       → tint subtly toward the artwork palette
    paused / nothing playing      → autopilot (slow circle-of-fifths walk), slower and dimmer.
    calm                          → breathing sand / breathing rings / filings lift on the in-breath
  Never strobes: beats move matter, never the light.

  Layers (no 2D canvas is ever uploaded to WebGL):
    #bg   canvas2D backdrop, baked at half res on time-of-day / palette change only
    #gl   WebGL2 plate (square, sized to the plate + a small glow margin, render res capped)
    #cap  canvas2D caption band under the plate (title/artist, figure, reminders), redrawn
          only while something in it changes
  Right ~28% of the screen: backdrop only.

  Settings: skin = 'sand' | 'faraday' | 'filings';  plate = 'auto' | 'square' | 'round' (sand only)
  URL (dev): ?set.side=256 (grain texture side), ?cap=1400 (render-res cap), ?fake=0
  Dev keys (browser only): n = fake track on/off (lw.js) with synthetic levels, beats AND chroma moving
    through a chord progression (music.js), p = play/pause demo tracks (with artwork), . = next,
    o = cycle plate, v = cycle skin, k = kick,
    s = stretch reminder, r = water reminder (lw.js), b = calm (lw.js), t = +3h (lw.js)
  Art slots: none (procedural).
  Debug: window.__cym.bench(120) → ms/frame incl. GPU sync.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07080b; }
  canvas { position: fixed; display: block; }
  #bg { left: 0; top: 0; width: 100vw; height: 100vh; }
  #gl, #cap { pointer-events: none; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="gl"></canvas>
<canvas id="cap"></canvas>
<script src="lw.js"></script>
<script src="music.js"></script>
<script>
'use strict';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, tau, dt) => v + (t - v) * (1 - Math.exp(-dt / Math.max(1e-4, tau)));
const nowS = () => performance.now() / 1000;
const qs = new URLSearchParams(location.search);
const DEV = !LW.isHost;
const SERIF = 'ui-serif, "New York", "Iowan Old Style", Georgia, serif';
const SANS = '-apple-system, BlinkMacSystemFont, system-ui, sans-serif';
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const toLin = (c) => c.map((v) => Math.pow(clamp(v / 255, 0, 1), 2.2));
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const SIDE = clamp(+(LW.settings.side || 288) | 0, 128, 512);     // 288² = 82,944 grains
const FSIDE = 168;                                                 // 168² = 28,224 iron filings
const CAP = clamp(+(qs.get('cap') || 1100), 512, 2400);            // max internal render px

// =====================================================================
//  Chladni modes (from cymatica/src/sand.js)
// =====================================================================
// Square plate (n, m, ±) ordered around the circle of fifths: harmonically close keys give related figures.
const SQUARE = [
  [1, 2, -1], [1, 3, 1], [2, 3, -1], [1, 4, -1], [2, 5, 1], [3, 4, 1],
  [3, 5, -1], [2, 6, -1], [4, 5, -1], [3, 7, 1], [5, 6, 1], [4, 7, -1],
];
const ROUND = [
  [0, 2], [2, 1], [3, 1], [1, 2], [4, 1], [2, 2],
  [5, 1], [3, 2], [6, 1], [4, 2], [0, 4], [5, 2],
];
function sandMode(pc, tier, round, minor) {
  const i = (pc * 7) % 12;
  if (round) { const [n, m] = ROUND[i]; return [n + tier + (minor && n === 0 ? 1 : 0), m + tier, 1]; }
  const [n, m, s] = SQUARE[i];
  return [n + tier, m + 2 * tier, minor ? -s : s];   // a minor chord takes the mode's ± partner
}

// =====================================================================
//  WebGL2 helpers (from cymatica/src/gl.js)
// =====================================================================
const glCv = document.getElementById('gl');
let gl = null;
try {
  gl = glCv.getContext('webgl2', { antialias: false, alpha: true, premultipliedAlpha: true, depth: false, stencil: false, preserveDrawingBuffer: false });
  if (gl && !gl.getExtension('EXT_color_buffer_float')) { console.warn('cymatics: EXT_color_buffer_float missing'); gl = null; }
} catch (e) { gl = null; }
if (gl) gl.bindVertexArray(gl.createVertexArray());

const FULLSCREEN_VS = `#version 300 es
out vec2 vUv;
void main() {
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;
function makeSetter(info, loc) {
  const arr = info.size > 1;
  switch (info.type) {
    case gl.FLOAT: return arr ? (v) => gl.uniform1fv(loc, v) : (v) => gl.uniform1f(loc, v);
    case gl.FLOAT_VEC2: return (v) => gl.uniform2fv(loc, v);
    case gl.FLOAT_VEC3: return (v) => gl.uniform3fv(loc, v);
    case gl.FLOAT_VEC4: return (v) => gl.uniform4fv(loc, v);
    case gl.UNSIGNED_INT: return (v) => gl.uniform1ui(loc, v);
    case gl.INT: case gl.BOOL: case gl.SAMPLER_2D: return arr ? (v) => gl.uniform1iv(loc, v) : (v) => gl.uniform1i(loc, v);
    default: return () => {};
  }
}
function program(vsSrc, fsSrc) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vsSrc], [gl.FRAGMENT_SHADER, fsSrc]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const setters = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    setters[info.name.replace(/\[0\]$/, '')] = makeSetter(info, gl.getUniformLocation(p, info.name));
  }
  return { use(u = {}) { gl.useProgram(p); for (const k in u) if (setters[k]) setters[k](u[k]); } };
}
function target(w, h, { internal = gl.RGBA16F, type = gl.HALF_FLOAT, filter = gl.LINEAR, data = null } = {}) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, gl.RGBA, type, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fbo, w, h, dispose() { gl.deleteTexture(tex); gl.deleteFramebuffer(fbo); } };
}
function bindTarget(t) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, t ? t.fbo : null);
  gl.viewport(0, 0, t ? t.w : gl.drawingBufferWidth, t ? t.h : gl.drawingBufferHeight);
}
function bindTex(unit, tex) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); }

// =====================================================================
//  Sand simulation + plate (from cymatica/src/sand.js)
// =====================================================================
const FIELD = `
#define PI 3.14159265
uniform vec4 uModes[4];  // n, m, sign, weight
uniform float uRound;
float besselish(float n, float x) {
  float a = cos(x - n * PI * 0.5 - PI * 0.25) * inversesqrt(max(x, 0.35));
  return n < 0.5 ? a : a * (1.0 - exp(-x * x / (1.5 * n + 1.0)));
}
float modeSquare(vec2 p, vec3 nm) {
  vec2 s = p * 0.5 + 0.5;
  return cos(nm.x * PI * s.x) * cos(nm.y * PI * s.y) + nm.z * cos(nm.y * PI * s.x) * cos(nm.x * PI * s.y);
}
float modeRound(vec2 p, vec3 nm) {
  float k = PI * (nm.y + 0.25 + 0.5 * nm.x);
  return 1.6 * besselish(nm.x, k * length(p)) * cos(nm.x * atan(p.y, p.x));
}
float field(vec2 p) {
  float u = 0.0, ws = 1e-4;
  for (int i = 0; i < 4; i++) {
    vec4 M = uModes[i];
    if (M.w < 0.001) continue;
    u += M.w * (uRound > 0.5 ? modeRound(p, M.xyz) : modeSquare(p, M.xyz));
    ws += M.w;
  }
  return u / max(ws, 1.0);
}`;

// Plate outline: a superellipse, n = 2 (disc) … 40 (square, softly rounded corners), so a
// shape change is a morph rather than a cut.
const SHAPE = `
uniform float uN;   // superellipse exponent, computed on the CPU from the shape morph
float plateR(vec2 p) {
  float n = uN;
  vec2 a = abs(p);
  return pow(pow(a.x, n) + pow(a.y, n), 1.0 / n);
}`;

const UPDATE_FS = `#version 300 es
precision highp float;
uniform sampler2D uState;
uniform float uDt, uAgitate, uDrift, uScatter, uFloor;
uniform uint uFrame;
${FIELD}
out vec4 o;
uvec3 pcg3d(uvec3 v) {
  v = v * 1664525u + 1013904223u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  v ^= v >> 16u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  return v;
}
vec3 hash3(uvec3 v) { return vec3(pcg3d(v)) * (1.0 / 4294967295.0); }
void main() {
  ivec2 ij = ivec2(gl_FragCoord.xy);
  vec4 s = texelFetch(uState, ij, 0);
  vec3 r = hash3(uvec3(ij, uFrame));
  vec2 p = s.xy;
  if (uScatter > 0.5) {
    float a = r.x * 6.2831853;
    p = uRound > 0.5 ? vec2(cos(a), sin(a)) * sqrt(r.y) * 0.98 : r.yz * 1.96 - 0.98;
    o = vec4(p, s.z, 1.0);
    return;
  }
  const float e = 0.003;
  float u = field(p);
  vec2 g = vec2(field(p + vec2(e, 0)) - field(p - vec2(e, 0)),
                field(p + vec2(0, e)) - field(p - vec2(0, e))) / (2.0 * e);
  float ang = r.x * 6.2831853;
  // uFloor: grains jostle a little even on a nodal line, so lines have a sandy width
  float hop = (abs(u) + uFloor) * uAgitate * (0.35 + r.y);
  vec2 step = vec2(cos(ang), sin(ang)) * hop - u * g * uDrift;
  p += step * uDt * 60.0;
  if (uRound > 0.5) { float L = length(p); if (L > 0.975) p *= 0.975 / L; }
  else p = clamp(p, -0.975, 0.975);
  o = vec4(p, s.z, mix(s.w, abs(u), 0.12));
}`;

const DRAW_VS = `#version 300 es
precision highp float;
uniform sampler2D uState;
uniform int uSide;
uniform float uSize, uK;
out float vE; out float vR;
void main() {
  vec4 s = texelFetch(uState, ivec2(gl_VertexID % uSide, gl_VertexID / uSide), 0);
  gl_Position = vec4(s.xy * uK, 0.0, 1.0);
  gl_PointSize = uSize;
  vE = s.w; vR = s.z;
}`;
const DRAW_FS = `#version 300 es
precision highp float;
uniform vec3 uHot, uCool;
uniform float uGain;
in float vE; in float vR; out vec4 o;
void main() {
  vec2 d = gl_PointCoord * 2.0 - 1.0;
  float a = max(0.0, 1.0 - dot(d, d));
  float settled = exp(-vE * 5.0);
  vec3 c = mix(uCool, uHot, settled) * mix(0.25, 1.0, settled) * (0.6 + 0.8 * vR);
  o = vec4(c * a * uGain, 1.0);
}`;

// The plate: dark brushed metal lit by a soft overhead box light, a bevel catching the light.
// Static, so it is rendered into a texture only when the palette or shape changes; alpha = coverage.
const PLATE_FS = `#version 300 es
precision highp float;
uniform vec3 uBase, uLight;
uniform float uK, uPx, uBrush;
${SHAPE}
in vec2 vUv; out vec4 o;
float h12(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
void main() {
  vec2 p = (vUv * 2.0 - 1.0) / uK;
  float r = plateR(p);
  if (r > 1.0 + 3.0 * uPx) { o = vec4(0.0); return; }
  float L = 1.0 - 0.5 * smoothstep(0.0, 2.3, length(p - vec2(-0.45, 0.6)));
  float br = h12(vec2(floor((p.y + 1.0) * uBrush), floor(p.x * 2.0 + h12(vec2(floor((p.y + 1.0) * uBrush), 1.0)) * 3.0)));
  vec3 c = uBase * L * (0.93 + 0.14 * br);
  float n = uN;
  vec2 a = abs(p) + 1e-5;
  vec2 nd = normalize(vec2(pow(a.x, n - 1.0) * sign(p.x), pow(a.y, n - 1.0) * sign(p.y)) + 1e-6);
  float d = 1.0 - r;
  float bev = exp(-pow((d - 0.006) / 0.009, 2.0));
  float lit = 0.5 + 0.5 * dot(nd, normalize(vec2(-0.55, 0.8)));
  c += uLight * bev * (0.015 + 0.12 * lit * lit);
  c *= 1.0 - 0.35 * exp(-pow(d / 0.004, 2.0)) * (1.0 - lit);  // the far lip falls into shade
  float m = 1.0 - smoothstep(1.0 - uPx, 1.0 + uPx, r);
  o = vec4(c * m, m);
}`;


// ── Faraday water (from cymatica/src/water.js): N standing plane waves, shaded as the reflection of a
//    ring light; a radial (Bessel-like) mode below threshold; kick ripples from the centre.
const WATER_FS = `#version 300 es
precision highp float;
#define PI 3.14159265
uniform float uTime, uK, uN0, uN1, uMix, uAmp, uPx, uRadial, uKp;
uniform vec4 uRipples[4];
uniform vec3 uHot, uCool, uBase;
in vec2 vUv; out vec4 o;
const float R = 0.93, RING_A = 0.30, RING_B = 0.62;
float waves(vec2 p, float N, out vec2 g) {
  float h = 0.0; g = vec2(0.0);
  for (int i = 0; i < 8; i++) {
    if (float(i) >= N) break;
    float a = PI * float(i) / N;
    vec2 d = vec2(cos(a), sin(a));
    float ph = uK * dot(d, p) + 0.7 * sin(uTime * (0.11 + 0.037 * float(i)) + float(i) * 1.7);
    h += cos(ph); g -= sin(ph) * uK * d;
  }
  return h / sqrt(N);
}
vec3 shade(vec2 p, out float cov) {
  float r = length(p);
  cov = 1.0 - smoothstep(R + 0.012 - uPx, R + 0.012 + uPx, r);
  if (r > R + 0.03) return vec3(0.0);
  vec2 g0, g1;
  float h = mix(waves(p, uN0, g0), waves(p, uN1, g1), uMix);
  vec2 g = mix(g0, g1, uMix) / sqrt(mix(uN0, uN1, uMix));
  float kr = uK * r;
  vec2 gr = -sin(kr) * uK * 1.4 * p / max(r, 1e-4);
  h = mix(h, cos(kr) * 1.4, uRadial); g = mix(g, gr, uRadial);
  float edge = smoothstep(R, R - 0.12, r);
  float amp = uAmp * (0.35 + 0.65 * edge);
  vec2 rd = p / max(r, 1e-4);
  for (int i = 0; i < 4; i++) {
    vec4 rp = uRipples[i];
    if (rp.y <= 0.0) continue;
    float x = r - rp.x * 0.9;
    float env = exp(-x * x * 180.0) * rp.y * exp(-rp.x * 1.6);
    h += 0.3 * env * sin(x * 70.0);
    g += 0.3 * rd * env * (70.0 * cos(x * 70.0) - 360.0 * x * sin(x * 70.0));
  }
  vec3 n = normalize(vec3(-g * amp, 1.0));
  vec3 refl = 2.0 * n * n.z - vec3(0, 0, 1);
  float rr = length(refl.xy), ang = atan(refl.y, refl.x);
  float leds = 0.85 + 0.15 * cos(ang * 36.0);
  float ring = exp(-pow((rr - RING_A) / 0.022, 2.0)) * leds + 0.3 * exp(-pow((rr - RING_B) / 0.035, 2.0));
  float fres = 0.04 + 0.96 * pow(1.0 - n.z, 5.0);
  vec3 c = uBase * (0.2 + 0.1 * h);
  c += uHot * ring * (0.7 + fres * 2.0);
  c += uCool * exp(-rr * 6.0) * 0.05;
  c += uCool * exp(-pow((r - R) / 0.004, 2.0)) * 0.35;      // the dish wall's highlight
  return c;
}
void main() {
  vec2 p = (vUv * 2.0 - 1.0) / uKp * R;
  float a;
  vec3 c = shade(p, a);
  o = vec4(c * a, a);
}`;

// ── Iron filings: frosted paper under raking light + 36,864 oriented filings
const PAPER_FS = `#version 300 es
precision highp float;
uniform vec3 uPaper, uLight;
uniform vec2 uLd;            // raking light direction (from the light, in plate space)
uniform float uK, uPx, uN;
in vec2 vUv; out vec4 o;
float h12(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vn(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(h12(i), h12(i + vec2(1, 0)), f.x), mix(h12(i + vec2(0, 1)), h12(i + vec2(1, 1)), f.x), f.y); }
void main() {
  vec2 p = (vUv * 2.0 - 1.0) / uK;
  vec2 a = abs(p);
  float r = pow(pow(a.x, uN) + pow(a.y, uN), 1.0 / uN);
  if (r > 1.0 + 3.0 * uPx) { o = vec4(0.0); return; }
  // raking light: bright on the side it comes from, falling off across the sheet
  float rake = 0.55 + 0.45 * smoothstep(1.4, -1.2, dot(p, -uLd));
  // frosted paper: soft cloudy formation + fine tooth, lit at a grazing angle (tooth shows as relief)
  float form = vn(p * 7.0) * 0.6 + vn(p * 19.0) * 0.4;
  float tooth = vn(p * 210.0) - vn(p * 210.0 + uLd * 0.9);
  vec3 c = uPaper * rake * (0.9 + 0.12 * form + 0.18 * tooth);
  c += uLight * 0.03 * rake;
  float m = 1.0 - smoothstep(1.0 - uPx, 1.0 + uPx, r);
  // the sheet's lit edge and its shadowed far edge
  c *= 1.0 - 0.3 * smoothstep(0.985, 1.0, r) * step(0.0, dot(p, uLd));
  o = vec4(c * m, m);
}`;
const FIL_UPDATE_FS = `#version 300 es
precision highp float;
uniform sampler2D uState;
uniform vec4 uPoles[6];       // x, y, q (±strength), -
uniform float uDt, uTap, uAlign, uLines, uScatter;
uniform uint uFrame;
out vec4 o;
uvec3 pcg3d(uvec3 v) { v = v * 1664525u + 1013904223u; v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y; v ^= v >> 16u; v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y; return v; }
vec3 hash3(uvec3 v) { return vec3(pcg3d(v)) * (1.0 / 4294967295.0); }
// 2D field of the poles (line-charge model) and its stream function ψ (field lines = contours of ψ)
void field(vec2 p, out vec2 B, out vec2 gpsi, out float B2) {
  B = vec2(0.0); gpsi = vec2(0.0);
  for (int i = 0; i < 6; i++) {
    vec4 P = uPoles[i];
    if (abs(P.z) < 1e-3) continue;
    vec2 d = p - P.xy;
    float r2 = dot(d, d) + 0.0045;
    B += P.z * d / r2;
    gpsi += P.z * vec2(-d.y, d.x) / r2;
  }
  B2 = dot(B, B);
}
float psi(vec2 p) {
  float s = 0.0;
  for (int i = 0; i < 6; i++) { vec4 P = uPoles[i]; if (abs(P.z) < 1e-3) continue; vec2 d = p - P.xy; s += P.z * atan(d.y, d.x); }
  return s;
}
void main() {
  ivec2 ij = ivec2(gl_FragCoord.xy);
  vec4 s = texelFetch(uState, ij, 0);
  vec3 r = hash3(uvec3(ij, uFrame));
  vec2 p = s.xy;

  else if (WAT.above && (e < 0.2 || !playing)) WAT.above = false;
  const n = waterSymmetry(S.pc, S.minor);
  if (n !== WAT.n1) { WAT.n0 = WAT.mix > 0.5 ? WAT.n1 : WAT.n0; WAT.n1 = n; WAT.mix = 0; }
  const morph = lerp(playing ? 0.8 : 1.4, 2.4, cl);
  WAT.mix = Math.min(1, WAT.mix + dt / (morph * 2.5));
  const restRing = !WAT.above || cl > 0.5;
  const kMul = restRing ? (playing ? 1 : 0.3 + 0.7 * (cl > 0.5 ? calm.br.level : 0.35 + 0.15 * Math.sin(T * 0.2))) : 1;
  const kT = (18 + S.tier * 9) * kMul;
  WAT.k += (kT - WAT.k) * (1 - Math.exp(-dt / Math.min(1.5, morph * 1.5)));
  WAT.radial += ((restRing ? 1 : 0) - WAT.radial) * (1 - Math.exp(-dt / morph));
  const ampT = lerp(0.006 + 0.026 * e + 0.006 * S.pulse, 0.004 + 0.01 * calm.br.level, cl);
  WAT.amp = approach(WAT.amp, ampT, 0.25, dt);
  WAT.ripples.forEach((r) => { r.age += dt; });
  WAT.ripples = WAT.ripples.filter((r) => r.age < 2.5);
  WAT.buf.fill(0);
  WAT.ripples.forEach((r, i) => WAT.buf.set([r.age, r.str, 0, 0], i * 4));
  const m = WAT.mix * WAT.mix * (3 - 2 * WAT.mix);
  bindTarget(tgt); gl.disable(gl.BLEND);
  const hot = mix3(V.hot, V.light, 0.3).map((v) => v * 1.25);
  GPU.water.use({
    uTime: T, uK: WAT.k, uN0: WAT.n0, uN1: WAT.n1, uMix: m, uAmp: WAT.amp, uPx: 2 / (GPU.size * K), uRadial: WAT.radial, uKp: K,
    uRipples: WAT.buf, uHot: hot, uCool: V.cool.map((v) => v * 1.6), uBase: V.plate.map((v) => v * 1.4 + 0.004),
  });
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function drawFilings(tgt, dt, T, d) {
  const cl = calm.lv;
  // poles: motor-limited glide toward the harmony's layout
  const key = S.pc + '|' + S.minor + '|' + S.tier + '|' + MX.keyPos;
  if (key !== FIL.key) { FIL.key = key; filPoles(); FIL.tap = Math.max(FIL.tap, 0.5); }
  FIL.poles.forEach((P, i) => {
    // motor-limited glide along the ring (shortest way round)
    let da = ((P.ta - P.a) % TAU + TAU * 1.5) % TAU - Math.PI;
    P.a += clamp(da * 1.2, -0.7, 0.7) * dt;
    P.r = approach(P.r, P.tr, 1.5, dt); P.q = approach(P.q, P.tq, 1.2, dt);
    FIL.buf.set([Math.cos(P.a) * P.r, Math.sin(P.a) * P.r, P.q, 0], i * 4);
  });
  // taps: kicks (+ the breath lifts them a little in calm); a slow idle tap now and then
  const breath = cl > 0.01 ? calm.br.level : 0;
  FIL.tap *= Math.exp(-dt / 0.35);
  if (d.auto && Math.random() < dt / 9) FIL.tap = Math.max(FIL.tap, 0.35);
  const tap = lerp(FIL.tap + 0.004, 0.02 + 0.06 * breath, cl);
  // raking light: its direction follows the time of day, very slowly
  const h = LW.env.hour || 12;
  FIL.lightA = approach(FIL.lightA, -2.4 + (h / 24) * Math.PI * 1.2, 20, dt);
  const ld = [Math.cos(FIL.lightA), Math.sin(FIL.lightA)];
  // sim
  const n = 1, sdt = dt;   // one step per frame (the shader caps the step for long frames)
  gl.disable(gl.BLEND);
  for (let i = 0; i < n; i++) {
    const src = GPU.fstate[GPU.fcur], dst = GPU.fstate[1 - GPU.fcur];
    bindTarget(dst); bindTex(0, src.tex);
    GPU.filUpdate.use({ uState: 0, uDt: sdt, uTap: tap, uAlign: 0.004, uLines: 16, uPoles: FIL.buf, uScatter: 0, uFrame: GPU.frame++ });
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    GPU.fcur = 1 - GPU.fcur;
  }
  // paper (re-rendered only when its look changes)
  const px = GPU.size, platePx = px * K;
  const paper = toLin(mix3([200, 194, 182], V.bgPool.map((v) => v * 4), 0.15)).map((v) => v * 0.3 * (0.7 + 0.3 * V.light[1]));
  const pk = paper.concat(ld).map((v) => Math.round(v * 400)).join(',');
  if (pk !== GPU.paperKey) {
    GPU.paperKey = pk;
    bindTarget(GPU.paperT);
    GPU.paper.use({ uPaper: paper, uLight: V.light, uLd: ld, uK: K, uPx: 1.5 / platePx * 2, uN: 26 });
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  bindTarget(tgt); bindTex(0, GPU.paperT.tex);
  GPU.blit.use({ uSrc: 0 });
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.BLEND); gl.blendFuncSeparate(gl.ONE, gl.ONE_MINUS_SRC_ALPHA, gl.ZERO, gl.ONE);
  bindTex(0, GPU.fstate[GPU.fcur].tex);
  const len = Math.max(5, platePx * 0.0085);
  GPU.filDraw.use({
    uState: 0, uSide: FSIDE, uSize: len * 1.3, uK: K, uLd: [ld[0], ld[1]], uLift: 0.05 + 0.25 * breath * cl + 0.1 * Math.min(1, FIL.tap),
    uLen: 0.5, uSteel: [0.012, 0.012, 0.013], uGlint: V.light.map((v) => v * 0.28),
  });
  gl.drawArrays(gl.POINTS, 0, FSIDE * FSIDE);
  gl.disable(gl.BLEND);
}

function drawSkin(name, tgt, dt, T, d) {
  if (name === 'faraday') drawWater(tgt, dt, T, d);
  else if (name === 'filings') drawFilings(tgt, dt, T, d);
  else drawSand(tgt, dt, d);
}
function render(dt, T, d) {
  updateSkin(dt);
  drawSkin(SK.cur, GPU.scene, dt, T, d);
  let src = GPU.scene;
  if (SK.x < 1 && SK.prev) {
    drawSkin(SK.prev, GPU.scene2, dt, T, d);
    bindTarget(GPU.mixT); gl.disable(gl.BLEND);
    bindTex(0, GPU.scene.tex); bindTex(1, GPU.scene2.tex);
    const e = SK.x * SK.x * (3 - 2 * SK.x);
    GPU.mix.use({ uA: 0, uB: 1, uX: e });
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    src = GPU.mixT;
  }
  // the backdrop's contact shadow follows the shown plate's shape
  const shownRound = (SK.x > 0.5 ? SK.cur : SK.prev || SK.cur) === 'sand' ? V.shapeShown < 0.5 : (SK.x > 0.5 ? SK.cur : SK.prev) === 'faraday';
  if (shownRound !== bg.round) { bg.round = shownRound; bg.dirty = true; }
  // bloom
  const scene = src;
  if (DBG.bloom) GPU.mips.forEach((m, i) => {
    bindTarget(m); bindTex(0, src.tex);
    GPU.down.use({ uSrc: 0, uTexel: [1 / src.w, 1 / src.h], uThreshold: 0.7, uPrefilter: i === 0 ? 1 : 0, uSpread: i === 0 ? 1 : 0.5 });
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    src = m;
  });
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  for (let i = DBG.bloom ? GPU.mips.length - 1 : 0; i > 0; i--) {
    const from = GPU.mips[i], to = GPU.mips[i - 1];
    bindTarget(to); bindTex(0, from.tex);
    GPU.up.use({ uSrc: 0, uTexel: [1 / from.w, 1 / from.h] });
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  gl.disable(gl.BLEND);
  bindTarget(null);
  bindTex(0, scene.tex); bindTex(1, GPU.mips[0].tex);
  const filingsW = SK.cur === 'filings' ? SK.x : SK.prev === 'filings' ? 1 - SK.x : 0;
  GPU.comp.use({ uScene: 0, uBloom: 1, uBloomAmt: lerp(0.75, 0.25, filingsW) / GPU.mips.length, uExposure: V.expo, uGlow: 0.9 });
  if (DBG.comp) gl.drawArrays(gl.TRIANGLES, 0, 3);
}

const PERF = { bake: 0, bakes: 0, render: 0, cap: 0 };
// real clock for perf counters (performance.now is virtualised under ?virtual=1)
const rnow = LW.virtual ? () => new Event('x').timeStamp : () => performance.now();
let tPrev = nowS(), perfAcc = 0, perfN = 0, perfMs = 0, bgOpacity = -1;
function frame() {
  requestAnimationFrame(frame);
  const T = nowS(), dt = Math.min(0.1, Math.max(0, T - tPrev));
  tPrev = T;
  const t0 = performance.now();
  tick(dt, T);
  if (!LW.virtual) { perfAcc += performance.now() - t0; if (++perfN >= 60) { perfMs = perfAcc / perfN; perfAcc = 0; perfN = 0; } }
}
function tick(dt, T) {
  if (calm.on) { calm.t += dt; if (calm.auto && calm.t > calm.auto) setCalm(false); }
  calm.lv = approach(calm.lv, calm.on ? 1 : 0, calm.on ? 1.2 : 1.6, dt);
  // lw.js's guide clock while its label is up (it starts on the load event, which can trail this script by
  // seconds while art loads); our own clock only for scene-started calm (breathe reminder), which has no label
  calm.br = calm.lv > 0.01 ? LW.breathState(LW.breathTime() > 0 ? LW.breathTime() : nowS() - BR.t0) : { level: 0 };
  MX.update(dt);
  const d = direct(dt, T);
  updatePalette(dt);
  if (bg.dirty && T - bg.at > 0.5) { bg.dirty = false; bg.at = T; const b0 = rnow(); bakeBg(); PERF.bake = rnow() - b0; PERF.bakes++; }
  const op = Math.round(V.bgA * 200) / 200;
  if (op !== bgOpacity) { bgOpacity = op; bgCv.style.opacity = op; }
  const r0 = rnow();
  if (gl) render(dt, T, d);
  const c0 = rnow();
  drawCaption(dt);
  PERF.render = c0 - r0; PERF.cap = rnow() - c0;
}

// =====================================================================
//  Wiring
// =====================================================================
function inPlate(x, y) {
  const dx = (x - L.cx) / (L.P / 2), dy = (y - L.cy) / (L.P / 2);
  return sand.round ? dx * dx + dy * dy < 1 : Math.abs(dx) < 1 && Math.abs(dy) < 1;
}
LW.on('down', (x, y) => {
  if (inPlate(x, y)) { S.burst = Math.max(S.burst, 0.8); media('playpause'); }
  else if (x >= cap.x && x <= cap.x + cap.w * 0.62 && y >= cap.y && y <= cap.y + cap.h && music.np) media('next');
});
LW.on('nowplaying', onNowPlaying);
LW.on('env', () => { bg.dirty = true; });
LW.on('settings', () => { cap.dirty = true; });
LW.on('reminder', (r) => {
  if (!r) return;
  if (r.kind === 'water') showTag('water', r.text || 'a sip of water?');
  else if (r.kind === 'stretch') showTag('stretch', r.text || 'roll your shoulders, unclench your jaw');
  else if (r.kind === 'breathe') setCalm(true, 60);
});
LW.on('calm', (on) => setCalm(!!on));
LW.on('action', (a) => {
  if (a === 'water') showTag('water', 'a sip of water?');
  else if (a === 'stretch') showTag('stretch', 'roll your shoulders, unclench your jaw');
  else if (a === 'calm' || a === 'breathe') setCalm(!calm.on, a === 'breathe' ? 60 : 0);
  else if (a === 'playpause' || a === 'next' || a === 'previous') media(a);
});
if (DEV) addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey) return;
  if (e.key === 'p') media('playpause');
  if (e.key === '.') media('next');
  if (e.key === 'k') S.pulse = 1;
  if (e.key === 's') showTag('stretch', 'roll your shoulders, unclench your jaw');
  if (e.key === 'v') LW.set('skin', SKINS[(SKINS.indexOf(skinWanted()) + 1) % SKINS.length]);
  if (e.key === 'o') { const order = ['auto', 'square', 'round']; LW.set('plate', order[(order.indexOf(plateSetting()) + 1) % 3]); }
});
addEventListener('resize', layout);

if (gl) { try { initGL(); } catch (e) { console.error('cymatics GL init failed', e); gl = null; } }
layout();
if (LW.nowPlaying) onNowPlaying(LW.nowPlaying);
if (LW.calm) setCalm(true);
requestAnimationFrame(frame);

// Debug / perf: average wall-clock ms per frame for n frames, forcing a GPU sync each frame.
window.__cym = {
  S, V, L, music, calm, sand, DBG, PERF, get perfMs() { return perfMs; }, SIDE, CAP,
  bench(n = 120) {
    // performance.now is virtualised under ?virtual=1; an Event's timeStamp is the real clock.
    const realNow = () => new Event('x').timeStamp;
    const px = new Uint8Array(4), t0 = realNow();
    let T = nowS();
    for (let i = 0; i < n; i++) { T += 1 / 30; tick(1 / 30, T); if (gl) gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); }
    const total = (realNow() - t0) / n;
    const t1 = realNow();
    for (let i = 0; i < n; i++) { T += 1 / 30; tick(1 / 30, T); }
    if (gl) gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    const js = (realNow() - t1) / n;
    return { msPerFrameSynced: +total.toFixed(2), msPerFrameJSPipelined: +js.toFixed(2), grains: SIDE * SIDE, renderPx: GPU.size, dpr: L.dpr, view: [L.W, L.H] };
  },
  // True GPU time per frame (EXT_disjoint_timer_query_webgl2), averaged over n frames.
  async gpuTime(n = 60) {
    const ext = gl && gl.getExtension('EXT_disjoint_timer_query_webgl2');
    if (!ext) return null;
    const qsA = []; let T = nowS();
    for (let i = 0; i < n; i++) {
      const q = gl.createQuery(); gl.beginQuery(ext.TIME_ELAPSED_EXT, q);
      T += 1 / 30; tick(1 / 30, T);
      gl.endQuery(ext.TIME_ELAPSED_EXT); qsA.push(q);
      if (i % 10 === 9) await new Promise((r) => setTimeout(r, 16));
    }
    const last = qsA[qsA.length - 1];
    for (let k = 0; k < 100 && !gl.getQueryParameter(last, gl.QUERY_RESULT_AVAILABLE); k++) await new Promise((r) => setTimeout(r, 20));
    const ms = qsA.map((q) => gl.getQueryParameter(q, gl.QUERY_RESULT) / 1e6).sort((x, y) => x - y);
    qsA.forEach((q) => gl.deleteQuery(q));
    return { medianGpuMs: +ms[ms.length >> 1].toFixed(2), p90GpuMs: +ms[Math.floor(ms.length * 0.9)].toFixed(2), renderPx: GPU.size };
  },
};
</script>
