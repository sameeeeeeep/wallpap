<script>
'use strict';
(() => {
// =====================================================================
//  Corner Café — a slow, cozy corner café (day and night) as a live wallpaper.
//  World units: the scene is 1000 units tall; width follows the aspect.
//  The room is painted once per light/weather change as an albedo layer,
//  lit by a soft light map (multiply) and cached; the street outside the
//  window is cached separately. Each frame draws those two images plus a
//  handful of animated things: pets, record, tonearm, steam, rain, cars.
//
//  ART SLOTS (all optional — anything missing falls back to the procedural
//  painting). Bundled art in scenes/art/cafe/:
//    bg-night.webp   the whole room at night, 16:10, 3200×2000 px (min 1600×1000)
//    bg-day.webp     same framing in daylight (crossfades with bg-night by time of day)
//                   → The window glass must be TRANSPARENT (alpha 0) so the live street,
//                     rain, cars and lightning show through. When a bg is present the
//                     scene uses a fixed 1600×1000 world, "cover"-fitted to the screen,
//                     and props sit at the LAYOUT_1600 positions below. Paint the room
//                     WITHOUT the record console / jukebox: they're mode-dependent and
//                     are drawn over the painting.
//    bg-overcast.webp  the day room under cloud / rain (no sun patches), blended over bg-day by cloud
//    bg-{night,day,overcast}-jukebox.webp  the same room without the record console (jukebox skin)
//    street-night.png / street-night-dry.png / street-day.webp  1024² painted views through the
//                   window (wet / dry night, day); the night sky above the roofs is cut out at load and
//                   replaced by the live sky + the shared moon (moon.js); weather grades the plate
//    car-1..3.webp   passing cars, side view facing right (lit per bake, headlights at night)
//    turntable.webp  the record player (plinth + platter + arm pillar; record, tonearm, lamp are live)
//    jukebox.png    the Pro skin (tubes painted unlit; a mask of them is lit live), crate.webp beside it
//    bowls.webp      the pets' bowls by the door
//  LAYOUT: LW.layout side 'left' → the whole café is drawn mirrored (MIR, see upright());
//    pets only rest inside LW.layout.clear and outside its avoid boxes; re-laid out on 'layout'.
//  PETS on/off (LW.settings.pets): they walk out past the right edge and stay away; back in from there.
//  PETS come from the shared illustrated sprites (all face RIGHT, flipped for left):
//    art/sprites/cats/grey/   walk1 walk2 sit sleep        (the cat)
//    art/sprites/dogs/golden/ walk1 walk2 sit lie belly-up (the pup, red collar + tag)
//    Each pet re-tints its OWN canvases to the room light (only when that light changes);
//    blinks / happy squints slide the fur above each eye down over it; the pup's tail is
//    cut out along a polygon and swung for wags. Until they load (or ?noart=1) the
//    original procedural pets are drawn instead.
//  ROAMING: each pet has spots and a loose schedule — the cat: window seat (nap, watch the
//    rain, the pillows), beside the record player / on top of the jukebox, next to the
//    dog, a wander on the floor; the dog: the rug, the bed in the nook under the window
//    seat, by the player (when music plays), a short wait at the door, following the cat,
//    in front of the window. They walk (2-frame gait, gentle depth arcs) and hop between
//    surfaces; never teleport. Music on → the dog heads for the player, the cat often too.
//  RIGHT SIDE CLEAR: everything that wants attention sits in the left ~70%; the right
//    ~28% (x > 0.72·W) is a calm door, floor lamp and plant only.
//  PLAYER: LW.settings.player = 'record' (default) | 'jukebox'; click it = play/pause,
//    the record crate/shelf = next; switching crossfades; dev key 'j' toggles.
//  LAYOUT_1600 (world units, 1600×1000, i.e. the bg-*.webp at 1×):
//    window glass x 64–618, y 92–596 · seat x 30–652, cushion top y≈612, cat home (374, 628)
//    nook (dog bed) centre x 230, 222 wide, y 672–772 · mug (552, 626)
//    record console x 698–1120, top y 604 · platter centre (822, 543) r 84
//    sleeve on its ledge x 790–950, y 330–490 · chalkboard x 705–1035, y 110–301
//    jukebox (other mode) centre x 870, base y 798, 222 wide, 344 tall
//    pendant A (341, 252) · Edison bulb B (673, 340) · rug centre (688, 872) · counter top y 946
//    right side: door x 1186–1322 (top y 300) · floor lamp (1396, shade bottom 460) · plant x 1519
//    latte (208, 958) · candle (358, 958)
//    (?noart=1 skips loading the art folders.)
//  BEAT SYNC: LW.music.level makes the lamps, sleeve spotlight, jukebox tubes and album tint
//  breathe; LW 'beat' events make the pets nod (and now and then squint happily), the
//  pup's tail thump, the fairy lights/dust motes sparkle, and notes drift up on strong beats.
// =====================================================================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgba = (c, a = 1) => `rgba(${clamp(c[0] | 0, 0, 255)},${clamp(c[1] | 0, 0, 255)},${clamp(c[2] | 0, 0, 255)},${a})`;
const mul = (c, m) => [c[0] * m[0], c[1] * m[1], c[2] * m[2]];
const lum = (c) => (c[0] + c[1] + c[2]) / 3;
const approach = (v, t, rate, dt) => v + (t - v) * (1 - Math.exp(-rate * dt));
function mulberry(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const nowS = () => performance.now() / 1000;
const timers = [];
const later = (sec, fn) => timers.push({ at: nowS() + sec, fn });
function runTimers() { const T = nowS(); for (let i = timers.length - 1; i >= 0; i--) if (timers[i].at <= T) { const f = timers[i].fn; timers.splice(i, 1); try { f(); } catch (e) { console.error(e); } } }
const SANS = '-apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif';
const SERIF = '"Hoefler Text", "Baskerville", "Iowan Old Style", Georgia, serif';
const CHALK = '"Chalkduster", "Chalkboard SE", "Marker Felt", cursive';
const CHALK2 = '"Chalkboard SE", "Chalkduster", "Marker Felt", cursive';
function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
function ellGrad(g, x, y, rx, ry, col, a, stops = 6) {
  // soft gaussian-ish blob (matches lightAt falloff)
  g.save(); g.translate(x, y); g.scale(rx, ry);
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, 1);
  for (let i = 0; i <= stops; i++) { const t = i / stops; gr.addColorStop(t, rgba(col, a * Math.exp(-2.6 * t * t) * (1 - t * t * t))); }
  g.fillStyle = gr; g.fillRect(-1, -1, 2, 2); g.restore();
}
function sprite(size, stops) {
  const c = newCanvas(size, size), g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
}
const GLOW_WARM = sprite(128, [[0, 'rgba(255,214,150,1)'], [0.18, 'rgba(255,190,110,0.5)'], [0.5, 'rgba(255,160,80,0.12)'], [1, 'rgba(255,140,60,0)']]);
const GLOW_WHITE = sprite(128, [[0, 'rgba(255,255,255,1)'], [0.2, 'rgba(255,255,255,0.45)'], [0.55, 'rgba(255,255,255,0.1)'], [1, 'rgba(255,255,255,0)']]);
const BLOB = sprite(64, [[0, 'rgba(255,255,255,0.9)'], [0.45, 'rgba(255,255,255,0.45)'], [1, 'rgba(255,255,255,0)']]);
const DARK = sprite(64, [[0, 'rgba(8,5,8,0.85)'], [0.5, 'rgba(8,5,8,0.45)'], [1, 'rgba(8,5,8,0)']]);
const GLOW_PINK = sprite(96, [[0, 'rgba(255,120,170,0.9)'], [0.35, 'rgba(255,90,150,0.3)'], [1, 'rgba(255,80,140,0)']]);
let GA = 1;   // global alpha multiplier for layers that crossfade (record player ↔ jukebox)
function drawSprite(g, sp, x, y, r, a, op = 'lighter') {
  if (a <= 0.003) return;
  g.globalCompositeOperation = op; g.globalAlpha = Math.min(1, a) * GA;
  g.drawImage(sp, x - r, y - r, r * 2, r * 2);
  g.globalAlpha = GA; g.globalCompositeOperation = 'source-over';
}

// =====================================================================
//  environment: time of day + weather (glides; never pops)
// =====================================================================
const KF = [
  { h: 0, top: '#070b1c', bot: '#1a2240', day: 0, lamp: 1, city: 1, warm: 0 },
  { h: 5.0, top: '#070b1c', bot: '#1a2240', day: 0, lamp: 1, city: 1, warm: 0 },
  { h: 6.3, top: '#2b3462', bot: '#dc9c88', day: 0.32, lamp: 0.75, city: 0.55, warm: 0.8 },
  { h: 7.6, top: '#7aa1cf', bot: '#efe0cc', day: 0.8, lamp: 0.12, city: 0.08, warm: 0.3 },
  { h: 9, top: '#6a9bd2', bot: '#dbe8f0', day: 1, lamp: 0, city: 0, warm: 0 },
  { h: 16.3, top: '#6696cf', bot: '#efdcc0', day: 0.95, lamp: 0.05, city: 0, warm: 0.2 },
  { h: 18.3, top: '#45507f', bot: '#ef9a62', day: 0.55, lamp: 0.72, city: 0.45, warm: 1 },
  { h: 19.6, top: '#1a2046', bot: '#6c4f72', day: 0.15, lamp: 1, city: 0.9, warm: 0.3 },
  { h: 21, top: '#070b1c', bot: '#1a2240', day: 0, lamp: 1, city: 1, warm: 0 },
  { h: 24, top: '#070b1c', bot: '#1a2240', day: 0, lamp: 1, city: 1, warm: 0 },
];
KF.forEach((k) => { k.topC = hex(k.top); k.botC = hex(k.bot); });
const WX = {
  cloudy: { d: ['#99a2b1', '#c8ccd2'], n: ['#141824', '#262a38'], amt: 0.6, day: 0.85, lamp: 0.3 },
  rain: { d: ['#6c7684', '#959daa'], n: ['#0b0e17', '#1a1f2c'], amt: 0.85, day: 0.6, lamp: 0.78 },
  storm: { d: ['#4b5262', '#6d7483'], n: ['#06080e', '#131723'], amt: 0.95, day: 0.45, lamp: 0.9 },
  snow: { d: ['#b8becb', '#dde1e8'], n: ['#1a1d2b', '#30344a'], amt: 0.75, day: 0.85, lamp: 0.5 },
  fog: { d: ['#b3b6bc', '#d2d4d7'], n: ['#1d2029', '#373a46'], amt: 0.85, day: 0.75, lamp: 0.58 },
};
let E = null, Et = null;
function computeTarget() {
  const env = LW.env || {};
  const hr = (((+env.hour || 0) % 24) + 24) % 24;
  let a = KF[0], b = KF[1];
  for (let i = 0; i < KF.length - 1; i++) if (hr >= KF[i].h && hr <= KF[i + 1].h) { a = KF[i]; b = KF[i + 1]; break; }
  const t = smooth((hr - a.h) / Math.max(0.001, b.h - a.h));
  const n = (k) => lerp(a[k], b[k], t);
  let top = mix3(a.topC, b.topC, t), bot = mix3(a.botC, b.botC, t);
  let day = n('day'), lamp = n('lamp'), city = n('city'), warm = n('warm');
  const w = env.weather || 'clear';
  const it = clamp(env.intensity == null ? 0.7 : +env.intensity, 0, 1);
  let rain = 0, storm = 0, snow = 0, fog = 0, cloud = 0.15, moon = (1 - day) * (hr > 19 || hr < 6 ? 1 : 0);
  const X = WX[w];
  if (X) {
    const f = X.amt * (0.6 + 0.4 * it);
    top = mix3(top, mix3(hex(X.n[0]), hex(X.d[0]), day), f);
    bot = mix3(bot, mix3(hex(X.n[1]), hex(X.d[1]), day), f);
    day *= lerp(1, X.day, 0.6 + 0.4 * it);
    lamp = Math.max(lamp, X.lamp * (0.7 + 0.3 * it));
    warm *= 0.3; moon *= w === 'cloudy' ? 0.25 : 0; cloud = w === 'cloudy' ? 0.8 : 1;
    if (w === 'rain') rain = 0.45 + 0.55 * it;
    if (w === 'storm') { rain = 0.75 + 0.25 * it; storm = 1; }
    if (w === 'snow') snow = 0.4 + 0.6 * it;
    if (w === 'fog') fog = 0.55 + 0.45 * it;
  }
  const litFrac = hr >= 18 || hr < 0.5 ? 0.45 : hr < 1.5 ? 0.4 : hr < 5 ? 0.16 : hr < 7.5 ? 0.35 : 0.04;
  moon *= LW.moonVisibility();
  Et = { hour: hr, weather: w, it, top, bot, day, lamp, city, warm, rain, storm, snow, fog, cloud, moon, litFrac };
  if (!E) { E = JSON.parse(JSON.stringify(Et)); E.wet = rain > 0 ? 1 : 0; E.snowCover = snow > 0 ? 1 : 0; E.wetGlass = E.wet; }
}
const ENV_KEYS = ['day', 'lamp', 'city', 'warm', 'rain', 'storm', 'snow', 'fog', 'cloud', 'moon', 'litFrac', 'it'];
let lastBake = -99, bakedSnap = null, fade = 1;
function envAmb() {
  const night = [0.19, 0.17, 0.22], dayA = mix3([0.84, 0.82, 0.8], [0.8, 0.84, 0.9], E.cloud * 0.6);
  const a = mix3(night, dayA, E.day);
  // warm sunrise / sunset light inside
  return mix3(a, mul(a, [1.12, 0.96, 0.82]), E.warm * E.day);
}
function updateEnv(dt) {
  const k = LW.envBlend(dt, 9);
  for (const key of ENV_KEYS) E[key] += (Et[key] - E[key]) * k;
  for (const key of ['top', 'bot']) for (let i = 0; i < 3; i++) E[key][i] += (Et[key][i] - E[key][i]) * k;
  E.hour = Et.hour; E.weather = Et.weather;
  E.wet = clamp(E.wet + (E.rain > 0.15 ? dt * E.rain / 30 : -dt / 420), 0, 1);
  E.wetGlass = clamp(E.wetGlass + (E.rain > 0.15 ? dt * E.rain / 20 : -dt / 240), 0, 1);
  E.snowCover = clamp(E.snowCover + (E.snow > 0.15 ? dt * E.snow / 50 : -dt / 600), 0, 1);
  E.amb = envAmb();
  fade = Math.min(1, fade + dt / 1.6);
  const snap = envSnap();
  const diff = bakedSnap ? Math.max(...snap.map((v, i) => Math.abs(v - bakedSnap[i]))) : 1;
  if (diff > 0.03 && nowS() - lastBake > 2.5 && fade >= 1) bake(true);
}
const envSnap = () => [...ENV_KEYS.map((q) => E[q] * (q === 'litFrac' ? 0.5 : 1)), E.wet * 0.5, E.snowCover * 0.5, ...E.top.map((v) => v / 255), ...E.bot.map((v) => v / 255)];

// =====================================================================
//  layout
// =====================================================================
let dpr = 1, cssW = 1, cssH = 1, U = 1, W = 1600, H = 1000, OX = 0, OY = 0;
let L = null;
// DESKTOP LAYOUT (LW.layout): with the user's widgets on the LEFT the whole café is drawn
// mirrored (MIR), so the window seat, player and pets' spots land in the free band and the calm
// door / lamp / plant corner sits under the widgets. Things that must not read backwards (text,
// artwork, the turntable's right-hand tonearm, the street through the glass) are drawn upright().
let MIR = false;
const VT = (g) => (MIR ? g.setTransform(-U, 0, 0, U, cv.width - OX, OY) : g.setTransform(U, 0, 0, U, OX, OY));
// world x → device px, and css px → world
const devX = (x) => (MIR ? cv.width - OX - x * U : OX + x * U);
const toWX = (x) => ((MIR ? cv.width - x * dpr : x * dpr) - OX) / U, toWY = (y) => (y * dpr - OY) / U;
// draw something un-mirrored about the vertical line x = cx (no-op when not mirrored)
function upright(g, cx, fn) { if (!MIR) return fn(); g.save(); g.translate(cx, 0); g.scale(-1, 1); g.translate(-cx, 0); try { fn(); } finally { g.restore(); } }
// the free band of the desktop (LW.layout.clear, display fractions) in world x
function clearW() {
  const c = (LW.layout && LW.layout.clear) || [0, 0.72], a = toWX(c[0] * cssW), b = toWX(c[1] * cssW);
  return [Math.min(a, b), Math.max(a, b)];
}
// is a world point inside one of the host's avoid boxes (widgets / icons)?
function inAvoid(x, y) {
  const A = (LW.layout && LW.layout.avoid) || [];
  if (!A.length) return false;
  const px = devX(x) / cv.width, py = (OY + y * U) / cv.height;
  return A.some(([ax, ay, aw, ah]) => px > ax && px < ax + aw && py > ay && py < ay + ah);
}
// ---- optional painted art (see ART SLOTS above) ----
const ART = { bg: {}, bgJ: {}, street: {}, car: {}, obj: {} };
const NOART = new URLSearchParams(location.search).get('noart') === '1';
function loadSlot(group, key, file) {
  if (NOART) return;
  const img = new Image();
  img.onload = () => { if (!img.naturalWidth) return; ART[group][key] = img; clearTimeout(rsT); rsT = setTimeout(rebuild, 30); };
  img.onerror = () => {};
  img.src = 'art/cafe/' + file;
}
loadSlot('bg', 'night', 'bg-night.webp'); loadSlot('bg', 'day', 'bg-day.webp'); loadSlot('bg', 'over', 'bg-overcast.webp');
// the street through the window: night (wet / dry) and day, crossfaded by daylight and wetness
loadSlot('street', 'night', 'street-night.png'); loadSlot('street', 'dry', 'street-night-dry.png'); loadSlot('street', 'day', 'street-day.webp');
for (const i of [1, 2, 3]) loadSlot('car', i, 'car-' + i + '.webp');
loadSlot('obj', 'tt', 'turntable.webp'); loadSlot('obj', 'crate', 'crate.webp'); loadSlot('obj', 'bowls', 'bowls.webp');
// the jukebox skin (and the room without the record console behind it) only load once it's chosen
let jukeArt = false;
function loadJukeArt() {
  if (jukeArt) return; jukeArt = true;
  loadSlot('obj', 'juke', 'jukebox.png'); loadSlot('bgJ', 'night', 'bg-night-jukebox.webp'); loadSlot('bgJ', 'day', 'bg-day-jukebox.webp'); loadSlot('bgJ', 'over', 'bg-overcast-jukebox.webp');
}
const hasBg = () => !!(ART.bg.night || ART.bg.day);   // (bg-overcast.webp only ever blends over bg-day)
const streetArt = () => !!(ART.street.night || ART.street.dry || ART.street.day);
const jukeSprite = () => (L && L.mode === 'jukebox' && ART.obj.juke) || null;
function computeLayout() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cssW = Math.max(1, innerWidth); cssH = Math.max(1, innerHeight);
  MIR = !!(LW.layout && LW.layout.side === 'left');
  const maxPx = 9.5e6;
  if (cssW * cssH * dpr * dpr > maxPx) dpr = Math.sqrt(maxPx / (cssW * cssH));
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
  H = 1000;
  if (hasBg()) { W = 1600; U = cv.height / 1000; OX = (cv.width - 1600 * U) * (cssW / cssH > 1.6 ? .25 : .5); OY = 0; }
  else { W = (cssW / cssH) * 1000; U = cv.height / 1000; OX = 0; OY = 0; }
  const o = {};
  o.floor = 772; o.wain = 588;
  // RIGHT SIDE CLEAR: macOS widgets live on the right, so everything that wants attention
  // (window seat, player, now-playing display, the pets' spots) sits in the left ~70%;
  // the right ~28% is calm background only (a door, a floor lamp, a plant).
  const LIM = W * 0.70;
  o.LIM = LIM; o.RZ = W * 0.72;
  const x0 = clamp(W * 0.04, 40, 140), R = 84;
  const conW = 2 * R + 98 + 32 + 124;            // plinth + margins + a cat-sized spot beside it
  const gapWC = clamp(W * 0.05, 70, 130);
  const ww = clamp(LIM - conW - gapWC - x0, 340, 980);
  o.win = { x0, x1: x0 + ww, y0: 92, y1: 596, w: ww, h: 504 };
  o.win.th = Math.round(o.win.h * 0.17);
  o.seat = { x0: x0 - 34, x1: x0 + ww + 34, gy: 628 };
  const cx0 = o.win.x1 + gapWC;
  o.con = { x0: cx0, x1: cx0 + conW, top: 604, leg: 24 };
  o.colC = (o.con.x0 + o.con.x1) / 2;
  o.tt = { R, q: 0.34, cx: cx0 + 16 + 24 + R, cy: 0 };
  o.tt.cy = 598 - 22 - (R + 14) * o.tt.q;
  o.tt.px0 = o.tt.cx - R - 24; o.tt.px1 = o.tt.cx + R + 74;
  o.tt.pv = R + 14;
  o.tt.piv = { u: R + 42, v: -R * 0.52 };
  o.tt.arm = R * 1.32;

// ----- emissive extras after lighting -----------------------------------------
function paintEmissive(g, artMode) {
  const lv = E.lamp;
  const A = L.lampA, B = L.lampB, T = L.tlamp;
  if (artMode) { L.fairy = []; return; }
  if (lv > 0.02) {
    // light cones under the pendants
    g.globalCompositeOperation = 'lighter';
    for (const [x, y, wTop, wBot, len, a] of [[A.x, A.y, 60, 230, 380, 0.075], [B.x, B.y, 12, 200, 320, 0.055]]) {
      // layered so the cone edges fall off softly instead of a hard triangle
      for (let k = 0; k < 4; k++) {
        const f = 1 - k * 0.22;
        const gr = g.createLinearGradient(0, y, 0, y + len);
        gr.addColorStop(0, rgba([255, 200, 130], a * lv * 0.4)); gr.addColorStop(0.6, rgba([255, 190, 120], a * lv * 0.16)); gr.addColorStop(1, rgba([255, 180, 110], 0));
        g.fillStyle = gr; g.beginPath(); g.moveTo(x - wTop * f, y); g.lineTo(x + wTop * f, y); g.lineTo(x + wBot * f, y + len); g.lineTo(x - wBot * f, y + len); g.closePath(); g.fill();
      }
    }
    g.globalCompositeOperation = 'source-over';
    // inner glow of the dome
    g.fillStyle = rgba(mix3([60, 50, 40], [255, 236, 200], lv)); g.beginPath(); g.ellipse(A.x, A.y + 1, 60, 4.5, 0, 0, TAU); g.fill();
    // Edison bulb B: warm glass + filament
    g.fillStyle = rgba(mix3([90, 80, 70], [255, 205, 130], lv), 0.95); g.beginPath(); g.ellipse(B.x, B.y - 14, 15, 22, 0, 0, TAU); g.fill();
    g.strokeStyle = rgba(mix3([60, 50, 40], [255, 250, 220], lv)); g.lineWidth = 1.1;
    g.beginPath(); for (let i = 0; i < 4; i++) { g.moveTo(B.x - 6 + i * 4, B.y - 26); g.lineTo(B.x - 4 + i * 2.5, B.y - 4); } g.stroke();
    // table lamp shade glows
    const sh = g.createRadialGradient(T.x, T.y - 20, 4, T.x, T.y - 40, 70);
    sh.addColorStop(0, rgba([255, 244, 220], 0.92 * lv)); sh.addColorStop(1, rgba([240, 196, 140], 0.7 * lv));
    g.fillStyle = sh; lampShadePath(g, T); g.fill();
    // fairy lights along the top of the window
    const w = L.win, n = Math.round(w.w / 44);
    g.strokeStyle = 'rgba(30,25,20,0.8)'; g.lineWidth = 1;
    g.beginPath();
    const fl = [];
    for (let i = 0; i <= n * 4; i++) {
      const t = i / (n * 4), x = w.x0 - 10 + (w.w + 20) * t, sag = Math.abs(Math.sin(t * Math.PI * 2)) * 26;
      const y = w.y0 + 8 + sag;
      if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      if (i % 4 === 2) fl.push([x, y + 4]);
    }
    g.stroke();
    L.fairy = fl;
  } else L.fairy = [];
  // wide soft bloom around each lamp (static part; the live halo breathes on top)
  if (lv > 0.02) {
    g.globalCompositeOperation = 'lighter';
    ellGrad(g, A.x, A.y + 60, 330, 330, [255, 170, 90], 0.09 * lv, 8);
    ellGrad(g, B.x, B.y + 20, 300, 300, [255, 170, 90], 0.1 * lv, 8);
    ellGrad(g, T.x, T.y - 40, 260, 260, [255, 170, 90], 0.08 * lv, 8);
    g.globalCompositeOperation = 'source-over';
  }
  // vignette
  const gr = g.createRadialGradient(W * 0.45, H * 0.55, H * 0.35, W * 0.45, H * 0.55, Math.max(W, H) * 0.85);
  gr.addColorStop(0, 'rgba(10,5,2,0)'); gr.addColorStop(1, `rgba(10,5,2,${0.45 + 0.2 * (1 - E.day)})`);
  g.globalCompositeOperation = 'source-atop'; g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // top of the frame falls into shadow
  const tg = g.createLinearGradient(0, 0, 0, 140);
  tg.addColorStop(0, `rgba(8,4,2,${0.5 - 0.25 * E.day})`); tg.addColorStop(1, 'rgba(8,4,2,0)');
  g.fillStyle = tg; g.fillRect(0, 0, W, 140);
  g.globalCompositeOperation = 'source-over';
}

  const bre = 1 + 0.16 * beat.level + 0.1 * beat.pulse;
  // live glows with a little bloom: hot core, halo, wide soft bloom
  if (lv > 0.02) {
    drawSprite(ctx, GLOW_WARM, L.lampA.x, L.lampA.y + 4, 40, 0.7 * lv);
    drawSprite(ctx, GLOW_WARM, L.lampA.x, L.lampA.y + 8, 140, 0.38 * lv * fl * bre);
    drawSprite(ctx, GLOW_WHITE, L.lampB.x, L.lampB.y - 14, 22, 0.55 * lv);
    drawSprite(ctx, GLOW_WARM, L.lampB.x, L.lampB.y - 14, 120, 0.55 * lv * fl * bre);
    drawSprite(ctx, GLOW_WARM, L.tlamp.x, L.tlamp.y - 42, 120, 0.36 * lv);
    const tw = L.fairy || [];
    for (let i = 0; i < tw.length; i++) {
      const [x, y] = tw[i], k = 0.7 + 0.3 * Math.sin(T * (0.6 + (i % 5) * 0.13) + i * 1.7) + 0.4 * beat.pulse * ((i + beat.n) % 3 === 0 ? 1 : 0.3);
      ctx.fillStyle = `rgba(255,${200 + (i % 3) * 15},140,${0.9 * lv})`; ctx.beginPath(); ctx.arc(x, y, 2.4, 0, TAU); ctx.fill();
      drawSprite(ctx, GLOW_WARM, x, y, 20, 0.38 * lv * k);
    }
  }
  drawMotes(ctx, T);
  // music tint: the room leans toward the album's colours (subtle)
  const tintLv = music.lv * (1 - calm.lv) * (0.55 + 0.45 * lv);
  if (tintLv > 0.01 && tintGlow) {
    const hx = lerp(L.sleeve.x + L.sleeve.s / 2, L.juke.x, music.jk), hy = lerp(L.sleeve.y + L.sleeve.s * 0.4, L.juke.top + 120, music.jk);
    drawSprite(ctx, tintGlow, hx, hy, 280, 0.2 * tintLv * (1 + 0.3 * beat.level), 'screen');
    drawSprite(ctx, tintGlow, (L.lampB.x + L.rug.cx) / 2, L.rug.cy - 160, 400, 0.11 * tintLv, 'screen');
  }
  // chalkboard text
  const c = L.chalk, clv = clamp(lum(lightAt((c.x0 + c.x1) / 2, (c.y0 + c.y1) / 2)) * 1.25, 0.32, 0.95);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const cx = Math.round(MIR ? devX(c.x1) : devX(c.x0)), cy = Math.round(OY + c.y0 * U);
  // erase the old line, then chalk in the new one
  const cfO = prevChalkCv ? clamp(1 - chalkFade * 2, 0, 1) : 0, cfN = prevChalkCv ? clamp(chalkFade * 2 - 1, 0, 1) : 1;
  if (cfO > 0) { ctx.globalAlpha = clv * cfO; ctx.drawImage(prevChalkCv, cx, cy); }
  if (cfN > 0) { ctx.globalAlpha = clv * cfN; ctx.drawImage(chalkCv, cx, cy); }
  ctx.globalAlpha = 1;
  VT(ctx);
  // the music player: record player + sleeve, or the jukebox (crossfading when switched)
  if (music.jk < 0.995) { GA = 1 - music.jk; ctx.globalAlpha = GA; drawSleeve(ctx, L.sleeveR); drawTurntable(ctx, T); }
  if (music.jk > 0.005) { GA = music.jk; ctx.globalAlpha = GA; if (L.juke.spr) { drawJukeSprite(ctx, T); drawSleeve(ctx, L.sleeve); } else upright(ctx, L.juke.x, () => drawJukebox(ctx, T)); }
  GA = 1; ctx.globalAlpha = 1;
  // record pulled from the shelf
  if (L.pulled && L.spines.length) {
    const [x, y, sw, sh] = L.spines[L.pulled.i % L.spines.length], k = Math.sin(L.pulled.t * Math.PI);
    ctx.fillStyle = rgba(mul([230, 220, 200], lightAt(x, y))); ctx.fillRect(x - 1, y - 18 * k, sw + 2, sh * 0.6);
  }
  drawDangle(ctx, T);
  petSystem.draw(ctx);
  // candle flames (always lit at night; the main light in calm mode)
  const cand = Math.max(1 - E.day * 0.8, calm.lv);
  const fk = 1 + 0.08 * Math.sin(T * 11) * Math.sin(T * 3.7) + 0.04 * Math.sin(T * 23);
  drawParticles(ctx);
  drawWater(ctx);
  // out-of-focus foreground leaves (nearest layer, moves most with the cursor)
  // (procedural blurred leaves: only without the painted room — over the painting they read as blobs)
  if (!hasBg()) {
    ctx.globalAlpha = 0.9;
    if (fgBR) ctx.drawImage(fgBR.cv, fgBR.x + par.x * 12, fgBR.y + par.y * 6, fgBR.w, fgBR.h);
    if (fgTL) ctx.drawImage(fgTL.cv, fgTL.x + par.x * 12, fgTL.y + par.y * 6, fgTL.w, fgTL.h);
    ctx.globalAlpha = 1;
  }
  // dimming: paused/stopped → a touch darker; calm → candlelight
  const pausedDim = (1 - music.lv) * (music.ever ? 0.07 : 0.04) * (1 - E.day * 0.7);
  const dim = clamp(pausedDim + calm.lv * (0.62 - 0.22 * bC), 0, 0.8);   // the room's light breathes
  if (dim > 0.002) { ctx.fillStyle = `rgba(8,4,6,${dim})`; ctx.fillRect(-2400, -10, W + 4800, H + 20); }
  if (cand > 0.05) {
    const { x, y } = L.candle, b = calm.lv > 0.01 ? breath() : 0.5;
    ctx.save(); ctx.translate(x, y); ctx.scale(L.fg, L.fg); ctx.translate(-x, -y);
    ctx.fillStyle = `rgba(255,214,140,${0.95 * cand})`;
    const ft = (44 + calm.lv * 7 * b) * fk;   // the flame stands a little taller on full lungs
    ctx.beginPath(); ctx.moveTo(x, y - ft); ctx.quadraticCurveTo(x + 4.5, y - 34, x, y - 29); ctx.quadraticCurveTo(x - 4.5, y - 34, x, y - ft); ctx.fill();
    ctx.fillStyle = `rgba(255,250,230,${cand})`; ctx.beginPath(); ctx.ellipse(x, y - 33, 1.6, 3, 0, 0, TAU); ctx.fill();
    drawSprite(ctx, GLOW_WARM, x, y - 34, (50 + calm.lv * (40 + 110 * b)) * fk, (0.45 + calm.lv * (0.22 + 0.45 * b)) * cand);
    // calm: a wide pool of candlelight that fills the corner on the in-breath
    if (calm.lv > 0.01) drawSprite(ctx, GLOW_WARM, x, y - 40, 200 + 260 * b, (0.04 + 0.16 * b) * calm.lv * cand);
    ctx.restore();
    if (calm.lv > 0.02) {
      if (!cat.away) drawSprite(ctx, GLOW_WARM, cat.x, cat.y - 40, 300, 0.1 * calm.lv * (0.6 + 0.4 * b) * petIn(cat));
      if (!dog.away) drawSprite(ctx, GLOW_WARM, dog.x, dog.y - 40, 300, 0.08 * calm.lv * (0.6 + 0.4 * b) * petIn(dog));
    }
  }
  const fa = flashA();
  if (fa > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(120,130,170,${fa * 0.1})`; ctx.fillRect(-2400, -10, W + 4800, H + 20); ctx.globalCompositeOperation = 'source-over'; }
}

// =====================================================================
//  boot
// =====================================================================
function rebuild() {
  computeLayout();
  if (!E) computeTarget();
  E.amb = envAmb();
  bake(false);
  bakeBeads();
  initCups();
  initMotes();
  petSystem.reset();
  // breath caption on the floor just right of the rug: clear of the pets, the cups, the Dock along the bottom
  // edge and the right-hand widget zone
  { const bx = devX(L.rug.cx + L.rug.rx + 80) / cv.width, [c0, c1] = (LW.layout && LW.layout.clear) || [0, 0.72];
    LW.breathLabelAt = [clamp(bx, c0 + 0.2, c1 - 0.06), clamp((OY + L.rug.cy * U) / cv.height, 0.5, 0.86)]; }
  rebuildArt(false);
  chalkKey = ''; prevChalkCv = null; chalkFade = 1; updateChalk(true);
  marqueeKey = ''; buildMarquee();
  placePets();
}
// (re)place the pets at home — only on boot / resize / when the painted room arrives
let rsT = null;
addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(rebuild, 150); });
LW.on('layout', () => { clearTimeout(rsT); rsT = setTimeout(rebuild, 60); });
computeTarget();
E.amb = envAmb();
rebuild();
if (LW.nowPlaying) onNowPlaying(LW.nowPlaying);
if (LW.calm) setCalm(true);
requestAnimationFrame(frame);

// dev hooks: perf + identity self-test
function benchRaw(n = 120, flushEach = false) {
  let T = nowS(); const t0 = performance.now(); let js = 0;
  for (let i = 0; i < n; i++) { T += 1 / 30; const a = performance.now(); step(1 / 30, T); render(T); js += performance.now() - a; if (flushEach) ctx.getImageData(0, 0, 1, 1); }
  ctx.getImageData(0, 0, 1, 1);
  return { perFrameTotal: +((performance.now() - t0) / n).toFixed(2), jsOnly: +(js / n).toFixed(2) };
}
function bench(n = 120) { if (!LW.virtual) return { perfMs }; const t0 = Date.now(); LW.advance(n / 30); return (Date.now() - t0) / n; }
window.__pets=petSystem;
window.__cafe={pets:petSystem,get L(){return L},get E(){return E},step,render,bake,ART,calm,setCalm,startWater,startStretch};
})();
