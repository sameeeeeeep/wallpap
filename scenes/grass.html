<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Touch Grass</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1a10; cursor: default; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #hud { position: fixed; left: 14px; bottom: 12px; font: 12px ui-monospace, Menlo, monospace; color: #dfe9c8; opacity: 0; transition: opacity .6s; pointer-events: none; text-shadow: 0 1px 2px #0008; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="hud"></div>
<script>window.__realNow = performance.now.bind(performance);</script>
<script src="astronomy.js"></script>
<script src="lw.js"></script>
<script src="moon.js"></script>
<script src="pet-motion.js"></script>
<script src="pets.js"></script>
<script>
'use strict';
// ─────────────────────────────────────────────────────────────────────────────
// Touch Grass — a sunlit meadow with pandas.
//   WebGL2:  sky/hills/meadow pass → instanced grass, flowers, bamboo (sorted by
//            depth) interleaved with SDF "vector" actors (pandas, songbirds, black kites,
//            water basin, bamboo bundles) → fog/vignette pass.
//   2D overlay (no texture uploads): butterflies, fireflies, rain/snow, seeds,
//            hearts, sleepy z's (lw.js draws the breathing guide; no speech bubbles).
//   Touch: a small CPU spring field (lean, flatten) uploaded as an RG8
//          texture; the grass vertex shader bends around the cursor/pandas.
// ─────────────────────────────────────────────────────────────────────────────
(() => {
const TAU = Math.PI * 2;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const approach = (x, t, d) => (x < t ? Math.min(t, x + d) : Math.max(t, x - d));
const wrapA = (a) => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const easeIO = (k) => k * k * (3 - 2 * k);
function mulberry(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const NP = new Float32Array(512).map(() => Math.random() * 2 - 1);
function noise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(NP[i & 511], NP[(i + 1) & 511], u); }
function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  return lerp(lerp(hash2(ix, iy), hash2(ix + 1, iy), ux), lerp(hash2(ix, iy + 1), hash2(ix + 1, iy + 1), ux), uy);
}

const glc = document.getElementById('gl');
const ov = document.getElementById('ov');
const octx = ov.getContext('2d');
const gl = glc.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: true, powerPreference: 'default' });

let W = 0, H = 0, DPR = 1, GLS = 1, ODPR = 1, yH = 0, GH = 0, GW = 0, PS = 0;
const sToY = (s) => yH + (H - yH) * s;
const yToS = (y) => (y - yH) / (H - yH);

// ─── Shaders ────────────────────────────────────────────────────────────────
const COMMON = `
uniform vec4 uGust[4];
uniform float uTime, uH, uWind;
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0 - 2.0*f);
  return mix(mix(hash12(i), hash12(i + vec2(1,0)), u.x), mix(hash12(i + vec2(0,1)), hash12(i + vec2(1,1)), u.x), u.y); }
float fbm3(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 3; i++){ s += a*vnoise(p); p = p*2.03 + 17.1; a *= 0.5; } return s/0.875; }
float fbm4(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ s += a*vnoise(p); p = p*2.03 + 17.1; a *= 0.5; } return s/0.9375; }
float gustAt(float x, float s){
  float xn = x/uH;
  float g = 0.5 + 0.5*sin(xn*4.0 - uTime*1.05 + s*4.0); g = g*g*0.35;
  g += 0.18*(0.5 + 0.5*sin(xn*9.7 - uTime*2.1 + s*7.0 + 1.3));
  for (int i = 0; i < 4; i++){ vec4 G = uGust[i]; float d = (x - G.x + (1.0 - s)*G.w)/G.y; g += G.z*exp(-d*d); }
  return g;
}
float cloudShadow(float x, float s){
  float z = 1.0/(s + 0.1);
  vec2 q = vec2((x/uH - 0.8)*z*0.32 - uTime*0.011, z*0.2 + uTime*0.003);
  float n = vnoise(q)*0.65 + vnoise(q*2.1 + 5.3)*0.35;
  return smoothstep(0.5, 0.7, n);
}`;

const FS_VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(p*2.0 - 1.0, 0.0, 1.0); }`;

const BG_FS = `#version 300 es
precision highp float;
${COMMON}
uniform vec2 uRes, uView;
uniform float uHor, uCloud, uNight, uFog, uFlash, uSnow, uBack, uCloudSh, uHazeK;
uniform vec3 uSkyTop, uSkyHor, uSun, uAmbC, uHaze, uCloudLit, uCloudDark, uSnowC, uGrassMid, uGroundDark, uHill1, uHill2;
uniform vec3 uSunP, uMoonP;
uniform sampler2D uMoonTex;   // the shared photoreal moon (moon.js), uploaded only when its key changes
uniform float uMoonOn;
uniform sampler2D uMtnTex;    // painted distant ridges (art/grass/mountains.png), uploaded once
uniform float uMtnOn, uMtnH;
out vec4 o;
void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y)/uRes*uView;
  float W = uView.x, H = uView.y, x = p.x, y = p.y, xn = x/H;
  vec3 col;
  float yFar = uHor - H*(0.052 + 0.022*sin(xn*2.3 + 0.6) + 0.014*sin(xn*5.1 + 2.0) + 0.005*sin(xn*13.0 + 1.0));
  float trees = smoothstep(0.52, 0.8, vnoise(vec2(xn*6.0, 1.0)));
  yFar -= H*0.014*trees*(0.5 + 0.5*vnoise(vec2(xn*80.0, 3.0)));
  float yMid = min(uHor - 1.5, uHor - H*(0.014 + 0.017*sin(xn*1.6 + 2.4) + 0.008*sin(xn*4.4 + 0.3)));
  if (uMtnOn > 0.5) { yFar = uHor; yMid = uHor; }   // the painted ridges replace the procedural hills
  vec3 lit = uAmbC*0.8 + uSun*0.55;
  float sd = length(p - uSunP.xy)/H;
  vec3 scatter = uSun*uSunP.z*(0.3*exp(-sd*4.5) + 0.08*exp(-sd*1.5))*(0.35 + uBack);
  if (y >= uHor) {
    float s = (y - uHor)/(H - uHor);
    vec3 far = uGrassMid*lit*1.05;
    vec3 near = uGroundDark*lit;
    col = mix(far, near, smoothstep(0.0, 0.32, s));
    float tex = vnoise(vec2(x/(H*(0.003 + s*0.02)), y/(H*0.004)));
    col *= 0.82 + 0.34*tex;
    float g = gustAt(x, s); col *= 1.0 + 0.25*g*uWind*(1.0 - s*0.7);
    if (uCloudSh > 0.01) col *= 1.0 - uCloudSh*0.35*cloudShadow(x, s);
    col = mix(col, uSnowC, uSnow*0.82*(1.0 - 0.35*s));
    col = mix(col, uHaze, clamp(pow(1.0 - s, 9.0)*0.8*uHazeK + uFog*0.55*(1.0 - s), 0.0, 0.95));
    col += uSun*uSunP.z*uBack*0.2*exp(-abs(x - uSunP.x)/H*2.6)*pow(1.0 - s, 3.0);
    col += scatter*pow(1.0 - s, 6.0)*0.6;
  } else if (y >= yMid) {
    float k = (y - yMid)/max(uHor - yMid, 1.0);
    vec3 c = uHill2*lit*(1.05 - 0.25*k);
    c *= 0.9 + 0.2*vnoise(vec2(x*0.05, y*0.2));
    c = mix(c, uSnowC, uSnow*0.85);
    col = mix(c, uHaze, clamp(0.22 + 0.4*uHazeK + uFog*0.55, 0.0, 0.95)) + scatter*0.7;
  } else if (y >= yFar) {
    float k = (y - yFar)/max(yMid - yFar, 1.0);
    vec3 c = uHill1*lit*(1.0 - 0.15*k);
    c = mix(c, c*0.7, trees*smoothstep(0.0, 0.4, k)*0.0);
    c = mix(c, uSnowC, uSnow*0.8);
    col = mix(c, uHaze, clamp(0.45 + 0.4*uHazeK + uFog*0.6, 0.0, 0.97)) + scatter;
  } else {
    float ty = clamp(y/uHor, 0.0, 1.0);
    vec3 sky = mix(uSkyTop, uSkyHor, pow(ty, 1.5));
    sky += uSun*uSunP.z*(0.3*exp(-sd*10.0) + 0.2*exp(-sd*2.6)*(0.35 + uBack));
    float md = length(p - uMoonP.xy)/H;
    sky += vec3(0.45, 0.52, 0.7)*uMoonP.z*0.1*exp(-md*7.0);
    if (uNight > 0.02) {
      vec2 g = floor(p/2.6); float h = hash12(g);
      float st = step(0.9966, h)*(0.55 + 0.45*sin(uTime*(0.8 + h*3.0) + h*40.0));
      sky += vec3(0.85, 0.9, 1.0)*st*uNight*(1.0 - uCloud*0.95)*smoothstep(1.0, 0.45, ty);
    }
    float hy = max(uHor - y, 1.0);
    float z = pow(H/hy, 0.7);
    vec2 cp = vec2((x - W*0.5)/H*z*1.1 + uTime*0.007*(0.4 + uWind), z*1.5);
    float dn = fbm4(cp*vec2(1.0, 1.25));
    float thr = 1.0 - uCloud*0.95;
    float cov = smoothstep(thr - 0.06, thr + 0.3, dn)*smoothstep(0.03, 0.22, hy/uHor);
    vec3 cc = mix(uCloudDark, uCloudLit, smoothstep(0.35, 0.95, dn*0.8 + (1.0 - ty)*0.3));
    cc += uSun*uSunP.z*0.4*exp(-sd*5.0)*(1.0 - smoothstep(0.45, 0.85, dn));
    sky = mix(sky, cc, cov*0.93);
    sky += uSun*uSunP.z*smoothstep(0.03, 0.026, sd)*(1.0 - cov*0.85)*1.3;
    vec2 mq = (p - uMoonP.xy)/(0.024*H);
    if (uMoonOn > 0.5) {
      if (max(abs(mq.x), abs(mq.y)) < 1.0) { vec4 mc = texture(uMoonTex, mq*0.5 + 0.5); sky = mix(sky, mc.rgb, mc.a*uMoonP.z*(1.0 - cov*0.9)); }
    } else {
      float mdisk = smoothstep(0.023, 0.020, md);
      float cres = smoothstep(0.019, 0.026, length(p - uMoonP.xy - vec2(0.009*H, -0.005*H))/H);
      sky = mix(sky, vec3(0.93, 0.92, 0.86), mdisk*mix(1.0, cres, 0.85)*uMoonP.z*(1.0 - cov*0.9));
    }
    col = mix(sky, uHaze, uFog*0.55*smoothstep(0.2, 1.0, ty));
  }
  if (uMtnOn > 0.5 && y > uHor - uMtnH && y < uHor + H*0.045) {
    float my = clamp((y - (uHor - uMtnH))/(uMtnH + H*0.045), 0.0, 1.0);
    vec4 m = texture(uMtnTex, vec2(x/W, my));
    if (m.a > 0.003) {
      vec3 mc = m.rgb*(uAmbC*1.05 + uSun*0.45);
      mc = mix(mc, uSnowC, uSnow*0.7*(1.0 - 0.5*my));
      // aerial perspective: the ridges are far off — hazier overall, a soft mist lying along their foot
      float hz = clamp((0.2 + 0.34*uHazeK + uFog*0.75)*(1.1 - 0.4*my) + 0.22*smoothstep(0.78, 1.0, my), 0.0, 0.96);
      mc = mix(mc, uHaze, hz) + scatter*(0.35 + 0.4*(1.0 - my));
      // Carry the foot of the painting into the distant grass, then dissolve it.
      // A soft irregular edge avoids a ruler-straight cut at the horizon.
      float foot = uHor + H*(0.012 + 0.006*vnoise(vec2(x/H*9.0, 2.0)));
      col = mix(col, mc, m.a*(1.0 - smoothstep(foot, foot + H*0.025, y)));
    }
  }
  col += vec3(0.5, 0.55, 0.72)*uFlash*(y < uHor ? 0.55 : 0.25);
  col += (hash12(gl_FragCoord.xy + fract(uTime)*91.0) - 0.5)*(1.6/255.0);
  o = vec4(col, 1.0);
}`;

const POST_FS = `#version 300 es
precision highp float;
${COMMON}
uniform vec2 uRes, uView;
uniform float uHor, uFog, uMist, uFlash, uVig, uDim;
uniform vec3 uFogC;
out vec4 o;
void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y)/uRes*uView;
  float s = (p.y - uHor)/(uView.y - uHor);
  float fa = 0.0;
  if (uFog + uMist > 0.01) {
    float m = fbm3(vec2(p.x/uView.y*1.5 - uTime*0.018, p.y/uView.y*4.0 + uTime*0.006));
    float band = smoothstep(-0.3, 0.02, s)*smoothstep(0.8, 0.08, s);
    fa = uMist*band*(0.15 + 0.4*m) + uFog*(0.18 + 0.38*m)*smoothstep(1.15, -0.25, s);
    fa = clamp(fa, 0.0, 0.85);
  }
  vec2 uv = p/uView;
  float vig = length((uv - vec2(0.5, 0.45))*vec2(uView.x/uView.y*0.6, 1.0));
  float av = clamp(smoothstep(0.42, 1.1, vig)*uVig + uDim, 0.0, 0.9);
  vec3 rgb = uFogC*fa + vec3(0.6, 0.65, 0.8)*uFlash*0.22;
  o = vec4(rgb, 1.0 - (1.0 - fa)*(1.0 - av));
}`;

const GRASS_VS = `#version 300 es
precision highp float;
layout(location=0) in vec4 iA;
layout(location=1) in vec4 iB;
layout(location=2) in vec4 iC;
layout(location=3) in vec4 iD;
${COMMON}
uniform vec2 uView, uShake;
uniform float uCalmLean, uCloudSh, uSwayK;
uniform sampler2D uField;
uniform vec4 uFR;
out vec4 vA; out vec4 vB; out vec4 vT;
float bendOf(vec2 root, float h, float s, float ph, float lean, float stiff, out float fl, out float g){
  g = gustAt(root.x, s);
  float sway = sin(uTime*(1.2 + fract(ph*7.31)*0.7) + ph*6.2832 + root.x*0.011)*0.6 + sin(uTime*2.7 + ph*17.0)*0.25;
  float b = lean + uWind*(0.12 + 0.6*g) + sway*(0.05 + 0.11*uWind)*uSwayK + uCalmLean;
  vec2 f = texture(uField, (vec2(root.x, root.y - h*0.45) - uFR.xy)/uFR.zw).rg;
  f = vec2((f.x*255.0 - 128.0)/63.5, f.y);   // RG8: lean in ±2, flatten 0..1
  fl = clamp(f.y, 0.0, 1.0);
  b = b/stiff + f.x*1.7;
  b += (b >= 0.0 ? 1.0 : -1.0)*fl*0.7;
  return clamp(b, -1.5, 1.5);
}
vec2 bladeP(int k, float h, float b){
  vec2 p = vec2(0.0);
  for (int j = 0; j < 5; j++){ if (j >= k) break; float vv = (float(j) + 0.5)*0.2; float a = b*pow(vv, 1.5)*1.1; p += vec2(sin(a), -cos(a))*h*0.2; }
  return p;
}
float stalkB(float x, float s, float ph, float lean, float stiff){
  float g = gustAt(x, s);
  float sway = sin(uTime*0.8 + ph*6.2832)*0.6 + sin(uTime*1.9 + ph*13.0)*0.25;
  float b = lean + (uWind*(0.05 + 0.12*g) + sway*0.02*(0.4 + uWind))/stiff;
  float dx = (x - uShake.x)/12.0;
  b += uShake.y*sin(uTime*23.0)*exp(-dx*dx);
  return b;
}
vec2 stalkP(float f, float h, float b){
  vec2 p = vec2(0.0);
  for (int j = 0; j < 5; j++){ float seg = clamp(f*5.0 - float(j), 0.0, 1.0); if (seg <= 0.0) break; float vv = (float(j) + 0.5*seg)*0.2; float a = b*vv*vv*1.6; p += vec2(sin(a), -cos(a))*h*0.2*seg; }
  return p;
}
void main(){
  int vid = gl_VertexID; int k = vid >> 1; float side = float(vid & 1)*2.0 - 1.0;
  float type = iC.x;
  vec2 pos; float u = side, v = float(k)*0.2, fl = 0.0, g = 0.0, wpx = iA.w, node = 0.0;
  vec2 spr = vec2(0.0);
  if (type < 1.5) {
    float b = bendOf(iA.xy, iA.z, iB.x, iB.y, iB.z, iC.y, fl, g);
    vec2 p = bladeP(k, iA.z, b);
    float ak = b*pow(v, 1.5)*1.1;
    p.y *= 1.0 - 0.72*fl;
    float wv = type < 0.5 ? iA.w*pow(1.0 - v, 0.8)*(0.8 + 0.45*sin(v*2.8)) : iA.w*(k == 5 ? 0.6 : 1.0);
    pos = iA.xy + p + vec2(cos(ak), sin(ak)*(1.0 - 0.72*fl))*side*wv*0.5;
  } else if (type < 2.5) {
    float b = bendOf(iA.xy, iA.z, iB.x, iB.y, iB.z, iC.y, fl, g);
    vec2 p = bladeP(5, iA.z, b); p.y *= 1.0 - 0.72*fl;
    int c = min(vid, 3); vec2 cr = vec2(float(c & 1), float(c >> 1));
    vec2 q = (cr - vec2(0.5, 0.6))*vec2(1.0, iD.x)*iC.w;
    float ra = b*0.55; q = vec2(q.x*cos(ra) - q.y*sin(ra), q.x*sin(ra) + q.y*cos(ra));
    pos = iA.xy + p + q;
    spr = vec2((iC.z + mix(0.01, 0.99, cr.x))/8.0, mix(0.01, 0.99, cr.y));
    u = cr.x*2.0 - 1.0; v = cr.y; wpx = 99.0;
  } else if (type < 3.5) {
    float b = stalkB(iA.x, iB.x, iB.y, iB.z, iC.y);
    vec2 p = stalkP(v, iA.z, b);
    float a = b*v*v*1.6;
    float wv = iA.w*(1.0 - 0.18*v);
    pos = iA.xy + p + vec2(cos(a), sin(a))*side*wv*0.5;
    node = v*iA.z/iD.y;
    g = gustAt(iA.x, iB.x);
  } else {
    float b = stalkB(iA.x, iB.x, iD.z, iD.x, iC.y);
    vec2 p = stalkP(iC.z, iA.z, b);
    g = gustAt(iA.x, iB.x);
    float A = iB.z + sin(uTime*(1.7 + fract(iB.y*5.3)) + iB.y*6.2832)*0.09*(0.4 + uWind);
    A += uWind*0.32*(0.3 + g)*cos(A);
    int c = min(vid, 3); vec2 cr = vec2(float(c & 1), float(c >> 1));
    vec2 d = vec2(sin(A), -cos(A)), n = vec2(cos(A), sin(A));
    pos = iA.xy + p + d*cr.y*iA.w + n*(cr.x*2.0 - 1.0)*iC.w*0.5;
    u = cr.x*2.0 - 1.0; v = cr.y; wpx = iC.w;
  }
  float cs = (uCloudSh > 0.01 && type < 2.5) ? cloudShadow(iA.x, iB.x)*uCloudSh : 0.0;
  vA = vec4(u, v, type, wpx);
  vB = vec4(iB.x, iB.w, g, fl);
  vT = vec4(type > 1.5 && type < 2.5 ? spr : vec2(node, 0.0), cs, hash12(iA.xy*0.37));
  gl_Position = vec4(pos.x/uView.x*2.0 - 1.0, 1.0 - pos.y/uView.y*2.0, 0.0, 1.0);
}`;

const GRASS_FS = `#version 300 es
precision highp float;
uniform sampler2D uAtlas;
uniform vec3 uSun, uAmbC, uHaze, uSnowC;
uniform float uHazeK, uFog, uGold, uBack, uSnow, uMoon, uWet, uPxk, uTime, uWind;
in vec4 vA; in vec4 vB; in vec4 vT;
out vec4 o;
void main(){
  float u = vA.x, v = vA.y, type = vA.z;
  float s = vB.x, hue = vB.y, g = vB.z, fl = vB.w;
  float h2 = fract(hue*7.13 + 0.37);
  vec3 col; float a = 1.0;
  if (type < 1.5) {
    float aa = fwidth(u)*1.3 + 1e-3;
    a = 1.0 - smoothstep(1.0 - aa, 1.0, abs(u));
    a *= clamp(vA.w*uPxk, 0.35, 1.0);
    vec3 dark = vec3(0.035, 0.07, 0.02), mid = vec3(0.19, 0.35, 0.065), fresh = vec3(0.4, 0.59, 0.12), straw = vec3(0.58, 0.53, 0.22);
    vec3 c = mix(mid, fresh, hue*0.9);
    c = mix(c, straw, smoothstep(0.84, 1.0, h2)*0.75);
    if (type > 0.5) c = mix(c, vec3(0.14, 0.28, 0.08), 0.55);
    c = mix(dark, c, smoothstep(0.0, 0.62, v));
    float facing = 0.55 + 0.45*sin(hue*40.0);
    vec3 amb = mix(uAmbC, vec3(dot(uAmbC, vec3(0.333))), 0.45);
    col = c*(amb*0.85 + uSun*(0.3 + 0.7*facing))*(1.0 - 0.22*u*u);
    float tip = smoothstep(0.45, 1.0, v);

let atlasTex = null;
function buildAtlas() {
  const C = 128, cv = document.createElement('canvas'); cv.width = C * 8; cv.height = C;
  const g = cv.getContext('2d');
  const R = mulberry(77);
  const cell = (i, fn) => { g.save(); g.translate(i * C + C / 2, C / 2); fn(); g.restore(); };
  // 0 daisy
  cell(0, () => {
    for (let k = 0; k < 2; k++) {
      const n = 17, off = k * 0.18;
      for (let i = 0; i < n; i++) {
        g.save(); g.rotate((i / n) * TAU + off + (R() - 0.5) * 0.1);
        const gr = g.createLinearGradient(0, -10, 0, -54);
        gr.addColorStop(0, k ? '#e9e4d8' : '#d9d3c6'); gr.addColorStop(0.4, '#fbf8f1'); gr.addColorStop(1, '#ffffff');
        g.fillStyle = gr; g.beginPath(); g.ellipse(0, -31, 6.4 - k, 24 + R() * 4, 0, 0, TAU); g.fill();
        g.restore();
      }
    }
    const cg = g.createRadialGradient(-3, -3, 1, 0, 0, 15);
    cg.addColorStop(0, '#ffe27a'); cg.addColorStop(0.6, '#f2b631'); cg.addColorStop(1, '#c98a1c');
    g.fillStyle = cg; g.beginPath(); g.arc(0, 0, 14, 0, TAU); g.fill();
    g.fillStyle = 'rgba(160,100,20,0.35)';
    for (let i = 0; i < 40; i++) { const a = R() * TAU, r = Math.sqrt(R()) * 12; g.beginPath(); g.arc(Math.cos(a) * r, Math.sin(a) * r, 1.1, 0, TAU); g.fill(); }
  });
  // 1,2 clover heads (pink, white)
  const clover = (base, tip) => {
    for (let i = 0; i < 70; i++) {
      const a = R() * TAU, r = Math.sqrt(R()), x = Math.cos(a) * r * 26, y = Math.sin(a) * r * 30 - 4;
      g.save(); g.translate(x, y); g.rotate(Math.atan2(y + 20, x) + Math.PI / 2);
      const gr = g.createLinearGradient(0, 8, 0, -8); gr.addColorStop(0, base); gr.addColorStop(1, tip);
      g.fillStyle = gr; g.beginPath(); g.ellipse(0, 0, 4, 9, 0, 0, TAU); g.fill(); g.restore();
    }
  };
  cell(1, () => clover('#9c4f74', '#f0b8d0'));
  cell(2, () => clover('#c9c4b4', '#fffdf6'));
  // 3 dandelion (yellow)
  cell(3, () => {
    for (let ring = 0; ring < 4; ring++) {
      const n = 26 - ring * 4, len = 44 - ring * 9;
      for (let i = 0; i < n; i++) {
        g.save(); g.rotate((i / n) * TAU + ring * 0.3 + R() * 0.1);
        g.fillStyle = ['#e9a91c', '#f6c632', '#fbd84a', '#ffe878'][ring];
        g.beginPath(); g.ellipse(0, -len / 2 - 2, 3.2, len / 2, 0, 0, TAU); g.fill(); g.restore();
      }
    }
  });
  // 4 dandelion clock (puff)
  const puff = (n) => {
    const rg = g.createRadialGradient(0, 0, 4, 0, 0, 58); rg.addColorStop(0, 'rgba(255,255,255,0.5)'); rg.addColorStop(0.7, 'rgba(255,255,255,0.28)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(0, 0, 58, 0, TAU); g.fill();
    g.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const a = R() * TAU, r = 40 + R() * 14, x = Math.cos(a) * r, y = Math.sin(a) * r;
      g.strokeStyle = 'rgba(240,238,228,0.55)'; g.lineWidth = 1; g.beginPath(); g.moveTo(0, 0); g.lineTo(x * 0.82, y * 0.82); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,0.75)';
      for (let k = -3; k <= 3; k++) { const b = a + k * 0.09; g.beginPath(); g.moveTo(x * 0.82, y * 0.82); g.lineTo(x * 0.82 + Math.cos(b) * 9, y * 0.82 + Math.sin(b) * 9); g.stroke(); }
    }
    g.fillStyle = '#c9bb98'; g.beginPath(); g.arc(0, 0, 4, 0, TAU); g.fill();
  };
  cell(4, () => puff(90));
  // 5 bare dandelion (seeds gone)
  cell(5, () => { puff(5); });
  // 6 buttercup
  cell(6, () => {
    for (let i = 0; i < 5; i++) {
      g.save(); g.rotate((i / 5) * TAU);
      const gr = g.createRadialGradient(-4, -24, 2, 0, -20, 22); gr.addColorStop(0, '#fff3a0'); gr.addColorStop(0.5, '#f5cf1c'); gr.addColorStop(1, '#c79a0c');
      g.fillStyle = gr; g.beginPath(); g.ellipse(0, -20, 15, 19, 0, 0, TAU); g.fill(); g.restore();
    }
    g.fillStyle = '#b58a12'; g.beginPath(); g.arc(0, 0, 7, 0, TAU); g.fill();
    g.fillStyle = '#e8c23a'; for (let i = 0; i < 14; i++) { const a = R() * TAU; g.beginPath(); g.arc(Math.cos(a) * 6, Math.sin(a) * 6, 1.5, 0, TAU); g.fill(); }
  });
  // 7 small blue flowers (speedwell)
  cell(7, () => {
    for (let k = 0; k < 4; k++) {
      const cx = (R() - 0.5) * 50, cy = (R() - 0.5) * 50;
      for (let i = 0; i < 4; i++) {
        g.save(); g.translate(cx, cy); g.rotate((i / 4) * TAU + k);
        g.fillStyle = i === 0 ? '#9fb3e8' : '#7f97d8'; g.beginPath(); g.ellipse(0, -8, 6.5, 8.5, 0, 0, TAU); g.fill(); g.restore();
      }
      g.fillStyle = '#f4f2e6'; g.beginPath(); g.arc(cx, cy, 2.6, 0, TAU); g.fill();
    }
  });
  atlasTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, atlasTex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.generateMipmap(gl.TEXTURE_2D);
  texParams(gl.LINEAR_MIPMAP_LINEAR);
}

  PAL.set(Lt.skyHor.map((v, i) => lerp(v, Lt.skyTop[i], 0.4) * 0.9 + 0.04), COL.WATER * 3);
  // black kites: dark brown silhouettes, warmed by a low sun
  const kbl = 0.4 + 0.6 * Lt.amb;
  const kb = [0.12, 0.08, 0.06].map((v, i) => v * kbl + Lt.sun[i] * 0.05 * (0.3 + Lt.back) + Lt.skyHor[i] * 0.05);
  PAL.set(kb, COL.RAPTOR * 3);
  PAL.set(kb.map((v, i) => v * 1.5 + Lt.skyHor[i] * 0.1 + Lt.sun[i] * 0.04 * Lt.back), COL.KITEPALE * 3);

  stepLight(dt);
  sprLight();
  stepGusts(dt);
  calmFade = approach(calmFade, calmOn || breathTemp > 0 ? 1 : 0, dt / 2.5);
  if (breathTemp > 0) breathTemp -= dt;
  if (calmOn || calmFade > 0.01 || breathTemp > 0) {
    calmBr = breathNow();
    calmStill = approach(calmStill, calmBr.phase === 'hold' || calmBr.phase === 'rest' ? 1 : 0, dt * 1.5);
  } else calmStill = 0;
  // the whole meadow leans with the breath (upright-ish on empty lungs, bowed on full), with the
  // ambient wind + sway quieted under it — almost silent in holds so the field visibly hangs still
  calmLean = calmFade * 0.5 * (calmBr.level - 0.3);
  windG = Lt.wind * (1 - 0.65 * calmFade);
  calmSway = 1 - calmFade * (0.45 + 0.5 * calmStill);
  if (basin.flowT > 0) basin.flowT -= dt; else basin.flow = approach(basin.flow, 0, dt * 0.4);
  for (let i = basin.ripples.length - 1; i >= 0; i--) { basin.ripples[i].t += dt; if (basin.ripples[i].t > 1.6) basin.ripples.splice(i, 1); }
  if (basin.flow > 0.3 && Math.random() < dt * 3) basin.ripples.push({ x: -0.55, t: 0 });
  shake.amp = approach(shake.amp, 0, dt * 0.004);

  // storm lightning
  if (LW.env.weather === 'storm') {
    nextFlash -= dt;
    if (nextFlash <= 0) {
      Lt.flash = rand(0.6, 1.1); nextFlash = rand(8, 24); thunder();
      const pts = []; let x = rand(W * 0.08, W * 0.6), y = 0; while (y < yH - H * 0.05) { pts.push([x, y]); x += rand(-30, 30); y += rand(20, 50); }
      bolt = { pts, t: 0 };
    }
  }
  // dandelions regrow
  for (const f of clocks) if (!f.ready) { f.regrow -= dt; if (f.regrow <= 0) { f.ready = true; setInstSprite(f, 4); } }

  const RN = window.__realNow || (() => 0), q0 = RN();
  runTimers(t);
  updateCursor(dt, t);
  petSystem.step(dt,t);
  for (const b of bundles) b.t += dt;
  for (let i = bundles.length - 1; i >= 0; i--) if (bundles[i].gone) bundles.splice(i, 1);
  for (const b of birds) updateBird(b, dt, t);
  kiteLow = null;
  for (const k of kiteBirds) updateKiteBird(k, dt, t);
  updateButterflies(dt, t);
  updateAmbience(dt, t);

  const q1 = RN();
  // build actors
  for (const p of pandas) emitPanda(p, t);
  emitBasin(t);
  for (const b of bundles) emitBundle(b, t);
  for (const b of birds) emitBird(b, t);
  for (const k of kiteBirds) emitKiteBird(k, t);
  drawList = [
    ...pandas.filter((p) => p.vis == null || p.vis > 0.01).map((p) => ({ L: p.prims, panda: p })), { L: basin.prims }, ...bundles.map((b) => ({ L: b.prims })),
    ...birds.filter((b) => b.state !== 'away').map((b) => ({ L: b.prims })),
    ...kiteBirds.map((k) => ({ L: k.prims })),
  ].filter((a) => a.L.on !== false).sort((a, b) => a.L.footY - b.L.footY);

  const q2 = RN();
  stepField(dt);
  const q3 = RN();
  let gq = null;
  if (gpuT.on && gpuT.ext) { gq = gl.createQuery(); gl.beginQuery(gpuT.ext.TIME_ELAPSED_EXT, gq); }
  render(tg);
  if (gq) { gl.endQuery(gpuT.ext.TIME_ELAPSED_EXT); gpuT.pending.push(gq); }
  const q4 = RN();
  drawOverlay(dt, t);
  const q5 = RN();
  const pt = [q1 - q0, q2 - q1, q3 - q2, q4 - q3, q5 - q4];
  for (let i = 0; i < 5; i++) perf.ph[i] = lerp(perf.ph[i], pt[i], 0.1);
}
requestAnimationFrame(frame);
LW.on('focus', (on) => { if (on) prev = performance.now() / 1000; });

// ─── Dev ────────────────────────────────────────────────────────────────────
if (!LW.isHost) {
  const hud = document.getElementById('hud');
  const show = () => { hud.textContent = `${LW.env.weather} · ${(LW.env.clockHour??LW.env.hour).toFixed(1)}h${LW.calm ? ' · calm' : ''}${LW.muted ? ' · muted' : ''}   [w t r b m]`; hud.style.opacity = 0.8; clearTimeout(show.t); show.t = setTimeout(() => (hud.style.opacity = 0), 2500); };
  LW.on('env', show); LW.on('calm', show); LW.on('mute', show);
}
const gpuT={on:false,ext:null,pending:[],res:[]};
async function gpuTest(frames = 60) {
  gpuT.ext = gl.getExtension('EXT_disjoint_timer_query_webgl2'); if (!gpuT.ext) return 'no timer ext';
  gpuT.on = true; gpuT.res = [];
  for (let i = 0; i < frames; i++) { LW.advance(1 / 30); await new Promise((r) => setTimeout(r, 5)); }
  gpuT.on = false;
  for (let tries = 0; tries < 100 && gpuT.pending.length; tries++) {
    await new Promise((r) => setTimeout(r, 20));
    gpuT.pending = gpuT.pending.filter((q) => { if (gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE)) { gpuT.res.push(gl.getQueryParameter(q, gl.QUERY_RESULT) / 1e6); gl.deleteQuery(q); return false; } return true; });
  }
  const r = gpuT.res.slice().sort((a, b) => a - b);
  return { gpuMinMs: +r[0].toFixed(2), gpuP25Ms: +r[r.length >> 2].toFixed(2), gpuMedianMs: +r[r.length >> 1].toFixed(2), n: r.length };
}
function perfTest(frames = 120) {
  const rn = window.__realNow;
  let js = 0, tot = 0, worst = 0;
  for (let i = 0; i < frames; i++) {
    const a = rn(); LW.advance(1 / 30); const b = rn(); gl.finish(); const c = rn();
    js += b - a; tot += c - a; worst = Math.max(worst, b - a);
  }
  return { jsMs: +(js / frames).toFixed(2), worstJsMs: +worst.toFixed(2), withGpuFinishMs: +(tot / frames).toFixed(2), instances: NI, glPx: glc.width + 'x' + glc.height };
}
window.__pets=petSystem;
window.__grass = {
  pandas, birds, kiteBirds, bundles, butterflies, basin, Lt, F, get drawList() { return drawList; },
  pets:petSystem, perfTest, gpuTest, perf, dbg, setState, think, dropBundle, startRoll, pokePanda, walkTo, SL,
  sprites(){return pandas.map(p=>({name:p.rosterId,state:p.state,frame:p.spP}))},
  clockHeads() { const t = performance.now() / 1000; return clocks.map((f) => [...flowerHead(f, t).map(Math.round), f.ready, +f.s.toFixed(2)]); },
  snap() { snapLight = true; stepLight(0); },
  swoop(i = 0) { kbSwoop(kiteBirds[i]); },
  calm() { return { br: calmBr, guide: breathNow(), lean: calmLean, still: calmStill, fade: calmFade }; },
  amb: AMB,
  env(patch) { LW.setEnv(patch); snapLight = true; stepLight(0); },
  arriveBird(i, kind) { const b = birds[i]; const t = performance.now() / 1000 % 20000; birdArrive(b, kind === 'panda' ? { kind: 'panda', panda: pandas[0] } : kind === 'stalk' ? { kind: 'stalk', stalk: frontStalks[0], f: stalkFracAtY(frontStalks[0], H * 0.38) } : { kind: 'ground', x: W * 0.55, s: 0.7 }, t); },
};
})();
</script>
