<script>
/* =====================================================================
   Night Train — a quiet carriage, window seat. The world slides by in
   parallax (city lights → suburbs → countryside → bridge over water →
   brief tunnels; fields and hills by day). A cup of chai rests on the table.
   The compartment is unoccupied. Small flocks pass outside the window.

   Click the window to skip to the next landscape.
   Dev keys: s stretch, w weather, t time.

   Art: art/train/bg-night.png and bg-day.png use a 1600×1000 stage.
   Window opening: x480…950, y322…550. Table: x580…850, y590…626.
   art/train/countryside-night.png and countryside-day.png supply matching moving fields.
   art/birds/sparrow.png is a shared four-frame transparent flight atlas.
   ===================================================================== */
'use strict';
(() => {
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

const approach = (v, t, rate, dt) => v + (t - v) * (1 - Math.exp(-rate * dt));
function mulberry(a) {

    a |= 0; a = (a + 0x6d2b79f5) | 0;

}

const timers = [];

const SANS = '-apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif';
const SERIF = '"Hoefler Text", "Baskerville", "Iowan Old Style", Georgia, serif';
const HAND = '"Marker Felt", "Noteworthy", "Chalkboard SE", cursive';
function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
function rr(g, x, y, w, h, r) {

function rrPath(p, x, y, w, h, r) {

  p.lineTo(x + w, y + h - r); p.quadraticCurveTo(x + w, y + h, x + w - r, y + h); p.lineTo(x + r, y + h);

const GLOW_WARM = sprite(128, [[0, 'rgba(255,214,150,1)'], [0.18, 'rgba(255,190,110,0.5)'], [0.5, 'rgba(255,160,80,0.12)'], [1, 'rgba(255,140,60,0)']]);
const GLOW_WHITE = sprite(128, [[0, 'rgba(255,255,255,1)'], [0.2, 'rgba(255,255,255,0.45)'], [0.55, 'rgba(255,255,255,0.1)'], [1, 'rgba(255,255,255,0)']]);
const GLOW_COOL = sprite(128, [[0, 'rgba(200,225,255,1)'], [0.2, 'rgba(170,205,255,0.4)'], [0.55, 'rgba(150,190,255,0.08)'], [1, 'rgba(150,190,255,0)']]);
const BLOB = sprite(64, [[0, 'rgba(255,255,255,0.9)'], [0.45, 'rgba(255,255,255,0.45)'], [1, 'rgba(255,255,255,0)']]);
const DARK = sprite(64, [[0, 'rgba(6,5,10,0.85)'], [0.5, 'rgba(6,5,10,0.45)'], [1, 'rgba(6,5,10,0)']]);
function drawSprite(g, sp, x, y, r, a, op = 'lighter') {

function hsl2rgb(h, s, l) {

function fitText(g, s, maxW) { s = s || ''; if (g.measureText(s).width <= maxW) return s; while (s.length > 1 && g.measureText(s + '…').width > maxW) s = s.slice(0, -1); return s + '…'; }
// smooth value noise (1D) for ridgelines
function vnoise(x, seed) {

// =====================================================================
//  art slots

const ART = { dir: 'art/train/', img: {} };
function loadArtSlots() {
  for (const name of ['bg-night', 'bg-day', 'countryside-night', 'countryside-night-sky', 'countryside-day']) {
    try {
      const im = new Image();
      im.onload = () => { if (!im.naturalWidth) return; ART.img[name] = im; clearTimeout(ART.rb); ART.rb = setTimeout(rebuild, 60); };
      im.onerror = () => {};

}
const artMode = () => !!(ART.img['bg-night'] || ART.img['bg-day']);

// =====================================================================
//  environment: time of day + weather (glides; never pops)
// =====================================================================
const KF = [
  { h: 0, top: '#0a1130', bot: '#2e3a66', day: 0, lamp: 1, city: 1, warm: 0 },
  { h: 5.0, top: '#0a1130', bot: '#2e3a66', day: 0, lamp: 1, city: 1, warm: 0 },
  { h: 6.3, top: '#2b3462', bot: '#e09e86', day: 0.32, lamp: 0.75, city: 0.55, warm: 0.9 },
  { h: 7.6, top: '#7aa1cf', bot: '#efe0cc', day: 0.8, lamp: 0.25, city: 0.08, warm: 0.3 },
  { h: 9, top: '#5f95d4', bot: '#d8e6ee', day: 1, lamp: 0.12, city: 0, warm: 0 },
  { h: 16.3, top: '#6696cf', bot: '#efdcc0', day: 0.95, lamp: 0.15, city: 0, warm: 0.2 },
  { h: 18.3, top: '#45507f', bot: '#f09a5e', day: 0.55, lamp: 0.72, city: 0.45, warm: 1 },
  { h: 19.6, top: '#1a2046', bot: '#6c4f72', day: 0.15, lamp: 1, city: 0.9, warm: 0.3 },

  { h: 24, top: '#0a1130', bot: '#2e3a66', day: 0, lamp: 1, city: 1, warm: 0 },

KF.forEach((k) => { k.topC = hex(k.top); k.botC = hex(k.bot); });
const WX = {
  cloudy: { d: ['#99a2b1', '#c8ccd2'], n: ['#141824', '#262a38'], amt: 0.6, day: 0.85, lamp: 0.3 },
  rain: { d: ['#6c7684', '#959daa'], n: ['#0b0e17', '#1a1f2c'], amt: 0.85, day: 0.6, lamp: 0.6 },
  storm: { d: ['#4b5262', '#6d7483'], n: ['#06080e', '#131723'], amt: 0.95, day: 0.45, lamp: 0.8 },
  snow: { d: ['#b8becb', '#dde1e8'], n: ['#1a1d2b', '#30344a'], amt: 0.75, day: 0.85, lamp: 0.45 },
  fog: { d: ['#b3b6bc', '#d2d4d7'], n: ['#1d2029', '#373a46'], amt: 0.85, day: 0.75, lamp: 0.5 },

let E = null, Et = null;
function computeTarget() {
  const env = LW.env || {};

// =====================================================================

    { x: o.lampR.x - 40, y: o.lampR.y + 140, rx: 320, ry: 560, k: 0.62, c: [1.0, 0.76, 0.48], kind: 'lamp' },

// =====================================================================
//  interior light model
// =====================================================================
function lightLevel(l) { return l.kind === 'ceil' ? 0.12 + 0.88 * E.lamp : E.lamp; }
function lightAt(x, y) {
  const a = E.amb; let r = a[0], g = a[1], b = a[2];
  for (const l of L.lights) {
    const lv = lightLevel(l); if (lv < 0.002) continue;
    const dx = (x - l.x) / l.rx, dy = (y - l.y) / l.ry, f = l.k * lv * Math.exp(-2.6 * (dx * dx + dy * dy));
    r += f * l.c[0]; g += f * l.c[1]; b += f * l.c[2];
  }
  const w = L.win, dx = (x - (w.x0 + w.w / 2)) / (w.w * 0.85), dy = (y - (w.y1 + 60)) / 360;
  const f = Math.exp(-2.6 * (dx * dx + dy * dy)), d = E.day * 0.45 * f, c = E.city * 0.06 * f;
  r += d * 0.98 + c * 0.6; g += d * 1.0 + c * 0.7; b += d * 1.04 + c;

function paintLightMap(g, sc) {

// =====================================================================

// =====================================================================
//  the route: biomes along the line, parallax layers generated per chunk
// =====================================================================
const ROUTE = [['city', 7200], ['sub', 6000], ['country', 9000], ['tunnel', 900], ['country', 5200], ['water', 3400], ['country', 5000], ['tunnel', 700], ['sub', 5600]];
const SEG = []; let RT = 0;

const BKEYS = ['city', 'sub', 'country', 'water'];

function biomeAt(d) {

  w[bType(s.t)] += f;

}

const elCache = new Map();
const routeD = (Ly, lx) => (lx - L.V.ww / 2) / Ly.f;
function chunk(id, i) {
  const key = id + ':' + i; let c = elCache.get(key); if (c) return c;
  if (elCache.size > 500) elCache.clear();
  const Ly = LAY[id], r = mulberry(hash(key) ^ 0x2c1b3c6d), lx0 = i * Ly.ch, d = routeD(Ly, lx0 + Ly.ch / 2), w = biomeAt(d);

  far(r, x0, cw, w) {

    if (b === 'city' || (b === 'sub' && r() < 0.5)) {
      let x = x0 + r() * 20;
      while (x < x0 + cw) { const bw = 18 + r() * 40, bh = (b === 'city' ? 40 + r() * 120 : 16 + r() * 40); out.push({ t: 'fbld', x, w: bw, h: bh, win: winGrid(r, bw, bh, 2, 3, 4, 5), ant: r() < 0.25 && bh > 90 }); x += bw + r() * 6; }
    } else if (r() < 0.6) for (let k = 0; k < 3; k++) out.push({ t: 'fdot', x: x0 + r() * cw, y: r() * 8, s: r() });
    return out;
  },
  back(r, x0, cw, w) {
    const out = [], b = pickB(r, w);
    if (b === 'water') return out;
    let x = x0 + r() * 30;
    while (x < x0 + cw) {
      if (b === 'city') { const bw = 40 + r() * 70, bh = 60 + r() * 170; out.push({ t: 'bld', x, w: bw, h: bh, col: r(), win: winGrid(r, bw, bh, 4, 5, 6, 6) }); x += bw + r() * 10; }
      else if (b === 'sub') { if (r() < 0.55) { const hw = 34 + r() * 30; out.push({ t: 'house', x, w: hw, h: 20 + r() * 14, roof: 10 + r() * 10, col: r(), lit: r() }); x += hw + 8 + r() * 20; } else { out.push({ t: 'trees', x, w: 50 + r() * 70, h: 26 + r() * 30, seed: r() }); x += 60 + r() * 60; } }
      else { out.push({ t: 'trees', x, w: 60 + r() * 140, h: 18 + r() * 34, seed: r() }); x += 80 + r() * 160; if (r() < 0.12) { out.push({ t: 'house', x, w: 30, h: 16, roof: 10, col: r(), lit: r() }); x += 40; } }
    }
    return out;
  },
  mid(r, x0, cw, w, d, i) {
    const out = [], b = pickB(r, w);
    if (b === 'water') { if (r() < 0.35) out.push({ t: 'boat', x: x0 + r() * cw, s: 0.7 + r() * 0.5 }); return out; }
    let x = x0 + r() * 30;

      out.push({ t: 'bld', x, w: bw, h: bh, col: r(), win: winGrid(r, bw, bh, 7, 9, 9, 9), sign: r() < 0.35 ? { hue: [r() < 0.5 ? 340 : 180, 40, 28][Math.floor(r() * 3)], y: 30 + r() * 60, w: 30 + r() * 30 } : null });

    }

      else { out.push({ t: 'tree', x: x + 20, h: 70 + r() * 60, r: 26 + r() * 18, seed: r() }); x += 60 + r() * 40; }

    }

      if (r() < 0.16) out.push({ t: 'farm', x: x0 + r() * (cw - 100), w: 90, h: 46, col: r(), lit: r() });
      if (r() < 0.25) for (let k = 0; k < 3; k++) out.push({ t: 'bale', x: x0 + r() * cw, s: 0.7 + r() * 0.5 });
    }
    if (b !== 'city') { const p0 = Math.ceil(x0 / 240) * 240; for (let p = p0; p < x0 + cw; p += 240) out.push({ t: 'pole', x: p }); }
    return out;
  },
  near(r, x0, cw, w, d) {

    else out.push({ t: 'wall', x: x0, w: cw, h: 22 + r() * 6 });

  },

// =====================================================================
//  the train: speed, distance, track joints, rocking, skips

function sSlide() { const a = ac(); if (!a) return; const o = outNode(a), t = a.currentTime + 0.02; noiseHit(a, t, 1.0, 'lowpass', 900, 0.7, 0.02, o); tone(a, t + 1.1, 2900, 2850, 0.4, 0.016, o); }

// =====================================================================
//  background ambience → LW.bus('ambience'), weather beds → LW.bus('weather')

const AMB = { a: null, bus: null, wx: null, L: {}, bufs: {}, ev: {} };

setInterval(() => {
  try {
    if (!AMB.a && !ambStart()) return;
    const a = AMB.a;

    ambUpdate(a, a.currentTime, 0.25, AMB.bus, AMB.wx);
  } catch (e) { console.error(e); }
}, 250);

// the sleeper at night: wheel rumble, da-dum … da-dum over the rail joints (rate follows train.v),
// carriage creaks, the ceiling fan, a far-off horn, tunnel whoosh; rain on the glass on the weather bus
function ambBuild(a, B, X) {
  ambLoop('rumble', 'brown', 'lowpass', 110, 0.8, B);     // wheels on rail, through the floor
  ambLoop('rail', 'pink', 'bandpass', 820, 0.7, B);       // steel-on-steel hiss
  ambLoop('air', 'pink', 'bandpass', 1500, 0.5, B);       // night air past the window bars
  ambLoop('fan', 'pink', 'bandpass', 240, 1.6, B, 4.4);   // the ceiling fan: soft whirr, blade flutter
  ambOsc('fanHum', 96, B);                                // … and its motor
  ambLoop('rain', 'pink', 'highpass', 1300, 0.5, X);      // rain streaking the glass
  ambLoop('rainLow', 'brown', 'lowpass', 600, 0.5, X);

function sClack(a, t, v, amp, o, bridge) {   // one bogie over a joint: da-dum
  const gap = clamp(26 / Math.max(60, v), 0.08, 0.3), f = 480 + 500 * bridge;

function sCreak(a, t, amp, o) {             // the carriage flexing: a short bandpassed sawtooth groan

// =====================================================================
//  interaction
// =====================================================================
function onDown(px, py) {
  if (!L) return;
  let [x, y] = toWorld(px, py); x -= rock.x; y -= rock.y;
  const T = nowS();
  if (water && Math.abs(x - L.glass.x) < 60 && y > L.glass.y - 110 && y < L.glass.y + 10) { water.sip = 1; if (water.out < 0) water.out = 0; return; }

LW.on('down', onDown);
LW.on('env', () => { computeTarget(); });
LW.on('reminder', (r) => {
  if (!r) return;
  if (r.kind === 'water') startWater(r.text);
  else if (r.kind === 'stretch') startStretch(r.text);
  else if (r.kind === 'breathe') setCalm(true, 60);

LW.on('calm', (on) => setCalm(!!on, 0, true));
LW.on('action', (a) => {
  if (a === 'water') startWater();
  else if (a === 'stretch') startStretch();
  else if (a === 'calm' || a === 'breathe') setCalm(!calm.on, a === 'breathe' ? 60 : 0);

if (!LW.isHost) addEventListener('keydown', (e) => {
  if (e.key === 's') startStretch('roll your shoulders');
});

// =====================================================================
//  frame
// =====================================================================
let tPrev = nowS(), perfAcc = 0, perfN = 0, perfMs = 0;
function frame() {
  requestAnimationFrame(frame);

}
function step(dt, T) {

  calm.lv = approach(calm.lv, calm.on ? 1 : 0, calm.on ? 0.6 : 0.9, dt);
  stepGuide(dt);
  updateEnv(dt);
  if (note && T > note.until) note = null;
  updateTrain(dt, T);

  flash.t += dt;
  if (E.storm > 0.5 && flash.t > flash.next) { flash.t = 0; flash.next = rand(9, 26); later(rand(1.5, 4), sThunder); }

  const bl = calm.lv > 0.01 ? breath() : 0;
  const lv = lerp(E.lamp * (1 - E.day), 0.12 + 0.88 * bl, calm.lv);
  if (lv > 0.02) for (const lp of [L.lampL, L.lampR]) {
    drawSprite(ctx, GLOW_WARM, lp.x, lp.y + 6, 60 + 60 * calm.lv * bl, 0.45 * lv);
    if (calm.lv > 0.01) drawSprite(ctx, GLOW_WARM, lp.x, lp.y + 70, 150 + 200 * bl, 0.3 * calm.lv * lv);   // the pool it casts on the wall + berth
  }

    const tw=ctx.measureText(note.text).width+32,x=L.table.cx,y=900;

// =====================================================================
//  boot
// =====================================================================
function rebuild() {

  E.amb = envAmb();

}
let rsT = null;
addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(rebuild, 150); });
computeTarget();
E.amb = envAmb();
rebuild();
loadArtSlots();
if (LW.calm) setCalm(true);
requestAnimationFrame(frame);

// dev hooks: perf + identity self-test

    LW.advance(1/30);maxBirds=Math.max(maxBirds,outsideBirds.length);
