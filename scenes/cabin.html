'use strict';
/* =====================================================================
   Snowy Cabin — a lived-in log cabin on a winter night (or a summer
   evening), as a music wallpaper. Painted plates (Codex) for the room by
   night and by day (identical geometry), a live view through the window
   (four painted landscapes: winter/summer × day/night, graded for dusk and
   weather, three depths of falling snow with wind and parallax, snow that
   builds up on the outside of the panes and melts later, frost at the
   corners, sleet/rain, fireflies, the real-phase moon), and a real fire:
   a painted flipbook of flames behind a painted log grate with glowing
   coals, embers, smoke curling up the flue, and the fire's light flickering
   on the stones, hearth, rug and the animals.

   Music: the record player on the walnut cabinet is THE player (artwork on
   the spinning label + the sleeve leaning beside it + a small card with the
   title). Click it = play/pause · click the window = next. The framed print
   above the mantel is a display that mirrors the artwork.

   Pets: Maple (golden puppy: rug by the fire, in front of the record
   cabinet) and Ember (orange cat: the armchair seat and its back, the rug).
   Lit by the light where they are (warm firelight + a rim on the fire side,
   cool window light by day), soft contact + fire-cast shadows, believable
   scale for the furniture. LW.settings.pets === false → they walk out of
   the room and stay away; back on → they wander in again.

   Layout: hero objects stay inside LW.layout.clear; side:'left' mirrors the
   whole room (window on the left, hero on the right).

   ART (scenes/art/cabin/):
     room-night.jpg, room-day.jpg   1586×992 plates (the 1600×1000 stage), window glass is a
                                    flat #0B1A2C placeholder (cut out at bake)
     room-{night,day}-wide.jpg       a wider repaint of the room, used only for the side panels on
                                    ultrawide screens (coat rack / snowshoes left, bench right)
     outside-{winter,summer}-{night,day}.jpg  1254² window views
     fire.jpg        8-frame flame flipbook on black (420×400 cells, base at y 372), added with 'lighter'
     logs.webp        burning log grate (transparent)
     smoke.jpg       4 smoke wisps on black (screen)
     turntable.webp   record player without tonearm (transparent; tonearm + label art are live)
     bowl.webp, mug.webp, glass.webp, slippers.webp   small lived-in props (transparent)
   Pets use the shared sprites in scenes/art/sprites/ (dogs/golden, cats/orange).
   ===================================================================== */

}
function drawSpriteXY(g, sp, x, y, rx, ry, a, op = 'lighter') {

  g.globalCompositeOperation = op; g.globalAlpha = Math.min(1, a);

//  art
// =====================================================================
const ART = {};

  'outside-summer-day.jpg', 'fire.jpg', 'logs.webp', 'smoke.jpg', 'turntable.webp', 'bowl.webp', 'mug.webp', 'glass.webp', 'slippers.webp'];

  for (const f of ART_FILES) {
    const im = new Image(), name = f.replace(/\.\w+$/, '');
    im.onload = () => { if (im.naturalWidth > 1) { ART[name] = im; artDirty = true; if (/^(bowl|mug|glass|slippers)$/.test(name)) PROPS[name] = im; if (name === 'outside-winter-day') paintIdleArt(); } };

// small props (cut-outs): drawn lit by the light where they stand
const PROPS = {};
// =====================================================================
//  environment: time of day, weather, season (glides; never pops)
// =====================================================================
const KF = [
  { h: 0, top: '#060a1c', bot: '#18223f', day: 0 },
  { h: 5.2, top: '#060a1c', bot: '#18223f', day: 0 },
  { h: 6.6, top: '#2e3868', bot: '#e3a596', day: 0.35 },
  { h: 8.2, top: '#7aa2d2', bot: '#e8e2d6', day: 0.85 },
  { h: 11, top: '#76a6da', bot: '#dce9f3', day: 1 },
  { h: 16.0, top: '#7098cc', bot: '#efdcc0', day: 0.92 },
  { h: 17.8, top: '#4a5590', bot: '#f2a070', day: 0.55 },
  { h: 19.2, top: '#1c2350', bot: '#7a4e7a', day: 0.16 },
  { h: 20.6, top: '#080c22', bot: '#1c2446', day: 0 },
  { h: 24, top: '#060a1c', bot: '#18223f', day: 0 },
];
KF.forEach((k) => { k.topC = hex(k.top); k.botC = hex(k.bot); });
const WX = { cloudy: { amt: 0.6, day: 0.85 }, rain: { amt: 0.85, day: 0.6 }, storm: { amt: 0.95, day: 0.5 }, snow: { amt: 0.8, day: 0.8 }, fog: { amt: 0.85, day: 0.78 } };
let E = null, Et = null;
function seasonFor(env) {
  const s = (LW.settings && LW.settings.season) || 'auto';
  if (s === 'summer') return 1;
  if (s === 'winter') return 0;
  if (env.weather === 'snow') return 0;
  return (+env.temp || 0) >= 22 ? 1 : 0;   // a snowy cabin by default; only a properly warm day turns it to summer
}
function computeTarget() {
  const env = LW.env || {};
  const hr = (((+env.hour || 0) % 24) + 24) % 24;
  let a = KF[0], b = KF[1];
  for (let i = 0; i < KF.length - 1; i++) if (hr >= KF[i].h && hr <= KF[i + 1].h) { a = KF[i]; b = KF[i + 1]; break; }

  const top = mix3(a.topC, b.topC, t), bot = mix3(a.botC, b.botC, t);

// the cabin: the fire (roar, crackles, the odd pop), a ticking clock, snow-muffled quiet; the wind
// around the walls (a howl in a blizzard) and sleet/rain on the weather bus; summer-night crickets far off
function ambBuild(a, B, X) {
  ambLoop('room', 'brown', 'lowpass', 110, 0.7, B);       // the hush of a snowed-in room
  ambLoop('fire', 'brown', 'lowpass', 300, 0.7, B);       // the fire breathing
  ambLoop('fireHiss', 'pink', 'bandpass', 2600, 0.6, B);  // sap hissing
  ambLoop('wind', 'pink', 'bandpass', 420, 0.7, X);       // wind around the walls …
  ambLoop('eaves', 'pink', 'bandpass', 1050, 11, X);      // … whistling at the eaves in a blizzard

let demoI = 0;
const demoArt = [];

  { title: 'Embers & Snowfall', artist: 'The Hearthside Trio', album: 'Cabin Sessions', c: ['#5a2418', '#f2b46a', '#1a0c08'] },
  { title: 'Pine Needles', artist: 'Juniper Lane', album: 'Winter Light', c: ['#1e3a3a', '#e8d8b0', '#0a1414'] },
  { title: 'Northern Lights', artist: 'Aurora Bay', album: 'Long Night', c: ['#16204a', '#7af0c0', '#06081a'] },
];
function demoTrack(i) {

function gust() { for (const arr of flakes) for (const f of arr) { f.x += rand(10, 40); f.y += rand(-20, 6); } }

// =====================================================================
//  frame
// =====================================================================
let tPrev = nowS();
function frame() {

  render(T);
}
function step(dt, T) {
  runTimers();
  view.dt = dt;

  calm.lv = approach(calm.lv, calm.on ? 1 : 0, calm.on ? 0.6 : 0.9, dt);

  updateEnv(dt);

  music.pulse *= Math.exp(-dt * 5);

  drawSleeve(g, T);
  drawCard(g, T);

  drawMug(g);
  petSystem.draw(g);

  drawParticles(g);
