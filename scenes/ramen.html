<script>
'use strict';
/* =====================================================================
   Ramen Alley — a narrow Tokyo back alley at night, as a music wallpaper.

   World units: the scene is 1000 units tall; width follows the aspect.
   The composition lives on a 1600-wide "stage" centred on screen (16:10);
   wider screens see more alley wall, narrower ones crop the sides.
   The alley is drawn in true one-point perspective (P(X,Y,Z), metres).

   Static scenery is painted once per light/weather change (albedo ×
   soft light map + emissive signs), cached, and crossfaded. Each frame
   draws that image plus the moving things: lanterns, noren, steam, the
   vending-machine screen (album artwork), radio display, cats, weather.

   ART SLOTS (optional, for future painted art) — scenes/art/ramen/*.png
   Every file is optional; anything missing (404) falls back to the
   procedural drawing. Loaded once at startup with new Image().
   ┌───────────────────────┬────────────┬──────────────────────────────────┐
   │ file                  │ size (px)  │ notes                            │
   ├───────────────────────┼────────────┼──────────────────────────────────┤
   │ bg-night.png          │ 3200×2000  │ static alley painting, 16:10.    │
   │ bg-dusk.png           │ 3200×2000  │ Mapped onto the 1600×1000 stage  │
   │ bg-day.png            │ 3200×2000  │ (centred, full height). Paint it │
   │                       │            │ to match the procedural layout   │
   │                       │            │ (stall left, vending machine +   │
   │                       │            │ beer crates centre-right, calm   │
   │                       │            │ wall + shoji door far right;     │
   │                       │            │ vanishing point x=640,y=470 of   │
   │                       │            │ 1600×1000). Leave OUT: lanterns, │
   │                       │            │ noren, steam, cats, vending      │
   │                       │            │ screen, radio display (live).    │
   └───────────────────────┴────────────┴──────────────────────────────────┘
   CATS use the shared illustrated sprites (see scenes/art/sprites/README.md):
     art/sprites/cats/calico/{walk1,walk2,sit,sleep}.png              — Mikan
     art/sprites/cats/black/{walk1,walk2,sit,loaf,sleep,stretch}.png  — Nori
   all facing RIGHT, feet at the bottom edge; scaled so walk1 spans 176
   world units at depth 2.45 m. Missing poses fall back (loaf→sit,
   stretch→squashed walk1, sleep→loaf); until a set has loaded the cat is
   drawn with the procedural side-view rig.
   Animal PNGs replace the procedural rig but still get the scene's
   lighting tint, breathing and beat-bob transforms.
   ===================================================================== */
(() => {
const SCENE_ID = 'ramen';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgba = (c, a = 1) => `rgba(${clamp(c[0] | 0, 0, 255)},${clamp(c[1] | 0, 0, 255)},${clamp(c[2] | 0, 0, 255)},${a})`;
const mul = (c, m) => [c[0] * m[0], c[1] * m[1], c[2] * m[2]];
const lum = (c) => (c[0] + c[1] + c[2]) / 3;
const approach = (v, t, rate, dt) => v + (t - v) * (1 - Math.exp(-rate * dt));
function mulberry(a) {

}
const hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const nowS = () => performance.now() / 1000;
const timers = [];
const later = (sec, fn) => timers.push({ at: nowS() + sec, fn });
function runTimers() { const T = nowS(); for (let i = timers.length - 1; i >= 0; i--) if (timers[i].at <= T) { const f = timers[i].fn; timers.splice(i, 1); try { f(); } catch (e) { console.error(e); } } }
const SANS = '-apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif';
const SERIF = '"Hoefler Text", "Baskerville", "Iowan Old Style", Georgia, serif';
const MONO = '"SF Mono", Menlo, ui-monospace, monospace';
function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
function rr(g, x, y, w, h, r) {

  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);

}
function ellGrad(g, x, y, rx, ry, col, a, stops = 6) {

  const gr = g.createRadialGradient(0, 0, 0, 0, 0, 1);
  for (let i = 0; i <= stops; i++) { const t = i / stops; gr.addColorStop(t, rgba(col, a * Math.exp(-2.6 * t * t) * (1 - t * t * t))); }

}
function sprite(size, stops) {

  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);

  g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
}
const GLOW_WARM = sprite(128, [[0, 'rgba(255,214,150,1)'], [0.18, 'rgba(255,190,110,0.5)'], [0.5, 'rgba(255,160,80,0.12)'], [1, 'rgba(255,140,60,0)']]);
const GLOW_RED = sprite(128, [[0, 'rgba(255,170,110,1)'], [0.2, 'rgba(255,90,60,0.5)'], [0.55, 'rgba(230,50,40,0.12)'], [1, 'rgba(200,30,30,0)']]);
const GLOW_WHITE = sprite(128, [[0, 'rgba(255,255,255,1)'], [0.2, 'rgba(255,255,255,0.45)'], [0.55, 'rgba(255,255,255,0.1)'], [1, 'rgba(255,255,255,0)']]);
const GLOW_COOL = sprite(128, [[0, 'rgba(210,235,255,1)'], [0.25, 'rgba(160,205,255,0.4)'], [0.6, 'rgba(120,170,255,0.08)'], [1, 'rgba(100,150,255,0)']]);
const BLOB = sprite(64, [[0, 'rgba(255,255,255,0.9)'], [0.45, 'rgba(255,255,255,0.45)'], [1, 'rgba(255,255,255,0)']]);
const STEAM = sprite(64, [[0, 'rgba(255,240,222,0.8)'], [0.5, 'rgba(255,236,215,0.35)'], [1, 'rgba(255,230,210,0)']]);
const VIGNETTE = (() => { const c = newCanvas(320, 200), g = c.getContext('2d'); g.setTransform(1, 0, 0, 200 / 320, 0, 0); const gr = g.createRadialGradient(160, 160, 60, 160, 160, 230); gr.addColorStop(0, 'rgba(4,3,10,0)'); gr.addColorStop(0.6, 'rgba(4,3,10,0.16)'); gr.addColorStop(1, 'rgba(4,3,10,0.6)'); g.fillStyle = gr; g.fillRect(0, 0, 320, 320); return c; })();
const DARK = sprite(64, [[0, 'rgba(6,5,12,0.85)'], [0.5, 'rgba(6,5,12,0.45)'], [1, 'rgba(6,5,12,0)']]);
function drawSprite(g, sp, x, y, r, a, op = 'lighter') {
  if (a <= 0.003) return;
  g.globalCompositeOperation = op; g.globalAlpha = Math.min(1, a);
  g.drawImage(sp, x - r, y - r, r * 2, r * 2);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
}
function drawSpriteXY(g, sp, x, y, rx, ry, a, op = 'lighter') {
  if (a <= 0.003) return;
  g.globalCompositeOperation = op; g.globalAlpha = Math.min(1, a);
  g.drawImage(sp, x - rx, y - ry, rx * 2, ry * 2);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
}
function fitText(g, s, maxW) { s = s || ''; if (g.measureText(s).width <= maxW) return s; while (s.length > 1 && g.measureText(s + '…').width > maxW) s = s.slice(0, -1); return s + '…'; }

// kanji-like glyph (not real text): a few brush strokes in a 10×10 cell
function glyph(g, cx, cy, s, seed, col, w) {
  const r = mulberry(seed);
  g.save(); g.translate(cx - s / 2, cy - s / 2); g.scale(s / 10, s / 10);
  g.strokeStyle = col; g.lineWidth = (w * 10) / s; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath();
  const part = (x0, y0, x1, y1, n) => {
    const ww = x1 - x0, hh = y1 - y0;
    for (let i = 0; i < n; i++) {
      const t = r();
      if (t < 0.36) { const y = y0 + hh * (0.12 + 0.76 * r()), a = x0 + ww * r() * 0.22, b = x1 - ww * r() * 0.22; g.moveTo(a, y); g.lineTo(b, y + (r() - 0.6) * 0.4); }
      else if (t < 0.66) { const x = x0 + ww * (0.15 + 0.7 * r()), a = y0 + hh * r() * 0.2, b = y1 - hh * r() * 0.15; g.moveTo(x, a); g.lineTo(x, b); }
      else if (t < 0.8) { const bx = x0 + ww * 0.18, by = y0 + hh * (0.18 + r() * 0.35), bw = ww * 0.64, bh = hh * 0.32; g.moveTo(bx, by); g.lineTo(bx + bw, by); g.lineTo(bx + bw, by + bh); g.moveTo(bx, by); g.lineTo(bx, by + bh); g.lineTo(bx + bw, by + bh); }
      else if (t < 0.93) { const x = x0 + ww * (0.3 + r() * 0.4), y = y0 + hh * 0.15; g.moveTo(x, y); g.quadraticCurveTo(x - ww * 0.12, y + hh * 0.5, x0 + ww * 0.04, y1 - hh * 0.04); }
      else { const x = x0 + ww * (0.2 + r() * 0.6), y = y0 + hh * (0.08 + r() * 0.3); g.moveTo(x, y); g.lineTo(x + ww * 0.1, y + hh * 0.12); }
    }
  };
  const lay = r();
  if (lay < 0.4) { part(0.4, 0.6, 3.8, 9.6, 2 + ((r() * 2) | 0)); part(4.5, 0.4, 9.6, 9.6, 3 + ((r() * 2) | 0)); }
  else if (lay < 0.72) { part(0.4, 0.4, 9.6, 4.1, 2 + ((r() * 2) | 0)); part(0.6, 4.7, 9.4, 9.6, 3 + ((r() * 2) | 0)); }

// =====================================================================
//  art slots (optional PNGs; procedural fallback)
// =====================================================================
const ART = {};
const ART_SLOTS = ['bg-night', 'bg-dusk', 'bg-day'];
let artDirty = false;
function loadArtSlots() {
  for (const name of ART_SLOTS) {
    try {
      const im = new Image();
      im.onload = () => { if (im.naturalWidth > 1) { ART[name] = im; if (name.startsWith('bg-')) artDirty = true; } };
      im.onerror = () => {};
      im.src = 'art/' + SCENE_ID + '/' + name + '.png';
    } catch (e) { /* ignore */ }
  }
}

// =====================================================================
//  environment: time of day + weather (glides over ~30 s; never pops)
// =====================================================================
const KF = [
  { h: 0, top: '#0a0c20', bot: '#2c2244', day: 0, lamp: 1, warm: 0 },
  { h: 4.8, top: '#0a0c20', bot: '#2c2244', day: 0, lamp: 1, warm: 0 },
  { h: 6.2, top: '#2d3566', bot: '#d89a8c', day: 0.32, lamp: 0.75, warm: 0.8 },
  { h: 7.8, top: '#7aa0cc', bot: '#e9dccb', day: 0.82, lamp: 0.22, warm: 0.3 },
  { h: 10, top: '#6c9bd0', bot: '#d6e4ee', day: 1, lamp: 0.1, warm: 0 },
  { h: 16.2, top: '#6a96cc', bot: '#ecd9bd', day: 0.95, lamp: 0.14, warm: 0.25 },
  { h: 18.2, top: '#4a5288', bot: '#ee9a66', day: 0.58, lamp: 0.7, warm: 1 },
  { h: 19.5, top: '#1c2050', bot: '#7a4e78', day: 0.16, lamp: 1, warm: 0.35 },
  { h: 21, top: '#0a0c20', bot: '#2c2244', day: 0, lamp: 1, warm: 0 },
  { h: 24, top: '#0a0c20', bot: '#2c2244', day: 0, lamp: 1, warm: 0 },
];
KF.forEach((k) => { k.topC = hex(k.top); k.botC = hex(k.bot); });
const WX = {
  cloudy: { d: ['#98a0ae', '#c6cad0'], n: ['#15172a', '#2c2a40'], amt: 0.6, day: 0.85, lamp: 0.25 },
  rain: { d: ['#6a7382', '#939aa6'], n: ['#0b0d18', '#1d1d30'], amt: 0.85, day: 0.6, lamp: 0.7 },
  storm: { d: ['#4a5060', '#6a7080'], n: ['#06070e', '#14141f'], amt: 0.95, day: 0.45, lamp: 0.85 },
  snow: { d: ['#b8becb', '#dde1e8'], n: ['#1a1c2c', '#33334a'], amt: 0.75, day: 0.85, lamp: 0.45 },
  fog: { d: ['#b0b3ba', '#d0d2d6'], n: ['#1c1f2a', '#3a3a4a'], amt: 0.85, day: 0.75, lamp: 0.55 },
};
let E = null, Et = null;
function computeTarget() {
  const env = LW.env || {};
  const hr = (((+env.hour || 0) % 24) + 24) % 24;
  let a = KF[0], b = KF[1];
  for (let i = 0; i < KF.length - 1; i++) if (hr >= KF[i].h && hr <= KF[i + 1].h) { a = KF[i]; b = KF[i + 1]; break; }
  const t = smooth((hr - a.h) / Math.max(0.001, b.h - a.h));
  const n = (k) => lerp(a[k], b[k], t);
  let top = mix3(a.topC, b.topC, t), bot = mix3(a.botC, b.botC, t);
  let day = n('day'), lamp = n('lamp'), warm = n('warm');
  const w = env.weather || 'clear';
  const it = clamp(env.intensity == null ? 0.7 : +env.intensity, 0, 1);
  let rain = 0, storm = 0, snow = 0, fog = 0, cloud = 0.15, moon = (1 - day) * (hr > 19 || hr < 6 ? 1 : 0);
  const X = WX[w];
  if (X) {
    const f = X.amt * (0.6 + 0.4 * it);
    top = mix3(top, mix3(hex(X.n[0]), hex(X.d[0]), day), f);
    bot = mix3(bot, mix3(hex(X.n[1]), hex(X.d[1]), day), f);
    day *= lerp(1, X.day, 0.6 + 0.4 * it);
    lamp = Math.max(lamp, X.lamp * (0.7 + 0.3 * it));
    warm *= 0.3; moon *= w === 'cloudy' ? 0.25 : 0; cloud = w === 'cloudy' ? 0.8 : 1;
    if (w === 'rain') rain = 0.45 + 0.55 * it;
    if (w === 'storm') { rain = 0.75 + 0.25 * it; storm = 1; }
    if (w === 'snow') snow = 0.4 + 0.6 * it;
    if (w === 'fog') fog = 0.55 + 0.45 * it;
  }
  const litFrac = hr >= 18 || hr < 0.5 ? 0.5 : hr < 1.5 ? 0.42 : hr < 5 ? 0.2 : hr < 7.5 ? 0.35 : 0.05;
  const warmNight = (+env.temp || 20) > 12 ? 1 : 0;
  moon *= LW.moonVisibility();
  Et = { hour: hr, weather: w, it, top, bot, day, lamp, warm, rain, storm, snow, fog, cloud, moon, litFrac, warmNight };
  if (!E) { E = JSON.parse(JSON.stringify(Et)); E.wet = rain > 0 ? 1 : 0.15; E.snowCover = snow > 0 ? 1 : 0; }
}
const ENV_KEYS = ['day', 'lamp', 'warm', 'rain', 'storm', 'snow', 'fog', 'cloud', 'moon', 'litFrac', 'it', 'warmNight'];
let lastBake = -99, bakedSnap = null, fade = 1;
function envAmb() {
  const night = [0.2, 0.2, 0.31], dayA = mix3([0.82, 0.8, 0.78], [0.76, 0.79, 0.85], E.cloud * 0.6);
  const a = mix3(night, dayA, E.day);
  return mix3(a, mul(a, [1.14, 0.95, 0.8]), E.warm * E.day);
}
function updateEnv(dt) {
  const k = LW.envBlend(dt, 9);
  for (const key of ENV_KEYS) E[key] += (Et[key] - E[key]) * k;
  for (const key of ['top', 'bot']) for (let i = 0; i < 3; i++) E[key][i] += (Et[key][i] - E[key][i]) * k;

  const diff = bakedSnap ? Math.max(...snap.map((v, i) => Math.abs(v - bakedSnap[i]))) : 1;

const envSnap = () => [...ENV_KEYS.map((q) => E[q] * (q === 'litFrac' ? 0.5 : 1)), E.wet * 0.5, E.snowCover * 0.5, ...E.top.map((v) => v / 255), ...E.bot.map((v) => v / 255)];

// =====================================================================
//  layout + perspective
// =====================================================================
const HY = 470, F = 700, EYE = 1.5, XL = -2.45, XR = 2.1, ZEND = 24;
let dpr = 1, cssW = 1, cssH = 1, U = 1, W = 1600, H = 1000;
let L = null;
function P(X, Y, Z) { const s = F / Z; return [L.vx + X * s, HY - (Y - EYE) * s]; }

function quad(g, a, b, c, d) { g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.lineTo(c[0], c[1]); g.lineTo(d[0], d[1]); g.closePath(); }

function computeLayout() {

  const vx = o.vx;
  // ---- the yatai (ramen stall) ----
  const s = { X0: -2.30, X1: -0.25, Zf: 3.25, Zb: 4.6, top: 1.0, roof: 2.45 };
  const sf = SC(s.Zf);

  s.ny0 = HY - (2.4 - EYE) * SC(3.2); s.ny1 = HY - (1.8 - EYE) * SC(3.2);

  // lanterns hang from the fascia corners
  o.lanterns = [
    { x: vx - 2.4 * SC(3.1), y: s.fy1 + 4, len: 46, bh: 112, bw: 76, th: 0, om: 0, seed: 11 },
    { x: vx - 0.15 * SC(3.1), y: s.fy1 + 4, len: 46, bh: 112, bw: 76, th: 0, om: 0, seed: 23 },
  ];
  // pots (cook side) + bowl on the counter = steam sources
  const pz = SC(4.15);
  o.pots = [
    { x: vx - 1.5 * pz, w: 0.5 * pz, y0: HY - (1.32 - EYE) * pz, y1: HY - (0.92 - EYE) * pz },
    { x: vx - 0.92 * pz, w: 0.4 * pz, y0: HY - (1.23 - EYE) * pz, y1: HY - (0.92 - EYE) * pz },
  ];
  const cz = SC(3.45);
  o.bowl = { x: vx - 1.55 * cz, y: HY - (1.0 - EYE) * cz + 2, r: 30 };

// ---- weather (live) --------------------------------------------------------
function inStallCover(x, y) { const s = L.stall; return x > s.fxl - 6 && x < s.fxr + 6 && y > s.fy0 - 10 && y < s.cy; }
function updateWeather(dt, T) {
  const wind = (LW.env.wind || 0.3) + E.storm * 0.6;
  // rain
  const rainN = Math.round(E.rain * 260);
  while (drops.length < rainN) drops.push({ x: rand(-50, W + 50), y: rand(-200, H), z: rand(0.4, 1), v: rand(900, 1300) });
  if (drops.length > rainN) drops.length = rainN;
  for (const d of drops) {
    d.y += d.v * d.z * dt; d.x += wind * 160 * d.z * dt;
    const gy = HY + (H - HY) * (0.15 + 0.85 * d.z);
    if (d.y > gy) {
      if (Math.random() < 0.25) ripples.push({ x: d.x, y: gy, t: 0, life: 0.5, r: 3 + 6 * d.z, flat: 0.25 });
      d.y = rand(-120, -10); d.x = rand(-80, W + 40);
    }
  }
  // ripples in puddles
  if (E.rain > 0.05 && E.wet > 0.3) {
    const n = E.rain * 22 * dt;
    for (let i = 0; i < n + (Math.random() < n % 1 ? 1 : 0); i++) {
      const p = L.puddles[(Math.random() * L.puddles.length) | 0], grow = 0.35 + 0.75 * E.wet;
      const a = Math.random() * TAU, rr2 = Math.sqrt(Math.random()) * 0.8;
      const X = p.X + Math.cos(a) * p.rx * rr2 * grow, Z = p.Z + Math.sin(a) * p.rz * rr2 * grow;
      const q = P(X, 0, Z), s = SC(Z);
      ripples.push({ x: q[0], y: q[1], t: 0, life: rand(0.8, 1.3), r: 0.12 * s, flat: EYE / Z });
    }
  }
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > ripples[i].life) ripples.splice(i, 1); }
  if (ripples.length > 220) ripples.splice(0, ripples.length - 220);
  // drips from the stall roof edge + lantern tassels
  if (E.rain > 0.1 || (E.wet > 0.6 && E.rain > 0.02)) {
    for (const d of L.drips) { d.t -= dt * (0.5 + E.rain); if (d.t <= 0) { d.t = rand(0.6, 2.2); dripsF.push({ x: d.x, y: d.y, v: 0, gy: d.gy }); } }
    for (const ln of L.lanterns) { ln.dripT = (ln.dripT || rand(1, 3)) - dt * (0.4 + E.rain); if (ln.dripT <= 0 && ln.tip) { ln.dripT = rand(1.2, 3.2); dripsF.push({ x: ln.tip[0], y: ln.tip[1], v: 0, gy: HY + EYE * SC(3.05) }); } }
  }
  for (let i = dripsF.length - 1; i >= 0; i--) {
    const d = dripsF[i]; d.v += 1600 * dt; d.y += d.v * dt;
    if (d.y > d.gy) { ripples.push({ x: d.x, y: d.gy, t: 0, life: 0.7, r: 7, flat: 0.3 }); dripsF.splice(i, 1); }
  }
  // snow
  const snowN = Math.round(E.snow * 240);
  while (flakes.length < snowN) flakes.push({ x: rand(-50, W + 50), y: rand(-50, H), z: rand(0.3, 1), ph: rand(0, 6), s: rand(0.7, 1.4) });
  if (flakes.length > snowN) flakes.length = snowN;
  for (const f of flakes) {

    const gy = HY + (H - HY) * (0.15 + 0.85 * f.z);
    if (f.y > gy || f.x > W + 60) { f.y = rand(-40, -5); f.x = rand(-60, W); }
  }
  // lightning
  if (E.storm > 0.5) { flash.next -= dt; if (flash.next <= 0) { flash.t = 0; flash.next = rand(9, 22); later(rand(1.2, 3), sThunder); } }
  flash.t += dt;
  // a car passing on the far street now and then (headlight sweep)

  if (carT <= 0 && !car) { car = { t: 0, dir: Math.random() < 0.5 ? 1 : -1 }; carT = rand(14, 40); }
  if (car) { car.t += dt; if (car.t > 2.4) car = null; }
  // moths around the vending light on warm, dry nights
  const mothOK = (1 - E.day) > 0.6 && E.rain < 0.05 && E.snow < 0.05 && E.warmNight > 0.5 && !calm.on;
  const want = mothOK ? 3 : 0;
  while (moths.length < want) moths.push({ x: L.vend.scr.x + rand(0, L.vend.scr.w), y: L.vend.y0 + rand(20, 120), vx: 0, vy: 0, ph: rand(0, 6), a: 0 });
  for (let i = moths.length - 1; i >= 0; i--) {

    m.vx *= 1 - dt * 1.2; m.vy *= 1 - dt * 1.2;
