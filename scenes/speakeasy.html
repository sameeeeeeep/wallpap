<script>
'use strict';
(() => {
// =====================================================================
//  Speakeasy — a hidden 1920s jazz bar, late at night, as a live wallpaper.
//  BEAT-SYNC ONLY: there is no player and no track UI here. A self-playing
//  upright player piano on the stage plays along with whatever the user is
//  listening to — its paper roll scrolls, keys go down across the keyboard
//  with the mids/highs, the low keys and the sustain pedal with the bass —
//  and the stage spotlight, footlights and the poster's bulbs pulse gently
//  with the beat. Paused/silent → the piano rests and the lights hold steady
//  and warm. The jukebox is silent decor. A black cat roams piano lid ↔
//  stage edge ↔ booths; a golden pup naps by the booths and the stage.
//  Pets leave (and come back) with LW.settings.pets.
//
//  World: a fixed 1000-unit-tall "design" stage scaled to the screen height.
//  The camera puts world x 1500 at 70% of the screen width (16:10 shows
//  ≈ x 380–1980, 16:9 ≈ 256–2034, 21:9 ≈ −159–2211), so the hero (jukebox,
//  marquee, stage) always sits in the left ~70% and the right ~28% holds only
//  calm background (hidden door, back bar of bottles, booth end). With the
//  desktop's widgets on the LEFT (LW.layout.side 'left') the camera slides
//  left so the stage sits at the right and the left holds only wall + booth.
//  The room is painted once per light/weather change (albedo × soft light
//  map, cached); the booths in front are a second small baked layer (so the
//  animals can walk behind them); each frame draws those images plus the
//  few moving things on top.
//
//  ART SLOTS (all optional; missing files fall back to the procedural
//  painting quietly). Drop PNGs into scenes/art/speakeasy/:
//    bg-night.png   4800×2000 px = design x 0–2400 × y 0–1000 at 2×, the whole
//                   room at night WITHOUT the live parts listed below (and
//                   without the two booths, which are painted in front).
//                   The high window glass must be TRANSPARENT (alpha 0) so the
//                   live street/rain shows through.
//    bg-day.png     same framing, daytime (crossfades by time of day; a sunbeam
//                   from the high window is added live).
//    piano.png      1030×946 the player piano, straight-on, on transparency
//                   (drawn at x 900–1148, y 465–693 over the painted one; key,
//                   paper-roll and pedal geometry: PIANO_ART below)
//    street-night.jpg / street-day.jpg  ≈2.4:1 painted view through the high
//                   window (crossfaded by daylight; weather drawn live on top)
//    Live parts drawn on top (keep these areas simple in a painting):
//      high window glass x 470–630, y 104–172
//      jukebox: base centre (520, 734), 192 wide, 346 tall — window, tubes,
//               grille and title strip are live (gramophone: same spot)
//      marquee: frame x 650–866, y 224–598 · art square x 670–846, y 262–438 ·
//               plaque text y 452–580 · ~38 bulbs on the frame border
//      piano: keyboard x 932–1102, y 584–598 · lid top y 468 (the cat naps here)
//      mic head (1176, 545) · double bass strings x≈1436, y 380–660
//      drums: kick head centre (1300, 636) r 45 · ride (1370, 550) · hi-hat (1214, 560)
//      booths (front layer): left x ≤ 720, right x 1130–1480, y 776–930
//      stage spotlight from (1176, 30) to a pool at (1176, 684)
//    Animals (side view, facing RIGHT, feet on the bottom edge, centred):
//      cat-<pose>.png  340×340 px, drawn as a 170×170-unit box
//      dog-<pose>.png  420×420 px, drawn as a 210×210-unit box
//      <pose> = stand, walk1…walk4 (walk cycle), sit, loaf, sleep, stretch.
//      Missing poses fall back to stand; no files → procedural rig. Sprites
//      are tinted by the room light, breathe, and flip/foreshorten as they turn.
//    ?noart=1 skips slot loading.
// =====================================================================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgba = (c, a = 1) => `rgba(${clamp(c[0] | 0, 0, 255)},${clamp(c[1] | 0, 0, 255)},${clamp(c[2] | 0, 0, 255)},${a})`;
const mul = (c, m) => [c[0] * m[0], c[1] * m[1], c[2] * m[2]];
const lum = (c) => (c[0] + c[1] + c[2]) / 3;
const approach = (v, t, rate, dt) => v + (t - v) * (1 - Math.exp(-rate * dt));
function mulberry(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const nowS = () => performance.now() / 1000;
const timers = [];
const later = (sec, fn) => timers.push({ at: nowS() + sec, fn });
function runTimers() { const T = nowS(); for (let i = timers.length - 1; i >= 0; i--) if (timers[i].at <= T) { const f = timers[i].fn; timers.splice(i, 1); try { f(); } catch (e) { console.error(e); } } }
const SANS = '-apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif';
const SERIF = '"Hoefler Text", "Baskerville", "Iowan Old Style", Georgia, serif';
const DIDOT = '"Didot", "Bodoni 72", "Hoefler Text", Georgia, serif';
const DECO = '"Futura", "Avenir Next", "Gill Sans", sans-serif';
const SCRIPT = '"Snell Roundhand", "Apple Chancery", "Hoefler Text", cursive';
const TYPE = '"American Typewriter", "Courier New", monospace';
function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
function ellGrad(g, x, y, rx, ry, col, a, stops = 6) {
  g.save(); g.translate(x, y); g.scale(rx, ry);
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, 1);
  for (let i = 0; i <= stops; i++) { const t = i / stops; gr.addColorStop(t, rgba(col, a * Math.exp(-2.6 * t * t) * (1 - t * t * t))); }
  g.fillStyle = gr; g.fillRect(-1, -1, 2, 2); g.restore();
}
function sprite(size, stops) {
  const c = newCanvas(size, size), g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
}
const GLOW_WARM = sprite(128, [[0, 'rgba(255,214,150,1)'], [0.18, 'rgba(255,190,110,0.5)'], [0.5, 'rgba(255,160,80,0.12)'], [1, 'rgba(255,140,60,0)']]);
const GLOW_SOFT = sprite(128, [[0, 'rgba(255,200,140,0.6)'], [0.4, 'rgba(255,170,100,0.22)'], [1, 'rgba(255,150,80,0)']]);
const GLOW_WHITE = sprite(128, [[0, 'rgba(255,255,255,1)'], [0.2, 'rgba(255,255,255,0.45)'], [0.55, 'rgba(255,255,255,0.1)'], [1, 'rgba(255,255,255,0)']]);
const BLOB = sprite(64, [[0, 'rgba(255,255,255,0.9)'], [0.45, 'rgba(255,255,255,0.45)'], [1, 'rgba(255,255,255,0)']]);
const DARK = sprite(64, [[0, 'rgba(6,3,4,0.85)'], [0.5, 'rgba(6,3,4,0.45)'], [1, 'rgba(6,3,4,0)']]);
function drawSprite(g, sp, x, y, r, a, op = 'lighter') {
  if (a <= 0.003) return;
  g.globalCompositeOperation = op; g.globalAlpha = Math.min(1, a);
  g.drawImage(sp, x - r, y - r, r * 2, r * 2);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
}
function drawSpriteE(g, sp, x, y, rx, ry, a, op = 'lighter') {
  if (a <= 0.003) return;
  g.globalCompositeOperation = op; g.globalAlpha = Math.min(1, a);
  g.drawImage(sp, x - rx, y - ry, rx * 2, ry * 2);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
}
// tileable haze texture (drawn through the light beams, scrolling slowly)
const HAZE = (() => {
  const w = 512, h = 256, c = newCanvas(w, h), g = c.getContext('2d'), r = mulberry(901);
  for (let i = 0; i < 90; i++) {
    const x = r() * w, y = r() * h, rx = 30 + r() * 90, ry = 14 + r() * 40, a = 0.05 + r() * 0.12;
    for (const dx of [-w, 0, w]) for (const dy of [-h, 0, h]) {
      if (x + dx + rx < 0 || x + dx - rx > w || y + dy + ry < 0 || y + dy - ry > h) continue;
      g.globalAlpha = a; g.drawImage(BLOB, x + dx - rx, y + dy - ry, rx * 2, ry * 2);
    }
  }
  return c;
})();

// =====================================================================
//  environment: time of day + weather (glides; never pops)
//  Inside it's always evening-lit; time and weather show through the high
//  street-level window (and a sunbeam crosses the haze by day).
// =====================================================================
const KF = [
  { h: 0, top: '#070b1c', bot: '#1a2240', day: 0, warm: 0 },
  { h: 5.0, top: '#070b1c', bot: '#1a2240', day: 0, warm: 0 },
  { h: 6.3, top: '#2b3462', bot: '#dc9c88', day: 0.32, warm: 0.8 },
  { h: 7.6, top: '#7aa1cf', bot: '#efe0cc', day: 0.8, warm: 0.3 },
  { h: 9, top: '#6a9bd2', bot: '#dbe8f0', day: 1, warm: 0 },
  { h: 16.3, top: '#6696cf', bot: '#efdcc0', day: 0.95, warm: 0.2 },
  { h: 18.3, top: '#45507f', bot: '#ef9a62', day: 0.55, warm: 1 },
  { h: 19.6, top: '#1a2046', bot: '#6c4f72', day: 0.15, warm: 0.3 },
  { h: 21, top: '#070b1c', bot: '#1a2240', day: 0, warm: 0 },
  { h: 24, top: '#070b1c', bot: '#1a2240', day: 0, warm: 0 },
];
KF.forEach((k) => { k.topC = hex(k.top); k.botC = hex(k.bot); });
const WX = {
  cloudy: { d: ['#99a2b1', '#c8ccd2'], n: ['#141824', '#262a38'], amt: 0.6, day: 0.85 },
  rain: { d: ['#6c7684', '#959daa'], n: ['#0b0e17', '#1a1f2c'], amt: 0.85, day: 0.6 },
  storm: { d: ['#4b5262', '#6d7483'], n: ['#06080e', '#131723'], amt: 0.95, day: 0.45 },
  snow: { d: ['#b8becb', '#dde1e8'], n: ['#1a1d2b', '#30344a'], amt: 0.75, day: 0.85 },
  fog: { d: ['#b3b6bc', '#d2d4d7'], n: ['#1d2029', '#373a46'], amt: 0.85, day: 0.75 },
};
let E = null, Et = null;
function computeTarget() {
  const env = LW.env || {};
  const hr = (((+env.hour || 0) % 24) + 24) % 24;
  let a = KF[0], b = KF[1];
  for (let i = 0; i < KF.length - 1; i++) if (hr >= KF[i].h && hr <= KF[i + 1].h) { a = KF[i]; b = KF[i + 1]; break; }
  const t = smooth((hr - a.h) / Math.max(0.001, b.h - a.h));
  let top = mix3(a.topC, b.topC, t), bot = mix3(a.botC, b.botC, t);
  let day = lerp(a.day, b.day, t), warm = lerp(a.warm, b.warm, t);
  const w = env.weather || 'clear';
  const it = clamp(env.intensity == null ? 0.7 : +env.intensity, 0, 1);
  let rain = 0, storm = 0, snow = 0, fog = 0, cloud = 0.15, moon = (1 - day) * (hr > 19 || hr < 6 ? 1 : 0);
  const X = WX[w];
  if (X) {
    const f = X.amt * (0.6 + 0.4 * it);
    top = mix3(top, mix3(hex(X.n[0]), hex(X.d[0]), day), f);
    bot = mix3(bot, mix3(hex(X.n[1]), hex(X.d[1]), day), f);
    day *= lerp(1, X.day, 0.6 + 0.4 * it);
    warm *= 0.3; moon *= w === 'cloudy' ? 0.25 : 0; cloud = w === 'cloudy' ? 0.8 : 1;
    if (w === 'rain') rain = 0.45 + 0.55 * it;
    if (w === 'storm') { rain = 0.75 + 0.25 * it; storm = 1; }
    if (w === 'snow') snow = 0.4 + 0.6 * it;
    if (w === 'fog') fog = 0.55 + 0.45 * it;
  }
  // late night = "last call": the room is a touch lower
  const late = hr >= 1.5 && hr < 5.5 ? 1 : 0;
  moon *= LW.moonVisibility();
  Et = { hour: hr, weather: w, it, top, bot, day, warm, rain, storm, snow, fog, cloud, moon, late };
  if (!E) { E = JSON.parse(JSON.stringify(Et)); E.wet = rain > 0 ? 1 : 0; E.snowCover = snow > 0 ? 1 : 0; }
}
const ENV_KEYS = ['day', 'warm', 'rain', 'storm', 'snow', 'fog', 'cloud', 'moon', 'it', 'late'];
let lastBake = -99, bakedSnap = null, fade = 1;
function updateEnv(dt) {
  const k = LW.envBlend(dt, 9);   // gradual in Auto; shorter when a view is selected
  for (const key of ENV_KEYS) E[key] += (Et[key] - E[key]) * k;
  for (const key of ['top', 'bot']) for (let i = 0; i < 3; i++) E[key][i] += (Et[key][i] - E[key][i]) * k;
  E.hour = Et.hour; E.weather = Et.weather;
  E.wet = clamp(E.wet + (E.rain > 0.15 ? dt * E.rain / 30 : -dt / 420), 0, 1);
  E.snowCover = clamp(E.snowCover + (E.snow > 0.15 ? dt * E.snow / 50 : -dt / 600), 0, 1);
  E.shaft = E.day * (1 - E.cloud * 0.72) * (1 - E.fog * 0.5) * (1 - E.rain * 0.85);
  E.amb = envAmb();
  fade = Math.min(1, fade + dt / 1.6);
  const snap = envSnap();
  const diff = bakedSnap ? Math.max(...snap.map((v, i) => Math.abs(v - bakedSnap[i]))) : 1;
  if (diff > 0.03 && nowS() - lastBake > 2.5 && fade >= 1) bake(true);

const envSnap = () => [...ENV_KEYS.map((q) => E[q]), E.wet * 0.5, E.snowCover * 0.5, ...E.top.map((v) => v / 255), ...E.bot.map((v) => v / 255)];

  const night = [0.105, 0.09, 0.105], dayA = [0.17, 0.16, 0.16];
  return mix3(night, dayA, E.day * 0.8);
}

// =====================================================================
//  art slots (see the header)
// =====================================================================
const ART = { bg: {}, pets: { cat: {}, dog: {} } };
let rsT = null;
function loadSlot(group, key, file, sub) {
  const img = new Image();
  img.onload = () => {
    if (!img.naturalWidth) return;
    if (sub) { img.pri = true; ART[group][sub][key] = img; } else ART[group][key] = img;

}

// =====================================================================
//  layout (design units, see header)
// =====================================================================
const DW = 2400;
let dpr = 1, cssW = 1, cssH = 1, U = 1, W = 1600, H = 1000, OX = 0, vx0 = 400, vx1 = 2000;
let L = null;
const VT = (g) => g.setTransform(U, 0, 0, U, OX, 0);

  o.mq = { x0: 650, x1: 866, y0: 224, y1: 598 };

  o.stage = { x0: 884, x1: 1500, top: 652, edge: 704, base: 750 };
  o.piano = { x0: 922, x1: 1116, top: 474, kb: 584, base: 690 };
  o.keys = { x0: 934, x1: 1104, y0: 584, y1: 598, n: 34 };
  if (PIANO.im) pianoLayout(o);
  o.mic = { x: 1176, base: 694, head: 545 };
  o.drums = { x: 1300, base: 688 };
  o.bass = { x: 1436, base: 690, ang: -0.07 };
  o.spot = { x: 1176, y: 30, px: 1176, py: 684, rx: 170, ry: 32 };
  // the player piano is tonight's performer: the follow-spot finds it
  if (o.pianoArt) Object.assign(o.spot, { x: 1112, px: 1046, py: 688, rx: 150 });
  // right of the stage: the hidden door, then the bar (calm background)
  o.door = { x0: 1540, x1: 1676, y0: 300, y1: 700 };
  o.bar = { x0: 1764, x1: 2218, top: 604, front: 616, foot: 708 };
  o.back = { x0: 1786, x1: 2198, y0: 214, y1: 604 };
  o.rows = [326, 440, 556];
  // the two velvet booths in front (a separate baked layer)
  o.boothL = { x0: Math.min(160, vx0 - 60), x1: 724, back: 784, seat: 878, base: 930 };
  o.boothR = { x0: 1130, x1: 1484, back: 776, seat: 870, base: 922 };
  o.tableL = { x: 520, y: 884, rx: 72, ry: 14 };
  o.tableR = { x: 1330, y: 874, rx: 86, ry: 17 };
  o.tlamp = { x: 1364, y: 872 };
  o.glass = { x: 566, y: 882 };
  o.candle = { x: 492, y: 882 };
  o.fgY = 740;   // the front layer covers y fgY…1000
  o.pend = [{ x: 1884, y: 150 }, { x: 2124, y: 150 }];
  o.sconces = [{ x: 300, y: 372 }, { x: 1722, y: 372 }];
  o.lights = [
    { x: 1992, y: 470, rx: 330, ry: 260, k: 0.78, c: [1.0, 0.6, 0.28] },     // back bar
    { x: 1992, y: 330, rx: 260, ry: 220, k: 0.35, c: [1.0, 0.7, 0.4] },      // bar pendants
    { x: 758, y: 420, rx: 210, ry: 290, k: 0.55, c: [1.0, 0.72, 0.42] },     // marquee bulbs
    { x: o.spot.px, y: 646, rx: 300, ry: 200, k: 0.95, c: [1.0, 0.86, 0.66] },    // spotlight pool
    { x: 1190, y: 380, rx: 440, ry: 380, k: 0.3, c: [1.0, 0.78, 0.55] },     // stage wash
    { x: 980, y: 440, rx: 170, ry: 120, k: 0.55, c: [1.0, 0.75, 0.45] },     // piano lamp

function bottlePath(bt) {
  const { x, base, w, h, kind } = bt, hw = w / 2, p = new Path2D();
  if (kind === 1) {          // square decanter with a ball stopper
    p.rect(x - hw, base - h * 0.72, w, h * 0.72);
    p.moveTo(x - 4, base - h * 0.72); p.lineTo(x - 3, base - h * 0.86); p.lineTo(x + 3, base - h * 0.86); p.lineTo(x + 4, base - h * 0.72); p.closePath();

    p.moveTo(x - hw, base); p.bezierCurveTo(x - hw - 3, base - h * 0.5, x - hw * 0.6, base - h * 0.72, x - 3, base - h * 0.76);

    p.bezierCurveTo(x + hw * 0.6, base - h * 0.72, x + hw + 3, base - h * 0.5, x + hw, base); p.closePath();
  } else {                   // whisky / tall liqueur
    const sh = kind === 2 ? 0.48 : 0.62;
    p.moveTo(x - hw, base); p.lineTo(x - hw, base - h * sh); p.quadraticCurveTo(x - hw, base - h * (sh + 0.14), x - 3, base - h * (sh + 0.2));

    p.quadraticCurveTo(x + hw, base - h * (sh + 0.14), x + hw, base - h * sh); p.lineTo(x + hw, base); p.closePath();

}
