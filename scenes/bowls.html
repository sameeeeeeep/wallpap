<script>
(() => {
'use strict';
// Singing Bowls — a quiet Himalayan room at the wall's foot; the bowls, candles, mallet and glass all live in
// the LEFT ~70% (the right is calm wall/floor for desktop icons and widgets).
// Window light is geometric: the sun/moon direction shears the arched window (panes + mullion bars) onto the
// floor, the bowls in it catch light on their rims and throw shadows along it, and a dust-lit beam joins window
// and patch (stronger in haze/fog, faint when cloudy, gone when the source is down). See bakeLight().
// Optional art (procedural fallback): art/bowls/window-view-day.png, window-view-night.png — 1152×468 painted
// Himalayan ranges with a transparent sky (live sky, sun, moon and stars show behind).

// ───────────────────────── helpers ─────────────────────────
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = (x) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x, 0, 1));
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgba = (c, a = 1) => `rgba(${clamp(c[0], 0, 255) | 0},${clamp(c[1], 0, 255) | 0},${clamp(c[2], 0, 255) | 0},${a})`;
function rng(seed) {
  return function () {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function lerpObj(a, b, t) {
  if (typeof a === 'number') return lerp(a, b, t);
  if (Array.isArray(a)) return a.map((v, i) => lerpObj(v, b[i], t));
  const o = {}; for (const k in a) o[k] = lerpObj(a[k], b[k], t); return o;
}

const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const HAS_CONIC = typeof ctx.createConicGradient === 'function';
const SERIF = '"Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif';

// ───────────────────────── scene config ─────────────────────────
const K = 0.4;                                     // perspective squash of horizontal circles
const NT = { D3: 146.83, F3: 174.61, G3: 196.0, A3: 220.0, C4: 261.63, D4: 293.66, F4: 349.23, G4: 392.0, A4: 440.0, D5: 587.33 };
// u = across group, d = depth (0 front → 1 back); p = metal; dp = depth; lip = rim thickness;
// fl = shoulder flare; sh = shoulder height; deco = engraved ornament band; pat = verdigris; lines = lathe lines
const T7 = [
  { u: 0.04, d: 0.85, f: NT.F4, p: 4, seed: 11, dp: 0.66, lip: 0.05, fl: 1.03, sh: 0.5, deco: 0, pat: 0, lines: 1 },
  { u: 0.17, d: 0.30, f: NT.C4, p: 3, seed: 23, dp: 0.75, lip: 0.062, fl: 1.05, sh: 0.56, deco: 1, pat: 0, lines: 2 },
  { u: 0.35, d: 0.00, f: NT.D3, p: 1, seed: 37, dp: 0.7, lip: 0.045, fl: 1.035, sh: 0.5, deco: 1, pat: 0.3, lines: 2 },
  { u: 0.52, d: 0.78, f: NT.A3, p: 5, seed: 41, dp: 0.72, lip: 0.052, fl: 1.04, sh: 0.46, deco: 0, pat: 1, lines: 1 },
  { u: 0.68, d: 0.08, f: NT.F3, p: 3, seed: 53, dp: 0.63, lip: 0.04, fl: 1.065, sh: 0.44, deco: 0, pat: 0.2, lines: 2 },
  { u: 0.84, d: 0.42, f: NT.D4, p: 0, seed: 67, dp: 0.77, lip: 0.056, fl: 1.02, sh: 0.58, deco: 0, pat: 0, lines: 1 },
  { u: 0.97, d: 0.90, f: NT.A4, p: 2, seed: 79, dp: 0.68, lip: 0.036, fl: 1.04, sh: 0.5, deco: 0, pat: 0.4, lines: 0 },
];
const T9 = [
  { u: 0.03, d: 0.78, f: NT.A4, p: 4, seed: 13, dp: 0.66, lip: 0.05, fl: 1.03, sh: 0.5, deco: 0, pat: 0, lines: 1 },
  { u: 0.13, d: 0.26, f: NT.D4, p: 3, seed: 29, dp: 0.75, lip: 0.06, fl: 1.05, sh: 0.56, deco: 1, pat: 0, lines: 2 },
  { u: 0.245, d: 0.72, f: NT.G3, p: 0, seed: 31, dp: 0.7, lip: 0.05, fl: 1.04, sh: 0.5, deco: 0, pat: 0.2, lines: 1 },
  { u: 0.37, d: 0.02, f: NT.D3, p: 1, seed: 37, dp: 0.7, lip: 0.045, fl: 1.035, sh: 0.5, deco: 1, pat: 0.3, lines: 2 },
  { u: 0.505, d: 0.82, f: NT.A3, p: 5, seed: 41, dp: 0.72, lip: 0.052, fl: 1.04, sh: 0.46, deco: 0, pat: 1, lines: 1 },
  { u: 0.64, d: 0.08, f: NT.F3, p: 3, seed: 53, dp: 0.63, lip: 0.04, fl: 1.065, sh: 0.44, deco: 0, pat: 0.2, lines: 2 },
  { u: 0.76, d: 0.64, f: NT.C4, p: 2, seed: 61, dp: 0.74, lip: 0.05, fl: 1.03, sh: 0.55, deco: 1, pat: 0, lines: 1 },
  { u: 0.87, d: 0.28, f: NT.F4, p: 0, seed: 67, dp: 0.77, lip: 0.056, fl: 1.02, sh: 0.58, deco: 0, pat: 0, lines: 1 },
  { u: 0.975, d: 0.86, f: NT.D5, p: 4, seed: 83, dp: 0.66, lip: 0.036, fl: 1.04, sh: 0.5, deco: 0, pat: 0.3, lines: 0 },
];
const CRYSTAL_TINTS = [[238, 236, 230], [232, 236, 242], [242, 234, 224]];
const crystalize = (o, i) => ({ ...o, kind: 'crystal', dp: 0.86 + (i % 3) * 0.05, lip: 0.075, tint: CRYSTAL_TINTS[i % 3] });
const CANDLES7 = [{ u: 0.245, d: 1.32, h: 1.2, ph: 0.3 }, { u: 0.29, d: 1.46, h: 0.72, ph: 2.1 }, { u: 0.785, d: 1.30, h: 0.95, ph: 4.2 }];
const CANDLES9 = [{ u: 0.185, d: 1.3, h: 1.2, ph: 0.3 }, { u: 0.215, d: 1.44, h: 0.72, ph: 2.1 }, { u: 0.69, d: 1.3, h: 0.95, ph: 4.2 }];
const SETS = {
  tibetan7: { gw: 1.55, rf: 0.078, glassU: 0.515, bowls: T7, candles: CANDLES7 },
  tibetan9: { gw: 1.85, rf: 0.066, glassU: 0.505, bowls: T9, candles: CANDLES9, wide: true },
  crystal: { gw: 1.55, rf: 0.072, glassU: 0.515, bowls: T7.map(crystalize), candles: CANDLES7 },
  mixed: { gw: 1.55, rf: 0.078, glassU: 0.515, bowls: T7.map((o, i) => (i === 3 || i === 5 ? crystalize(o, i) : o)), candles: CANDLES7 },
};
// golden brass, warm bronze, antique, dark antique bronze, bright brass, patinated bronze
const PAL = [[178, 120, 54], [152, 95, 46], [126, 84, 48], [100, 63, 37], [204, 150, 70], [128, 92, 56]];
const FABRIC = [58, 30, 25];
const FX = {
  brass: { bloom: '255,168,88', bloom2: '255,138,58', inner: '255,200,130', rip: '255,206,146', dark: '4,2,1', rim: '255,214,160', rim2: '255,238,205', ring: '255,188,118' },
  crystal: { bloom: '255,234,212', bloom2: '235,228,240', inner: '255,246,234', rip: '255,250,242', dark: '40,36,40', rim: '255,246,232', rim2: '255,252,246', ring: '246,236,226' },
};

// ───────────────────────── settings ─────────────────────────
const DEF = { auto: 'off', set: 'tibetan7', sleepMinutes: 45 };
let S = { ...DEF, ...LW.settings };
let setName = SETS[S.set] ? S.set : 'tibetan7';
let breathB = null, lowB = null;      // breathing bowl (back centre) and the deepest bowl

// ───────────────────────── lighting by time / weather ─────────────────────────
const KF = {
  night: { wall: [[5, 5, 8], [11, 10, 13], [24, 17, 13]], table: [[30, 21, 15], [11, 8, 6]], pool: [150, 80, 35, 0.2],
    shaft: [150, 172, 225], shaftA: 0.55, candle: 1, sky: [[4, 8, 22], [14, 22, 46]], moon: 1, stars: 1, grade: [0.95, 0.9, 0.9], amb: 0.85 },
  dawn: { wall: [[10, 8, 10], [19, 14, 13], [32, 22, 16]], table: [[40, 28, 19], [14, 10, 7]], pool: [170, 95, 50, 0.14],
    shaft: [255, 188, 150], shaftA: 0.8, candle: 0.75, sky: [[52, 62, 112], [246, 168, 122]], moon: 0.15, stars: 0.1, grade: [1, 0.93, 0.9], amb: 1 },
  day: { wall: [[13, 11, 10], [24, 19, 15], [38, 28, 20]], table: [[46, 33, 22], [16, 11, 8]], pool: [170, 110, 60, 0.1],
    shaft: [255, 236, 208], shaftA: 1.0, candle: 0.45, sky: [[62, 118, 190], [166, 200, 228]], moon: 0, stars: 0, grade: [1, 0.98, 0.95], amb: 1.22 },
  dusk: { wall: [[10, 7, 8], [21, 13, 11], [36, 22, 15]], table: [[44, 28, 18], [14, 9, 6]], pool: [185, 95, 40, 0.17],
    shaft: [255, 150, 80], shaftA: 0.9, candle: 0.88, sky: [[48, 38, 92], [250, 138, 70]], moon: 0.1, stars: 0.05, grade: [1.04, 0.9, 0.8], amb: 1 },
};
const TIMELINE = [[0, 'night'], [5.2, 'night'], [6.7, 'dawn'], [8.9, 'day'], [16.6, 'day'], [18.9, 'dusk'], [20.7, 'night'], [24, 'night']];

function lightFor(env) {
  const h = (((env.hour || 0) % 24) + 24) % 24;
  let i = 0; while (i < TIMELINE.length - 2 && h >= TIMELINE[i + 1][0]) i++;
  const [h0, k0] = TIMELINE[i], [h1, k1] = TIMELINE[i + 1];
  const L = lerpObj(KF[k0], KF[k1], ease((h - h0) / Math.max(0.001, h1 - h0)));
  const w = env.weather || 'clear';
  const I = clamp(env.intensity == null ? 0.7 : env.intensity, 0, 1);
  L.weather = w; L.I = I; L.haze = 0; L.shaftW = 1; L.clouds = 0; L.hour = h;
  L.wind = clamp(env.wind == null ? 0.3 : env.wind, 0, 1);
  L.day = sstep(5.4, 7.4, h) * (1 - sstep(18.2, 20.2, h));
  const sunT = (h - 5.6) / 13.6;                         // 0 = sunrise, 1 = sunset
  L.sunX = clamp(sunT, 0, 1); L.sunE = sunT > 0 && sunT < 1 ? Math.sin(Math.PI * sunT) : 0;
  const nT = ((h - 19.4 + 24) % 24) / 10.6;               // moon arc through the night
  L.moonX = clamp(nT, 0, 1); L.moonE = nT >= 0 && nT <= 1 ? Math.sin(Math.PI * nT) : 0;
  if(env.astronomy){L.moonX=clamp((env.astronomy.moon.azimuth+Math.PI)/(2*Math.PI),0,1);L.moonE=Math.max(0,Math.sin(env.astronomy.moon.altitude));L.moon*=env.astronomy.moon.visibility;}
  L.moon *= sstep(0, 0.12, L.moonE);                      // set below the hills outside its arc
  L.sunVis = w === 'clear' ? 1 : w === 'cloudy' ? 0.3 : 0;
  L.patchK = { clear: 1, cloudy: 0.4, snow: 0.35, fog: 0.45, rain: 0.04, storm: 0 }[w] ?? 1;   // direct sun on the table
  if (w === 'clear') L.clouds = 0.32 * L.day;             // a few fair-weather clouds drift by
  const gradeTo = (g, k) => { L.grade = mixc(L.grade, g, k * lerp(0.4, 1, I)); };
  const grey = (c, f) => { const g = (c[0] * 0.3 + c[1] * 0.5 + c[2] * 0.2) * f; return [g, g, g * 1.04]; };
  const wx = (factor, skyMix, skyDark) => {
    const m = lerp(0.4, 1, I);
    L.shaftA *= lerp(1, factor, m);
    L.sky = L.sky.map((c) => mixc(c, grey(c, skyDark), skyMix * m));
    L.moon *= w === 'cloudy' ? lerp(1, 0.35, m) : 0; L.stars *= w === 'cloudy' ? 1 - m : 0;
  };
  switch (w) {
    case 'cloudy': wx(0.42, 0.75, 0.85); L.clouds = 0.5 + 0.5 * I; gradeTo([0.94, 0.95, 1.0], 0.5); break;
    case 'rain': wx(0.22, 0.85, 0.62); L.clouds = 0.8; L.amb *= 0.86; L.pool[3] *= 0.6; gradeTo([0.86, 0.9, 1.0], 0.7); L.candle = Math.max(L.candle, 0.72); break;
    case 'storm': wx(0.12, 0.9, 0.42); L.clouds = 1; L.amb *= 0.78; L.pool[3] *= 0.5; gradeTo([0.82, 0.86, 1.0], 0.75); L.candle = Math.max(L.candle, 0.8); break;
    case 'snow': wx(0.5, 0.8, 1.05); L.shaft = mixc(L.shaft, [215, 228, 245], 0.55); L.clouds = 0.6; L.amb *= 1.05; gradeTo([0.95, 0.98, 1.06], 0.6); break;
    case 'fog': wx(1.0, 0.9, 0.95); L.haze = 0.35 + 0.45 * I; L.shaftW = 1.5; gradeTo([0.96, 0.96, 0.98], 0.5); break;
  }
  return L;
}
const lightKeyOf = (L) => {
  const q = (v) => (Array.isArray(v) ? v.map(q).join(',') : Math.round(v * 40));
  return `${L.weather}|${L.I.toFixed(2)}|${Math.round(L.sunX * 24)}|${Math.round(L.moonX * 16)}|${q([L.wall, L.table, L.pool, L.shaft, L.sky, L.grade, L.shaftA / 8, L.candle / 8, L.moon / 8, L.amb / 8])}`;
};

// ───────────────────────── state ─────────────────────────
let W = 0, H = 0, dpr = 1, MIR = 1;
let groupW, gx0, Rmax, depthSpan, baseY, horizonY;
let bowls = [], candles = [], win = null, glass = null, shaft = null;
let bgCur = null, bgPrev = null, bgFade = 1;
let LIGHT = null, LIGHTprev = null, beamFront = [], beamFrontPrev = [];                   // baked window light (patch + beam), current / fading out
let frameSpr = null, dotSpr = null;
let light = lightFor(LW.env), lightKey = '';
let dust = [], rings = [], props = [];
const smoke = { p: [], acc: 0 };
let GR = [1, 1, 1];                                   // colour grade used while baking
const gc = (c, m = 1, a = 1) => rgba([c[0] * m * GR[0], c[1] * m * GR[1], c[2] * m * GR[2]], a);

let hover = null;
let lastInput = performance.now();
let nextAuto = 0;
let ambT = 0, ts = 1;                                 // ambient clock (slows in calm mode)
LW.breathDiegetic = true;   // the room carries the breath (rings of light on the floor round the breathing bowl); lw.js only adds a small label
const calm = { target: !!LW.calm, amt: 0, breath: 0, temp: 0, br: { phase: 'in', k: 0, level: 0 }, lastPh: '', cyc: 0, still: 0 };
// Breath comes from LW.breathState on the guide's clock (lw.js draws the guide); a scene-started
// breath (meditate auto-mode / breathe reminder, no guide on screen) restarts that clock.
function calmRestart() { if (!LW.calm) BR.t0 = performance.now() / 1000; calm.lastPh = ''; }
const reminder = { on: false, kind: '', text: '', t0: 0, a: 0 };
const wxs = { flash: 0, flashes: [], nextFlash: 0, rain: [], drops: [], snow: [], clouds: [], fog: [], snowAcc: 0 };

// ───────────────────────── layout ─────────────────────────
function layout() {
  W = Math.max(1, innerWidth); H = Math.max(1, innerHeight);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const budget = 6.5e6;
  if (W * H * dpr * dpr > budget) dpr = Math.sqrt(budget / (W * H));
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);

  const SET = SETS[setName];
  // Everything that needs attention (bowls, candles, mallet, glass) lives in the LEFT ~70%: the right ~28%
  // is quiet wall and floor for the desktop icons/widgets. Measure the set's true footprint (bowl radii at
  // both ends) so the group fills the band [BAND0, BAND1] of the width without spilling past it.
  const cl = (LW.layout && LW.layout.clear) || [0, 0.72];
  MIR = LW.layout && LW.layout.side === 'left' ? -1 : 1;     // widgets on the left → the room is mirrored
  const BAND0 = clamp(cl[0], 0, 0.5) + 0.045, BAND1 = clamp(cl[1], 0.5, 1) - 0.035, fRef = Math.min(...SET.bowls.map((o) => o.f));
  let lo = 1e9, hi = -1e9;
  for (const o of SET.bowls) { const r = SET.rf * Math.pow(fRef / o.f, 0.45) * (1 - 0.14 * o.d) * 1.06; lo = Math.min(lo, o.u - r); hi = Math.max(hi, o.u + r); }
  groupW = Math.min(W * (BAND1 - BAND0) / (hi - lo), H * SET.gw);
  gx0 = W * (BAND0 + BAND1) / 2 - groupW * (lo + hi) / 2;
  Rmax = groupW * SET.rf;
  depthSpan = Rmax * 1.2;
  baseY = Math.min(H * 0.8, H * 0.965 - Rmax * (K + 0.5 + 0.16));
  horizonY = baseY - depthSpan * 1.55 - Rmax * 0.35;

  const old = bowls;
  bowls = SET.bowls.map((o, i) => {
    const f = o.f, kind = o.kind || 'brass';
    const sz0 = Math.pow(fRef / f, 0.45);
    const s = 1 - 0.14 * o.d;
    const R = Rmax * sz0 * s;
    const x = gx0 + o.u * groupW, y = baseY - o.d * depthSpan;
    const ry = R * K, D = R * o.dp, rb = R * 0.5;           // silhouette depth (screen), base radius
    const Hb = D - ry;                                       // body visible below the front rim
    const t = R * o.lip, Ri = R - t, ryi = ry - t * 0.6;
    const wrx = Ri * (kind === 'crystal' ? 0.62 : 0.7);
    return {
      i, f, kind, col: FX[kind], d: o.d, p: o.p, seed: o.seed, o, sz: clamp((sz0 - 0.6) / 0.4, 0, 1),
      x, y, R, ry, Hb, D, rb, Ri, ryi, bottom: y + ry + Hb,
      w: { x, y: y + R * (kind === 'crystal' ? 0.18 : 0.13), rx: wrx, ry: wrx * K },
      pan: clamp((x / W) * 2 - 1, -1, 1) * 0.6,
      visHz: 2.1 + f / 190, m: [4, 6, 5, 4, 6, 5, 8, 4, 6][i % 9],
      glowE: old[i] && old.length === SET.bowls.length ? old[i].glowE : 0, ripE: 0,
      rub: 0, rubT: 0, rubSeen: 0, hum: 0, humT: 0, humSeen: 0, auto: 0, autoT: 0, sing: 0, actG: 0, singer: null, hov: 0, calmG: 0, lastRing: 0, spr: null, over: [],
    };
  });
  // back → front draw order
  bowls.order = bowls.slice().sort((a, b) => b.d - a.d);
  lowB = bowls.reduce((a, b) => (b.f < a.f ? b : a));
  breathB = bowls.filter((b) => b.d > 0.5).reduce((a, b) => (Math.abs(b.o.u - 0.5) < Math.abs(a.o.u - 0.5) ? b : a));
  // breath caption on the wall just above the breathing bowl (the default spot would sit on the front bowls)
  LW.breathLabelAt = [clamp(breathB.x / W, 0.2, 0.62), clamp((breathB.y - breathB.ry - Rmax * 1.1) / H, 0.12, 0.8)];

  candles = SET.candles.map((o) => {
    const s = 1 - 0.14 * o.d;
    return { x: gx0 + o.u * groupW, y: baseY - o.d * depthSpan, w: Rmax * 0.3 * s, h: o.h * Rmax * 0.58 * s, ph: o.ph, d: o.d };
  });

  const ww = clamp(Math.min(W * 0.2, H * 0.34), 110, 640);
  let wxp = Math.max(W * 0.04, Math.min(gx0 - ww * 0.3, W * 0.12));
  if (MIR < 0) wxp = W - ww - Math.max(W * 0.04, Math.min(W - (gx0 + groupW) - ww * 0.3, W * 0.12));
  let wtop = H * 0.07;
  const wbot = horizonY - (horizonY - wtop) * 0.12;
  wtop = Math.max(wtop, wbot - ww * 1.9);
  win = { x0: wxp, x1: wxp + ww, w: ww, top: wtop, bot: wbot, r: ww / 2, cx: wxp + ww / 2, archY: wtop + ww / 2, ft: ww * 0.07 };
  win.cy = win.top + (win.bot - win.top) * 0.55;

  glass = { x: gx0 + SET.glassU * groupW, y: baseY + 0.3 * depthSpan, rw: Rmax * 0.2, h: Rmax * 0.5 };

  initWeatherParticles();
  if (!dust.length) initDust(); else for (const p of dust) { p.x = clamp(p.x, 0, W); p.y = clamp(p.y, 0, H); }
}

// ───────────────────────── baking: bowls ─────────────────────────
function mixp(p, m, h = 0) { const HL = [255, 232, 190]; return [lerp(p[0] * m, HL[0], h), lerp(p[1] * m, HL[1], h), lerp(p[2] * m, HL[2], h)]; }

function bodyPath(g, cx, cy, b) {
  const R = b.R, ry = b.ry, S = b.D;
  g.beginPath();
  g.moveTo(cx - R, cy);
  const fl = b.o.fl, sh = b.o.sh;
  g.bezierCurveTo(cx - R * fl, cy + S * sh, cx - R * 0.6, cy + S, cx, cy + S);
  g.bezierCurveTo(cx + R * 0.6, cy + S, cx + R * fl, cy + S * sh, cx + R, cy);
  g.ellipse(cx, cy, R, ry, 0, 0, Math.PI, false);
  g.closePath();
}

function makeCrystalSprite(b) {
  const R = b.R, ry = b.ry, D = b.D, pad = R * 0.12, bw = R * 1.06;
  const w = 2 * bw + 2 * pad, h = ry + D + R * 0.3 + 2 * pad;
  const c = mk(w * dpr, h * dpr), g = c.getContext('2d');
  g.scale(dpr, dpr);
  const cx = pad + bw, cy = pad + ry, by = cy + D, rnd = rng(b.seed + 7);
  const T = mixc(b.o.tint, [255, 214, 172], 0.14), C = (m, a = 1) => gc(T, m * 0.9, a);
  // simple base: a low dark felt ring
  const bR = R * 0.82, bT = R * 0.07;
  g.beginPath(); g.ellipse(cx, by + bT * 0.4, bR, bR * K, 0, 0, TAU); g.fillStyle = gc([30, 27, 26]); g.fill();
  g.beginPath(); g.ellipse(cx, by - bT * 0.4, bR * 0.98, bR * K * 0.98, 0, 0, TAU);
  let gr = g.createLinearGradient(cx - bR, 0, cx + bR, 0);
  gr.addColorStop(0, gc([40, 36, 34])); gr.addColorStop(0.35, gc([74, 68, 64])); gr.addColorStop(1, gc([34, 31, 30]));
  g.fillStyle = gr; g.fill();
  g.save(); g.translate(cx, by - bT * 0.3); g.scale(1, K);
  const ao = g.createRadialGradient(0, 0, 0, 0, 0, R * 0.8);
  ao.addColorStop(0, 'rgba(0,0,0,0.6)'); ao.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = ao; g.fillRect(-R, -R, 2 * R, 2 * R); g.restore();
  // body: near-cylindrical frosted quartz
  g.beginPath(); g.moveTo(cx - R, cy);
  g.bezierCurveTo(cx - R * 1.01, cy + D * 0.62, cx - R * 0.8, cy + D, cx, cy + D);
  g.bezierCurveTo(cx + R * 0.8, cy + D, cx + R * 1.01, cy + D * 0.62, cx + R, cy);
  g.ellipse(cx, cy, R, ry, 0, 0, Math.PI, false); g.closePath();
  g.save(); g.clip();
  gr = g.createLinearGradient(cx - R, 0, cx + R, 0);
  gr.addColorStop(0, C(0.46)); gr.addColorStop(0.12, C(0.66)); gr.addColorStop(0.3, C(0.88)); gr.addColorStop(0.42, C(0.94));
  gr.addColorStop(0.62, C(0.8)); gr.addColorStop(0.86, C(0.62)); gr.addColorStop(1, C(0.42));
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  gr = g.createLinearGradient(0, cy, 0, by);
  gr.addColorStop(0, 'rgba(0,0,0,0.08)'); gr.addColorStop(0.5, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.16)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'lighter';                      // translucency: light gathering in the base
  g.save(); g.translate(cx - R * 0.1, cy + D * 0.72); g.scale(1, 0.38);
  let rg = g.createRadialGradient(0, 0, 0, 0, 0, R * 0.9);
  rg.addColorStop(0, gc(T, 0.34, 0.75)); rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(-R, -R, 2 * R, 2 * R); g.restore();
  // frosted edges scatter light: a soft luminous band just inside the silhouette
  g.strokeStyle = gc(T, 0.5, 0.16); g.lineWidth = R * 0.09;
  g.beginPath(); g.moveTo(cx - R, cy);
  g.bezierCurveTo(cx - R * 1.01, cy + D * 0.62, cx - R * 0.8, cy + D, cx, cy + D);
  g.bezierCurveTo(cx + R * 0.8, cy + D, cx + R * 1.01, cy + D * 0.62, cx + R, cy); g.stroke();
  g.globalCompositeOperation = 'source-over';
  for (let i = 0; i < R * 6; i++) {                             // frost grain
    g.fillStyle = rnd() < 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.04)';
    g.fillRect(cx + (rnd() * 2 - 1) * R, cy + rnd() * D, 1, 1);
  }
  g.restore();
  // lip
  g.beginPath(); g.ellipse(cx, cy, R, ry, 0, 0, TAU); g.ellipse(cx, cy, b.Ri, b.ryi, 0, 0, TAU, true);
  gr = g.createLinearGradient(cx - R, cy - ry, cx + R, cy + ry);
  gr.addColorStop(0, C(1.16)); gr.addColorStop(0.45, C(1.02)); gr.addColorStop(1, C(0.76));
  g.fillStyle = gr; g.fill('evenodd');
  g.strokeStyle = 'rgba(255,255,255,0.28)'; g.lineWidth = Math.max(0.7, R * 0.01);
  g.beginPath(); g.ellipse(cx, cy, R * 0.985, ry * 0.985, 0, Math.PI * 1.02, Math.PI * 1.98); g.stroke();
  // interior: milky, softly lit through the walls
  g.save(); g.beginPath(); g.ellipse(cx, cy, b.Ri, b.ryi, 0, 0, TAU); g.clip();
  gr = g.createLinearGradient(0, cy - b.ryi, 0, cy + b.ryi);
  gr.addColorStop(0, C(0.98)); gr.addColorStop(0.4, C(0.78)); gr.addColorStop(1, C(0.55));
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'lighter';
  g.save(); g.translate(cx, cy + b.ryi * 0.25); g.scale(1, K);
  rg = g.createRadialGradient(0, 0, 0, 0, 0, b.Ri * 0.75);
  rg.addColorStop(0, gc(T, 0.28, 0.8)); rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(-R, -R, 2 * R, 2 * R); g.restore();
  g.restore();
  g.globalCompositeOperation = 'lighter';
  for (const [a, s2] of [[-2.35, 0.45], [2.25, 0.2]]) {
    const x = cx + Math.cos(a) * R * 0.97, y = cy + Math.sin(a) * ry * 0.97, r = R * 0.2;
    g.save(); g.translate(x, y); g.scale(1, 0.35);
    const sg = g.createRadialGradient(0, 0, 0, 0, 0, r);
    sg.addColorStop(0, `rgba(255,255,255,${s2})`); sg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = sg; g.fillRect(-r, -r, 2 * r, 2 * r); g.restore();
  }
  g.globalCompositeOperation = 'source-over';
  const ox = Math.round((b.x - cx) * dpr) / dpr, oy = Math.round((b.y - cy) * dpr) / dpr;
  b.spr = { c, x: ox, y: oy, w: c.width / dpr, h: c.height / dpr };
}

function makeBowlSprite(b) {
  if (b.kind === 'crystal') return makeCrystalSprite(b);
  const R = b.R, ry = b.ry, Hb = b.Hb, pad = R * 0.1;
  const bw = R * 1.08;
  const w = 2 * bw + 2 * pad, h = ry + b.D + R * 0.42 + 2 * pad;
  const c = mk(w * dpr, h * dpr), g = c.getContext('2d');
  g.scale(dpr, dpr);
  const cx = pad + bw, cy = pad + ry;
  const p = PAL[b.p], rnd = rng(b.seed);
  const G = (m, h2 = 0, a = 1) => gc(mixp(p, m, h2), 1, a);
  drawCushion(g, cx, cy + b.D, R);

  // ── outer body
  bodyPath(g, cx, cy, b);
  g.save(); g.clip();
  let gr = g.createLinearGradient(cx - R, 0, cx + R, 0);
  gr.addColorStop(0, G(0.16)); gr.addColorStop(0.07, G(0.38)); gr.addColorStop(0.18, G(0.92));
  gr.addColorStop(0.27, G(1.22, 0.3)); gr.addColorStop(0.33, G(1.04, 0.08)); gr.addColorStop(0.5, G(0.68));
  gr.addColorStop(0.7, G(0.5)); gr.addColorStop(0.86, G(0.38)); gr.addColorStop(0.94, G(0.5, 0.05)); gr.addColorStop(1, G(0.18));
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  gr = g.createLinearGradient(0, cy, 0, cy + ry + Hb);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.55, 'rgba(0,0,0,0.18)'); gr.addColorStop(1, 'rgba(0,0,0,0.6)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  // hammered facets
  const n = Math.floor(R * 1.5);
  for (let i = 0; i < n; i++) {
    const u = rnd() * 2 - 1, v = Math.pow(rnd(), 0.8);
    const cs = Math.sqrt(Math.max(0, 1 - u * u));
    const x = cx + u * R * (1 - v * 0.3);
    const yTop = cy + ry * cs, yBot = cy + b.D * Math.pow(cs, 0.8);
    const y = lerp(yTop, yBot, v);
    const sr = R * (0.028 + rnd() * 0.035);
    const ew = sr * Math.max(0.25, cs), eh = sr * 0.62;
    g.fillStyle = gc(mixp(p, 1.25, 0.15), 1, (0.035 + rnd() * 0.035) * (p[0] > 190 ? 0.7 : 1));
    g.beginPath(); g.ellipse(x - ew * 0.22, y - eh * 0.28, ew, eh, 0, 0, TAU); g.fill();
    g.fillStyle = `rgba(0,0,0,${0.05 + rnd() * 0.04})`;
    g.beginPath(); g.ellipse(x + ew * 0.22, y + eh * 0.28, ew * 0.9, eh * 0.9, 0, 0, TAU); g.fill();
  }
  // verdigris / patina (strong on one bowl, a hint on a few)
  const pat = b.o.pat;
  for (let i = 0; i < (pat > 0.5 ? 14 : 4); i++) {
    const x = cx + (rnd() * 1.7 - 0.85) * R, y = cy + ry * 0.5 + Math.pow(rnd(), 0.6) * Hb * 0.95, r = R * (0.06 + rnd() * 0.16);
    const pg = g.createRadialGradient(x, y, 0, x, y, r);
    const col = pat > 0 ? [78, 118, 96] : [70, 84, 58];
    pg.addColorStop(0, gc(col, 1, pat > 0 ? 0.05 + 0.13 * pat : 0.06)); pg.addColorStop(1, 'rgba(70,110,90,0)');
    g.fillStyle = pg; g.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  // lathe lines just under the lip
  const line = (dy, sc, a = 1) => {
    g.lineWidth = Math.max(0.6, R * 0.008);
    g.strokeStyle = `rgba(12,6,2,${0.42 * a})`;
    g.beginPath(); g.ellipse(cx, cy + dy, R * sc, ry * sc, 0, 0.04 * Math.PI, 0.96 * Math.PI); g.stroke();
    g.strokeStyle = gc([255, 210, 150], 1, 0.1 * a);
    g.beginPath(); g.ellipse(cx, cy + dy + g.lineWidth * 1.2, R * sc, ry * sc, 0, 0.06 * Math.PI, 0.94 * Math.PI); g.stroke();
  };
  if (b.o.lines > 0) line(b.D * 0.06, 1.0);
  if (b.o.lines > 1) line(b.D * 0.1, 0.995);
  // engraved ornament band (Tibetan-style petals + dots between two rules)
  if (b.o.deco) {
    const d0 = b.D * 0.16, d1 = b.D * 0.3, sc0 = 0.99, sc1 = 0.955;
    line(d0, sc0, 0.8); line(d1, sc1, 0.8);
    const dm = (d0 + d1) / 2, scm = (sc0 + sc1) / 2, bandH = (d1 - d0) * 0.62, N = 30;
    for (let k = 0; k < N; k++) {
      const th = ((k + 0.5) / N) * TAU; if (th > Math.PI * 0.97 || th < Math.PI * 0.03) continue;
      const sn = Math.sin(th);
      const px = cx + Math.cos(th) * R * scm, py = cy + dm + Math.sin(th) * ry * scm;
      const pw = (R * 0.045) * Math.max(0.2, sn);
      if (k % 2) {
        g.fillStyle = 'rgba(12,6,2,0.38)';
        g.beginPath(); g.ellipse(px, py, pw * 0.5, bandH * 0.5, 0, 0, TAU); g.fill();
        g.strokeStyle = gc([255, 214, 160], 1, 0.12); g.lineWidth = Math.max(0.5, R * 0.005);
        g.beginPath(); g.ellipse(px - pw * 0.12, py - bandH * 0.08, pw * 0.5, bandH * 0.5, 0, Math.PI * 0.9, Math.PI * 1.6); g.stroke();
      } else {
        g.fillStyle = 'rgba(12,6,2,0.32)';
        g.beginPath(); g.ellipse(px, py, pw * 0.22, pw * 0.22 * 0.9, 0, 0, TAU); g.fill();
      }
    }
  }
  if (b.o.deco) line(b.D * 0.46, 0.84, 0.7);
  // specular streaks
  g.globalCompositeOperation = 'lighter';
  const streak = (sx, a) => {
    g.save(); g.translate(sx, cy + ry * 0.7 + Hb * 0.35); g.scale(0.16, 1);
    const r = (ry + Hb) * 0.8, sg = g.createRadialGradient(0, 0, 0, 0, 0, r);
    sg.addColorStop(0, gc([255, 226, 172], 1, a)); sg.addColorStop(1, 'rgba(255,226,172,0)');
    g.fillStyle = sg; g.fillRect(-r, -r, 2 * r, 2 * r); g.restore();
  };
  streak(cx - R * 0.46, 0.3); streak(cx + R * 0.62, 0.06);
  // warm bounce from cushion at the base
  gr = g.createLinearGradient(0, cy + ry + Hb * 0.55, 0, cy + ry + Hb);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, gc([120, 45, 25], 1, 0.16));
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'source-over';
  g.restore();
  // shadow line under the lip
  g.strokeStyle = 'rgba(0,0,0,0.45)'; g.lineWidth = Math.max(0.8, R * 0.013);
  g.beginPath(); g.ellipse(cx, cy + R * 0.012, R * 0.995, ry, 0, 0.04 * Math.PI, 0.96 * Math.PI); g.stroke();

  // ── rim lip
  g.beginPath();
  g.ellipse(cx, cy, R, ry, 0, 0, TAU);
  g.ellipse(cx, cy, b.Ri, b.ryi, 0, 0, TAU, true);
  let lg;
  if (HAS_CONIC) {
    lg = g.createConicGradient(0, cx, cy);
    lg.addColorStop(0, G(0.7)); lg.addColorStop(0.12, G(0.42)); lg.addColorStop(0.25, G(0.85, 0.05));
    lg.addColorStop(0.36, G(1.3, 0.45)); lg.addColorStop(0.45, G(0.9, 0.1)); lg.addColorStop(0.55, G(0.8));
    lg.addColorStop(0.63, G(1.35, 0.6)); lg.addColorStop(0.72, G(0.95, 0.12)); lg.addColorStop(0.86, G(0.6)); lg.addColorStop(1, G(0.7));
  } else {
    lg = g.createLinearGradient(cx - R, cy - ry, cx + R, cy + ry);
    lg.addColorStop(0, G(1.2, 0.4)); lg.addColorStop(0.4, G(0.9)); lg.addColorStop(1, G(0.45));
  }
  g.fillStyle = lg; g.fill('evenodd');
  if (b.o.pat > 0.5) {
    g.save(); g.clip('evenodd');
    for (let i = 0; i < 6; i++) {
      const a = rnd() * TAU, x = cx + Math.cos(a) * R * 0.98, y = cy + Math.sin(a) * ry * 0.98, r = R * (0.05 + rnd() * 0.08);
      const pg = g.createRadialGradient(x, y, 0, x, y, r);
      pg.addColorStop(0, gc([90, 130, 108], 1, 0.22)); pg.addColorStop(1, 'rgba(90,130,108,0)');
      g.fillStyle = pg; g.fillRect(x - r, y - r, 2 * r, 2 * r);
    }
    g.restore();
  }

  // ── interior
  g.save();
  g.beginPath(); g.ellipse(cx, cy, b.Ri, b.ryi, 0, 0, TAU); g.clip();
  gr = g.createLinearGradient(0, cy - b.ryi, 0, cy + b.ryi);
  gr.addColorStop(0, G(1.05, 0.14)); gr.addColorStop(0.22, G(0.82, 0.04)); gr.addColorStop(0.55, G(0.45)); gr.addColorStop(1, G(0.16));
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  gr = g.createLinearGradient(cx - b.Ri, 0, cx + b.Ri, 0);
  gr.addColorStop(0, 'rgba(0,0,0,0.35)'); gr.addColorStop(0.55, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.05)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'lighter';
  {
    const hx = cx + b.Ri * 0.34, hy = cy - b.ryi * 0.5, r = b.Ri * 0.62;
    g.save(); g.translate(hx, hy); g.scale(1, 0.5);
    const hg = g.createRadialGradient(0, 0, 0, 0, 0, r);
    hg.addColorStop(0, gc(mixp(p, 1.1, 0.35), 1, 0.35)); hg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = hg; g.fillRect(-r, -r, 2 * r, 2 * r); g.restore();
  }
  g.globalCompositeOperation = 'source-over';
  // facets on the inner back wall
  for (let i = 0; i < n * 0.35; i++) {
    const a = Math.PI + rnd() * Math.PI, rr = 0.75 + rnd() * 0.22;
    const x = cx + Math.cos(a) * b.Ri * rr, y = cy + Math.sin(a) * b.ryi * rr;
    const sr = R * (0.02 + rnd() * 0.025);
    g.fillStyle = gc([255, 220, 170], 1, 0.035);
    g.beginPath(); g.ellipse(x, y, sr, sr * 0.5, 0, 0, TAU); g.fill();
  }
  // water
  const wv = b.w, wy = wv.y - (b.y - cy);
  g.beginPath(); g.ellipse(cx, wy, wv.rx, wv.ry, 0, 0, TAU);
  gr = g.createLinearGradient(0, wy - wv.ry, 0, wy + wv.ry);
  gr.addColorStop(0, gc(mixp(p, 0.7, 0.08), 1, 0.7)); gr.addColorStop(0.25, gc(mixp(p, 0.4), 1, 0.6));
  gr.addColorStop(0.7, gc(mixp(p, 0.24), 1, 0.6)); gr.addColorStop(1, gc(mixp(p, 0.16), 1, 0.7));
  g.fillStyle = gr; g.fill();
  g.save(); g.clip();
  g.globalCompositeOperation = 'lighter';
  {
    const r = wv.rx * 0.5;
    g.save(); g.translate(cx - wv.rx * 0.3, wy - wv.ry * 0.25); g.scale(1, 0.4);
    const sg = g.createRadialGradient(0, 0, 0, 0, 0, r);
    sg.addColorStop(0, gc([255, 225, 180], 1, 0.12)); sg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = sg; g.fillRect(-r, -r, 2 * r, 2 * r); g.restore();
  }
  g.restore();
  g.strokeStyle = gc([255, 210, 150], 1, 0.07); g.lineWidth = Math.max(0.6, R * 0.006);
  g.beginPath(); g.ellipse(cx, wy, wv.rx, wv.ry, 0, Math.PI * 1.05, Math.PI * 1.95); g.stroke();
  g.restore();

  // lip glints
  g.globalCompositeOperation = 'lighter';
  for (const [a, s] of [[-2.35, 0.55], [2.2, 0.28]]) {
    const x = cx + Math.cos(a) * R * 0.975, y = cy + Math.sin(a) * ry * 0.975, r = R * 0.16;
    g.save(); g.translate(x, y); g.scale(1, 0.35);
    const sg = g.createRadialGradient(0, 0, 0, 0, 0, r);
    sg.addColorStop(0, gc([255, 238, 205], 1, s)); sg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = sg; g.fillRect(-r, -r, 2 * r, 2 * r); g.restore();
  }
  g.globalCompositeOperation = 'source-over';

  const ox = Math.round((b.x - cx) * dpr) / dpr, oy = Math.round((b.y - cy) * dpr) / dpr;
  b.spr = { c, x: ox, y: oy, w: c.width / dpr, h: c.height / dpr };
}

function drawShadow(g, b) {
  const R = b.R, by = b.bottom;
  for (const [dx, sc, a] of [[R * 0.35, 1.5, 0.35], [R * 0.05, 1.12, 0.55]]) {
    g.save(); g.translate(b.x + dx, by - R * 0.02); g.scale(1, K * 0.85);
    const r = R * sc, sg = g.createRadialGradient(0, 0, 0, 0, 0, r);
    sg.addColorStop(0, `rgba(0,0,0,${a})`); sg.addColorStop(0.55, `rgba(0,0,0,${a * 0.5})`); sg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = sg; g.fillRect(-r, -r, 2 * r, 2 * r); g.restore();
  }
}

function drawCushion(g, x, by, R) {
  // puffy round cushion (zafu-like), bowl nestles into it
  const cy = by - R * 0.16, rx = R * 0.9, ry = rx * K, T = R * 0.2;
  const b = { x };
  g.beginPath(); g.ellipse(b.x, cy + T * 0.55, rx * 0.97, ry * 1.02, 0, 0, TAU);
  g.fillStyle = gc(FABRIC, 0.16); g.fill();
  for (let k = 0; k < 5; k++) {                       // rounded side, built from stacked slices
    const f = k / 4, yy = cy + T * 0.55 * (1 - f), sc = 0.97 + 0.03 * Math.sin(f * Math.PI);
    g.beginPath(); g.ellipse(b.x, yy, rx * sc, ry * sc, 0, 0, TAU);
    g.fillStyle = gc(FABRIC, 0.2 + 0.28 * f); g.fill();
  }
  let gr = g.createRadialGradient(b.x - rx * 0.25, cy - ry * 0.3, rx * 0.1, b.x, cy, rx);
  gr.addColorStop(0, gc(FABRIC, 0.75)); gr.addColorStop(0.7, gc(FABRIC, 0.55)); gr.addColorStop(1, gc(FABRIC, 0.35));
  g.save(); g.translate(0, 0);
  g.beginPath(); g.ellipse(b.x, cy, rx * 0.96, ry * 0.94, 0, 0, TAU); g.fillStyle = gr; g.fill();
  g.restore();
  // velvet sheen along the far edge + faint gold piping at the seam
  g.strokeStyle = gc([210, 120, 95], 1, 0.12); g.lineWidth = Math.max(1, R * 0.03);
  g.beginPath(); g.ellipse(b.x, cy, rx * 0.92, ry * 0.88, 0, Math.PI * 1.02, Math.PI * 1.75); g.stroke();
  g.strokeStyle = gc([210, 160, 90], 1, 0.1); g.lineWidth = Math.max(0.6, R * 0.007);
  g.beginPath(); g.ellipse(b.x, cy + T * 0.18, rx * 0.985, ry * 0.99, 0, 0.08 * Math.PI, 0.92 * Math.PI); g.stroke();
  // occlusion where the bowl sinks in
  g.save(); g.translate(x, by - R * 0.06); g.scale(1, K);
  const ao = g.createRadialGradient(0, 0, 0, 0, 0, R * 0.72);

// A tiny bit of real geometry. The window is an opening in the back wall; the floor runs from the wall's foot
// (horizonY) toward the viewer, with depth foreshortened by K (a horizontal circle of radius R reads R × R·K).
// A ray from the sun/moon that passes the window at height h above the floor drops h and, per unit of drop,
// travels tx sideways and tz into the room, so it lands at screen (x + tx·h, horizonY + K·tz·h). That's one
// affine map, so the lit patch IS the window — arch, panes and mullion bars — sheared and stretched by the
// light direction: high sun → short patch near the wall; low dusk sun → long streak reaching into the room.
// The beam in the air is the same map at fractions t of the drop (window → patch), stacked as thin slices.

  const e = lerp(3.5, maxE, clamp(E, 0, 1)) * D2R;

  const moonK = L.moon * (1 - sstep(0.25, 0.5, L.day)) * moonLit();

  ind.dimA = (ind.dimA || 0) + (auto.dim - (ind.dimA || 0)) * (1 - Math.exp(-dt / 2));
  if (calm.amt > 0.002 || calmOn) {
    const st = breathNow();
    calm.br = st; calm.breath = st.level;
    // hold / rest: the room goes very still
    calm.still += ((st.phase === 'hold' || st.phase === 'rest' ? 1 : 0) - calm.still) * (1 - Math.exp(-dt * 1.5));
    const exhale = st.phase !== calm.lastPh && st.phase === 'out' && calm.lastPh !== '';
    if (st.phase !== calm.lastPh) calm.lastPh = st.phase;
    if (calmOn && exhale) {   // each out-breath: one soft strike on the breathing bowl
      const cyc = calm.cyc++;
      const b = breathB;
      if (auto.mode === 'meditate') meditateExhale(cyc, now);
      else b.ripE = Math.min(1, b.ripE + 0.25);   // the soft strike shivers the bowl's water (no outward ring: the floor rings are drawing in)
      if (auto.mode !== 'meditate') { const c = runningCtx(); if (c) playStrike(graph(c), b, 0.1, 0.8); }
    }
  } else { calm.breath = 0; calm.still = 0; calm.lastPh = ''; }
  ts = lerp(1, 0.4, Math.max(calm.amt, ind.dimA)) * (1 - 0.5 * calm.still * calm.amt);
  ambT += dt * ts;
  // hover-to-sing activation
  if (act.dwell && (act.dwell !== hover || LW.pointer.down || !LW.pointer.inside)) act.dwell = null;
  if (act.dwell && now - act.dwellStart >= DWELL && !(act.bowl && now - act.lastCircle < 900)) activate(act.dwell, now);
  if (act.bowl) {
    const b = act.bowl, P = LW.pointer;
    const far = !P.inside || Math.hypot(P.x - b.x, (P.y - b.y) * 1.6) > b.R * 4;
    if (far) { if (!act.farSince) act.farSince = now; else if (now - act.farSince > 2000) deactivate(); }
    else act.farSince = 0;
    if (act.bowl && now - act.lastCircle > 6000) deactivate();
  }
  act.fade += ((act.bowl ? 1 : 0) - act.fade) * (1 - Math.exp(-dt / 0.35));
  act.pulse *= Math.exp(-dt / 0.6);
  // bowls
  for (const b of bowls) {
    b.glowE *= Math.exp(-dt / 4.2);
    b.ripE *= Math.exp(-dt / 1.3);
    if (now - b.rubSeen > 140) b.rubT *= Math.exp(-dt / 0.15);
    const up = b.rubT > b.rub;
    b.rub += (b.rubT - b.rub) * (1 - Math.exp(-dt / (up ? 1.5 : 0.9)));
    if (b.rub < 1e-4) b.rub = 0;
    if (now - b.humSeen > 120) b.humT *= Math.exp(-dt / 0.3);   // cursor stopped → let it ring down
    const hup = b.humT > b.hum;
    b.hum += (b.humT - b.hum) * (1 - Math.exp(-dt / (hup ? 1.0 : 2.4)));
    if (b.hum < 1e-4) b.hum = 0;
    const aup = b.autoT > b.auto;
    b.auto += (b.autoT - b.auto) * (1 - Math.exp(-dt / (aup ? 1.4 : 2.2)));
    if (b.auto < 1e-4) b.auto = 0;
    b.sing = Math.max(b.rub, b.hum, b.auto);
    b.actG = b === act.bowl ? act.fade * (0.14 + 0.05 * Math.sin(now / 1000 * 1.7)) + act.pulse * 0.45 : 0;
    b.hov += ((hover === b ? 1 : 0) - b.hov) * (1 - Math.exp(-dt / 0.18));
    b.calmG = b === breathB ? calm.amt * (0.12 + 0.8 * calm.breath) : 0;
    if (b.sing > 0.12 && now - b.lastRing > lerp(1300, 700, b.sing)) {
      b.lastRing = now;
      rings.push({ x: b.x, y: b.bottom - b.R * 0.1, r0: b.R * 0.95, sp: groupW * 0.2, life: 3, age: 0, k: 0.34, str: b.sing * 0.5, ground: true });
    }
  }
  // singing audio
  if (now - lastSingerTick > 60) {
    lastSingerTick = now;
    const c = runningCtx();
    for (const b of bowls) {
      if (c && !b.singer && b.sing > 0.03) singerStart(graph(c), b);
      if (b.singer && AU) {
        const tt = AU.c.currentTime, S = b.singer;
        S.out.gain.setTargetAtTime(0.13 * Math.pow(b.sing, 1.3), tt, 0.25);
        S.ng.gain.setTargetAtTime((0.05 * b.rubT + 0.012 * b.humT) * S.noiseK, tt, 0.06);
        // hover / auto singing: brighter and fuller as it swells
        const br = Math.max(b.hum, b.auto * 0.7);
        S.pg[1].gain.setTargetAtTime(S.base[1] * (1 + 1.05 * br), tt, 0.4);
        S.pg[2].gain.setTargetAtTime(S.base[2] * (1 + 1.6 * br * br), tt, 0.4);
        if (b.sing < 0.004 && now - Math.max(b.rubSeen, b.humSeen) > 4000) singerStop(b);
      }
    }
  }
  if (now - lastRainTick > 500) { lastRainTick = now; updateRainAudio(now); }
  // idle auto-strike (rare, quiet, only when audio already running)
  const idle = now - lastInput > 40000;
  if (!idle || calm.target || auto.mode !== 'off') nextAuto = 0;
  else if (runningCtx()) {
    if (!nextAuto) nextAuto = now + 5000 + Math.random() * 25000;
    else if (now > nextAuto) {
      strike(bowls[(Math.random() * bowls.length) | 0], 0.14 + Math.random() * 0.08, { onlyIfRunning: true, vis: 0.7, level: 0.7 });
      nextAuto = now + 40000 + Math.random() * 60000;
    }
  }
  // rings
  for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.age += dt * (r.soft ? 1 : lerp(1, 0.7, calm.amt) * (1 - 0.35 * calm.still * calm.amt)); if (r.age > r.life) rings.splice(i, 1); }
  // incense smoke
  { const rp = ROOM_PROPS[1], r = roomPropGeom(rp);
    if (r) {
      const tx = r.x - r.w / 2 + rp.tip[0] * r.s, ty = r.y - r.h + rp.tip[1] * r.s;
      smoke.acc += dt * 9 * ts;
      while (smoke.acc > 1) { smoke.acc--; if (smoke.p.length < 60) smoke.p.push({ x: tx, y: ty, age: 0, life: 5 + Math.random() * 3, ph: Math.random() * TAU, sx: (Math.random() - 0.5) * 2 }); }
      for (let i = smoke.p.length - 1; i >= 0; i--) {
        const q = smoke.p[i]; q.age += dt * ts;
        if (q.age > q.life) { smoke.p.splice(i, 1); continue; }
        const k = q.age / q.life;
        q.y -= dt * ts * Rmax * (0.42 - 0.18 * k);
        q.x += dt * ts * (Math.sin(ambT * 0.7 + q.ph + q.age * 1.3) * Rmax * 0.09 * k + q.sx * Rmax * 0.02 * k + Rmax * 0.05 * k * light.wind);
      }
    } else smoke.p.length = 0; }
  // dust
  for (const p of dust) {
    const sp = 0.4 + 0.8 * p.z;
    const bx = (2.2 + 3 * Math.sin(ambT * 0.05 + p.ph)) * sp, by = (-1.2 + 2.4 * Math.sin(ambT * 0.07 + p.ph * 1.7)) * sp;
    for (const r of rings) {
      if (r.age <= 0) continue;
      const rad = r.r0 + r.sp * r.age * (1 - 0.25 * r.age / r.life);
      const dx = p.x - r.x, dy = (p.y - r.y) / 0.6, d = Math.hypot(dx, dy) || 1;
      const diff = Math.abs(d - rad);
      if (diff < 28) { const f = r.str * (1 - diff / 28) * (1 - r.age / r.life) * 160 * dt; p.vx += (dx / d) * f; p.vy += (dy / d) * f * 0.6; }
    }
    p.x += (bx * ts + p.vx) * dt; p.y += (by * ts + p.vy) * dt;
    const damp = Math.exp(-dt / 1.1); p.vx *= damp; p.vy *= damp;
    if (p.x > W + 12) p.x = -12; else if (p.x < -12) p.x = W + 12;
    if (p.y > H + 12) p.y = -12; else if (p.y < -12) p.y = H + 12;
  }
  // weather
  const w = light.weather;
  if (w === 'storm') {
    if (!wxs.nextFlash) wxs.nextFlash = now + 4000;
    if (now > wxs.nextFlash) {
      const dist = Math.random();
      wxs.flashes.push(now, now + 90 + Math.random() * 120);
      if (Math.random() < 0.4) wxs.flashes.push(now + 400 + Math.random() * 300);
      wxs.nextFlash = now + 9000 + Math.random() * 18000;
      const c = runningCtx();
      if (c) { const A = graph(c); setTimeout(() => thunder(A, dist), 900 + dist * 2600); }
    }
  }
  while (wxs.flashes.length && now >= wxs.flashes[0]) { wxs.flashes.shift(); wxs.flash = Math.max(wxs.flash, 0.7 + Math.random() * 0.3); }
  wxs.flash *= Math.exp(-dt / 0.11);
  wxs.snowAcc = clamp(wxs.snowAcc + (light.weather === 'snow' ? dt * (0.25 + 0.75 * light.I) / 120 : -dt / (light.day > 0.5 ? 240 : 600)), 0, 1);
  if (bgFade < 1) bgFade = Math.min(1, bgFade + dt / 2.5);
  if (reminder.on) {
    const e = (now - reminder.t0) / 1000;
    reminder.a = e < 2.5 ? ease(e / 2.5) : e < 14.5 ? 1 : 1 - ease((e - 14.5) / 3);
    if (e > 17.5) { reminder.on = false; reminder.a = 0; }
  }
}

// ───────────────────────── draw ─────────────────────────
function drawBeam(LP, fk, sa, front, t) {
  const c = LP && LP.beam; if (!c) return;
  const a = fk * (0.45 + sa) * c.k * 1.15;
  if (!c.box || a <= 0.002) return;
  const bx = c.box, s = c.box_sc;
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = Math.min(1, a);
  ctx.drawImage(c, bx.sx, bx.sy, bx.sw, bx.sh, bx.sx / s, bx.sy / s, bx.sw / s, bx.sh / s);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  for (const p of front || []) drawProp(p, t);
}

function drawWindowWeather(t) {
  const L = light, w = L.weather, I = L.I;
  const { x0, top, bot } = win, ww = win.w, wh = bot - top;
  const hasFx = L.clouds > 0 || w === 'rain' || w === 'storm' || w === 'snow' || wxs.flash > 0.01 || wxs.snowAcc > 0.01;
  if (!hasFx) { ctx.drawImage(frameSpr.c, frameSpr.x, frameSpr.y, frameSpr.w, frameSpr.h); return; }
  ctx.save(); winPath(ctx, 0); ctx.clip();
  // clouds
  if (L.clouds > 0) {
    const day = clamp((L.sky[1][0] + L.sky[1][1] + L.sky[1][2]) / 600, 0.05, 1);
    const cc = mixc(mixc(L.sky[1], L.sky[0], 0.3), [255, 250, 245], 0.55 * day * (L.weather === 'clear' ? 1 : 0.5));
    for (const c of wxs.clouds) {
      const cx = x0 + (((c.x + ambT * c.v) % 1.8) - 0.4) * ww, cy = top + c.y * wh, r = c.s * ww * (0.9 + 0.1 * Math.sin(ambT * 0.05 + c.y * 9));
      ctx.save(); ctx.translate(cx, cy); ctx.scale(1, 0.42);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
      g.addColorStop(0, rgba(cc, 0.34 * L.clouds)); g.addColorStop(0.6, rgba(cc, 0.14 * L.clouds)); g.addColorStop(1, rgba(cc, 0));
      ctx.fillStyle = g; ctx.fillRect(-r, -r, 2 * r, 2 * r); ctx.restore();
    }
  }
  if (wxs.flash > 0.01) { ctx.fillStyle = `rgba(215,222,255,${wxs.flash * 0.75})`; ctx.fillRect(x0, top, ww, wh); }
  // rain outside
  if (w === 'rain' || w === 'storm') {
    const n = Math.round(wxs.rain.length * (0.35 + 0.65 * I) * (w === 'storm' ? 1 : 0.75));
    const slant = 0.18 + L.wind * 0.3;
    ctx.strokeStyle = `rgba(200,210,225,${0.2 + 0.12 * I})`; ctx.lineWidth = Math.max(1, ww / 260);
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const r = wxs.rain[i];
      const y = ((r.y + ambT * r.s * (w === 'storm' ? 1.6 : 1.2)) % 1.1) - 0.05;
      const x = ((r.x + y * slant * 0.3) % 1);
      const px = x0 + x * ww, py = top + y * wh, l = r.l * wh;
      ctx.moveTo(px, py); ctx.lineTo(px - l * slant, py - l);
    }
    ctx.stroke();
    // droplets on the pane
    const dsc = Math.max(1, ww / 200);
    for (const d0 of wxs.drops) {
      const d = { ...d0, r: d0.r * dsc };
      const px = x0 + d.x * ww, py = top + d.y * wh;
      if (d.v > 0) {
        ctx.strokeStyle = 'rgba(210,220,235,0.08)'; ctx.lineWidth = d.r * 0.8;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py - Math.min(18, d.v * 400)); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.arc(px, py, d.r, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(235,240,250,0.35)'; ctx.beginPath(); ctx.arc(px - d.r * 0.3, py - d.r * 0.35, d.r * 0.42, 0, TAU); ctx.fill();
    }
  }
  if (w === 'snow') {
    const n = Math.round(wxs.snow.length * (0.4 + 0.6 * I));
    ctx.fillStyle = 'rgba(240,244,252,0.8)';
    for (let i = 0; i < n; i++) {
      const s = wxs.snow[i];
      const y = ((s.y + ambT * (0.02 + 0.05 * s.z)) % 1.05) - 0.02;
      const x = s.x + Math.sin(ambT * 0.6 + s.ph) * 0.02 + ambT * 0.004 * L.wind;
      const px = x0 + (((x % 1) + 1) % 1) * ww, py = top + y * wh, r = (0.6 + s.z * 1.8) * Math.max(1, ww / 240);
      ctx.globalAlpha = 0.35 + 0.55 * s.z;
      ctx.beginPath(); ctx.arc(px, py, r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // snow collecting on the outside of the panes, deepest in the bottom corners; builds up while it snows and
  // lingers (then slowly melts) after
  if (wxs.snowAcc > 0.01) {
    const bw = Math.max(2, win.ft * 0.45), rectH = bot - win.archY, A = wxs.snowAcc;
    const cols = [[x0, win.cx - bw / 2], [win.cx + bw / 2, x0 + ww]], rowsB = [win.archY + rectH * 0.5 - bw / 2, bot, win.archY - bw / 2];
    const day = clamp(L.day + 0.25, 0.3, 1);

      const gr = ctx.createLinearGradient(0, yb - hc, 0, yb);

      ctx.quadraticCurveTo(b - pw * 0.08, yb - he * 1.5, b, yb - hc * 0.8); ctx.lineTo(b, yb); ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
  ctx.drawImage(frameSpr.c, frameSpr.x, frameSpr.y, frameSpr.w, frameSpr.h);
}

function updateDrops(dt) {
  for (const d of wxs.drops) {
    if (d.v === 0) { d.hold -= dt; if (d.hold < 0) d.v = 0.01 + Math.random() * 0.03; }
    else { d.y += d.v * dt; d.v = Math.min(0.12, d.v + dt * 0.02); if (Math.random() < dt * 0.6) { d.v = 0; d.hold = 1 + Math.random() * 6; } }
    if (d.y > 1.02) { d.y = -0.02; d.x = Math.random(); d.v = 0; d.hold = Math.random() * 6; }
  }
}

function drawCandleFlames(t) {
  const L = light;
  ctx.globalCompositeOperation = 'lighter';
  for (const c of candles) {
    const fl = 1 + 0.06 * Math.sin(ambT * 7.3 + c.ph) + 0.04 * Math.sin(ambT * 13.1 + c.ph * 2) + 0.03 * Math.sin(ambT * 23.7 + c.ph * 3);
    const sway = Math.sin(ambT * 1.3 + c.ph) * c.w * 0.05 + Math.sin(ambT * 4.1 + c.ph) * c.w * 0.02;
    const bx = c.x, by = c.y - c.h - c.w * 0.12;
    const fh = c.w * 1.25 * fl, fw = c.w * 0.3;
    const cs = 0.55 + 0.45 * L.candle;
    // halo
    let r = c.w * 7, g = ctx.createRadialGradient(bx, by - fh * 0.4, 0, bx, by - fh * 0.4, r);
    g.addColorStop(0, `rgba(255,160,70,${(0.05 + 0.11 * L.candle) * fl})`); g.addColorStop(0.4, `rgba(255,130,50,${(0.015 + 0.04 * L.candle) * fl})`); g.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = g; ctx.fillRect(bx - r, by - fh * 0.4 - r, 2 * r, 2 * r);
    r = c.w * 1.4; g = ctx.createRadialGradient(bx, by - fh * 0.45, 0, bx, by - fh * 0.45, r);
    g.addColorStop(0, `rgba(255,200,120,${0.22 * cs})`); g.addColorStop(1, 'rgba(255,170,90,0)');
    ctx.fillStyle = g; ctx.fillRect(bx - r, by - fh * 0.45 - r, 2 * r, 2 * r);
    // flame
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.bezierCurveTo(bx - fw, by - fh * 0.2, bx - fw * 0.4 + sway * 0.5, by - fh * 0.72, bx + sway, by - fh);
    ctx.bezierCurveTo(bx + fw * 0.4 + sway * 0.5, by - fh * 0.72, bx + fw, by - fh * 0.2, bx, by);
    g = ctx.createRadialGradient(bx, by - fh * 0.28, 0, bx, by - fh * 0.3, fh * 0.8);
    g.addColorStop(0, 'rgba(255,250,236,0.95)'); g.addColorStop(0.25, 'rgba(255,214,140,0.85)'); g.addColorStop(0.6, 'rgba(255,140,50,0.45)'); g.addColorStop(1, 'rgba(200,60,20,0)');
    ctx.fillStyle = g; ctx.fill();
    ctx.fillStyle = 'rgba(90,120,255,0.18)'; ctx.beginPath(); ctx.ellipse(bx, by - fh * 0.06, fw * 0.45, fh * 0.07, 0, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawFog(t) {
  if (light.haze <= 0) return;
  // fog banks drifting through the valley — outside, seen through the glass only
  ctx.save(); winPath(ctx, 0); ctx.clip();
  ctx.globalCompositeOperation = 'lighter';
  const ww = win.w, wh = win.bot - win.top;
  for (const f of wxs.fog) {
    const x = win.x0 + ((((f.x + ambT * f.v * 3) % 1.4) + 1.4) % 1.4 - 0.2) * ww, y = win.top + (0.35 + f.y * 0.6) * wh, r = f.s * ww * 1.6;
    ctx.save(); ctx.translate(x, y); ctx.scale(1, 0.35);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    g.addColorStop(0, `rgba(150,148,146,${0.16 * light.haze})`); g.addColorStop(1, 'rgba(150,148,146,0)');
    ctx.fillStyle = g; ctx.fillRect(-r, -r, 2 * r, 2 * r); ctx.restore();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
}

function drawSprite(s, jx) { if (s) ctx.drawImage(s.c, s.x + jx, s.y, s.w, s.h); }
const drawProp = (p, t) => drawSprite(p.spr, p.b ? jitterOf(p.b, t) : 0);

const vibOf = (b) => Math.min(0.9, b.ripE * 0.8 + b.sing * 0.45);
const jitterOf = (b, t) => { const v = vibOf(b); return v > 0.04 ? (Math.sin(t * 83 + b.i) * 0.7 + Math.sin(t * 127 + b.i * 2) * 0.3) * v * 0.8 : 0; };
function drawBowlFx(b, t, spritesDone) {
  const g = Math.min(1.3, b.glowE * 0.85 + b.sing * 0.9 + b.calmG * 1.15 + b.actG);
  const calmRip = b.calmG * (1 - 0.8 * calm.still);   // breath ripples in the bowl settle on holds
  const amp = Math.min(1.4, b.ripE + 0.28 * b.glowE + b.sing * 0.8 + calmRip * 0.45 + b.actG * 0.3);
  if (!spritesDone && vibOf(b) > 0.04) {
    drawSprite(b.spr, jitterOf(b, t));
    for (const o of b.over) drawProp(o, t);
  }

  ctx.globalCompositeOperation = 'lighter';

    let r = b.R * 2.6;
    ctx.save(); ctx.translate(b.x, b.y + b.ry * 0.4); ctx.scale(1, 0.62);
    let gg = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    gg.addColorStop(0, `rgba(${b.col.bloom},${0.28 * g})`); gg.addColorStop(0.35, `rgba(${b.col.bloom2},${0.1 * g})`); gg.addColorStop(1, `rgba(${b.col.bloom2},0)`);
    ctx.fillStyle = gg; ctx.fillRect(-r, -r, 2 * r, 2 * r); ctx.restore();
    r = b.R;
    ctx.save(); ctx.translate(b.x, b.y); ctx.scale(1, K);
    gg = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    gg.addColorStop(0, `rgba(${b.col.inner},${0.3 * g})`); gg.addColorStop(1, `rgba(${b.col.inner},0)`);
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0, 0, r * 0.97, 0, TAU); ctx.fill(); ctx.restore();
  }
  if (amp > 0.012) drawRipples(b, amp, t);
  const ra = clamp(0.5 * g + 0.17 * b.hov, 0, 0.8);
  if (ra > 0.01) {
    ctx.lineWidth = Math.max(1, b.R * 0.018);
    ctx.strokeStyle = `rgba(${b.col.rim},${ra * 0.7})`;
    ctx.beginPath(); ctx.ellipse(b.x, b.y, b.R * 0.985, b.ry * 0.985, 0, 0, TAU); ctx.stroke();
    ctx.strokeStyle = `rgba(${b.col.rim2},${ra * 0.8})`; ctx.lineWidth = Math.max(1, b.R * 0.012);
    ctx.beginPath(); ctx.ellipse(b.x, b.y, b.R * 0.985, b.ry * 0.985, 0, Math.PI * 1.08, Math.PI * 1.55); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawRipples(b, amp, t) {
  const w = b.w;
  ctx.save();
  ctx.beginPath(); ctx.ellipse(w.x, w.y, w.rx, w.ry, 0, 0, TAU); ctx.clip();
  ctx.translate(w.x, w.y); ctx.scale(1, w.ry / w.rx);
  const R = w.rx;
  let gg = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
  gg.addColorStop(0, `rgba(${b.col.inner},${0.22 * Math.min(1, amp)})`); gg.addColorStop(1, `rgba(${b.col.inner},0)`);
  ctx.fillStyle = gg; ctx.fillRect(-R, -R, 2 * R, 2 * R);
  const N = 7, om = TAU * b.visHz * lerp(1, 0.45, calm.amt), ct = Math.cos(t * om);
  const sing = Math.min(1, b.sing * 1.3 + b.calmG * (1 - 0.8 * calm.still) * 0.3 + b.actG * 0.4);
  const lw = Math.max(0.7, R * 0.022);
  ctx.lineWidth = lw;
  for (let i = 1; i <= N; i++) {
    const rr = i / (N + 0.5);
    const s = Math.cos(3.2 * Math.PI * rr - t * 0.9) * ct;
    const a = amp * (0.1 + 0.55 * Math.abs(s)) * (1 - rr * 0.45);
    if (a < 0.008) continue;
    ctx.beginPath();
    if (sing > 0.03) {
      const seg = 56, m = b.m;
      for (let k = 0; k <= seg; k++) {
        const th = (k / seg) * TAU;
        const r = rr * R * (1 + (0.05 + 0.06 * b.sing) * sing * Math.cos(m * th + t * 0.35) * Math.cos(t * om * 0.5 + i * 0.9));
        const x = Math.cos(th) * r, y = Math.sin(th) * r;
        if (k) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      }
    } else ctx.arc(0, 0, rr * R, 0, TAU);
    if (s >= 0) { ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(${b.col.rip},${Math.min(0.85, a * 0.6)})`; }
    else { ctx.globalCompositeOperation = 'source-over'; ctx.strokeStyle = `rgba(${b.col.dark},${Math.min(0.6, a * 0.45)})`; }
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'lighter';
  gg = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 0.16);
  gg.addColorStop(0, `rgba(255,230,190,${0.35 * Math.min(1, amp) * (0.5 + 0.5 * Math.abs(ct))})`); gg.addColorStop(1, 'rgba(255,200,140,0)');
  ctx.fillStyle = gg; ctx.fillRect(-R, -R, 2 * R, 2 * R);
  ctx.restore();
}

function drawDwell(now) {
  const b = act.dwell; if (!b) return;
  const p = clamp((now - act.dwellStart) / DWELL, 0, 1);
  const vis = sstep(0.12, 0.3, p);                          // don't flicker on brief passes
  if (vis <= 0) return;
  const a0 = -Math.PI / 2, a1 = a0 + p * TAU, rx = b.R * 1.045, ry = b.ry * 1.06;
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const [lw, a] of [[Math.max(4, b.R * 0.07), 0.1], [Math.max(1.4, b.R * 0.022), 0.6]]) {
    ctx.lineWidth = lw; ctx.strokeStyle = `rgba(255,214,160,${a * vis})`;
    ctx.beginPath(); ctx.ellipse(b.x, b.y, rx, ry, 0, a0, a1); ctx.stroke();
  }
  const hx = b.x + Math.cos(a1) * rx, hy = b.y + Math.sin(a1) * ry, hr = Math.max(5, b.R * 0.09);
  const hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, hr);
  hg.addColorStop(0, `rgba(255,240,215,${0.75 * vis})`); hg.addColorStop(1, 'rgba(255,200,140,0)');
  ctx.fillStyle = hg; ctx.fillRect(hx - hr, hy - hr, hr * 2, hr * 2);
  ctx.lineCap = 'butt';
  ctx.globalCompositeOperation = 'source-over';
}

function drawRings(passes) {
  if (!rings.length) return;
  ctx.globalCompositeOperation = 'lighter';
  for (const pass of passes) {
    if (pass) { ctx.save(); ctx.beginPath(); ctx.rect(0, horizonY, W, H - horizonY); ctx.clip(); }
    for (const r of rings) {
      if (r.ground !== pass || r.age <= 0) continue;
      const p = r.age / r.life;
      const rad = r.r0 + r.sp * r.age * (1 - 0.25 * p);
      const a = r.str * Math.pow(1 - p, 1.7) * sstep(0, 0.08, r.age);
      if (a < 0.004) continue;
      const col = r.soft ? '255,220,175' : r.col || '255,188,118';
      for (const [lw, k] of [[14, 0.045], [4, 0.09], [1.1, 0.24]]) {
        ctx.lineWidth = lw; ctx.strokeStyle = `rgba(${col},${a * k})`;
        ctx.beginPath(); ctx.ellipse(r.x, r.y, rad, rad * r.k, 0, 0, TAU); ctx.stroke();
      }
    }
    if (pass) ctx.restore();
  }
  ctx.globalCompositeOperation = 'source-over';
}

// Calm: rings of light on the floor round the breathing bowl. They spread out across the boards on the in-breath,
// hold their radius on the hold and draw back into the bowl on the out-breath. Driven only by calm.breath (the
// breath level, constant during hold/rest), so a hold is a true hold. Same strokes as the strike rings.
function drawBreathFloor() {
  if (calm.amt <= 0.01) return;
  const b = breathB, lv = calm.breath, a = calm.amt, N = 3;
  const r0 = b.R * 0.95, spread = Math.max(b.R, Math.min(groupW * 0.27, W * 0.72 - b.x - r0)) * lv;
  const x = b.x, y = b.bottom - b.R * 0.1, col = b.col.ring;
  ctx.save(); ctx.beginPath(); ctx.rect(0, horizonY, W, H - horizonY); ctx.clip();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < N; i++) {
    const f = (i + 1) / N, rad = r0 + spread * f;
    const s = a * (0.3 + 0.7 * lv) * (1 - 0.35 * f);
    for (const [lw, k] of [[14, 0.06], [4, 0.12], [1.1, 0.3]]) {
      ctx.lineWidth = lw; ctx.strokeStyle = `rgba(${col},${s * k})`;
      ctx.beginPath(); ctx.ellipse(x, y, rad, rad * 0.34, 0, 0, TAU); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawSmoke() {
  if (!smoke.p.length) return;
  ctx.globalCompositeOperation = 'lighter';
  const L = light, base = mixc([150, 140, 130], L.shaft, 0.25);
  for (const q of smoke.p) {
    const k = q.age / q.life, r = Rmax * (0.03 + 0.2 * k);
    const lit = 0.05 + shaftAt(q.x, q.y) * 1.4 + 0.05 * L.candle;
    const a = Math.sin(Math.PI * Math.min(1, k * 1.15)) * (1 - k) * 0.5 * lit;
    if (a < 0.003) continue;
    ctx.globalAlpha = Math.min(1, a);
    ctx.drawImage(dotSpr, q.x - r, q.y - r, r * 2, r * 2);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
function drawDust(t) {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of dust) {
    const s = 0.5 + 1.7 * p.z;
    let a = (0.03 + 0.06 * p.z) * (0.6 + 0.4 * Math.sin(ambT * 0.6 + p.ph)) + shaftAt(p.x, p.y) * (0.22 + 0.5 * p.z);
    for (const b of bowls) {
      const gl = b.glowE + b.sing + b.calmG; if (gl < 0.03) continue;
      const dx = (p.x - b.x) / (b.R * 2.2), dy = (p.y - b.y) / (b.R * 1.4);
      a += gl * 0.35 * Math.exp(-(dx * dx + dy * dy));
    }
    if (a < 0.01) continue;
    ctx.globalAlpha = Math.min(1, a);
    ctx.drawImage(dotSpr, p.x - s * 2, p.y - s * 2, s * 4, s * 4);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawGlass(a, t) {
  const { x, y, rw, h } = glass, rb = rw * 0.82;
  ctx.save();
  ctx.globalAlpha = a;
  // shadow + caustic
  ctx.save(); ctx.translate(x + rw * 0.25, y); ctx.scale(1, K);
  let g = ctx.createRadialGradient(0, 0, 0, 0, 0, rw * 1.5);
  g.addColorStop(0, 'rgba(0,0,0,0.4)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(-rw * 1.5, -rw * 1.5, rw * 3, rw * 3); ctx.restore();
  ctx.globalCompositeOperation = 'lighter';
  ctx.save(); ctx.translate(x + rw * 0.9, y + rw * 0.05); ctx.scale(1, K);
  g = ctx.createRadialGradient(0, 0, 0, 0, 0, rw * 1.6);
  g.addColorStop(0, `rgba(255,205,145,${0.16 * (0.85 + 0.15 * Math.sin(t * 1.7))})`); g.addColorStop(0.5, 'rgba(255,190,120,0.05)'); g.addColorStop(1, 'rgba(255,180,110,0)');
  ctx.fillStyle = g; ctx.fillRect(-rw * 1.6, -rw * 1.6, rw * 3.2, rw * 3.2); ctx.restore();
  {
    ctx.save(); ctx.translate(x, y - h * 0.3); ctx.scale(1, 0.55);
    const r = rw * 4.5, pg = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    pg.addColorStop(0, `rgba(255,190,120,${0.07 * (0.8 + 0.2 * Math.sin(t * 1.3))})`); pg.addColorStop(1, 'rgba(255,170,100,0)');
    ctx.fillStyle = pg; ctx.fillRect(-r, -r, 2 * r, 2 * r); ctx.restore();
  }
  // body
  const body = (topY, topR) => {
    ctx.beginPath(); ctx.moveTo(x - topR, topY); ctx.lineTo(x - rb, y);
    ctx.ellipse(x, y, rb, rb * K, 0, Math.PI, 0, true);
    ctx.lineTo(x + topR, topY); ctx.ellipse(x, topY, topR, topR * K, 0, 0, Math.PI, false); ctx.closePath();
  };
  ctx.globalCompositeOperation = 'source-over';
  body(y - h, rw); ctx.fillStyle = 'rgba(150,170,180,0.06)'; ctx.fill();
  const wl = y - h * 0.62, rwl = lerp(rb, rw, 0.62);
  body(wl, rwl);
  let lg = ctx.createLinearGradient(0, wl, 0, y);
  lg.addColorStop(0, 'rgba(120,140,150,0.10)'); lg.addColorStop(1, 'rgba(60,70,75,0.16)');
  ctx.fillStyle = lg; ctx.fill();
  ctx.globalCompositeOperation = 'lighter';
  lg = ctx.createLinearGradient(0, wl, 0, y);
  lg.addColorStop(0, 'rgba(255,190,120,0)'); lg.addColorStop(1, 'rgba(255,190,120,0.12)');
  ctx.fillStyle = lg; ctx.fill();
  // water surface
  ctx.beginPath(); ctx.ellipse(x, wl, rwl, rwl * K, 0, 0, TAU); ctx.fillStyle = 'rgba(200,215,225,0.06)'; ctx.fill();
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(255,236,212,0.38)'; ctx.beginPath(); ctx.ellipse(x, wl, rwl, rwl * K, 0, 0.05, Math.PI - 0.05); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,236,212,0.14)'; ctx.beginPath(); ctx.ellipse(x, wl, rwl, rwl * K, 0, Math.PI, TAU); ctx.stroke();
  // walls
  for (const [sx, bx2, al] of [[-1, -1, 0.42], [1, 1, 0.22]]) {
    lg = ctx.createLinearGradient(0, y - h, 0, y);
    lg.addColorStop(0, `rgba(255,232,205,${al})`); lg.addColorStop(1, `rgba(255,232,205,${al * 0.35})`);
    ctx.strokeStyle = lg; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(x + sx * rw, y - h); ctx.lineTo(x + bx2 * rb, y); ctx.stroke();
  }
  // vertical highlight streak
  lg = ctx.createLinearGradient(0, y - h, 0, y);
  lg.addColorStop(0, 'rgba(255,245,230,0.0)'); lg.addColorStop(0.3, 'rgba(255,245,230,0.26)'); lg.addColorStop(1, 'rgba(255,245,230,0.03)');
  ctx.fillStyle = lg;
  ctx.beginPath(); ctx.moveTo(x - rw * 0.66, y - h * 0.95); ctx.lineTo(x - rw * 0.52, y - h * 0.95); ctx.lineTo(x - rb * 0.48, y - h * 0.06); ctx.lineTo(x - rb * 0.6, y - h * 0.06); ctx.closePath(); ctx.fill();
  // rim + base
  ctx.strokeStyle = 'rgba(255,238,215,0.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(x, y - h, rw, rw * K, 0, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,230,200,0.2)'; ctx.lineWidth = Math.max(1, h * 0.05);
  ctx.beginPath(); ctx.ellipse(x, y - h * 0.035, rb * 0.93, rb * 0.93 * K, 0, 0.05, Math.PI - 0.05); ctx.stroke();
  // glint
  g = ctx.createRadialGradient(x - rw * 0.55, y - h * 0.8, 0, x - rw * 0.55, y - h * 0.8, rw * 0.35);
  g.addColorStop(0, 'rgba(255,248,235,0.5)'); g.addColorStop(1, 'rgba(255,248,235,0)');
  ctx.fillStyle = g; ctx.fillRect(x - rw, y - h * 1.2, rw, rw);
  ctx.restore();
}


function draw(now) {
  const t = now / 1000;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  if (bgFade < 1) {
    ctx.drawImage(bgPrev, 0, 0, W, H);
    ctx.globalAlpha = ease(bgFade); ctx.drawImage(bgCur, 0, 0, W, H); ctx.globalAlpha = 1;
  } else ctx.drawImage(bgCur, 0, 0, W, H);
  if (calm.amt > 0.003) { ctx.fillStyle = `rgba(3,2,2,${0.26 * calm.amt})`; ctx.fillRect(0, 0, W, H); }

  // breathing volumetric light
  ctx.globalCompositeOperation = 'lighter';
  const breathe = 0.22 + 0.16 * Math.sin((ambT * TAU) / 17) + 0.06 * Math.sin((ambT * TAU) / 6.3);
  const sa = breathe * (1 - 0.5 * calm.amt) + calm.amt * (0.1 + 0.75 * calm.breath) + wxs.flash * 0.3;
  const fresh = LIGHTprev && bgFade < 1 ? bgFade : 1;
  if (fresh < 1) drawBeam(LIGHTprev, 1 - fresh, sa, beamFrontPrev, t);
  drawBeam(LIGHT, fresh, sa, beamFront, t);
  ctx.globalCompositeOperation = 'source-over';

  drawWindowWeather(t);
  if (wxs.flash > 0.01) {
    ctx.globalCompositeOperation = 'lighter';
    const r = Math.max(W, H) * 0.9, g = ctx.createRadialGradient(win.cx, win.cy, 0, win.cx, win.cy, r);
    g.addColorStop(0, `rgba(170,185,230,${0.22 * wxs.flash})`); g.addColorStop(1, 'rgba(170,185,230,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }
  drawCandleFlames(t);
  drawFog(t);
  // calm: warm swell around the breathing bowl
  if (calm.amt > 0.003) {
    const b = breathB;
    ctx.globalCompositeOperation = 'lighter';
    ctx.save(); ctx.translate(b.x, b.y + b.ry); ctx.scale(1, 0.5);
    const r = groupW * (0.16 + 0.22 * calm.breath), g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    g.addColorStop(0, `rgba(255,160,85,${0.13 * calm.amt * (0.2 + calm.breath)})`); g.addColorStop(1, 'rgba(255,140,70,0)');
    ctx.fillStyle = g; ctx.fillRect(-r, -r, 2 * r, 2 * r); ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
  }
  const ground = rings.some((r) => r.ground && r.age > 0) || calm.amt > 0.01;
  if (ground) { drawRings([true]); drawBreathFloor(); for (const p of props) drawProp(p, t); }
  for (const b of bowls.order) drawBowlFx(b, t, ground);
  drawDwell(now);
  drawRings([false]);
  drawSmoke();
  drawDust(t);
  // reminders are diegetic (a glass of water appears); the host's own label carries any words
  if (reminder.a > 0.003 && reminder.kind === 'water') drawGlass(reminder.a, t);
  if ((ind.dimA || 0) > 0.003) { ctx.fillStyle = `rgba(2,1,1,${ind.dimA})`; ctx.fillRect(0, 0, W, H); }
  {
    const P = LW.pointer, q = indicatorPos();
    const near = P.inside && Math.abs(P.x - q.x) < 140 && Math.abs(P.y - q.y) < 60 ? 1 : 0;
    const tgt = auto.mode !== 'off' ? 0.3 + 0.2 * near : 0.22 * near;
    ind.a += (tgt - ind.a) * 0.12;
    if (ind.a > 0.01) {
      ctx.save();
      ctx.font = `italic 300 ${clamp(H * 0.014, 11, 14)}px ${SERIF}`;
      if ('letterSpacing' in ctx) ctx.letterSpacing = '1.5px';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = `rgba(232,214,190,${ind.a})`;
      ctx.fillText(indicatorText(now), q.x, q.y);
      ctx.restore();
    }
  }
}

// ───────────────────────── loop ─────────────────────────
let lastDraw = 0, lastT = performance.now();
function isActive(now) {
  if (now - lastInput < 1500) return true;
  if (rings.length) return true;
  if (act.dwell || act.pulse > 0.02 || auto.swell) return true;
  for (const b of bowls) if (b.glowE > 0.02 || b.ripE > 0.02 || b.sing > 0.01 || b.hov > 0.02) return true;
  return wxs.flash > 0.01 || bgFade < 1;
}
function frame(now) {
  requestAnimationFrame(frame);
  if (!bgCur) return;
  const active = isActive(now);
  const minDt = active ? 1000 / 62 : 1000 / 31;
  if (now - lastDraw < minDt) return;
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now; lastDraw = now;
  update(dt, now);
  if (light.weather === 'rain' || light.weather === 'storm') updateDrops(dt);
  draw(now);
}

let rsT = 0;
addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { layout(); rebake(false); }, 120); });
LW.on('layout', () => { clearTimeout(rsT); rsT = setTimeout(() => { layout(); rebake(false); }, 60); });
// the shared moon art arrives asynchronously: re-bake the window once it can be drawn
{ const iv = setInterval(() => { if (!LW.moonCanvas || LW.moonCanvas(16)) { clearInterval(iv); if (light.moon > 0.01 && bgCur) rebake(false); } }, 250); setTimeout(() => clearInterval(iv), 20000); }
document.addEventListener('visibilitychange', () => { lastT = performance.now(); });

layout();
applyEnv(LW.env, true);
applySettings(LW.settings);
if (!bgCur) rebake(false);
if (LW.calm) calm.target = true;
requestAnimationFrame(frame);

// test hooks
window.__bowls = { strike: (i, v = 0.8) => strike(bowls[i], v), bowls: () => bowls, light: () => light, calm, reminder, wxs, rebake, bakeLight: () => bakeLight(light), LIGHT: () => LIGHT,
  act, auto, S: () => S, rub: (i, s = 0.8) => { const b = bowls[i]; b.rubT = s; b.rubSeen = performance.now() + 3000; } };
})();
</script>
</body>
