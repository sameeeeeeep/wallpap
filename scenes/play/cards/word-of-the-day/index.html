<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letter Garden</title><!--CARD_STYLE--><style>
.garden{display:flex;gap:20px}.guesses{display:grid;gap:5px;flex:1}.guess{display:flex;gap:8px}.letter{width:37px;height:39px;border-radius:18px 18px 9px 9px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px}.letter small{font-size:10px;line-height:10px}.exact{border:2px solid var(--accent)}.present{border-style:dashed}.absent{opacity:.65}.legend{width:150px;font-size:12px;line-height:1.6}.legend p{margin:0 0 8px}#guess{width:155px;text-transform:uppercase;letter-spacing:.16em}#result{font-family:Georgia,serif;font-size:20px}#entry{margin-top:14px}@media(max-width:440px){.garden{gap:10px}.legend{width:120px;font-size:11px}.letter{width:31px}.guess{gap:5px}}
</style></head><body><div class="row" style="justify-content:space-between"><h1>Letter Garden</h1><small id="day"></small></div><p class="muted">One hidden word. Six gentle attempts.</p><div class="garden"><div id="guesses" class="guesses" aria-label="Your guesses"></div><aside class="legend"><p><b>=</b> In the right place</p><p><b>~</b> In the word, elsewhere</p><p><b>·</b> Not in the word</p><p id="streak"></p></aside></div><div id="entry" class="row"><label for="guess" class="muted">Five letters</label><input id="guess" maxlength="5" autocomplete="off" spellcheck="false" aria-label="Guess a five-letter word"><button id="submit">Plant word</button></div><p id="notice" class="notice" role="status" aria-live="polite"></p><p id="result"></p><div id="ad"></div><!--CARD_SDK--><script>
(async()=>{await card.ready();const $=s=>document.querySelector(s),day=card.today(),words=CARD_DATA.words,answer=words.answers[PlayCore.dailyIndex(day,words.answers.length)],valid=new Set(words.guesses);let state={day,guesses:[]},savedStreak=null,busy=false,adShown=false;
try{const saved=await card.load('progress');if(saved?.day===day&&Array.isArray(saved.guesses))state={day,guesses:saved.guesses.filter(w=>/^[A-Z]{5}$/.test(w)).slice(0,6)};savedStreak=await card.load('streak');}catch{$('#notice').textContent='Local progress could not load. You can still play.';}
$('#day').textContent=day;const won=()=>state.guesses.includes(answer),done=()=>won()||state.guesses.length===6;
async function persist(){try{await card.save('progress',state);if(done()){if(won()){savedStreak=PlayCore.streak(savedStreak,day);await card.save('streak',savedStreak);}await card.save('summary',{day,done:true,streak:won()?savedStreak.count:0});await card.event('puzzle_complete');}}catch{$('#notice').textContent='This result could not be saved. Keep Play open and try again.';}}
function render(){const box=$('#guesses');box.replaceChildren();for(let n=0;n<6;n++){const row=document.createElement('div');row.className='guess';row.setAttribute('aria-label','Attempt '+(n+1));const guess=state.guesses[n],feedback=guess?PlayCore.feedback(answer,guess):[];for(let i=0;i<5;i++){const el=document.createElement('span');el.className='letter '+(feedback[i]||'');el.textContent=guess?.[i]||'';if(guess){const mark=document.createElement('small');mark.textContent={exact:'=',present:'~',absent:'·'}[feedback[i]];el.append(mark);el.setAttribute('aria-label',guess[i]+': '+{exact:'correct position',present:'in word, different position',absent:'not in word'}[feedback[i]]);}else el.setAttribute('aria-label','Empty letter '+(i+1));row.append(el);}box.append(row);}$('#entry').hidden=done();$('#entry').style.display=done()?'none':'flex';$('#streak').textContent=savedStreak?.count?savedStreak.count+' day streak':'';if(done()){$('#result').textContent=won()?'A word well found.':'Today’s word was '+answer+'.';$('#notice').textContent='A fresh garden tomorrow.';if(!adShown){adShown=true;card.adSlot($('#ad')).catch(()=>{});}}}
async function submit(){if(busy||done())return;const guess=$('#guess').value.trim().toUpperCase();if(!/^[A-Z]{5}$/.test(guess)){$('#notice').textContent='Enter exactly five letters.';return;}if(!valid.has(guess)){$('#notice').textContent='That word is not in our dictionary. Try another.';return;}if(state.guesses.includes(guess)){$('#notice').textContent='You have already planted that word.';return;}busy=true;state.guesses.push(guess);$('#guess').value='';$('#notice').textContent='Attempt '+state.guesses.length+' of 6.';render();await persist();render();busy=false;}
$('#submit').onclick=submit;$('#guess').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();submit();}};render();
})();
</script></body></html>
