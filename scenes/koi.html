<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Koi Pond</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050d0d; cursor: default; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #hud { position: fixed; left: 14px; bottom: 12px; font: 12px ui-monospace, Menlo, monospace; color: #9fb; opacity: 0; transition: opacity .6s; pointer-events: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="over"></canvas>
<div id="hud"></div>
<script src="astronomy.js"></script>
<script src="lw.js"></script>
<script src="moon.js"></script>
<script>
'use strict';
// ─────────────────────────────────────────────────────────────────────────────
// Koi pond. Layers:
//   fish canvas (2D, underwater)  ─┐
//   surface canvas (2D, pads…)    ─┼─► WebGL composite: ripple sim → refraction,
//   ripple sim (GPU wave eq.)     ─┘   caustics, shadows, sky reflection, glints
//   overlay canvas (2D, emissive: text, fireflies, breath glow, snow)
// ─────────────────────────────────────────────────────────────────────────────

const TAU = Math.PI * 2;
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

// 1D value noise for wandering.
const NP = new Float32Array(512).map(() => Math.random() * 2 - 1);
function noise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(NP[i & 511], NP[(i + 1) & 511], u); }

const glc = document.getElementById('gl');
const over = document.getElementById('over');
const octx = over.getContext('2d');

let W = 0, H = 0, DPR = 1, GLS = 1;
// Sprite resolution for pre-rendered pads/flowers (uploaded once, never per frame —
// canvas→texture uploads stall WebKit, so everything per-frame is drawn in WebGL).
const SURF_SCALE = Math.min(2, devicePixelRatio || 1);
const SIM_DIV = 3;         // ripple sim at 1/3 CSS res

// ─── WebGL ──────────────────────────────────────────────────────────────────
const gl = glc.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: 'default' });
const floatOK = !!(gl && gl.getExtension('EXT_color_buffer_float'));

const VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(p*2.0-1.0,0.0,1.0); }`;

const SIM_FS = `#version 300 es
precision highp float;
uniform sampler2D uPrev; uniform vec2 uSize; uniform vec4 uDrops[16]; uniform int uN; uniform float uDamp;
out vec4 o;
void main(){
  vec2 uv = gl_FragCoord.xy / uSize; vec2 tx = 1.0/uSize;
  vec4 c = texture(uPrev, uv);
  float n = texture(uPrev, uv+vec2(tx.x,0)).r + texture(uPrev, uv-vec2(tx.x,0)).r
          + texture(uPrev, uv+vec2(0,tx.y)).r + texture(uPrev, uv-vec2(0,tx.y)).r;
  float h = (n*0.5 - c.g) * uDamp;
  for (int i=0;i<16;i++){
    if (i>=uN) break;
    vec4 d = uDrops[i];
    float dist = length((uv - d.xy) * uSize);
    if (dist < d.z) h += d.w * (0.5 + 0.5*cos(3.14159*dist/d.z));
  }
  // keep the edges calm
  vec2 e = min(uv, 1.0-uv) * uSize;
  h *= smoothstep(0.0, 4.0, min(e.x, e.y));
  o = vec4(h, c.r, 0.0, 1.0);
}`;

const COMP_FS = `#version 300 es
precision highp float;
uniform sampler2D uSim, uFish, uSurf, uFloor;
uniform vec2 uRes, uSimTx, uSunDir, uLantern;
uniform float uTime, uAspect, uHasSim;
uniform vec3 uLight, uSky, uDeep, uShallow, uFogCol;
uniform float uAmb, uCaust, uSpec, uFlash, uFog, uDapple, uWind, uLanternOn, uSat;
uniform vec4 uBreath;   // calm breath rings: centre (fp space), outer radius (fp), amplitude (0 = off)
uniform sampler2D uGlint;                 // music: koi scale glints (r = sheen, g = sparkle), from the fish pass's 2nd target
uniform vec3 uGlintCol; uniform float uGlintOn, uCaustB;
uniform vec4 uSwell;    // music: deep bass swell — centre (fp space), amplitude, phase
uniform vec2 uClear;    // LW.layout.clear (0..1 of the width): the swell fades out beyond it
uniform sampler2D uMoon; uniform vec4 uMoonP;   // night: the shared moon reflected — centre (fp), radius (fp), strength
uniform float uPadSnow; // snow settled on the pads, 0..1
out vec4 o;

float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash2(vec2 p){ return vec2(hash(p), hash(p+19.19)); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<4;i++){ s+=a*noise(p); p=p*2.03+17.1; a*=.5; } return s; }

// Tileable water caustic (after joltz0r / Dave Hoskins).
float caustic(vec2 p, float t){
  p = mod(p, 6.28318) - 250.0;
  vec2 i = p; float c = 1.0; float inten = .005;
  for (int n = 0; n < 4; n++) {
    float tt = t * (1.0 - (3.5 / float(n+1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0/length(vec2(p.x / (sin(i.x+tt)/inten), p.y / (cos(i.y+tt)/inten)));
  }
  c /= 4.0; c = 1.17 - pow(c, 1.4);
  return pow(abs(c), 8.0);
}

// Pond bed: silt + moss, with patches of small river pebbles.
float pebbles(vec2 p, out float tone){
  // Separate rounded stones with silt between (not a tiled pavement).
  vec2 i = floor(p), f = fract(p);
  float best = 0.0; tone = 0.0;
  for (int y=-1;y<=1;y++) for (int x=-1;x<=1;x++){
    vec2 g = vec2(x,y); vec2 h = hash2(i+g);
    if (h.x > 0.6) continue;                         // some cells are empty
    vec2 c = g + 0.2 + h*0.6 - f;
    float ang = h.y*6.28; vec2 q = mat2(cos(ang),-sin(ang),sin(ang),cos(ang))*c;
    q.x *= 0.75 + h.x*0.5;                           // oval
    float hr = hash(i+g+3.7); float r = 0.12 + 0.36*hr*hr;
    float d = length(q)/r;
    float v = smoothstep(1.0, 0.6, d) * (1.0 - 0.4*d*d);   // domed
    float ao = smoothstep(1.45, 1.0, d);                     // contact shadow
    v = v > 0.0 ? v : -ao*0.5;
    if (abs(v) > abs(best)){ best = v; tone = hash(i+g+9.1); }
  }
  return best;
}
vec3 pondFloor(vec2 p, out float stoneMask){
  float m1 = fbm(p*0.35), m2 = fbm(p*1.1 + 7.0);
  vec3 silt = mix(uDeep*1.1, uShallow*0.55, m1);
  silt = mix(silt, silt*vec3(0.85,1.08,0.8), smoothstep(0.4,0.7,m2));     // moss
  float tone;
  float st = pebbles(p*0.75, tone);
  float patchMask = smoothstep(0.42, 0.6, fbm(p*0.3 + 3.1));
  float tone2;
  float small = max(pebbles(p*2.2 + 11.0, tone2), 0.0) * 0.6;
  float grain = noise(p*14.0)*0.5 + noise(p*31.0)*0.5;
  vec3 stone = uShallow * mix(0.6, 1.15, tone);
  stone = mix(stone, stone*vec3(1.12,0.96,0.82), step(0.85, tone)*0.5);
  silt *= 0.88 + 0.24*grain;
  float stv = max(st, 0.0), ao = max(-st, 0.0);
  stoneMask = max(stv*patchMask, small*patchMask*0.5);
  vec3 col = silt * (1.0 - ao*patchMask);
  col = mix(col, stone*(0.9+0.2*grain), stv*patchMask*0.85);
  col = mix(col, uShallow*mix(0.45,0.8,tone2), small*patchMask*0.35);
  return col;
}

float blurA(sampler2D t, vec2 uv, float r){
  float a = texture(t, uv).a*0.28;
  a += texture(t, uv+vec2(r,0)).a*0.18 + texture(t, uv-vec2(r,0)).a*0.18;
  a += texture(t, uv+vec2(0,r*uAspect)).a*0.18 + texture(t, uv-vec2(0,r*uAspect)).a*0.18;
  return a;
}

vec3 sat(vec3 c, float s){ float l = dot(c, vec3(0.299,0.587,0.114)); return mix(vec3(l), c, s); }

void main(){
  vec2 uv = vec2(gl_FragCoord.x/uRes.x, 1.0 - gl_FragCoord.y/uRes.y);
  vec2 asp = vec2(uAspect, 1.0);
  vec2 fp = uv*asp;

  // Surface normal from the ripple heightfield + wind micro-ripples.
  vec2 grad = vec2(
    texture(uSim, uv+vec2(uSimTx.x,0)).r - texture(uSim, uv-vec2(uSimTx.x,0)).r,
    texture(uSim, uv+vec2(0,uSimTx.y)).r - texture(uSim, uv-vec2(0,uSimTx.y)).r) * uHasSim;
  // Calm: standing ripple rings whose radius follows the breath (analytic, so they hold perfectly still on a hold).
  vec2 bd = fp - uBreath.xy; float bdl = length(bd);
  if (uBreath.w > 0.0005 && bdl < uBreath.z + 0.06) {
    float d = bdl, hd = 0.0;
    for (int i = 1; i <= 5; i++) {
      float f = float(i) / 5.0, x = (d - uBreath.z * (0.2 + 0.8 * f)) / (0.006 + 0.004 * f);
      hd += (1.0 - 0.45 * f) * x * exp(-x * x);
    }
    grad += bd / max(d, 1e-4) * hd * uBreath.w;
  }
  // Music: a long, slow swell rolling out from where the koi gather (bass), fading out before the right ~28%.
  if (uSwell.z > 1e-5) {
    vec2 sd = fp - uSwell.xy; float sl = length(sd) + 1e-4;
    float ph = 11.0 * sl - uSwell.w, se = exp(-sl * 1.8)
      * (uClear.x > 0.01 ? smoothstep(uClear.x - 0.06, uClear.x + 0.12, uv.x) : 1.0) * (uClear.y < 0.99 ? smoothstep(uClear.y + 0.06, uClear.y - 0.12, uv.x) : 1.0);
    grad += sd / sl * uSwell.z * se * (11.0 * cos(ph) - 1.8 * sin(ph));
  }
  vec2 wp = fp*34.0;
  vec2 micro = vec2(noise(wp + uTime*vec2(1.1,0.6)) - 0.5, noise(wp.yx*1.13 - uTime*vec2(0.8,1.2)) - 0.5);
  micro += 0.5*vec2(noise(fp*9.0 + uTime*0.25) - 0.5, noise(fp.yx*9.0 - uTime*0.21) - 0.5);
  vec3 N = normalize(vec3(-(grad*4.0 + micro*uWind*0.22), 1.0));
  vec2 refr = N.xy * 0.014;

  // Overhead foliage shade drifting slowly (day only).
  float dap = 0.0;
  if (uDapple > 0.01) {
    dap = smoothstep(0.52, 0.72, fbm(fp*2.2 + vec2(uTime*0.012, uTime*0.004)));
    dap *= smoothstep(1.25, 0.2, length((uv - vec2(-0.05, -0.05))*asp)) * uDapple;
  }

  // Floor + caustics.
  float stoneMask;
  vec4 flr = texture(uFloor, uv + refr*1.8/asp);   // pre-baked pond bed
  vec3 fl = flr.rgb; stoneMask = flr.a;
  float ca = caustic((fp + refr*2.5)*4.2, uTime*0.32);
  if (uCaust > 0.2) ca = ca*0.8 + 0.35*caustic((fp*1.7 - refr*1.5)*4.2 + 1.7, uTime*0.27);

  vec2 so = uSunDir * vec2(0.03/uAspect, 0.03);
  float fsh = blurA(uFish, uv + refr*0.5 + so, 0.006);
  float psh = blurA(uSurf, uv + so*0.9, 0.008);
  float lit = (1.0 - dap*0.6) * (1.0 - fsh*0.75) * (1.0 - psh*0.72);

  vec3 col = fl * (uLight*uAmb*(0.5 + 0.5*lit) + vec3(0.02,0.03,0.035));
  col += uLight * ca * uCaust * uCaustB * lit * (0.5 + 0.5*stoneMask) * 0.55;

  // Lantern pool (night).
  float ld = length((uv - uLantern)*asp);
  vec3 lantern = vec3(1.0,0.62,0.3) * uLanternOn * 0.55 / (1.0 + ld*ld*28.0);
  col += fl * lantern * (1.0 - fsh*0.5) * 2.0;

  // Water column.
  float depth = 0.55 + 0.25*smoothstep(0.1, 0.9, length((uv-0.5)*asp*0.9));
  col = mix(col, uDeep*(uAmb*0.8+0.08) + lantern*0.15, 0.42*depth);

  // Fish, refracted.
  vec4 f = texture(uFish, uv + refr*0.7);
  vec3 fishLit = f.rgb * (uLight*uAmb*(0.92 - dap*0.35) + uLight*ca*uCaust*uCaustB*0.22*(1.0-dap) + lantern*1.4 + vec3(0.03));
  col = col*(1.0 - f.a) + fishLit;
  col = mix(col, uDeep*(uAmb*0.7+0.06), 0.1);
  // Music: light catching the koi's scales (sun by day, moon by night) — added as light, refracted like the fish.
  if (uGlintOn > 0.5) { vec4 gq = texture(uGlint, uv + refr*0.7); col += uGlintCol * (gq.r + 1.7*gq.g); }

  // Sky reflection + specular glints.
  vec4 pad = texture(uSurf, uv + grad*0.004);   // rigid leaves: a slight bob, not a warp
  float slope = 1.0 - N.z;
  vec3 sky = uSky * (0.75 + 0.5*noise(fp*2.5 + vec2(uTime*0.006, 0.0) + N.xy*3.0));
  col += sky * (0.06 + min(slope, 0.04)*3.0) * (1.0 - pad.a) * (1.0 - dap*0.5);
  vec3 L = normalize(vec3(uSunDir*vec2(-1.0,1.0)*0.9, 1.0));
  L = normalize(vec3(-uSunDir.x, uSunDir.y, 1.1));
  vec3 Hh = normalize(L + vec3(0,0,1));
  float sp = pow(max(dot(N,Hh), 0.0), 220.0) * uSpec * (1.0 - dap*0.8);
  col += uLight * sp * 0.9 * (1.0 - pad.a);
  // The moon on the water: the shared photoreal moon, broken up by the same ripples (pads cover it below).
  if (uMoonP.w > 0.003) {
    vec2 mo = fp - uMoonP.xy + N.xy * 0.085 + vec2(sin(fp.y * 260.0 + uTime * 1.7), 0.0) * 0.0012;   // ripples break it up; a faint horizontal shimmer
    vec2 mq = vec2(mo.x, -mo.y) / (uMoonP.z * 2.0);                      // mirrored, as a reflection is
    vec4 mt = texture(uMoon, mq + 0.5) * smoothstep(0.5, 0.485, length(mq));   // disk only (no clamped edge texels)
    float md = length(mo) / uMoonP.z;
    col += (mt.rgb * 0.32 + vec3(0.55, 0.62, 0.78) * 0.06 * exp(-md * md * 0.07)) * uMoonP.w;
    col += vec3(0.72, 0.78, 0.92) * min(slope, 0.03) * 2.2 * exp(-md * md * 0.03) * uMoonP.w;   // moonlit glitter on nearby crests
  }

  // Floating layer (pads, flowers, pellets, leaves) lit by the scene.
  vec3 padLit = pad.rgb * (uLight*uAmb*(0.95 - dap*0.4) + lantern*1.6 + vec3(0.025));
  if (uPadSnow > 0.003) {   // snow settles on the leaves in drifts (not on the water — it melts there)
    float drift = mix(0.45, 1.0, smoothstep(0.32, 0.68, fbm(fp * 11.0 + 4.0))) * smoothstep(0.0, 0.35, uPadSnow);   // an even frosting, a little deeper in drifts
    padLit = mix(padLit, vec3(0.86, 0.89, 0.94) * pad.a * (uLight*uAmb*0.95 + lantern*1.2 + vec3(0.03)), drift * uPadSnow * 0.62);
  }
  col = col*(1.0 - pad.a) + padLit;

  // Mist.
  if (uFog > 0.005) {
    float mist = fbm(fp*1.3 + vec2(uTime*0.02, -uTime*0.008));
    col = mix(col, uFogCol*(uAmb*0.9+0.1), uFog * (0.35 + 0.55*mist));
  }

  col += uSky * uFlash * 0.6;
  col = sat(col, uSat);

  // Vignette, gentle filmic shoulder, grain.
  float vig = smoothstep(1.25, 0.35, length((uv-0.5)*vec2(uAspect*0.8, 1.0)));
  col *= 0.82 + 0.18*vig;
  // Camera exposure adapts to moonlight, retaining pond-bed and scale detail.
  float moonExposure = smoothstep(0.65, 0.38, uAmb);
  col = mix(col, sqrt(max(col,0.0))*0.72, moonExposure*0.72);
  col = col / (1.0 + max(col - 0.7, 0.0)*0.9);
  col += (fract(sin(dot(gl_FragCoord.xy + fract(uTime*7.0)*97.0, vec2(12.9898,78.233)))*43758.5453) - 0.5) * 0.02;
  o = vec4(pow(max(col, 0.0), vec3(0.97)), 1.0);
}`;

// Pond bed is static: bake it once (and again only when the light's palette shifts).
const FLOOR_FS = COMP_FS.slice(0, COMP_FS.indexOf('float blurA(')) + `
void main(){
  vec2 uv = vec2(gl_FragCoord.x/uRes.x, 1.0 - gl_FragCoord.y/uRes.y);
  float m; vec3 c = pondFloor(uv*vec2(uAspect,1.0)*8.0, m);
  o = vec4(c, m);
}`;

function compile(src, type) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(VS, gl.VERTEX_SHADER)); gl.attachShader(p, compile(fs, gl.FRAGMENT_SHADER));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name.replace('[0]', '')] = gl.getUniformLocation(p, info.name); }
  return { p, u };
}
const simP = program(SIM_FS);
const compP = program(COMP_FS);
const floorP = program(FLOOR_FS);
const vao = gl.createVertexArray();

function tex(w, h, float) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  if (float) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
let sim = null; // {w,h,tex:[a,b],fbo:[a,b],i}
// Offscreen layers the composite samples: koi (underwater) and surface (pads…).
function target(w, h) {
  const t = tex(w, h);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex: t, fbo: fb };
}
let fishRT = null, surfRT = null;
let floorTex = null, floorFbo = null, floorKey = null;
function bakeFloor(force) {
  const key = [...L.deep, ...L.shallow];
  if (!force && floorKey && key.every((v, i) => Math.abs(v - floorKey[i]) < 0.004)) return;
  floorKey = key;
  if (!floorTex) {
    floorTex = tex(glc.width, glc.height, floatOK);
    if (!floatOK) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, glc.width, glc.height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    floorFbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, floorFbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, floorTex, 0);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, floorFbo);
  gl.viewport(0, 0, glc.width, glc.height);
  gl.useProgram(floorP.p); gl.bindVertexArray(vao);
  gl.uniform2f(floorP.u.uRes, glc.width, glc.height);
  gl.uniform1f(floorP.u.uAspect, W / H);
  gl.uniform3fv(floorP.u.uDeep, L.deep); gl.uniform3fv(floorP.u.uShallow, L.shallow);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
let dummySim = null;

function buildSim() {
  if (sim) { sim.tex.forEach((t) => gl.deleteTexture(t)); sim.fbo.forEach((f) => gl.deleteFramebuffer(f)); sim = null; }
  if (!floatOK) {
    dummySim = tex(1, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 255]));
    return;
  }
  const w = Math.max(64, Math.round(W / SIM_DIV)), h = Math.max(64, Math.round(H / SIM_DIV));
  const t = [tex(w, h, true), tex(w, h, true)];
  const f = t.map((tt) => { const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tt, 0); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); return fb; });
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  sim = { w, h, tex: t, fbo: f, i: 0 };
}

const drops = [];
function addDrop(x, y, r, s) { if (drops.length < 64) drops.push([x / W, y / H, Math.max(2.6, r / SIM_DIV), s]); }
// Sky-borne drops (rain, melting snow): one that lands on a floating pad beads on the leaf instead of rippling the water.

// Pond bed: water lapping at the stones + a thin trickle; birds by day, crickets (and the odd frog) at night.
ambDrive((ctx) => {
  const lap = ambLoop(ctx, 'pink', AMB.out, 0.09, ambFilt(ctx, 'bandpass', 480, 0.9), ambFilt(ctx, 'lowpass', 1400));
  ambLfo(ctx, 0.13, 180, lap.f[0].frequency); ambLfo(ctx, 0.085, 0.04, lap.gain);

}, (ctx, at) => {
  const w = LW.env.weather, dry = w === 'clear' || w === 'cloudy', wet = w === 'rain' || w === 'storm';
  if (Math.random() < 0.12) ambTone(ctx, ambPan(ctx, AMB.out), at + Math.random() * 0.2, rand(1300, 1900), rand(2000, 2600), 0.05, 0.0035);   // drip into the pond
  if (L.night < 0.4 && dry && Math.random() < 0.05) ambBird(ctx, AMB.out, at, 0.006);

// ─── Koi ────────────────────────────────────────────────────────────────────
const C = {
  white: '#ebe4d6', red: '#c4472b', red2: '#a93a23', sumi: '#2e2a2b', gold: '#d7a445', gold2: '#f1d488',
  orange: '#d77a2e', plat: '#dcdcd6', bronze: '#86684a', asagi: '#6d8293', asagiDark: '#4f6170',

const VARIETIES = [

    case 'platinum': return { base: C.plat, fin: 'rgba(235,235,230,0.5)', metal: '#ffffff', patches: [] };

const SEG = 14;
class Koi {

    this.variety = pickVariety();

    this.phase = rand(TAU);

let fish = [];
const pellets = [];
function spawnFish() {
  const n = clamp(Math.round((W * H) / 160000), 6, 13);
  const companions = fish.filter((f) => f.agent);
  varietyDeck = [];   // fresh deal per pond, so every koi differs
  fish = Array.from({ length: n }, (_, i) => new Koi(i)).sort((a, b) => b.z - a.z).concat(companions);
}

// ─── AI companions as koi (Claude Code / Codex at work) ─────────────────────
function companionKoi(a) {
  const k = new Koi(0);
  k.variety = a.kind; k.pat = makePattern(a.kind === 'codex' ? 'codex' : 'claude');
  k.butterfly = true; k.z = 0.12; k.curious = 0.9; k.agent = a;
  // Swim in from the left edge.
  const y = rand(H * 0.35, H * 0.8);
  k.ang = rand(-0.3, 0.3);
  k.p = [];
  for (let j = 0; j < SEG; j++) k.p.push([-k.L * 0.2 - Math.cos(k.ang) * j * k.L / (SEG - 1), y - Math.sin(k.ang) * j * k.L / (SEG - 1)]);
  return k;
}
LW.on('agents', (A) => {
  LW.nativeAgents = A.style === 'native';
  const list = A.style === 'native' ? A.list : [];
  const ids = new Set(list.map((a) => a.id));
  let added = false;
  for (const f of fish) if (f.agent && !ids.has(f.agent.id)) f.leaving = true;
  for (const a of list) {
    const f = fish.find((g) => g.agent && g.agent.id === a.id);
    if (f) { f.agent = a; f.leaving = false; } else { fish.push(companionKoi(a)); added = true; }
  }
  fish.filter((f) => f.agent && !f.leaving).forEach((f, i) => { f.homeIdx = i; });

// Cursor state.
const cur = { x: -1e4, y: -1e4, vx: 0, vy: 0, speed: 0, inside: false, still: 0, lastMove: 0, lastT: 0 };
LW.on('move', (x, y) => {
  const t = performance.now() / 1000, dt = Math.max(0.008, t - cur.lastT);
  const vx = (x - cur.x) / dt, vy = (y - cur.y) / dt;
  if (cur.inside && Math.hypot(vx, vy) > 900) scareShoals(cur.x, cur.y, x, y);
  if (cur.inside && cur.lastT) { cur.vx = lerp(cur.vx, vx, 0.35); cur.vy = lerp(cur.vy, vy, 0.35); }
  cur.x = x; cur.y = y; cur.lastT = t; cur.lastMove = t; cur.inside = true;
  cur.speed = Math.hypot(cur.vx, cur.vy);
  // A finger trailing through the water.
  if (cur.speed > 60 && Math.random() < 0.6) addDrop(x, y, 7, -0.25 * Math.min(1, cur.speed / 900));
  lastInput = t;
});
LW.on('leave', () => { cur.inside = false; });
function dropFood(x, y) {
  const n = 4 + Math.floor(rand(4));
  for (let i = 0; i < n; i++) {
    const a = rand(TAU), r = rand(4, 26);
    pellets.push({ x: x + Math.cos(a) * r, y: y + Math.sin(a) * r, vx: Math.cos(a) * rand(4, 14), vy: Math.sin(a) * rand(4, 14), age: 0, life: rand(35, 55), rot: rand(TAU), bits: 1 });

// Menu action: drop food on open water in the left/centre of the pond (the right side stays calm).
LW.on('action', (a) => {
  if (a !== 'feed') return;
  const [c0, c1] = clearBand();
  const x = innerWidth * (c0 + (c1 - c0) * (0.3 + Math.random() * 0.55)), y = innerHeight * (0.3 + Math.random() * 0.4);
  LW.emit('down', x, y); LW.emit('up', x, y);

LW.on('down', (x, y) => {
  const now = performance.now() / 1000;

  const fh = fish.slice().reverse().find((f) => hitKoi(f, x, y));
  if (fh) { if (fh.agent && fh.agent.state === 'attention') fh.ack = true; boop(fh, x, y); return; }

});

}

// Seven spine sections suffice at ~25 CSS px. Shared scratch, 42 body + 6 tail vertices/fish.
const minnowMesh = new Float32Array(8*4);

function minnowVertex(f,x,y,u,v,fin=false) {
  vtx(x,y,u,v,f.shade,0,0,(1-f.z*0.3)*(fin?0.55:1),fin?4:3,f.school.gold,f.z,f.flash);
}
function emitShoals() {
  for(let fi=0;fi<minnows.length;fi++) {
    const f=minnows[fi],len=f.L*(1-f.z*0.18),c=Math.cos(f.ang),s=Math.sin(f.ang);
    const amp=len*(0.025+0.025*Math.min(2,f.speed/f.L));
    for(let j=0;j<8;j++) {
      const u=j/7, wave=Math.sin(f.phase-u*4.8)*amp*u*u+f.bend*len*0.018*u*u;
      const x=f.x-c*len*u-s*wave,y=f.y-s*len*u+c*wave,w=minnowWidths[j]*len,k=j*4;
      minnowMesh[k]=x-s*w;minnowMesh[k+1]=y+c*w;minnowMesh[k+2]=x+s*w;minnowMesh[k+3]=y-c*w;
      if(j) {
        const p=k-4;
        minnowVertex(f,minnowMesh[p],minnowMesh[p+1],(j-1)/7,1);
        minnowVertex(f,minnowMesh[p+2],minnowMesh[p+3],(j-1)/7,-1);
        minnowVertex(f,minnowMesh[k],minnowMesh[k+1],u,1);
        minnowVertex(f,minnowMesh[p+2],minnowMesh[p+3],(j-1)/7,-1);
        minnowVertex(f,minnowMesh[k+2],minnowMesh[k+3],u,-1);
        minnowVertex(f,minnowMesh[k],minnowMesh[k+1],u,1);
      }
    }
    const x=(minnowMesh[28]+minnowMesh[30])*0.5,y=(minnowMesh[29]+minnowMesh[31])*0.5;
    const beat=Math.sin(f.phase-5.5)*len*0.055;
    for(let side=-1;side<=1;side+=2) {
      minnowVertex(f,x,y,0,0,true);
      minnowVertex(f,x-c*len*0.24-s*(side*len*0.1+beat),y-s*len*0.24+c*(side*len*0.1+beat),1,side,true);
      minnowVertex(f,x-c*len*0.12-s*beat,y-s*len*0.12+c*beat,1,0,true);
    }
  }
}

// Geometry buffers reused per fish.
const Q = Array.from({ length: SEG }, () => [0, 0]);

    nx: lerp(NRM[i][0], NRM[i + 1][0], k), ny: lerp(NRM[i][1], NRM[i + 1][1], k), hw: lerp(HW[i], HW[i + 1], k),

const rgba = (str) => { const m = str.match(/[\d.]+/g).map(Number); return [m[0] / 255, m[1] / 255, m[2] / 255, m.length > 3 ? m[3] : 1]; };

// Each koi's markings live in one row of a pattern texture, in body space:

const patAtlas = { tex: null, rows: 1 };
const PW = 512, PH = 64;
function buildPatterns() {
  const cv = document.createElement('canvas'); cv.width = PW; cv.height = PH * fish.length;
  const c = cv.getContext('2d');
  fish.forEach((f, row) => {
    const pat = f.pat, y0 = row * PH;
    c.save(); c.beginPath(); c.rect(0, y0, PW, PH); c.clip();
    c.fillStyle = pat.base; c.fillRect(0, y0, PW, PH);

    if (pat.net) {

        c.beginPath(); c.ellipse(u * PW, y0 + (sv * 0.4 + 0.5) * PH, 0.018 * PW, (0.018 / hwRel(u)) * PH / 2, 0, 0, TAU); c.stroke();

    }
    for (const b of pat.patches) {
      const t = clamp(b.t, 0, 0.95);

    for (let u = 0.14, k = 0; u < 0.86; u += 0.03, k++) {
      for (let sv = -0.85; sv <= 0.86; sv += 0.34) {
        const vv = sv + (k % 2) * 0.17;
        c.beginPath(); c.ellipse(u * PW, y0 + (vv * 0.5 + 0.5) * PH, 0.026 * PW, (0.026 / hwRel(u)) * PH / 2, 0, -1.2, 1.2); c.stroke();

    f.finC = rgba(pat.fin);

// Sample a fin outline (two cubic béziers in fin space) → world points.
function bez(p0, p1, p2, p3, t) { const m = 1 - t; return m * m * m * p0 + 3 * m * m * t * p1 + 3 * m * t * t * p2 + t * t * t * p3; }

  const nx = -dy, ny = dx, pts = [];

function emitKoi(f, t) {

    const [fx, fy] = rot(back[0] / bl, back[1] / bl, -s * (0.95 - flap * s * 0.3));
    const pts = finPoly(bx, by, fx, fy, finLen, finLen * 0.34 * -s);

    const c1 = [B[0] + t1x * F * 0.6 + nx * F * 0.12, B[1] + t1y * F * 0.6 + ny * F * 0.12];
    const c3 = [B[0] + t2x * F * 0.6 - nx * F * 0.12, B[1] + t2y * F * 0.6 - ny * F * 0.12];
    const pts = [];

// ─── Surface: lily pads, lotus, pellets, leaves ─────────────────────────────
let pads = [];
function padSprite(r, tone, flowerKind) {

}
function emitLife(t) {
  if (frog.state !== 'gone') {
    const s = 1.25 * (1 + (frog.h || 0) * 0.4), a = frog.fade;
    quad(frog.x, frog.y, SPR.frog.s * s, SPR.frog.s * s, frog.ang + Math.PI / 2, SPR.frog.uv, a);
    if (frog.croak > 0.02) {
      const hx = frog.x + Math.cos(frog.ang) * 13 * s, hy = frog.y + Math.sin(frog.ang) * 13 * s, cs = (0.5 + 0.7 * frog.croak) * SPR.frogThroat.s;
      quad(hx, hy, cs, cs, frog.ang, SPR.frogThroat.uv, a * 0.9);
    }
  }
  if (fly.state !== 'gone') {
    const air = fly.state === 'perch' ? 1 : 1.12, rotA = fly.head + Math.PI / 2;
    const flutter = fly.state === 'perch' ? 0.75 : 0.35 + 0.25 * Math.random();
    quad(fly.x, fly.y, SPR.dfWings.s * air, SPR.dfWings.s * air * (fly.state === 'perch' ? 1 : 0.9 + 0.1 * Math.random()), rotA, SPR.dfWings.uv, flutter);
    quad(fly.x, fly.y, SPR.dfBody.s * air, SPR.dfBody.s * air, rotA, SPR.dfBody.uv, 1);
  }
}

// ─── Overlay: emissive things ───────────────────────────────────────────────
// Breath rings: the water shader bends real ripple crests (uBreath, refraction + sky sheen); this adds the emissive
// part on top — a faint crest line and a tapered sky glint per ring. Radius ∝ br.level → frozen during holds.
function breathRout() { return Math.min(W, H) * (0.085 + 0.255 * br.level); }   // outer ring radius, px (shared with the water shader)
function drawBreathRings(c, a) {
  const [cx, cy] = calmCenter(), lv = br.level, Rout = breathRout(), N = 5;
  const tint = '232,242,238';
  // a faint pool of light the rings sit in, breathing with them
  const g = c.createRadialGradient(cx, cy, 0, cx, cy, Rout * 1.15);
  g.addColorStop(0, `rgba(${tint},${(0.035 + 0.05 * lv) * a})`); g.addColorStop(1, `rgba(${tint},0)`);
  c.fillStyle = g; c.beginPath(); c.arc(cx, cy, Rout * 1.15, 0, TAU); c.fill();
  const w = 1.1 + 1.2 * lv, A0 = -Math.PI * 0.68;   // glints sit where the sky reflects: the upper-left of each crest
  for (let i = 0; i < N; i++) {
    const f = (i + 1) / N, r = Rout * (0.2 + 0.8 * f);
    const al = a * (1 - 0.45 * f) * (0.55 + 0.45 * lv);
    c.lineWidth = w * 3; c.strokeStyle = `rgba(${tint},${0.045 * al})`;                     // soft crest all the way round
    c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.stroke();
    c.lineWidth = Math.max(1, w * 0.55); c.strokeStyle = `rgba(${tint},${0.07 * al})`;
    c.stroke();
    c.strokeStyle = `rgba(255,255,246,${0.11 * al})`;                                       // tapered sky glint (stacked arcs)
    for (const hw of [1.1, 0.7, 0.35]) { c.beginPath(); c.arc(cx, cy, r, A0 - hw, A0 + hw); c.stroke(); }
  }
}
const flies = [];
const flakes = [];
function drawOverlay(dt, t) {
  const c = octx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, W, H);
  // Fireflies on warm, dry nights.
  const m = month();
  const wantFlies = L.night > 0.6 && m >= 3 && m <= 9 && !['rain', 'storm', 'snow'].includes(LW.env.weather) ? 14 : 0;
  while (flies.length < wantFlies) flies.push({ x: rand(W), y: rand(H), ph: rand(TAU), s: rand(0.6, 1.2), a: 0 });
  flies.forEach((f, i) => {
    f.x += noise1(f.ph + t * 0.2) * 12 * dt; f.y += noise1(f.ph * 3 + t * 0.2) * 12 * dt;
    f.a = lerp(f.a, i < wantFlies ? 1 : 0, dt * 0.5);
    const glow = f.a * Math.pow(0.5 + 0.5 * Math.sin(t * 1.3 * f.s + f.ph), 3);
    if (glow < 0.02) return;
    const g = c.createRadialGradient(f.x, f.y, 0, f.x, f.y, 14 * f.s);
    g.addColorStop(0, `rgba(230,240,150,${glow * 0.9})`); g.addColorStop(0.2, `rgba(200,220,110,${glow * 0.35})`); g.addColorStop(1, 'rgba(200,220,110,0)');
    c.fillStyle = g; c.beginPath(); c.arc(f.x, f.y, 14 * f.s, 0, TAU); c.fill();
  });
  for (let i = flies.length - 1; i >= 0; i--) if (i >= wantFlies && flies[i].a < 0.02) flies.splice(i, 1);

  // Snow.
  const snowing = LW.env.weather === 'snow';
  if (snowing && flakes.length < 160 * LW.env.intensity + 40) flakes.push({ x: rand(-50, W), y: rand(-50, H), z: rand(0.3, 1), life: rand(3, 9), age: 0 });
  c.fillStyle = 'rgba(240,244,250,0.85)';
  for (let i = flakes.length - 1; i >= 0; i--) {
    const f = flakes[i]; f.age += dt;
    f.x += (8 + noise1(i + t * 0.3) * 14) * dt * f.z; f.y += 16 * dt * f.z;
    // Flakes shrink as they fall toward the water, then melt with a tiny ripple.
    const k = 1 - f.age / f.life;
    if (k <= 0) { waterDrop(f.x, f.y, 3, -0.25); flakes.splice(i, 1); continue; }
    c.globalAlpha = Math.min(1, f.age * 2) * (0.35 + 0.6 * k);
    c.beginPath(); c.arc(f.x, f.y, (0.8 + 2.2 * f.z) * (0.4 + 0.6 * k), 0, TAU); c.fill();
  }
  c.globalAlpha = 1;

  // Calm: the breath lives on the water — concentric ripple rings swell out from the pond's centre on the
  // in-breath, hold their radius on the hold, draw back in on the out-breath. Driven purely by br.level
  // (constant during hold/rest), so the rings freeze exactly when the breath holds.
  if (calmFade > 0.01) drawBreathRings(c, calmFade);

  // Companions carry their own light under the water: a slow breathing glow while their agent works,
  // a brighter pulse (and rings on the surface) while it waits for you, nothing when idle. No labels.
  c.save(); c.globalCompositeOperation = 'lighter';
  for (const f of fish) {
    if (!f.agent || f.leaving || f.x < -f.L || f.x > W + f.L) continue;
    const st = f.agent.state, calling = st === 'attention' && !f.ack;
    f.glow = lerp(f.glow || 0, calling ? 1 : st === 'working' ? 0.55 : 0, 1 - Math.exp(-dt * 1.5));
    if (f.glow < 0.02) continue;
    const pulse = calling ? 0.65 + 0.35 * Math.sin(t * 3.2 + f.seed) : 0.75 + 0.25 * Math.sin(t * 1.4 + f.seed);
    const col = f.agent.kind === 'codex' ? '127,224,208' : '240,150,110';
    for (const [i, w] of [[2, 0.8], [5, 1], [9, 0.6]]) {   // a halo that hugs the whole body
      const m = f.p[i], R = f.L * (0.42 + 0.22 * f.glow) * (0.8 + 0.2 * w);
      const g = c.createRadialGradient(m[0], m[1], 0, m[0], m[1], R), a = f.glow * pulse * w;
      g.addColorStop(0, `rgba(${col},${0.42 * a})`); g.addColorStop(0.45, `rgba(${col},${0.16 * a})`); g.addColorStop(1, `rgba(${col},0)`);
      c.fillStyle = g; c.beginPath(); c.arc(m[0], m[1], R, 0, TAU); c.fill();
    }
    if (calling && t - (f.lastCall || 0) > 1.6) { f.lastCall = t; addDrop(f.x, f.y, f.L * 0.12, -0.9); }
  }
  c.restore();

  // Reminder text floating on the water.
  if (reminder) {
    const k = smooth(0.5, 2.5, reminder.t) * smooth(16, 12.5, reminder.t);
    if (k > 0.005) {
      const fs = Math.round(clamp(Math.min(W, H) * 0.028, 18, 40));
      c.font = `italic 300 ${fs}px ui-serif, "New York", Georgia, serif`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      const wob = Math.sin(t * 1.3) * 1.5;
      c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 12;
      c.fillStyle = `rgba(242,236,222,${0.9 * k})`;
      c.fillText(reminder.text, reminder.x + wob, reminder.y + 4);
      c.shadowBlur = 0;
    }
  }
}

// ─── Night: the moon on the water; snow on the pads ─────────────────────────
// Uses the shared photoreal moon (moon.js, real phase); re-uploaded only when LW.moonKey changes.
const MOON = { tex: null, key: '', k: 0, check: 0 };
const PADSNOW = { k: 0 };
function moonAst() { return LW.env && LW.env.astronomy && LW.env.astronomy.moon; }
function stepNightSky(dt, t) {
  const env = LW.env, w = env.weather, it = clamp(0.5 + env.intensity * 0.6, 0.5, 1.1), m = moonAst();
  const sky = w === 'clear' ? 1 : w === 'cloudy' ? lerp(0.45, 0.15, it - 0.5) : w === 'fog' ? 0.1 : w === 'snow' ? 0.12 : w === 'rain' ? 0.08 : 0;
  const want = smooth(0.55, 0.9, L.night) * sky * (m ? m.visibility : 1) * (1 - L.fog);
  MOON.k = lerp(MOON.k, want, 1 - Math.exp(-dt * 0.5));
  if (MOON.k > 0.003 && LW.moonCanvas && t > MOON.check) {
    MOON.check = t + 2;
    const opts = { alt: m ? m.altitude : 0.6 }, key = LW.moonKey(opts);
    if (key !== MOON.key) { const cv = LW.moonCanvas(256, opts); if (cv) { if (MOON.tex) gl.deleteTexture(MOON.tex); MOON.tex = uploadOnce(cv); MOON.key = key; } }
  }
  // Snow builds up on the pads over a few minutes of snowfall and melts away afterwards (faster in sun).
  if (w === 'snow') PADSNOW.k = Math.min(1, PADSNOW.k + dt * (0.4 + 0.6 * env.intensity) / 150);
  else PADSNOW.k = Math.max(0, PADSNOW.k - dt / (L.night > 0.5 ? 240 : 110));
}
function moonPlace() {   // upper part of the clear band; drifts along it with the moon's azimuth
  const [c0, c1] = clearBand(), m = moonAst();
  const f = m && Number.isFinite(m.azimuth) ? 0.2 + 0.45 * clamp((m.azimuth + Math.PI) / TAU, 0, 1) : 0.3;
  return [W * (c0 + (c1 - c0) * f), H * 0.22];
}

// ─── Main loop ──────────────────────────────────────────────────────────────
let lastInput = 0;
function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  GLS = Math.min(DPR, Math.sqrt(1.7e6 / (W * H)));   // water is soft: ~1x is plenty, and M1 + Low Power Mode needs the headroom
  glc.width = Math.round(W * GLS); glc.height = Math.round(H * GLS);
  over.width = Math.round(W * DPR); over.height = Math.round(H * DPR);
  [fishRT, surfRT].forEach((rt) => { if (rt) { gl.deleteTexture(rt.tex); gl.deleteFramebuffer(rt.fbo); if (rt.glint) gl.deleteTexture(rt.glint); } });
  fishRT = target(glc.width, glc.height); surfRT = target(glc.width, glc.height);
  // Music glints ride along with the koi draw as a 2nd colour target (same geometry, no extra pass).
  fishRT.glint = tex(glc.width, glc.height);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, glc.width, glc.height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fishRT.fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, fishRT.glint, 0);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  buildSim();
  if (floorTex) { gl.deleteTexture(floorTex); gl.deleteFramebuffer(floorFbo); floorTex = null; }
  floorKey = null;
  if (!fish.length || Math.abs(fish.length - clamp(Math.round((W * H) / 160000), 6, 13)) > 2) { spawnFish(); buildPatterns(); }
  spawnPads();
  makeMiscSprites();
  buildAtlas([...pads.map((p) => p.sp), ...pads.filter((p) => p.flower).map((p) => p.flower), ...SPR.maple, ...SPR.petal, SPR.pellet, SPR.bloomPad, ...SPR.bloom, SPR.frog, SPR.frogThroat, SPR.dfBody, SPR.dfWings]);
  spawnShoals();
  frog.state = 'gone'; frog.back = 2;
}
addEventListener('resize', () => { clearTimeout(resize.t); resize.t = setTimeout(resize, 150); });
resize();
for (const k in L) { const tl = targetLight(); if (k in tl) L[k] = tl[k]; }

let prev = performance.now() / 1000, frame = 0, nextFlash = 10, rafDt = 1 / 60;
function tick() {
  requestAnimationFrame(tick);
  const now = performance.now() / 1000;
  const idle = now - lastInput > 20 && !reminder && calmFade < 0.01;
  frame++;
  rafDt = lerp(rafDt, Math.min(0.1, now - (tick.last || now)), 0.1); tick.last = now;
  if (idle && rafDt < 0.012 && frame % 2) return;  // halve 120 Hz when nobody's looking (never below ~60)
  const dt = Math.min(0.05, now - prev); prev = now;
  const t = now;

  stepLight(dt);
  calmFade = lerp(calmFade, calm ? 1 : 0, 1 - Math.exp(-dt * 0.8));
  if (calm || calmFade > 0.01) {
    br = breathNow(); brLead = breathNow(1.8).level;
    // hold / rest: the pond goes very still
    calmStill = lerp(calmStill, br.phase === 'hold' || br.phase === 'rest' ? 1 : 0, 1 - Math.exp(-dt * 1.6));
    // each in-breath starts with one slow drop at the centre of the rings
    if (br.phase !== breathPh) { if (calmFade > 0.3 && br.phase === 'in') { const [cx, cy] = calmCenter(); addDrop(cx, cy, 30, -1.4); } breathPh = br.phase; }
  } else { calmStill = 0; breathPh = ''; }
  if (reminder) { reminder.t += dt; if (reminder.t > 17) reminder = null; else if (reminder.t < 12 && Math.random() < dt / 2.5) addDrop(reminder.x + rand(-60, 60), reminder.y - 64 + rand(-20, 20), 5, -0.5); }
  if (bloom) { bloom.t += dt; if (bloom.t > 17) bloom = null; }

  // Weather drops.
  const w = LW.env.weather, it = LW.env.intensity;
  const rate = w === 'rain' ? 30 + it * 70 : w === 'storm' ? 90 + it * 90 : 0;
  let n = rate * dt; while (n > 0) { if (Math.random() < n) waterDrop(rand(W), rand(H), rand(4, 7), -rand(0.15, 0.4)); n -= 1; }
  if (w === 'storm') { nextFlash -= dt; if (nextFlash <= 0) { L.flash = rand(0.6, 1.2); nextFlash = rand(7, 22); thunder(); } }

  stepMusic(dt, t);
  stepNightSky(dt, t);
  if (hand.pending && !hand.on && now - hand.downT > 0.45) hand.on = true;
  if (hand.on) { lastInput = now; if (Math.random() < dt * 2.5) addDrop(hand.x + rand(-3, 3), hand.y + rand(-3, 3), 5, -0.3); if (now - hand.downT > 45) hand.on = false; }
  updateFish(dt * (1 - 0.35 * calmFade) * (1 - 0.5 * calmStill * calmFade), t);
  updateShoals(dt, t);
  updateSurface(dt, t);
  updateFrog(dt, t);
  updateFly(dt, t);

  drawOverlay(dt, t);
  stepSim();
  emitShoals(); // deeper life, covered by adult koi and then the surface pads
  for (const f of fish) emitKoi(f, t);
  flush(fishRT, true);
  emitSurface(t);
  flush(surfRT, true);
  bakeFloor();

  gl.viewport(0, 0, glc.width, glc.height);
  gl.useProgram(compP.p);
  gl.bindVertexArray(vao);
  const u = compP.u;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sim ? sim.tex[sim.i] : dummySim); gl.uniform1i(u.uSim, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, fishRT.tex); gl.uniform1i(u.uFish, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, surfRT.tex); gl.uniform1i(u.uSurf, 2);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, floorTex); gl.uniform1i(u.uFloor, 3);
  gl.uniform2f(u.uRes, glc.width, glc.height);
  gl.uniform2f(u.uSimTx, sim ? 1 / sim.w : 0, sim ? 1 / sim.h : 0);
  gl.uniform1f(u.uHasSim, sim ? 1 : 0);
  gl.uniform1f(u.uTime, t % 3600);
  gl.uniform1f(u.uAspect, W / H);
  gl.uniform3fv(u.uLight, L.light);
  gl.uniform3fv(u.uSky, L.sky);
  gl.uniform3fv(u.uDeep, L.deep);
  gl.uniform3fv(u.uShallow, L.shallow);
  gl.uniform3fv(u.uFogCol, [lerp(0.55, 0.2, L.night), lerp(0.6, 0.24, L.night), lerp(0.62, 0.32, L.night)]);
  gl.uniform1f(u.uAmb, L.amb);
  gl.uniform1f(u.uCaust, L.caust);
  gl.uniform1f(u.uCaustB, 1 + 0.3 * MU.lvl + 0.16 * MU.kickS);
  gl.activeTexture(gl.TEXTURE6); gl.bindTexture(gl.TEXTURE_2D, fishRT.glint); gl.uniform1i(u.uGlint, 6);
  gl.uniform1f(u.uGlintOn, MU.on > 0.003 ? 1 : 0);
  {
    const wx = WEATHER[LW.env.weather] || WEATHER.clear, wit = LW.env.weather === 'clear' ? 1 : clamp(0.5 + LW.env.intensity * 0.6, 0.5, 1.1);
    const gw = clamp(0.4 + 0.6 * lerp(1, wx.spec, wit), 0.4, 1), n = L.night;   // overcast still glints, just softer
    const gi = lerp(0.7, 0.85, n) * gw;   // moonlit scales stand out more against the dark water
    gl.uniform3f(u.uGlintCol, lerp(1, 0.7, n) * gi, lerp(0.94, 0.8, n) * gi, lerp(0.82, 1, n) * gi);
  }
  { const [c0, c1] = clearBand(); gl.uniform2f(u.uClear, c0, c1); }
  gl.uniform1f(u.uPadSnow, PADSNOW.k);
  if (MOON.tex && MOON.k > 0.003) {
    const [mx, my] = moonPlace();
    gl.activeTexture(gl.TEXTURE7); gl.bindTexture(gl.TEXTURE_2D, MOON.tex); gl.uniform1i(u.uMoon, 7);
    gl.uniform4f(u.uMoonP, mx / H, my / H, Math.min(W, H) * 0.03 / H, MOON.k);
  } else gl.uniform4f(u.uMoonP, 0, 0, 1, 0);
  if (MU.bass > 0.002) { gl.uniform4f(u.uSwell, MU.fx / H, MU.fy / H, 0.0016 * MU.bass, MU.swell % (TAU * 64)); }
  else gl.uniform4f(u.uSwell, 0, 0, 0, 0);
  gl.uniform1f(u.uSpec, L.spec);
  gl.uniform1f(u.uWind, L.wind);
  gl.uniform1f(u.uFog, L.fog);
  gl.uniform1f(u.uSat, L.sat);
  gl.uniform1f(u.uDapple, L.dapple);
  gl.uniform1f(u.uFlash, L.flash);
  gl.uniform1f(u.uLanternOn, L.lantern);
  gl.uniform2f(u.uLantern, 0.04, 0.96);
  gl.uniform2fv(u.uSunDir, L.sunDir);
  if (calmFade > 0.01) { const [bx, by] = calmCenter(); gl.uniform4f(u.uBreath, bx / H, by / H, breathRout() / H, calmFade * (0.09 + 0.07 * br.level)); }
  else gl.uniform4f(u.uBreath, 0, 0, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
requestAnimationFrame(tick);

// Dev HUD (browser only).
if (!LW.isHost) {
  const hud = document.getElementById('hud');
  const show = () => { hud.textContent = `${LW.env.weather} · ${(LW.env.clockHour??LW.env.hour).toFixed(1)}h${LW.calm ? ' · calm' : ''}${LW.muted ? ' · muted' : ''}   [w t r b m]`; hud.style.opacity = 0.8; clearTimeout(show.t); show.t = setTimeout(() => (hud.style.opacity = 0), 2500); };
  LW.on('env', show); LW.on('calm', show); LW.on('mute', show);
}
</script>
</body>
</html>
