<script>
'use strict';
(() => {
// =====================================================================
//  Rooftop — a cozy city rooftop at night, as a live wallpaper.
//  An analog cassette boombox on a crate plays the user's music;
//  a projector on a little table behind two deck chairs is a DISPLAY: it beams
//  the album art big (title + artist small) onto the whitewashed wall of the
//  building next door, like a rooftop cinema (never a second player). String lights sway over the deck; the skyline twinkles, a bridge
//  glows in the distance, planes blink past, and on a strong beat a far-off
//  firework sometimes blooms. A corgi wanders between the blanket, the deck
//  and the ledge; a ginger cat patrols the ledge and the planters.
//  Click the boombox = play/pause, the projector or the wall = next track.
//  The sky follows LW.env: golden hour, night stars + moon, rain (wet deck,
//  streaks in the projector beam), snow (on the plants), fog between towers.
//
//  World: a 1000-unit-tall design stage scaled to the screen height; world
//  x 1500 sits at 70% of the screen width (16:10 shows ≈ x 380–1980, 16:9
//  ≈ 256–2034, 21:9 ≈ −159–2211). Hero (boombox, projector, projected wall)
//  lives in the left ~70%; the right ~28% is calm sky, bridge and plants.
//  Sky + city + rooftop are baked once per light/weather change (rooftop =
//  albedo × soft light map); chairs, crates and the big pot are a second
//  small baked layer in front, so the animals can pass behind them.
//
//  ART SLOTS (all optional; missing files fall back to the procedural
//  painting quietly). Drop PNGs into scenes/art/rooftop/:
//    bg-night.png / bg-day.png   design x −180–2220 × y 0–1000
//                   at 2×; replaces the procedural sky + city + rooftop
//                   (crossfades by time of day). Keep these live areas simple:
//      projected wall panel x 444–836, y 150–520 (art square x 520–760, y 176–416)
//      boombox: base centre (585, 800), 200×108; projector lens derived from aim
//    chairs.png: two equal atlas cells; rear three-quarter view toward the wall
//    boombox.png 900×561 (cassette window px 327–573 × 242–381, live tape inside)
//    projector.png 493×997 projector on its side table (lens at px 47,75)
//      string-light strands: (860,132)→(1320,300)→(2070,272), (860,268)→(1320,306)
//      sky above the parapet (y < 640, x > 860): planes + fireworks drawn live
//    Animals (side view, facing RIGHT, feet on the bottom edge, centred):
//      cat-<pose>.png / dog-<pose>.png, poses: walk1, walk2, sit, loaf, sleep,
//      stretch (dog: play-bow). They override the shared illustrated sprites
//      in scenes/art/sprites/ (cats/orange, dogs/corgi); with neither, a
//      procedural rig draws them.
//    ?noart=1 skips slot loading.
// =====================================================================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgba = (c, a = 1) => `rgba(${clamp(c[0] | 0, 0, 255)},${clamp(c[1] | 0, 0, 255)},${clamp(c[2] | 0, 0, 255)},${a})`;
const mul = (c, m) => [c[0] * m[0], c[1] * m[1], c[2] * m[2]];
const lum = (c) => (c[0] + c[1] + c[2]) / 3;
const approach = (v, t, rate, dt) => v + (t - v) * (1 - Math.exp(-rate * dt));
function mulberry(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const nowS = () => performance.now() / 1000;
const timers = [];
const later = (sec, fn) => timers.push({ at: nowS() + sec, fn });
function runTimers() { const T = nowS(); for (let i = timers.length - 1; i >= 0; i--) if (timers[i].at <= T) { const f = timers[i].fn; timers.splice(i, 1); try { f(); } catch (e) { console.error(e); } } }
const SANS = '-apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif';
const SERIF = '"Hoefler Text", "Baskerville", "Iowan Old Style", Georgia, serif';
const DIDOT = '"Didot", "Bodoni 72", "Hoefler Text", Georgia, serif';
const DECO = '"Futura", "Avenir Next", "Gill Sans", sans-serif';
const SCRIPT = '"Snell Roundhand", "Apple Chancery", "Hoefler Text", cursive';
const TYPE = '"American Typewriter", "Courier New", monospace';
function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
function ellGrad(g, x, y, rx, ry, col, a, stops = 6) {
  g.save(); g.translate(x, y); g.scale(rx, ry);
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, 1);
  for (let i = 0; i <= stops; i++) { const t = i / stops; gr.addColorStop(t, rgba(col, a * Math.exp(-2.6 * t * t) * (1 - t * t * t))); }

  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;

const GLOW_WARM = sprite(128, [[0, 'rgba(255,214,150,1)'], [0.18, 'rgba(255,190,110,0.5)'], [0.5, 'rgba(255,160,80,0.12)'], [1, 'rgba(255,140,60,0)']]);
const GLOW_SOFT = sprite(128, [[0, 'rgba(255,200,140,0.6)'], [0.4, 'rgba(255,170,100,0.22)'], [1, 'rgba(255,150,80,0)']]);
const GLOW_WHITE = sprite(128, [[0, 'rgba(255,255,255,1)'], [0.2, 'rgba(255,255,255,0.45)'], [0.55, 'rgba(255,255,255,0.1)'], [1, 'rgba(255,255,255,0)']]);
const BLOB = sprite(64, [[0, 'rgba(255,255,255,0.9)'], [0.45, 'rgba(255,255,255,0.45)'], [1, 'rgba(255,255,255,0)']]);
const DARK = sprite(64, [[0, 'rgba(6,3,4,0.85)'], [0.5, 'rgba(6,3,4,0.45)'], [1, 'rgba(6,3,4,0)']]);
function drawSprite(g, sp, x, y, r, a, op = 'lighter') {
  if (a <= 0.003) return;
  g.globalCompositeOperation = op; g.globalAlpha = Math.min(1, a);
  g.drawImage(sp, x - r, y - r, r * 2, r * 2);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
}
function drawSpriteE(g, sp, x, y, rx, ry, a, op = 'lighter') {
  if (a <= 0.003) return;
  g.globalCompositeOperation = op; g.globalAlpha = Math.min(1, a);
  g.drawImage(sp, x - rx, y - ry, rx * 2, ry * 2);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
}
// tileable haze texture (drawn through the light beams, scrolling slowly)
const HAZE = (() => {
  const w = 512, h = 256, c = newCanvas(w, h), g = c.getContext('2d'), r = mulberry(901);
  for (let i = 0; i < 90; i++) {
    const x = r() * w, y = r() * h, rx = 30 + r() * 90, ry = 14 + r() * 40, a = 0.05 + r() * 0.12;
    for (const dx of [-w, 0, w]) for (const dy of [-h, 0, h]) {
      if (x + dx + rx < 0 || x + dx - rx > w || y + dy + ry < 0 || y + dy - ry > h) continue;
      g.globalAlpha = a; g.drawImage(BLOB, x + dx - rx, y + dy - ry, rx * 2, ry * 2);
    }
  }
  return c;
})();


// =====================================================================
//  environment: time of day + weather (glides; never pops)
// =====================================================================
const KF = [
  { h: 0, top: '#050816', bot: '#1a2242', day: 0, warm: 0 },
  { h: 5.0, top: '#050816', bot: '#1a2242', day: 0, warm: 0 },
  { h: 6.2, top: '#2b3462', bot: '#e09a7a', day: 0.3, warm: 0.9 },
  { h: 7.5, top: '#6f97cc', bot: '#f0dcc4', day: 0.8, warm: 0.35 },
  { h: 9, top: '#5d90cf', bot: '#cfe2f2', day: 1, warm: 0 },
  { h: 16.5, top: '#5a8bcb', bot: '#f0d8b0', day: 0.95, warm: 0.25 },
  { h: 18.2, top: '#3d4a80', bot: '#f59a52', day: 0.62, warm: 1 },
  { h: 19.4, top: '#1c2350', bot: '#a25a6a', day: 0.22, warm: 0.6 },
  { h: 20.6, top: '#070b1e', bot: '#1d2546', day: 0, warm: 0 },
  { h: 24, top: '#050816', bot: '#1a2242', day: 0, warm: 0 },
];
KF.forEach((k) => { k.topC = hex(k.top); k.botC = hex(k.bot); });
const WX = {
  cloudy: { d: ['#8c96a6', '#c3c8cf'], n: ['#10141f', '#232838'], amt: 0.6, day: 0.85 },
  rain: { d: ['#606a78', '#8e96a2'], n: ['#090c14', '#191e2b'], amt: 0.85, day: 0.6 },
  storm: { d: ['#454b5a', '#676e7c'], n: ['#05070c', '#121622'], amt: 0.95, day: 0.45 },
  snow: { d: ['#b3b9c6', '#dadde4'], n: ['#171a28', '#2c3046'], amt: 0.75, day: 0.85 },
  fog: { d: ['#aeb2b8', '#cfd1d4'], n: ['#1a1d27', '#343744'], amt: 0.85, day: 0.75 },
};
let E = null, Et = null;
function computeTarget() {
  const env = LW.env || {};
  const hr = (((+env.hour || 0) % 24) + 24) % 24;
  let a = KF[0], b = KF[1];
  for (let i = 0; i < KF.length - 1; i++) if (hr >= KF[i].h && hr <= KF[i + 1].h) { a = KF[i]; b = KF[i + 1]; break; }
  const t = smooth((hr - a.h) / Math.max(0.001, b.h - a.h));
  let top = mix3(a.topC, b.topC, t), bot = mix3(a.botC, b.botC, t);
  let day = lerp(a.day, b.day, t), warm = lerp(a.warm, b.warm, t);
  const w = env.weather || 'clear';
  const it = clamp(env.intensity == null ? 0.7 : +env.intensity, 0, 1);
  let rain = 0, storm = 0, snow = 0, fog = 0, cloud = 0.12, moon = (1 - day) * (hr > 19 || hr < 6 ? 1 : 0);
  const X = WX[w];
  if (X) {
    const f = X.amt * (0.6 + 0.4 * it);
    top = mix3(top, mix3(hex(X.n[0]), hex(X.d[0]), day), f);
    bot = mix3(bot, mix3(hex(X.n[1]), hex(X.d[1]), day), f);
    day *= lerp(1, X.day, 0.6 + 0.4 * it);
    warm *= 0.3; moon *= w === 'cloudy' ? 0.3 : w === 'fog' ? 0.4 : 0; cloud = w === 'cloudy' ? 0.8 : w === 'fog' ? 0.3 : 1;
    if (w === 'rain') rain = 0.45 + 0.55 * it;
    if (w === 'storm') { rain = 0.75 + 0.25 * it; storm = 1; }
    if (w === 'snow') snow = 0.4 + 0.6 * it;
    if (w === 'fog') fog = 0.55 + 0.45 * it;
  }
  moon *= LW.moonVisibility();
  Et = { hour: hr, weather: w, it, top, bot, day, warm, rain, storm, snow, fog, cloud, moon };
  if (!E) { E = JSON.parse(JSON.stringify(Et)); E.wet = rain > 0 ? 1 : 0; E.snowCover = snow > 0 ? 1 : 0; }
}
const ENV_KEYS = ['day', 'warm', 'rain', 'storm', 'snow', 'fog', 'cloud', 'moon', 'it'];
let lastBake = -99, bakedSnap = null, fade = 1;
function updateEnv(dt) {
  const k = LW.envBlend(dt, 9);   // gradual in Auto; shorter when a view is selected
  for (const key of ENV_KEYS) E[key] += (Et[key] - E[key]) * k;
  for (const key of ['top', 'bot']) for (let i = 0; i < 3; i++) E[key][i] += (Et[key][i] - E[key][i]) * k;
  E.hour = Et.hour; E.weather = Et.weather;
  E.wet = clamp(E.wet + (E.rain > 0.15 ? dt * E.rain / 30 : -dt / 420), 0, 1);
  E.snowCover = clamp(E.snowCover + (E.snow > 0.15 ? dt * E.snow / 50 : -dt / 600), 0, 1);
  E.night = clamp(1 - E.day * 1.35, 0, 1);
  E.amb = envAmb();
  fade = Math.min(1, fade + dt / 1.6);
  const snap = envSnap();
  const diff = bakedSnap ? Math.max(...snap.map((v, i) => Math.abs(v - bakedSnap[i]))) : 1;
  if (diff > 0.03 && nowS() - lastBake > 2.5 && fade >= 1) bake(true);
}
const envSnap = () => [...ENV_KEYS.map((q) => E[q]), E.wet * 0.5, E.snowCover * 0.5, ...E.top.map((v) => v / 255), ...E.bot.map((v) => v / 255)];

  const night = [0.2, 0.22, 0.34], dayA = [1.0, 0.98, 0.95];
  let a = mix3(night, dayA, E.day);

  const dim = 1 - 0.35 * Math.max(E.rain, E.storm * 0.9) * E.day;
  return a.map((v) => v * dim);

// =====================================================================
//  art slots (see the header)
// =====================================================================
const ART = { bg: {}, props: {}, pets: { cat: {}, dog: {} } };
let rsT = null;
function loadSlot(group, key, file, sub) {
  const img = new Image();
  img.onload = () => {
    if (!img.naturalWidth) return;
    if (group === 'props' && key === 'chairs') {
      // Measure alpha once: contact points use the painted feet, not atlas padding.
      const c = newCanvas(img.width,img.height), g = c.getContext('2d'); g.drawImage(img,0,0);
      const pixels = g.getImageData(0,0,c.width,c.height).data, cell = c.width / 2;
      img.bounds = [0,1].map(i => {
        let x0=(i+1)*cell,y0=c.height,x1=i*cell,y1=0;
        for(let y=0;y<c.height;y++) for(let x=i*cell;x<(i+1)*cell;x++) if(pixels[(y*c.width+x)*4+3]>20) {
          x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);
        }
        return {x:x0,y:y0,w:x1-x0+1,h:y1-y0+1};
      });
    }
    if (sub) { img.pri = true; ART[group][sub][key] = img; } else ART[group][key] = img;
    if (group === 'bg' || group === 'props') { clearTimeout(rsT); rsT = setTimeout(rebuild, 30); }

const NOART = new URLSearchParams(location.search).get('noart') === '1';
if (!NOART) {

  loadSlot('props', 'projector', 'projector.png'); loadSlot('props', 'boombox', 'boombox.png');
  loadSlot('bg', 'night', 'bg-night.png'); loadSlot('bg', 'day', 'bg-day.png');
  for (const id of ['cat', 'dog']) for (const k of ['walk1', 'walk2', 'sit', 'loaf', 'sleep', 'stretch', 'play-bow']) loadSlot('pets', k, `${id}-${k}.png`, id);

const hasBg = () => !!(ART.bg.night || ART.bg.day);

// =====================================================================
//  layout (design units, see header)
// =====================================================================
let dpr = 1, cssW = 1, cssH = 1, U = 1, W = 1600, H = 1000, OX = 0, vx0 = 380, vx1 = 1980;
let L = null;
const VT = (g) => g.setTransform(U, 0, 0, U, OX, 0);
const toWX = (x) => (x * dpr - OX) / U, toWY = (y) => (y * dpr) / U;
const catenary = (a, b, sag, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t) + sag * 4 * t * (1 - t)];

  o.screen = { x0: 444, x1: 836, y0: 150, y1: 520 };

  o.radio = { x: 585, base: 800, w: 200, h: 108 };
  o.crateR = { x0: 494, x1: 676, top: 800, base: 904 };
  o.blanket = { x0: 690, x1: 1010, y0: 884, y1: 970 };

  // beam passing over their backs to the wall. (art/rooftop/projector.png: 493×997, lens at px 47,75)
  o.proj = { x: 1208, base: 858, h: 288 };

  o.crateP = { x0: o.proj.x0 + 20, x1: o.proj.x0 + o.proj.w - 20, top: o.proj.top + 290 * o.proj.s, base: o.proj.base };
  o.chairs = [{ x: 1086, base: 912, w: 214, h: 244 }, { x: 1338, base: 916, w: 214, h: 246 }];
  o.pot = { x: 1494, base: 748, rim: 692, r: 46 };

    { a: [860, 132], b: [1320, 300], sag: 74 },

  });

  o.lights.push({ x: 1250, y: 720, rx: 420, ry: 90, k: 0.35, c: [1.0, 0.72, 0.46], night: 1 });   // warm spill on the deck

  o.lights.push({ x: 640, y: 335, rx: 260, ry: 230, k: 0.1, c: [0.92, 0.9, 1.0], night: 1 });    // projected light on the wall
