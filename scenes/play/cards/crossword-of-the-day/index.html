<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Crossings</title><!--CARD_STYLE--><style>
.crossing{display:flex;gap:18px;align-items:flex-start}#grid{display:grid;grid-template-columns:repeat(5,37px);gap:3px;flex-shrink:0}.cell{height:37px;position:relative;border-radius:5px;overflow:hidden;border:1px solid var(--line)}.cell input{width:100%;height:100%;border:0;border-radius:0;text-align:center;font-size:19px;padding:7px 0 0;text-transform:uppercase;caret-color:transparent}.cell small{position:absolute;top:1px;left:3px;font-size:8px;pointer-events:none}.cell[data-active=true]{outline:2px solid var(--accent)}.cell[data-check=wrong]{outline:2px dashed #ab765e}.cell[data-check=right]{box-shadow:inset 0 -3px var(--accent)}.block{background:var(--soft);border-color:transparent}#clues{height:214px;overflow:auto;flex:1;font-size:12px}#clues h2{font:15px Georgia,serif;margin:0 0 4px}#clues button{display:block;background:none;border:0;padding:4px 5px;text-align:left;width:100%;font-size:11px;line-height:1.4}#clues button[aria-pressed=true]{background:var(--soft);box-shadow:none}.controls{margin-top:14px;font-size:11px;gap:5px}.controls button{padding:7px}#active-clue{font-size:12px;min-height:18px}#result{font:19px Georgia,serif;margin-top:10px}@media(max-width:440px){.crossing{gap:10px}#grid{grid-template-columns:repeat(5,30px)}.cell{height:32px}}
</style></head><body><div class="row" style="justify-content:space-between"><h1>Little Crossings</h1><small id="day"></small></div><p id="active-clue" role="status">A small crossing of familiar words.</p><div class="crossing"><div id="grid" role="group" aria-label="Five by five crossword"></div><div id="clues" aria-label="Crossword clues"></div></div><div class="row controls"><button id="square">Check square</button><button id="word">Check word</button><button id="puzzle">Check puzzle</button><button id="reveal" title="Revealing marks this puzzle as assisted">Reveal word</button></div><p class="notice" id="notice" role="status">Arrows move. Tab changes clue. Space changes direction.</p><p id="result"></p><div id="ad"></div><!--CARD_SDK--><script>
(async()=>{await card.ready();const $=s=>document.querySelector(s),day=card.today(),set=CARD_DATA['2026'],p=set[PlayCore.dailyIndex(day,set.length)],solution=p.solution,entries=p.entries;let progress={day,entry:Array(25).fill(''),assisted:false,done:false},selected=0,active=0,streak=null,adShown=false,queue=Promise.resolve();
try{const saved=await card.load('progress');if(saved?.day===day&&Array.isArray(saved.entry)&&saved.entry.length===25)progress={day,entry:saved.entry.map(c=>/^[A-Z]$/.test(c)?c:''),assisted:!!saved.assisted,done:!!saved.done};streak=await card.load('streak');}catch{$('#notice').textContent='Saved progress could not load. You can still play.';}
$('#day').textContent=day;const cells=[];const buttons=[];
for(let i=0;i<25;i++){const wrap=document.createElement('div');wrap.className='cell';if(solution[i]==='#'){wrap.classList.add('block');wrap.setAttribute('aria-hidden','true');}else{const input=document.createElement('input');input.maxLength=1;input.autocomplete='off';input.spellcheck=false;input.value=progress.entry[i];input.setAttribute('aria-label','Row '+(Math.floor(i/5)+1)+', column '+(i%5+1));input.onfocus=()=>select(i);input.onclick=()=>{if(i===selected){const alt=entries.findIndex((e,n)=>n!==active&&e.cells.includes(i));if(alt>=0)active=alt;}select(i);};input.oninput=()=>{progress.entry[i]=input.value.replace(/[^a-z]/gi,'').slice(-1).toUpperCase();input.value=progress.entry[i];wrap.removeAttribute('data-check');save();if(input.value)advance();};input.onkeydown=e=>key(e,i);wrap.append(input);cells[i]=input;const start=entries.find(e=>e.cells[0]===i);if(start){const n=document.createElement('small');n.textContent=start.number;wrap.append(n);}}$('#grid').append(wrap);}
for(const direction of ['across','down']){const h=document.createElement('h2');h.textContent=direction==='across'?'Across':'Down';$('#clues').append(h);entries.forEach((e,n)=>{if(e.direction!==direction)return;const b=document.createElement('button');b.textContent=e.number+'. '+e.clue+' ('+e.answer.length+')';b.onclick=()=>{active=n;focus(e.cells[0]);};buttons[n]=b;$('#clues').append(b);});}
function select(i){selected=i;if(!entries[active].cells.includes(i))active=entries.findIndex(e=>e.cells.includes(i));cells.forEach((c,n)=>{if(c){c.tabIndex=n===i?0:-1;c.parentElement.dataset.active=String(entries[active].cells.includes(n));}});buttons.forEach((b,n)=>b.setAttribute('aria-pressed',String(n===active)));const e=entries[active];$('#active-clue').textContent=e.number+' '+e.direction+' · '+e.clue;}
function focus(i){if(cells[i]){select(i);cells[i].focus();}}
function advance(){const line=entries[active].cells,n=line.indexOf(selected);if(n<line.length-1)focus(line[n+1]);}
function key(e,i){const moves={ArrowLeft:-1,ArrowRight:1,ArrowUp:-5,ArrowDown:5};if(e.key in moves){e.preventDefault();const delta=moves[e.key];let j=i+delta;while(j>=0&&j<25&&(Math.abs(delta)===5||Math.floor(j/5)===Math.floor(i/5))){if(cells[j]){const direction=Math.abs(delta)===5?'down':'across';active=entries.findIndex(x=>x.direction===direction&&x.cells.includes(j));focus(j);break;}j+=delta;}return;}if(e.key===' '){e.preventDefault();const alt=entries.findIndex((x,n)=>n!==active&&x.cells.includes(i));if(alt>=0)active=alt;select(i);}if(e.key==='Tab'){const next=active+(e.shiftKey?-1:1);if(next>=0&&next<entries.length){e.preventDefault();active=next;focus(entries[active].cells[0]);}}if(e.key==='Backspace'&&!cells[i].value){e.preventDefault();const line=entries[active].cells,n=line.indexOf(i);if(n>0){focus(line[n-1]);progress.entry[selected]='';cells[selected].value='';save();}}}
function save(){const complete=PlayCore.completeCrossword(solution,progress.entry);if(complete&&!progress.done){progress.done=true;streak=PlayCore.streak(streak,day);}const snapshot=JSON.parse(JSON.stringify(progress));queue=queue.then(async()=>{await card.save('progress',snapshot);if(snapshot.done){await card.save('streak',streak);await card.save('summary',{day,done:true,streak:streak?.count||1});await card.event('puzzle_complete');}}).catch(()=>{$('#notice').textContent='Progress could not save. Keep Play open and make another edit to retry.';});finish();}
function finish(){if(PlayCore.completeCrossword(solution,progress.entry)){$('#result').textContent=progress.assisted?'Every crossing found · assisted.':'Every crossing found. Nicely done.';$('#notice').textContent='A new little crossing tomorrow.';if(!adShown){adShown=true;card.adSlot($('#ad')).catch(()=>{});}}}
function check(indices){const checks=PlayCore.checkCrossword(solution,progress.entry,indices);checks.forEach(c=>{cells[c.i].parentElement.dataset.check=c.correct?'right':'wrong';cells[c.i].setAttribute('aria-invalid',String(!c.correct));});$('#notice').textContent=checks.every(c=>c.correct)?'All checked letters fit.':checks.filter(c=>!c.correct).length+' checked squares need another look. Dashed outlines mark them.';}
$('#square').onclick=()=>check([selected]);$('#word').onclick=()=>check(entries[active].cells);$('#puzzle').onclick=()=>check();$('#reveal').onclick=()=>{const result=PlayCore.revealCrossword(solution,progress.entry,entries[active].cells);progress.entry=result.entry;progress.assisted=true;cells.forEach((c,i)=>{if(c)c.value=progress.entry[i];});$('#notice').textContent='Word revealed. This puzzle is marked assisted.';save();};select(entries[0].cells[0]);finish();
})();
</script></body></html>
